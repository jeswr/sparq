{{- if .Values.serviceAccount.create -}}
# ServiceAccount (R5 — minimal, no cluster-admin; scoped to this release only)
# [OPUS-4.8] sq-0d744
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sparq.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparq.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
