{{- if .Values.serviceAccount.create -}}
# ServiceAccount (R5 — minimal, no cluster-admin; scoped to this release only)
# [OPUS-4.8] sq-0d744
# [GPT-5.6] R9: sparq-server is open-by-default at the image layer; this chart
# gates it with SPARQ_AUTH_TOKEN from an existing Secret. Do not remove that wiring.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sparq.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparq.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
