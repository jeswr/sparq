{{/*
secret-ref.yaml — validates that the referenced auth Secret NAME is configured.
The API server resolves the Secret itself at pod startup. This chart does NOT
create or inline a secret literal (R4: tokens come from an existing k8s Secret,
never from values.yaml).

For sparq-server, auth.existingSecret MUST be set (R1: auth ON by default).
For lws, LWS is fail-closed by default (§1.2) so a token ref is not required,
but we still validate the configuration is intentional.

[OPUS-4.8] sq-0d744 — cloud-deploy epic sq-3vjdr §3.5 R1/R2/R4
[GPT-5.6] Cross-field fail-closed checks supplement values.schema.json.
*/}}
{{- if and (eq .Values.server "sparq-server") (not .Values.auth.existingSecret) }}
{{- fail (printf "auth.existingSecret must be set for server=sparq-server (R1: sparq-server is open-by-default at the image layer; this chart requires an existing k8s Secret holding SPARQ_AUTH_TOKEN). Create one with:\n  kubectl create secret generic <name> --from-literal=%s=$(openssl rand -hex 32)\nthen set --set auth.existingSecret=<name>" .Values.auth.tokenKey) }}
{{- end }}
{{- if and .Values.persistence.existingClaim (not .Values.persistence.enabled) }}
{{- fail "persistence.enabled must be true when persistence.existingClaim is set; refusing to silently ignore the existing PVC" }}
{{- end }}
{{- if and (eq .Values.server "lws") .Values.ingress.enabled }}
{{- $basePattern := printf "^https://%s(:[0-9]+)?(/|$)" (regexQuoteMeta .Values.ingress.host) }}
{{- if not (regexMatch $basePattern .Values.lws.baseUrl) }}
{{- fail (printf "lws.baseUrl must use ingress.host %q when the built-in Ingress is enabled" .Values.ingress.host) }}
{{- end }}
{{- end }}
