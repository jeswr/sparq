{{- if and (eq .Values.server "sparq-server") .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
# PersistentVolumeClaim for /data (dataset storage) — sparq-server only
# [OPUS-4.8] sq-0d744
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sparq.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sparq.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
