# sparq-server plain-manifest quickstart (no Helm required)
# [OPUS-4.8] sq-0d744 — cloud-deploy epic sq-3vjdr §3.5
#
# SECURE-DEFAULT NOTES (R1/R2/R4/R9):
#   - sparq-server is open-by-default at the image layer. This manifest gates it
#     with SPARQ_AUTH_TOKEN from a pre-provisioned Secret. Do NOT remove the secretKeyRef.
#   - [GPT-5.6] This file does not create a Secret. Provision sparq-auth-token
#     separately so no credential or editable placeholder is committed (R4).
#   - TLS is NOT provided here (this is a cluster-internal deployment). Front this
#     only with an HTTPS-enforcing Ingress and a TLS Secret for public exposure (R3).
#
# Usage:
#   1. kubectl create namespace sparq
#   2. kubectl create secret generic sparq-auth-token --namespace sparq \
#        --from-literal=SPARQ_AUTH_TOKEN="$(openssl rand -hex 32)"
#   3. kubectl apply -f sparq-server-quickstart.yaml
#   4. kubectl port-forward -n sparq svc/sparq-server 3030:3030
#   5. curl -H "Authorization: Bearer <your-token>" http://localhost:3030/sparql \
#        -H "Content-Type: application/sparql-query" \
#        --data "SELECT * WHERE { ?s ?p ?o } LIMIT 10"
# R5: minimal ServiceAccount, no cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sparq-server
  namespace: sparq
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparq-server
  namespace: sparq
  labels:
    app.kubernetes.io/name: sparq-server
    app.kubernetes.io/component: triplestore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparq-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparq-server
    spec:
      serviceAccountName: sparq-server
      # [GPT-5.6] R5: disable API credentials at both SA and pod scope.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # R8: pod-level security
      securityContext:
        runAsNonRoot: true
        # [GPT-5.6] Match the distroless nonroot group for writable volumes.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sparq-server
          image: ghcr.io/sparq-org/sparq-server:latest
          # [GPT-5.6] latest must be re-resolved instead of using a stale node cache.
          imagePullPolicy: Always
          # R8: container-level least-priv
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          # [GPT-5.6] R7: tolerate initial dataset loading before liveness starts.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # R7: health probe on /health (ungated, always returns 200 + "ok" when up)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            # R1/R4: auth token from Secret (NEVER hardcode a literal token here)
            - name: SPARQ_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sparq-auth-token
                  key: SPARQ_AUTH_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            # Writable scratch needed by distroless + readOnlyRootFilesystem
            - name: tmp
              mountPath: /tmp
            # [GPT-5.6] R8: keep /data writable without relaxing the root filesystem.
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
# R6: ClusterIP service — not exposed to the internet; front with an Ingress for public access.
apiVersion: v1
kind: Service
metadata:
  name: sparq-server
  namespace: sparq
  labels:
    app.kubernetes.io/name: sparq-server
spec:
  type: ClusterIP
  ports:
    - port: 3030
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sparq-server
