# sparq-server plain-manifest quickstart (no Helm required)
# [OPUS-4.8] sq-0d744 — cloud-deploy epic sq-3vjdr §3.5
#
# SECURE-DEFAULT NOTES (R1/R2/R4/R9):
#   - sparq-server is open-by-default at the image layer. This manifest gates it
#     with SPARQ_AUTH_TOKEN from the Secret below. Do NOT remove the secretKeyRef.
#   - The Secret value is a placeholder. Replace <BASE64-ENCODED-TOKEN> with a
#     real random token: openssl rand -hex 32 | base64
#   - TLS is NOT provided here (this is a cluster-internal deployment). Front this
#     with an Ingress + cert-manager for public exposure (R3).
#
# Usage:
#   1. Edit the Secret data.SPARQ_AUTH_TOKEN below with your token (base64-encoded).
#   2. kubectl apply -f sparq-server-quickstart.yaml
#   3. kubectl port-forward svc/sparq-server 3030:3030
#   4. curl -H "Authorization: Bearer <your-token>" http://localhost:3030/sparql \
#        -H "Content-Type: application/sparql-query" \
#        --data "SELECT * WHERE { ?s ?p ?o } LIMIT 10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: sparq
---
# R4: token stored in a k8s Secret, never in a configmap or pod spec literal.
# Replace <BASE64-ENCODED-TOKEN> before applying.
apiVersion: v1
kind: Secret
metadata:
  name: sparq-auth-token
  namespace: sparq
type: Opaque
data:
  # base64-encode your token: echo -n "your-token-here" | base64
  SPARQ_AUTH_TOKEN: <BASE64-ENCODED-TOKEN>
---
# R5: minimal ServiceAccount, no cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sparq-server
  namespace: sparq
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparq-server
  namespace: sparq
  labels:
    app.kubernetes.io/name: sparq-server
    app.kubernetes.io/component: triplestore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparq-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparq-server
    spec:
      serviceAccountName: sparq-server
      # R8: pod-level security
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sparq-server
          image: ghcr.io/sparq-org/sparq-server:latest
          imagePullPolicy: IfNotPresent
          # R8: container-level least-priv
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          # R7: health probe on /health (ungated, always returns 200 + "ok" when up)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            # R1/R4: auth token from Secret (NEVER hardcode a literal token here)
            - name: SPARQ_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sparq-auth-token
                  key: SPARQ_AUTH_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            # Writable scratch needed by distroless + readOnlyRootFilesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# R6: ClusterIP service — not exposed to the internet; front with an Ingress for public access.
apiVersion: v1
kind: Service
metadata:
  name: sparq-server
  namespace: sparq
  labels:
    app.kubernetes.io/name: sparq-server
spec:
  type: ClusterIP
  ports:
    - port: 3030
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sparq-server
