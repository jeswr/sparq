# Coverage-guided fuzz harness for sparq (bead sq-ovnf; threat-model T-PARSE-FUZZ +
# T-MMAP-FUZZ). [OPUS-4.8]
#
# STANDALONE manifest — this crate is DELIBERATELY NOT a member of the root
# workspace (the root `Cargo.toml` lists `exclude = ["fuzz", ...]`). cargo-fuzz
# requires a nightly toolchain (libFuzzer's `-Cpasses=sancov-*` / `-Zsanitizer`),
# so keeping it out of the workspace means `cargo build`/`cargo test`/`clippy
# --workspace` on STABLE never try to compile it and the stable gate is unaffected.
# Build/run it only via `cargo +nightly fuzz run <target>` from this directory (or
# the CI fuzz lane), which uses THIS manifest, not the workspace.
[package]
name = "sparq-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
# Pin the same MSRV floor as the workspace for documentation parity; cargo-fuzz
# itself still requires nightly to *run* (libFuzzer codegen), independent of this.
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

# Empty [workspace] table => this manifest is its OWN workspace root. This severs the
# fuzz crate from ANY ancestor workspace (belt-and-braces alongside the root's
# `exclude = [..., "fuzz"]`), so `cargo +nightly fuzz build` here never trips the
# "believes it's in a workspace when it's not" error, and the stable workspace gate
# never picks this crate up regardless of where the checkout is nested. [OPUS-4.8]
[workspace]

[dependencies]
# libFuzzer bindings: provides the `fuzz_target!` macro and the libFuzzer main.
libfuzzer-sys = "0.4"
# The crates under test. sparq-core needs `mmap` (for `Graph::open` over an on-disk
# store) and `parallel` (for `load_reader_parallel`'s pipelined N-Triples path).
# The `jsonld` feature wires in oxjsonld so Graph::load_str("jsonld") exercises the
# real oxjsonld toRdf parser path — the same path attacker-controlled GSP PUT bodies
# reach in sparq-server. [SONNET-4.6] (sq-oy1f.46)
sparq-core = { path = "../crates/sparq-core", features = ["mmap", "parallel", "jsonld"] }
sparq-engine = { path = "../crates/sparq-engine" }
# SHACL validation under test (bead sq-o4pi). Opt-in crate (the sparq-reason isolation
# pattern). Used by the `validate_shacl` target. Like every entry here it is a
# package-wide dependency — Cargo deps are not scoped per [[bin]] target — but it stays
# out of the workspace default build because this fuzz crate is excluded from the root
# workspace (see the header note). [OPUS-4.8]
sparq-shacl = { path = "../crates/sparq-shacl" }
# sparq-jsonld: the native W3C JSON-LD 1.1 document pipeline (bead sq-oy1f.46). The
# `jsonld_pipeline` fuzz target exercises Json::parse + expand + flatten_expanded
# directly. Published = false (scaffold phase), path dep resolves in the fuzz crate's
# standalone workspace. [SONNET-4.6]
sparq-jsonld = { path = "../crates/sparq-jsonld" }
# Temp store directories for the `Graph::open` hostile-bytes target.
tempfile = "3"

# A fast-but-instrumentable profile: opt-level 3 keeps the fuzzer throughput high
# while `debug-assertions = true` + `overflow-checks = true` turn latent UB / integer
# overflow into a clean, catchable panic the fuzzer flags as a crash (exactly what we
# want a hostile-bytes corpus to surface). `panic = "unwind"` (NOT abort) lets
# libFuzzer's hook report the crashing input.
[profile.release]
opt-level = 3
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"
incremental = false
codegen-units = 1

# Each entry point is its own libFuzzer binary. `test = false`/`doc = false` keep them
# out of any `cargo test`/doc pass; `bench = false` keeps them off `cargo bench`.
[[bin]]
name = "parse_rdf_str"
path = "fuzz_targets/parse_rdf_str.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_reader_parallel"
path = "fuzz_targets/load_reader_parallel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_sparql"
path = "fuzz_targets/parse_sparql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_open"
path = "fuzz_targets/graph_open.rs"
test = false
doc = false
bench = false

# bead sq-o4pi: SHACL validation (shape-parse + traversal) over hostile (data, shapes)
# bytes. Auto-discovered by the CI fuzz lane's `cargo fuzz list`, so it runs in the same
# bounded per-PR / nightly budget as the targets above with no workflow list to edit. [OPUS-4.8]
[[bin]]
name = "validate_shacl"
path = "fuzz_targets/validate_shacl.rs"
test = false
doc = false
bench = false

# bead sq-oy1f.46 (security: attacker-reachable application/ld+json ingest, default-on
# in sparq-server/sparq-py/sparq-cli). Exercises:
#   - sparq-jsonld: Json::parse → expand() → flatten_expanded() — the native pipeline
#   - oxjsonld leg: sparq_core::Graph::load_str(text, "jsonld") → the Oxigraph
#     JSON-LD-to-RDF parser that GSP PUT/POST bodies reach in production
# Auto-discovered by CI `cargo fuzz list`; no workflow edit needed. [SONNET-4.6]
[[bin]]
name = "jsonld_pipeline"
path = "fuzz_targets/jsonld_pipeline.rs"
test = false
doc = false
bench = false
