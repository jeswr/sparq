# sparq-arrow (gh-910, bead sq-v78l4): opt-in Apache Arrow columnar export for SPARQL
# SELECT results. Converts a sparq-engine `QueryResult` (variable columns + RDF-term
# rows) into an Arrow `RecordBatch` so results flow zero-copy-ish into the dataframe /
# analytics ecosystem (Polars / DuckDB / pandas via the Python follow-up). [OPUS-4.8]
#
# OPT-IN / LEAN-CORE by construction: this is a SEPARATE leaf crate, so the `arrow-*`
# dependency closure NEVER enters sparq-core / sparq-engine / the wasm bundle. Nothing
# in the workspace default build depends on it. The Arrow export is itself feature-gated
# (`arrow`, OFF by default) so even building THIS crate without the feature pulls no
# Arrow code — the crate then exposes only the dependency-free schema documentation.

[package]
name = "sparq-arrow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in Apache Arrow columnar export for sparq: convert a SPARQL SELECT QueryResult into an Arrow RecordBatch (one struct column per variable: kind / value / datatype / language / direction), a faithful round-trippable projection of the SPARQL-Results term model for zero-copy transfer into Polars / DuckDB / pandas"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg so the `arrow`-gated
# `to_record_batch` / `term_schema` items render on the docs.rs front page.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# OFF by default: the default build of this crate carries ZERO Arrow code and no
# Arrow dependency — only the schema documentation + the public field-name constants
# compile. Turning `arrow` ON pulls `arrow-array` + `arrow-schema` and enables
# `to_record_batch` / `term_schema`. The crate is itself opt-in (a separate leaf crate
# off the default workspace build), and the Arrow dependency is opt-in on top of that.
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer"]

[dependencies]
# The SELECT result we project (`QueryResult { vars, rows }`). Always present — the
# crate's whole job is to read it. default-features=false keeps the edge lean (we need
# only the result type + its `oxrdf::Term` rows, no engine features).
sparq-engine = { path = "../sparq-engine", version = "0.1.0", default-features = false }
# The RDF term model (`Term`, `Literal`, `NamedNode`, …). workspace-pinned so the term
# type is byte-identical to sparq-engine's. Always present (used to classify each cell).
oxrdf.workspace = true
# Arrow building blocks. We depend ONLY on `arrow-array` (RecordBatch + the typed array
# builders) and `arrow-schema` (Schema / Field / DataType) — NOT the `arrow` meta-crate,
# which additionally pulls IPC / Flight / CSV / JSON / cast machinery we do not use. This
# keeps the dependency (and cargo-vet exemption) closure as small as a RecordBatch export
# can be. Only behind the `arrow` feature. [OPUS-4.8]
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
# `NullBuffer` for the per-row struct validity (unbound cells). It is `arrow-array`'s
# own dependency; named directly because the code references `arrow_buffer::NullBuffer`.
arrow-buffer = { version = "59", optional = true }

[dev-dependencies]
# The integration tests (tests/record_batch.rs, `#![cfg(feature = "arrow")]`) drive the
# REAL path: load a Graph, run `sparq_engine::query`, then export. They need the engine's
# default features (parse + execute) and sparq-core for `Graph::load_str`. These are
# dev-only — they never enter the shipped crate, which keeps its lean `sparq-engine`
# (default-features=false) edge.
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
# [GPT-5.6] Property generators for schema/shape/null-mask invariants.
proptest = "1"
