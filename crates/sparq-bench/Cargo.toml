[package]
name = "sparq-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sparq-core = { path = "../sparq-core", features = ["mmap", "dict-spill"] }
# [FABLE-5] (sq-7d3dj.30.13) `algebra-rewrite` ON: the nightly differential fuzzer
# (sparq-vs-oxigraph value-level compare, .github/workflows/differential.yml) must fuzz the
# SHIPPED configuration — the sparq-cli / sparq-server binaries default-light the engine's
# pre-execution algebra rewrite pass (#1735). The fuzzer's `equality` category generates the
# exact `FILTER(?v = <iri>)` trigger shape (fuzz.rs gen_query, IRI arm), so the rewrite-ON
# path is oracle-checked every night. [SONNET-4.6] (sq-avd75) rewrite (b)'s trigger —
# `OPTIONAL { B } FILTER(!bound(?v))` — is now generated too, by the `antijoin` category
# (which also carries a no-shared-variable shape the pass must DECLINE), so BOTH halves of
# the pass are oracle-checked rather than only tests/rewrite_pass.rs's fixed fixtures on the
# feature-matrix leg. Harness crate, `publish = false`; the engine LIBRARY default stays OFF.
sparq-engine = { path = "../sparq-engine", features = ["algebra-rewrite"] }
# Reference engine to compare against (in-memory; no RocksDB).
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
# [FABLE-5] (sq-hodke) RDFC-1.0, for the UPDATE differential's blank-node-ISOMORPHISM
# adjudication: once the generator emits blank nodes, sorted N-Quads stops being a
# canonical form (sparq labels them `_:fbN` from a process counter, Oxigraph from a hash,
# and sparq's two update paths disagree with EACH OTHER), so the comparator relabels every
# snapshot to its RDFC-1.0 canonical form first. `rdf12-triple-terms` is required because
# the generator also emits RDF-1.2 triple terms, which the standard W3C profile fails
# closed on; the comparator uses only that feature's CONSTRAINED `*_ground_terms` entry
# points, which are exactly RDFC-1.0 with triple terms as opaque constants (they fail
# closed on a blank node nested inside a triple term — an invariant the generator upholds
# with an `isBlank` FILTER guard and `tests::no_nested_blank_nodes_in_triple_terms` pins).
# Harness crate, `publish = false`; nothing in the shipped build gains a dependency.
sparq-canon = { path = "../sparq-canon", features = ["rdf12-triple-terms"] }
# The oxrdf 0.3 term model both engines already render through — used by the comparator to
# rewrite `xsd:integer` lexicals STRUCTURALLY (never by string surgery) for the adjudicated
# `update-oxigraph-integer-lexical-canonicalization` class. Already in the dependency graph
# via sparq-core/sparq-engine/sparq-canon; this adds nothing new to the tree.
oxrdf = { workspace = true }
# [SONNET-4.6] (sq-qcnn.8) The ENGINE-INDEPENDENT neutral result form + comparators that every
# `Oracle` in `src/oracle.rs` emits. Load-bearing that this is NOT sparq's own value code: a
# second oracle exists to catch a bug sparq and Oxigraph SHARE, so normalising both sides through
# sparq's numeric tower / term comparator would cancel exactly the class of bug it is there to
# find (see that crate's own header). `publish = false` on both sides; nothing shipped links it.
sparq-difftest = { path = "../sparq-difftest" }
libc = "0.2"
# [SONNET-4.6] (sq-qcnn.8) Private, owner-only (`0o700`) scratch directories with random names for
# the subprocess oracle's four per-evaluation temp files. Load-bearing for SAFETY, not
# convenience: paths derived from the public process id in the SHARED system temp directory are
# predictable, and `fs::write` / `File::create` follow an existing symlink, so another local user
# could aim one at a file the fuzz runner may write. Already in this workspace's lock file (a
# dev-dependency of sparq-hdt and sparq-crdt), so it adds no PACKAGE to the tree — but it does add
# a dependency EDGE that cargo-vet evaluates differently. [OPUS-5] Measured, not assumed: as a
# dev-dependency the imported audits satisfied it at `safe-to-run`; as a normal dependency of a
# first-party crate cargo-vet requires `safe-to-deploy`, which no imported audit supplies for
# tempfile (nor for its `rustix` / `linux-raw-sys` subtree). Those three carry deliberate
# `[[exemptions]]` entries in supply-chain/config.toml, each explaining the gap. `publish = false`
# harness crate — nothing shipped links it, so no released artifact carries this code.
tempfile = "3"
serde_json = "1"

[[bin]]
name = "sparq-bench"
path = "src/main.rs"
