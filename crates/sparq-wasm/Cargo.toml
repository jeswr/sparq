[package]
name = "sparq-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib for the wasm artifact; rlib so the pure helpers can be unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# No-default-features => no rayon: the wasm build has no threads and we keep the
# bundle minimal. `compact-index` builds only 3 permutation indexes (~half the index
# memory) — the right trade for the memory-constrained browser. Same store + engine
# code as native otherwise, single-threaded.
sparq-core = { path = "../sparq-core", default-features = false, features = ["compact-index"] }
sparq-engine = { path = "../sparq-engine", default-features = false }
oxrdf.workspace = true
wasm-bindgen = "0.2"

# oxrdf pulls `rand`/getrandom (blank-node ids). On wasm there is no OS RNG, so
# select getrandom's browser backend (crypto.getRandomValues). The matching
# `--cfg getrandom_backend="wasm_js"` is set in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
# Optimise the wasm for size.
wasm-opt = ["-Oz"]
