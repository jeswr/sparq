[package]
name = "sparq-solid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Solid Pod access control for the sparq RDF engine: pods as named graphs, WAC/ACP materialized to a queryable triples-native auth view by N3 rules, queries filtered to authorized graphs"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Opt-in Solid layer (the sparq-reason isolation pattern): a SEPARATE crate so the
# core engine carries zero Solid/access-control code, deps, or runtime cost — it is
# a dependency of NOTHING in the workspace. Design: research/solid-access-control-design.md.

# [OPUS-4.8] docs.rs: build with all features + the `docsrs` cfg (for #[cfg_attr(docsrs, ...)] gating).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.0", default-features = false }
sparq-engine = { path = "../sparq-engine", version = "0.1.0", default-features = false }
sparq-reason = { path = "../sparq-reason", version = "0.1.0", default-features = false }
# [OPUS-4.8] sq-h3uk: the ODRL→AUTH_GRAPH bridge. OPTIONAL + behind the `odrl-bridge`
# feature (OFF by default), so the default sparq-solid build carries zero ODRL code,
# deps, or runtime cost — sparq-policy is NOT forced onto the default build. Research
# track (the single-node bridge of epic sq-3183), NOT a production cutover.
sparq-policy = { path = "../sparq-policy", version = "0.1.0", default-features = false, optional = true }
oxrdf.workspace = true
spargebra.workspace = true
rustc-hash.workspace = true

[features]
# [OPUS-4.8] sq-h3uk: materialize matched ODRL permissions into the AUTH_GRAPH so the
# existing graph-level WAC/ACP enforcement applies them. OFF by default (lean core);
# pulls in the optional sparq-policy ODRL evaluator only when enabled.
odrl-bridge = ["dep:sparq-policy"]

# [OPUS-4.8] sq-58mh: wire sparq-policy's STATEFUL `odrl:count` enforcement THROUGH the
# bridge so a bridged grant SELF-RETRACTS on exhaustion. OFF by default; implies
# `odrl-bridge` and turns on the `count-enforcement` feature of sparq-policy (the
# usage-counter store + the atomic `evaluate_and_exercise`). ACP is stateless — there
# is no per-session usage counter — so the count is enforced through the EXISTING
# refresh/retraction ledger (sq-dpk4): the count is consumed atomically at exercise and
# re-checked (read-only) on refresh, dropping the grant once the budget is spent.
count-enforcement = ["odrl-bridge", "sparq-policy/count-enforcement"]
