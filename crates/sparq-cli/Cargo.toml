[package]
name = "sparq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Out-of-core querying (memory-mapped on-disk indexes) — on by default for the CLI.
# mimalloc: the global allocator (T1.0). On by default; `--no-default-features --features mmap`
# falls back to the system allocator for A/B measurement of allocator contention.
default = ["mmap", "mimalloc"]
mmap = ["sparq-core/mmap"]
mimalloc = ["dep:mimalloc"]

[dependencies]
sparq-core = { path = "../sparq-core", features = ["mmap"] }
sparq-engine = { path = "../sparq-engine" }
# Direct dep so the `scaling` harness can build fixed-size rayon pools (ThreadPoolBuilder) and
# sweep RAYON thread counts in one process — the per-subsystem parallel-efficiency instrument.
rayon = "1"
# Global allocator (T1.0): the system allocator's per-thread arena contention is a measured
# scaling bottleneck under rayon (per-row SmallVec spills). mimalloc is lock-light + sharded.
mimalloc = { version = "0.1", optional = true }
# Opt-in reasoning (RDFS/OWL-RL materialization) — engaged only by `--reason` / the `reason`
# subcommand; the default query/build path never touches it.
sparq-reason = { path = "../sparq-reason" }
oxttl.workspace = true
oxrdf.workspace = true
# Streaming decompression: gzip + bzip2, and zstd (the fast, parallel-friendly bulk
# format — ~12x faster to decompress than bzip2, so decompression stops being the
# ingestion bottleneck; recompress a .bz2 source once with `zstd -9 -T0`).
flate2 = "1"
bzip2 = "0.5"
zstd = "0.13"
# Direct mmap for the compression probe (measure-first sizing of permutation indexes).
memmap2 = { workspace = true }
