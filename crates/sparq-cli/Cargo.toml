[package]
name = "sparq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface for the sparq RDF triplestore: load, query, benchmark, build/query on-disk indexes, and reason (RDFS/OWL-RL/N3)"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# [OPUS-4.8] crate-local README so crates.io (package.readme) matches the docs.rs front
# page (main.rs include_str!("../README.md")) — same content on both registries.
readme = "README.md"

# [OPUS-4.8] Build the README-as-front-page docs on docs.rs with all features
# enabled, and pass `--cfg docsrs` so any `#[cfg(docsrs)]`-gated doc attrs apply.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Out-of-core querying (memory-mapped on-disk indexes) — on by default for the CLI.
# mimalloc: the global allocator (T1.0). On by default; `--no-default-features --features mmap`
# falls back to the system allocator for A/B measurement of allocator contention.
# [OPUS-4.8] (sq-oy1f.4, MAINTAINER-DIRECTED DEFAULT-ON EXCEPTION) `jsonld` is in the default
# set: the native CLI parses AND re-serialises JSON-LD out of the box (the user-prioritised
# sq-oy1f epic). This is a deliberate exception to sparq's opt-in-by-default principle — JSON-LD
# is the dominant linked-data interchange format and the native binary has no bundle-size floor.
# Still TOGGLEABLE: `--no-default-features --features mmap,mimalloc,dict-spill` drops it.
default = ["mmap", "mimalloc", "dict-spill", "jsonld"]
mmap = ["sparq-core/mmap"]
# Spillable build-time term dictionary for `build` (bounded peak RSS; env-gated at
# runtime via SPARQ_DICT_SPILL — default behavior is unchanged when the vars are unset).
dict-spill = ["sparq-core/dict-spill"]
mimalloc = ["dep:mimalloc"]
# [OPUS-4.8] (sq-oy1f.4, epic sq-oy1f) `jsonld` — JSON-LD ingest + re-serialisation, DEFAULT ON
# (maintainer-directed exception to opt-in-by-default; see `default` above). Forwards
# `sparq-core/jsonld` (the `oxjsonld` parser `dump <file> jsonld …` / `load <file> jsonld` use to
# READ a JSON-LD document) and implies `serialize-rdf` (the engine's hand-rolled JSON-LD WRITER, so
# `dump … jsonld[-…]` EMITS one). Toggleable: drop it via `--no-default-features` to omit the
# `oxjsonld` parser. Native-only; the lean wasm bundle keeps JSON-LD opt-in (sparq-wasm/jsonld).
jsonld = ["sparq-core/jsonld", "serialize-rdf"]
# [OPUS-4.8] (sq-678h) `dump <file> <in-format> <out-format>` — load an RDF document and
# re-serialize it as Turtle / TriG / N-Quads / JSON-LD (the writer matrix). Forwards sparq-engine's
# `serialize-rdf` feature (no new dependencies — the JSON-LD writer is a hand-rolled emitter).
# Pulled into the default build by `jsonld` (above); a `--no-default-features` build that wants ONLY
# the Turtle/TriG/N-Quads writers (no JSON-LD parser) can enable `serialize-rdf` on its own.
serialize-rdf = ["sparq-engine/serialize-rdf"]
# HDT ingestion (`<file>.hdt[.gz]` / format "hdt") via the opt-in sparq-hdt crate.
# OFF by default for two deliberate reasons: (1) sparq-hdt's MSRV is 1.87 (the
# wrapped hdt crate) vs this crate's workspace floor of 1.85 — a default dep
# would silently raise the CLI's MSRV; (2) the hdt decode stack is dead weight
# for the common load-and-query paths. Enable with
# `cargo build -p sparq-cli --features hdt`.
hdt = ["dep:sparq-hdt"]
# [OPUS-4.8] (sq-i3xc, lever H5) `zlib-ng`: opt-in, OFF by default, NATIVE-ONLY faster
# gzip backend (zlib-ng C library via flate2) — a measured 1.5–3× inflate on every gzip
# ingest path (`.nt.gz` etc.) at ~zero code change. The weak `sparq-hdt?/zlib-ng` dep
# extends the speedup to the `.hdt.gz` path too, but ONLY when the `hdt` feature is also
# enabled (so `--features hdt,zlib-ng`); with `hdt` off it is a no-op and pulls nothing.
# SAFE because the CLI is native-only and never in the sparq-wasm graph, so the C dep can
# never reach the wasm bundle. The default flate2 backend stays pure-Rust miniz_oxide.
zlib-ng = ["flate2/zlib-ng", "sparq-hdt?/zlib-ng"]
# [OPUS-4.8] (sq-vczh2, epic sq-2m6zm, design research/llm-ergonomic-sparql-surface.md §4) `terse`
# (default OFF) adds the `terse <terse-query>` subcommand: it transpiles a *terse* query (the
# `K:<name>` keyword layer over canonical SPARQL) and prints the CANONICAL SPARQL it expands to PLUS
# the keyword expansions / warnings / legend version, as JSON — the same verifiable contract the
# server's `POST /terse/transpile` endpoint returns. It never executes the query: the agent runs the
# printed `canonical_sparql` through `query` (or pipes it to `--query`). Forwards the LEAN
# `sparq-terse` build (no `vectors`): the keyword layer is fully on; a `V("phrase")` construct
# loud-FAILS (exit 2) rather than guessing — concept resolution is a future `vectors`-gated
# extension (the V() ambiguity caveat is tracked by sq-26fdp). OFF by default — a build without
# the feature carries no terse code and the subcommand is absent. Enable with
# `cargo build -p sparq-cli --features terse`.
terse = ["dep:sparq-terse"]
# [FABLE-5] (sq-1ivw7) Forward sparq-engine's opt-in `id-filter-fastpath` — the id-level `=`/`!=`
# FILTER fast path (subject/predicate-only + snapshot-aware predicate-range non-literal object
# operands decided by dictionary-id (in)equality). OFF by default (the default CLI build carries
# none of the fast-path machinery and is behaviour-identical). Enable to bench the fast path, e.g.
# `cargo build --release -p sparq-cli --features id-filter-fastpath`.
id-filter-fastpath = ["sparq-engine/id-filter-fastpath"]

[dependencies]
# `version` alongside `path` on the sparq-* deps: cargo uses the path locally and the
# version on crates.io (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.0", features = ["mmap"] }
# [SONNET-4.6] sq-7d3dj.30.5: enable the opt-in DPccp join-order planner so the CLI
# (the canonical bench binary) uses the cost-optimal bushy join tree by default for
# small BGPs. sparq-engine's default features are unchanged; the feature is ON only for
# the CLI, keeping the core lean per the opt-in feature architecture.
# [FABLE-5] sq-7d3dj.30.13: also enable the opt-in pre-execution ALGEBRA-REWRITE pass
# (#1735 — result-equivalent FILTER `?v = <iri>` constant substitution + `!bound` anti-join)
# the same way, so the shipped CLI and every canonical benchmark measure the rewritten
# plans instead of a rewrite-dark binary. sparq-engine's LIBRARY default stays OFF (library
# consumers choose explicitly); the pass adds zero deps and no `unsafe`. Its soundness
# witnesses run in the `sparq-engine (algebra-rewrite)` feature-matrix leg, and
# `tests/cli_contract.rs::algebra_rewrite_*` is the compile-time + behavioral tripwire
# that this dep line keeps the pass lit.
sparq-engine = { path = "../sparq-engine", version = "0.1.0", features = ["dp-planner", "algebra-rewrite"] }
# [OPUS-4.8] (sq-l4ki) `query` reuses sparq-server's W3C SELECT result serialisers
# (XML/CSV/TSV) for its `--format` flag instead of re-implementing them. We take ONLY
# the pure serialiser library (`results`) — `default-features = false` drops the `server`
# feature so axum/tokio/hyper are NOT pulled into the CLI (verified: `cargo tree -p
# sparq-cli -e normal | grep -c axum` == 0). JSON / ASK-boolean / CONSTRUCT come straight
# from sparq-engine (`query_json` / `construct_ntriples`), so the dep is serialiser-only.
sparq-server = { path = "../sparq-server", version = "0.1.0", default-features = false }
# [OPUS-4.8] Classify the parsed query form (Select / Ask / Construct / Describe) so
# `query` can dispatch SELECT→rows, ASK→boolean, CONSTRUCT/DESCRIBE→triples. Mirrors how
# sparq-server classifies before dispatch; already in the CLI's tree transitively via
# sparq-engine, so the direct dep adds no new code.
spargebra.workspace = true
# Direct dep so the `scaling` harness can build fixed-size rayon pools (ThreadPoolBuilder) and
# sweep RAYON thread counts in one process — the per-subsystem parallel-efficiency instrument.
rayon = "1"
# Global allocator (T1.0): the system allocator's per-thread arena contention is a measured
# scaling bottleneck under rayon (per-row SmallVec spills). mimalloc is lock-light + sharded.
mimalloc = { version = "0.1", optional = true }
# Opt-in reasoning (RDFS/OWL-RL materialization) — engaged only by `--reason` / the `reason`
# subcommand; the default query/build path never touches it.
sparq-reason = { path = "../sparq-reason", version = "0.1.0" }
# Opt-in HDT ingestion (the `hdt` feature; see [features] for why it is not default).
sparq-hdt = { path = "../sparq-hdt", version = "0.1.0", optional = true }
# [OPUS-4.8] (sq-vczh2) Behind the opt-in `terse` feature only: the verifiable LLM-ergonomic
# transpiler (`sparq_terse::terse_to_sparql`) for the `terse` subcommand. Pulled WITHOUT its
# `vectors` feature, so this is the LEAN build (depends only on `spargebra`, already in the CLI's
# tree). OFF by default — a build without the `terse` feature carries no terse code.
sparq-terse = { path = "../sparq-terse", version = "0.1.0", optional = true }
oxttl.workspace = true
oxrdf.workspace = true
# Streaming decompression: gzip + bzip2, and zstd (the fast, parallel-friendly bulk
# format — ~12x faster to decompress than bzip2, so decompression stops being the
# ingestion bottleneck; recompress a .bz2 source once with `zstd -9 -T0`).
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
# Direct mmap for the compression probe (measure-first sizing of permutation indexes).
memmap2 = { workspace = true }

[dev-dependencies]
# [OPUS-4.8] cli_contract.rs generates gzip/zstd/bzip2 copies of the same N-Triples
# fixture in a tempdir to assert the CLI's compressed-input auto-detection. These are
# already regular deps above (the CLI decodes the same three codecs), so declaring them
# as dev-deps adds nothing to the dependency tree — it just lets the integration test
# link them. (hdt_cli.rs uses flate2 the same way under the `hdt` feature.)
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
# [OPUS-4.8] (sq-d7d) `bench`/`bench-mmap` emit a dependency-free JSON results document via
# `--json <path>` (the runtime CLI adds NO serde dep — it hand-builds the JSON like
# mpc_net_bench::cell_json). serde_json is a TEST-ONLY dep so cli_contract.rs can prove the
# emitted document is genuinely valid, parseable JSON with the expected keys (a stronger
# assertion than substring checks). Dev-deps never enter the shipped binary or its MSRV.
serde_json = "1"
