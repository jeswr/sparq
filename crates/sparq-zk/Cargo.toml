[package]
name = "sparq-zk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ZK derived-credential commitment pipeline + zk-trace seam for sparq (RDFC10 canonicalization, Poseidon2-BN254 per-graph commitments, <urn:sparq:zk> registry plumbing)"
publish = false

# NOTHING in the workspace depends on this crate: default builds, the wasm
# artifact, and every other crate's dependency graph are untouched by it.
# (Verified by the byte-identical wasm gate in the zk-core branch report.)

[features]
default = []
# [OPUS-4.8] sq-zzxt: the `value-only` commitment method — a single value-first
# leaf with the lexical-identity hash DROPPED (term identity lost entirely). It is
# a BENCHMARK / RESEARCH comparison dial only and NEVER a production default
# (`research/zk-configurable-commitment-design.md` §2.2, §10 default (2)). OFF by
# default: a normal build CANNOT construct or parse the value-only method, and the
# `commit::CommitmentMethod::ValueOnlyV1` variant is compiled out — the feature
# name is the warning. LEAN: adds NO dependency. (`string-canonical` and
# `dual-leaf` are always available; only the research dial is gated.)
commitment-value-only = []

[dependencies]
# sparq term model / store / engine. The engine dep turns on its non-default
# `zk` feature (the zk-trace executor seam); that feature only exists inside
# sparq-zk's own dependency graph.
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine", features = ["zk"] }
oxrdf = { workspace = true }
spargebra = { workspace = true }

# RDFC-1.0 (W3C RDF Dataset Canonicalization) — single-sourced in the opt-in
# `sparq-canon` crate (the public canonicalization surface; sq-0qip). It owns
# the oxrdf 0.3 <-> 0.2 bridge and the rdf-canon dependency, so `sparq-zk`'s
# `canon` module is now just a re-export. [OPUS-4.8]
sparq-canon = { path = "../sparq-canon" }

# BN254 scalar field (the Noir `Field`) for Poseidon2.
# [OPUS-4.8] The whole arkworks stack (ark-bn254/ark-ff/ark-ec/ark-serialize/ark-ed-on-bn254/
# ark-std) is bumped 0.5 -> 0.6 TOGETHER: the traits are version-coupled, so a partial bump
# (Dependabot PRs #21 ark-std / #22 ark-ed-on-bn254 in isolation) mixes 0.5/0.6 trait
# coherence and fails to compile. The combined bump compiles clean and all sparq-zk tests
# (EdDSA/Poseidon2/commitment) pass.
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6", default-features = false }

# Off-circuit string hash h_s (plan §2.2: Enc_t(term) = h_2(type_code, h_s(value))).
blake3 = "1"

# [OPUS-4.8] sq-u8a8 (epic sq-toze / from side-channel analysis sq-egx6, gap
# CR-G5): secret-memory hygiene + constant-time-equality PRIMITIVES for the
# secret-bearing types in this crate. This is timing/memory HYGIENE only — it
# changes NO crypto algorithm, protocol behaviour, wire format, or verifier
# soundness (the analysis found the architecture already avoids secret-vs-secret
# equality, so `subtle` is adopted for the SecretKey scalar bytes' future-safe
# CT compare, not to replace any public-data `==`). `zeroize` zeroes the issuer/
# holder `SecretKey` scalar on drop so it does not linger in freed memory.
# Mark for Fable crypto re-review.
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# OS CSPRNG for the trusted-ingest per-graph salt mint (audit #9 / sq-610): each
# named graph draws fresh OS-random entropy so its bnode salt is globally unique
# by construction.
# [OPUS-4.8] sq-610 / sq-8xug: bumped to the 0.4 line as part of the rand-ecosystem
# upgrade. getrandom 0.3+ replaced the top-level `getrandom()` fn with `fill()`.
getrandom = "0.4"
ark-ed-on-bn254 = { version = "0.6", default-features = false }
ark-ec = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false, features = ["std"] }

# [dev-dependencies] removed: the W3C rdf-canon suite (and its serde_json/sha2
# deps) moved to `sparq-canon` with the canonicalization surface (sq-0qip).
