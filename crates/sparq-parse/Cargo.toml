[package]
name = "sparq-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Compressed (multi-member gzip / multi-frame zstd) serialization of sparq query results; design gated on the measured baseline in research/custom-parsers-baseline.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = false

# Codec deps live HERE and nowhere closer to the engine: this crate must never
# enter the sparq-wasm dependency graph (guard: `cargo tree -p sparq-wasm -e
# normal` shows no sparq-parse/zstd/flate2). Same flate2/zstd versions the CLI
# pins, so the lockfile stays single-versioned.
[dependencies]
# Multi-member gzip (one RFC 1952 member per result chunk).
flate2 = "1"
# Multi-frame zstd + dictionary training/compression (zdict_builder is a default feature).
zstd = "0.13"
# Parallel chunk compression (CompressedSink Mode::Parallel).
rayon = { workspace = true }
