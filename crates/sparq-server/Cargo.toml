[package]
name = "sparq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "W3C-conformant HTTP server exposing the sparq query engine (SPARQL 1.1 Protocol + Graph Store HTTP Protocol read side)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
# rlib so the protocol/serializer logic can be unit-tested and reused by the binary.
crate-type = ["rlib"]

[[bin]]
name = "sparq-server"
path = "src/main.rs"
required-features = ["server"]

[features]
# `server` pulls the async HTTP stack (axum/hyper/tokio). Default-on for the native
# build; the wasm build never compiles this crate (it depends only on sparq-core and
# sparq-engine directly — see crates/sparq-wasm/Cargo.toml), so the heavy async deps
# are never part of the bundle. Kept behind a feature so a consumer can depend on the
# pure serializer library (XML/CSV/TSV) without dragging in the runtime.
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing-subscriber", "dep:futures-util", "dep:serde_json"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.0" }
sparq-engine = { path = "../sparq-engine", version = "0.1.0" }
oxrdf.workspace = true
# Re-parse to classify the SPARQL query form (SELECT/ASK/CONSTRUCT/DESCRIBE) before
# dispatching to the engine — the engine's public API only runs SELECT.
spargebra.workspace = true

# --- async HTTP stack (feature-gated; native only) ---
# `ws` powers the /subscriptions endpoint (T23, SEPA-style SPARQL subscriptions).
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "tokio", "query", "json", "ws"] }
# `sync` adds the watch channel that carries the commit generation to subscription tasks (T23).
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# `limit` + `load-shed` power the max-concurrency guard (T15); `util` for ServiceBuilder combinators.
tower = { version = "0.5", optional = true, features = ["limit", "load-shed", "util"] }
# `catch-panic` turns a handler panic into a 500 instead of a dead connection (T15).
tower-http = { version = "0.6", optional = true, features = ["trace", "catch-panic"] }
# Emits the TraceLayer request log when the binary runs with --verbose.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "env-filter"] }
# `stream::iter` feeds the streamed SELECT body (T16) — already in axum's dependency
# graph, so this adds no new transitive code.
futures-util = { version = "0.3", optional = true, default-features = false }
# Subscription protocol messages + result diffs (T23) — already in axum's dependency
# graph (its `json` feature), so this adds no new transitive code.
serde_json = { version = "1", optional = true }

mimalloc = "0.1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }
# In-process HTTP client for integration tests (spin the server, assert protocol shape).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# WebSocket client for the /subscriptions integration tests (T23) — same version axum's
# `ws` feature resolves to, so the dependency tree gains nothing new.
tokio-tungstenite = "0.24"
# `StreamExt::next` / `SinkExt::send` on the test client's WebSocket stream.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
