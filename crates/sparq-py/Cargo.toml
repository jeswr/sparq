# sparq-py (T21): Python bindings for the sparq RDF engine, built with pyo3 + maturin.
#
# This crate ships to PyPI (package name `sparq`) — NOT to crates.io — hence
# `publish = false`. It is a thin wrapper over the public APIs of sparq-core /
# sparq-engine / sparq-reason; it contains no engine logic of its own.
#
# abi3-py39: one wheel per platform works on every CPython >= 3.9 (the stable ABI),
# instead of one wheel per Python minor version.

[package]
name = "sparq-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Python bindings for the sparq RDF + SPARQL engine (PyPI package: sparq)"
repository.workspace = true
homepage.workspace = true

[lib]
# The cdylib IS the Python module (maturin renames it to sparq.<abi3>.so). The lib
# name matches the `#[pymodule] fn sparq` so no [tool.maturin] module-name is needed.
name = "sparq"
crate-type = ["cdylib"]

[build-dependencies]
# build.rs: emit the macOS `-undefined dynamic_lookup` link args for extension modules.
pyo3-build-config = "0.25"

[dependencies]
# `extension-module` tells pyo3 NOT to link libpython (the interpreter provides the
# symbols at import time) — required for manylinux wheels, and it keeps a plain
# `cargo build -p sparq-py` working without Python development headers.
pyo3 = { version = "0.25", features = ["abi3-py39", "extension-module"] }
# `mmap` enables Graph::save / Graph::open (the out-of-core persisted-index path).
sparq-core = { path = "../sparq-core", features = ["mmap"] }
sparq-engine = { path = "../sparq-engine" }
# Opt-in reasoning. Pulling it here is fine: sparq-py is a leaf crate, so the reason
# crate never enters the engine/CLI/wasm dependency graphs through this edge.
sparq-reason = { path = "../sparq-reason" }
oxrdf.workspace = true
# Used only to classify ASK vs SELECT and rewrite ASK -> SELECT (the same trick
# sparq-server uses): the engine has no native ASK entry point yet.
spargebra.workspace = true
