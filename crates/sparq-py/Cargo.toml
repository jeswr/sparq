# sparq-py (T21): Python bindings for the sparq RDF engine, built with pyo3 + maturin.
#
# This crate ships to PyPI as the distribution `sparq-rdf` (the import name stays
# `sparq` — see [lib] name below and pyproject.toml `[tool.maturin] module-name`) —
# NOT to crates.io — hence `publish = false`. It is a thin wrapper over the public
# APIs of sparq-core / sparq-engine / sparq-reason; it contains no engine logic of
# its own.
#
# abi3-py39: one wheel per platform works on every CPython >= 3.9 (the stable ABI),
# instead of one wheel per Python minor version.

[package]
name = "sparq-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Python bindings for the sparq RDF + SPARQL engine (PyPI distribution: sparq-rdf; import name: sparq)"
repository.workspace = true
homepage.workspace = true

[lib]
# The cdylib IS the Python *import* module (maturin renames it to sparq.<abi3>.so).
# The lib name matches the `#[pymodule] fn sparq`. [OPUS-4.8] sq-8slf: the PyPI
# *distribution* name is `sparq-rdf` (pyproject `[project] name`), which differs from
# this import name; pyproject `[tool.maturin] module-name = "sparq"` pins the import
# name so maturin does not derive `sparq_rdf` from the distribution name.
name = "sparq"
crate-type = ["cdylib"]
# No Rust tests live here (the test suite is tests/test_basic.py, run via maturin/pytest).
# Disable the auto lib-test harness: pyo3's `extension-module` emits the required
# `-undefined dynamic_lookup` only as cdylib link args (`cargo:rustc-cdylib-link-arg`),
# so the test binary fails to link on macOS (missing _Py* symbols) — a known pyo3
# cargo-test limitation. Without this, `cargo test --workspace` cannot run on macOS.
test = false
doctest = false

[build-dependencies]
# build.rs: emit the macOS `-undefined dynamic_lookup` link args for extension modules.
pyo3-build-config = "0.29"

[dependencies]
# `extension-module` tells pyo3 NOT to link libpython (the interpreter provides the
# symbols at import time) — required for manylinux wheels, and it keeps a plain
# `cargo build -p sparq-py` working without Python development headers.
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# `mmap` enables Graph::save / Graph::open (the out-of-core persisted-index path).
sparq-core = { path = "../sparq-core", features = ["mmap"] }
sparq-engine = { path = "../sparq-engine" }
# Opt-in reasoning. Pulling it here is fine: sparq-py is a leaf crate, so the reason
# crate never enters the engine/CLI/wasm dependency graphs through this edge.
sparq-reason = { path = "../sparq-reason" }
# Opt-in full-text search (TextIndex + the `text:` magic predicates) — the same
# leaf-crate rationale as sparq-reason above. Natively, full-text is "opt-in by
# depending on sparq-text"; this edge opts the Python wheel in while the
# engine/CLI/wasm dependency graphs stay text-free. Default features = `engine`
# (the text: rewrite) + `parallel` (rayon-sharded index build).
sparq-text = { path = "../sparq-text" }
oxrdf.workspace = true
# Used only to classify the query form in `Graph.ask` (ASK runs the engine's
# native early-exiting entry point; SELECT is answered via the lazy count).
spargebra.workspace = true
# [OPUS-4.8] sq-lt1ml (gh-910): opt-in Arrow export. Only behind the `arrow` feature,
# so the lean wheel pulls ZERO Arrow code. `sparq-arrow/arrow` gives the QueryResult ->
# RecordBatch projection (one struct column per variable); `arrow-array`/`arrow-schema`
# with their `ffi` feature give the C Data Interface (`FFI_ArrowArrayStream`) we hand to
# pyarrow as a PyCapsule (no re-serialisation). Versions are workspace-pinned to match
# sparq-arrow's arrow 59 exactly so the `RecordBatch` type is byte-identical across the edge.
sparq-arrow = { path = "../sparq-arrow", features = ["arrow"], optional = true }
arrow-array = { version = "59", features = ["ffi"], optional = true }
arrow-schema = { version = "59", features = ["ffi"], optional = true }

[features]
# [OPUS-4.8] sq-oy1f.20: JSON-LD is DEFAULT-ON in the Python wheel — the maintainer-
# directed exception to sparq's opt-in-by-default principle for the user-prioritised
# JSON-LD epic (sq-oy1f), mirroring the native CLI + server (sq-oy1f.4). The Python
# wheel has no bundle-size floor (unlike the lean wasm bundle, where JSON-LD stays
# opt-in), so wiring `oxjsonld` in by default costs nothing the wheel cares about while
# making `Graph.load(..., format="jsonld")` and a `.jsonld` path work out of the box.
# LEAN INVARIANT PRESERVED: this only enables `oxjsonld` via THIS leaf crate's edge —
# the sparq-core / sparq-engine LIBRARY defaults stay lean, so the engine/wasm graphs
# are untouched. Toggleable: `cargo build -p sparq-py --no-default-features` (and a
# `--no-default-features` wheel) drops the oxjsonld parser; then `format="jsonld"`
# fails closed (sparq-core rejects the unknown format rather than mis-parsing it).
default = ["jsonld"]
jsonld = ["sparq-core/jsonld"]
# [OPUS-4.8] sq-lt1ml (gh-910): `Graph.query_arrow(sparql) -> pyarrow.Table`. OFF by
# default — the lean wheel pays nothing (no Arrow dependency, no extra code compiled).
# A wheel built with `--features arrow` (the `arrow` PyPI extra is wired through this
# cargo feature) gains the Arrow columnar export. Pulls sparq-arrow's RecordBatch
# projection + the arrow C Data Interface used to hand the batch to pyarrow zero-copy.
arrow = ["dep:sparq-arrow", "dep:arrow-array", "dep:arrow-schema"]
