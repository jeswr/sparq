[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sparq"
description = "Python bindings for the sparq RDF + SPARQL engine (dictionary-encoded triplestore, SPARQL 1.1 query/update, opt-in RDFS/OWL-RL/N3 reasoning)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rdf", "sparql", "semantic-web", "triplestore", "query-engine", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Scientific/Engineering",
]
# Version comes from the workspace Cargo.toml ([workspace.package] version).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jeswr/sparq"
Repository = "https://github.com/jeswr/sparq"
Documentation = "https://github.com/jeswr/sparq#readme"
Issues = "https://github.com/jeswr/sparq/issues"

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[tool.maturin]
# The cdylib's lib name and #[pymodule] are both `sparq`, so no module-name
# override is needed. abi3 (set in Cargo.toml) makes the wheel one-per-platform.
# For RELEASE wheels use `maturin build --profile python-release` (release
# optimisation + unwinding panics; the workspace's plain release profile is
# panic=abort, which would turn any Rust panic into a hard interpreter abort).

[tool.pytest.ini_options]
testpaths = ["tests"]
# [OPUS-4.8] sq-th1u: also collect bench_*.py (pytest's default python_files is
# only test_*.py / *_test.py, so without this the FFI micro-bench file would be
# silently skipped by a plain `pytest tests/` directory run).
python_files = ["test_*.py", "bench_*.py"]
# Register the `bench` marker (the FFI-overhead micro-bench in tests/bench_py.py).
# CI selects it with `pytest -m bench` or skips it with `pytest -m "not bench"`;
# registering it here silences the "unknown mark" warning.
markers = [
  "bench: timed FFI-overhead micro-benchmarks (prints measurements; select/deselect with -m bench / -m 'not bench')",
]
