[package]
name = "sparq-conformance"
# Dev-only harness (roadmap T13): runs the official W3C SPARQL test suites
# against sparq and reports a pass-rate scoreboard. Never published.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sparq-conformance"
path = "src/main.rs"

# The inference/reasoning suites (RDF Semantics rdf-mt, OWL 2 RL, N3, SPARQL
# entailment regimes) — run against sparq-reason. Informational in CI.
[[bin]]
name = "sparq-inference-conformance"
path = "src/bin/inference.rs"

[dependencies]
sparq-core = { path = "../sparq-core" }
sparq-engine = { path = "../sparq-engine" }
sparq-reason = { path = "../sparq-reason" }
oxrdf.workspace = true
oxttl.workspace = true
spargebra.workspace = true
rustc-hash.workspace = true
# Expected-result parsing only: RDF/XML result sets (.rdf) and SPARQL XML results (.srx).
oxrdfxml = { version = "0.2", features = ["rdf-12"] }
quick-xml = "0.37"
serde_json = "1"
