[package]
name = "sparq-introspect"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in ontology/schema introspection for the sparq RDF engine: characteristic sets, effective-schema mining (classes, predicate usage, observed domain/range), vocabulary detection, and token-budgeted text summaries for LLM grounding"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Opt-in schema introspection (GenAI phase 2 — see research/genai-design.md and
# research/genai-ontology-introspection.md). This is a SEPARATE crate so the core
# engine carries zero introspection code; it consumes only sparq-core's PUBLIC
# read API (dict lookups, permutation-index scans). The whole effective schema —
# characteristic sets, class extents, predicate histograms, observed domain/range
# — falls out of sorted scans over the indexes the store already keeps: no
# GROUP BY, no hashing joins, no models, no network.

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.0" }
oxrdf.workspace = true
rustc-hash.workspace = true
# The machine-readable surface for LLM grounding (`Introspection::to_json`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
