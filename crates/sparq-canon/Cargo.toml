[package]
name = "sparq-canon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RDFC-1.0 (RDF Dataset Canonicalization / URDNA2015 successor) as a small, opt-in public API over sparq's oxrdf 0.3 term model"
publish = false

# OPT-IN, single-sourced canonicalizer. NOTHING in the workspace's default
# build depends on this crate: it is a standalone member (like `sparq-zk`), so
# `sparq-core`'s default build and the wasm artifact are byte-identical with or
# without it. `sparq-zk` depends on it for the ZK commitment pipeline; consumers
# who don't need canonicalization never pull `rdf-canon`/arkworks-free this dep.
#
# The RDFC-1.0 ALGORITHM itself is the maintained zkp-ld `rdf-canon` crate
# (W3C rdf-canon-test-suite validated). This crate is the clean PUBLIC SURFACE:
# it owns the single oxrdf-0.3 <-> oxrdf-0.2 bridge that every sparq consumer
# (the ZK layer, and now any caller) shares, so the bridge lives in exactly one
# place. [OPUS-4.8] sq-0qip (ex-epic sq-3183).

[dependencies]
# sparq term model (oxrdf 0.3 re-export) + store Graph.
sparq-core = { path = "../sparq-core" }
oxrdf = { workspace = true }
oxttl = { workspace = true }

# RDFC-1.0 (W3C RDF Dataset Canonicalization). Maintained zkp-ld implementation;
# it speaks oxrdf 0.2, so we bridge from sparq's oxrdf 0.3 via canonical N-Quads
# text (the interchange form the RDFC10 spec is defined over — lossless by
# construction, and exercised end-to-end by the W3C suite).
rdf-canon = "0.15.3"
oxrdf02 = { package = "oxrdf", version = "0.2.4" }
oxttl01 = { package = "oxttl", version = "0.1.8" }
# RDFC-1.0's hash-function trait, re-exported as `sparq_canon::Digest` so callers
# of the `*_with` profile functions can name a hasher without a direct dep.
# [OPUS-4.8] Pinned to 0.10 to match rdf-canon 0.15.3's `Digest` bound (see sha2 note below).
digest = "0.10"

[dev-dependencies]
sparq-engine = { path = "../sparq-engine" }
serde_json = "1"
# SHA-384 parameterized-hash cases of the W3C rdf-canon suite (test075).
# [OPUS-4.8] Pinned to 0.10 (NOT 0.11): rdf-canon 0.15.3 exposes a `Digest` bound
# from digest 0.10, and the suite feeds `sha2::Sha384` straight into
# canonicalize_quads_with::<D>. Lift only once rdf-canon publishes a digest-0.11
# release. See sparq-zk's Cargo.toml note / Dependabot PR #17.
sha2 = "0.10"
