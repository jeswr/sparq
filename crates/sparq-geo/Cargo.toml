[package]
name = "sparq-geo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in GeoSPARQL 1.0/1.1 core for the sparq RDF engine: WKT geometry parsing, geof: spatial functions, and an R-tree GeoIndex over sparq Graphs"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# [OPUS-4.8] docs.rs: build with ALL features (engine + reproject) so the full
# API — including the `reproject` module — appears on the rendered front page,
# and pass `--cfg docsrs` so any `#[doc(cfg(...))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Opt-in GeoSPARQL support (T24b). This is a SEPARATE crate so the core engine — and
# in particular the wasm build — carries zero geometry code or dependencies; spatial
# support is engaged only by depending on this crate.
#
# Wrap-vs-implement: WKT parsing and the simple-features (DE-9IM) relations are
# WRAPPED from the standard pure-Rust geo stack (georust: `wkt` + `geo`/`geo-types`)
# rather than reimplemented; the R-tree spatial index wraps `rstar`. What this crate
# adds is the GeoSPARQL layer: geo:wktLiteral lexical forms (optional leading CRS
# IRI), the geof: function semantics, and Graph -> (entity, geometry) extraction
# over geo:hasGeometry / geo:asWKT.

[features]
# `engine` (default on): [`geof_registry`] — the geof: functions packaged as a
# sparq-engine `FunctionRegistry`, runnable inside SPARQL FILTER/BIND via
# `sparq_engine::query_with_functions`. Disable default features for the pure
# geometry library (WKT literals, geof: as plain Rust, GeoIndex) without the
# engine in the dependency graph.
# `reproject` (opt-in): the [`reproject`] module — pure-Rust coordinate
# transformation (proj4rs) from a small curated set of projected EPSG CRSs
# into CRS84, so projected literals can join the geographic machinery
# (GeoIndex, metric distance). Off by default: most deployments never see
# projected literals.
# `geosparql_rewrite` (opt-in, OFF by default): the [`rewrite`] module — the OGC
# GeoSPARQL query-rewrite extension (`/conf/query-rewrite-extension`). It expands a
# topology-relation PROPERTY pattern (`?f geo:sfWithin ?region`) into a
# default-geometry resolution + matching `geof:` FILTER, on a DEDICATED
# `geosparql_rewrite` entry point. OFF by default so the STANDARD `sparq_engine`
# entry points keep their exact W3C-conformant behaviour (a `geo:sfWithin` triple
# matches only ASSERTED triples there) — the rewrite is a strict opt-in superset,
# never a change to default SPARQL semantics. Implies `engine` (the rewrite hands a
# rewritten `spargebra::Query` to the engine). [OPUS-4.8] sq-wf9qg
default = ["engine"]
engine = ["dep:sparq-engine", "dep:spargebra"]
geosparql_rewrite = ["engine"]
reproject = ["dep:proj4rs"]

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version on crates.io
# (required to publish — crates.io strips `path`).
sparq-core = { path = "../sparq-core", version = "0.1.0" }
# Behind the `engine` feature (the dependency direction is sparq-geo -> sparq-engine;
# the engine itself stays geometry-free, and so does the wasm bundle).
sparq-engine = { path = "../sparq-engine", version = "0.1.0", optional = true }
# [OPUS-4.8] sq-9g58: the SPARQL algebra the GeoSPARQL query-rewrite extension
# (src/rewrite.rs) transforms. Behind the `engine` feature only — the rewrite
# hands a rewritten `spargebra::Query` to `sparq_engine::PreparedQuery`, so the
# engine is already in the graph; the pure geometry library is unaffected. Same
# vendored spargebra + features the engine uses (workspace dep).
spargebra = { workspace = true, optional = true }
oxrdf.workspace = true
# WKT lexical forms <-> geo-types geometries.
wkt = "0.14"
# Geometry algorithms: DE-9IM relate, convex hull, bounding rect, distances.
geo = "0.33"
geo-types = "0.7"
# 1-D (string-line) overlay: clip a polyline by a polygon (line∩polygon and
# line−polygon), which `geo`'s `BooleanOps` does NOT provide — `BooleanOps`
# only nodes/overlays polygons. This is the SAME engine `geo 0.33` already
# uses for polygon overlay (it depends on i_overlay 4.5.x), so adding it as a
# direct dependency pulls in no new transitive crates. `default-features =
# false` mirrors geo's own usage and keeps the lockfile stable. [OPUS-4.8]
i_overlay = { version = "7.0.0", default-features = false }
# R-tree (bulk-loaded STR) over geometry bounding boxes.
rstar = "0.13"
# GML-SF geometry parsing (geo:gmlLiteral). A streaming XML reader, NOT a full
# GML processor — we walk the OGC GML Simple-Features geometry subset GeoSPARQL
# uses (Point/LineString/Polygon/Multi*). `default-features = false` keeps it to
# the pull-parser with no serde. The transitive oxigraph stack (oxrdfxml /
# sparesults) still pins quick-xml 0.37, so this 0.41 requirement currently
# resolves as a second copy in the lockfile until those upstreams bump. [OPUS-4.8]
# Bumped 0.40 -> 0.41 for RUSTSEC-2026-0194 (quadratic duplicate-attribute check)
# and RUSTSEC-2026-0195 (unbounded NsReader namespace-declaration allocation); both
# transitive 0.37.5 copies are scoped-ignored in deny.toml until oxigraph bumps.
quick-xml = { version = "0.41", default-features = false }
# Behind the `reproject` feature: pure-Rust proj4 (NOT the C `proj` binding —
# the workspace's pure-Rust constraint holds). One transitive dep (thiserror).
proj4rs = { version = "0.1", optional = true }
# Fast hash maps for the geometry-node -> feature mapping during index build.
rustc-hash.workspace = true

[dev-dependencies]
# Deterministic random geometries for property tests + the benchmark example.
# [OPUS-4.8] sq-8xug: rand-ecosystem 0.10. `random_range` moved from the `Rng`
# trait to `RngExt` in 0.10, so the test/example imports use the prelude.
rand = "0.10"
# [OPUS-4.8] sq-5ts8: TEST-ONLY. The GeoSPARQL RDFS/OWL Feature/Geometry class
# entailment conformance fixture (tests/entailment.rs) drives the generic
# RDFS / OWL-RL closure over the GeoSPARQL ontology axioms — engine support for
# the entailment requirements is `sparq-reason`'s rule set, not new geo code, so
# the dependency is dev-only and the shipped crate is unaffected. `default-features
# = false` drops the rayon `parallel` feature the closure does not need here.
sparq-reason = { path = "../sparq-reason", version = "0.1.0", default-features = false }
