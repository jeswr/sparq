<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" role="img" aria-label="sparq">
  <style>
    .shield{fill:#1c7f86}
    .bolt{fill:none;stroke:#f5a623;stroke-width:30;stroke-linejoin:round;stroke-linecap:round}
    .ink{fill:#11343a}
    @media (prefers-color-scheme:dark){ .shield{fill:#4cc4cc} .ink{fill:#e6f4f4} }
  </style>
  <!-- privacy/proof shield: an RDF triple knocked out as true negative space (transparent),
       with an amber lightning bolt (speed/spark) on the right. -->
  <defs>
    <mask id="graphCut">
      <rect x="0" y="0" width="380" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="20" stroke-linecap="round" fill="none">
        <line x1="138" y1="150" x2="96" y2="300"/>
        <line x1="138" y1="150" x2="180" y2="300"/>
        <line x1="96" y1="300" x2="180" y2="300"/>
      </g>
      <circle cx="138" cy="150" r="28" fill="#000"/>
      <circle cx="96" cy="300" r="26" fill="#000"/>
      <circle cx="180" cy="300" r="26" fill="#000"/>
    </mask>
  </defs>
  <g id="icon">
    <!-- fuller, fully-closed escutcheon, graph masked out -->
    <path class="shield" mask="url(#graphCut)" d="
      M190 48 C 250 86, 300 92, 326 96
      C 330 210, 320 320, 268 386
      C 240 422, 214 446, 190 462
      C 166 446, 140 422, 112 386
      C 60 320, 50 210, 54 96
      C 80 92, 130 86, 190 48 Z"/>
    <!-- amber lightning bolt on the right -->
    <path class="bolt" d="M278 140 L232 256 L276 256 L228 398"/>
  </g>
  <g id="wordmark">
    <text class="ink" x="430" y="296"
          font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace"
          font-size="190" font-weight="700" letter-spacing="-6">sparq</text>
  </g>
</svg>
