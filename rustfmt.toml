# rustfmt configuration for the sparq workspace.
#
# The workspace is formatted and CI enforces `cargo fmt --all --check` as a hard gate.
#
# STABLE options only: `cargo fmt` on the stable toolchain rejects unstable keys
# (imports_granularity, group_imports, etc.), which would make the gate fail on
# configuration rather than formatting. Keep everything here stable.
edition = "2021"
max_width = 100
