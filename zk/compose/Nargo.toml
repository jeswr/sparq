[workspace]
members = [
    "compose_core",
    "scan_k1_n16_r4",
    # [OPUS-4.8] sq-pzet: remaining scan (k,n,r)-lattice members the family could
    # derive but that had no compiled package (silent-unprovability gap, sq-wto
    # class). NOT a soundness change (verifier remains NOT-yet-sound, sq-qhy4).
    "scan_k1_n16_r8",
    "scan_k1_n64_r4",
    "scan_k1_n64_r8",
    "scan_k2_n16_r4",
    "scan_k2_n16_r8",
    "scan_k2_n64_r4",
    "scan_k2_n64_r8",
    "filter_int_d1",
    "filter_int_d2",
    "filter_int_d3",
    "filter_int_d4",
    # [OPUS-4.8] sq-1q9h: SIGNED xsd:integer + xsd:decimal FILTER coverage --
    # extends filter_int (canonical NON-negative integer only) to negative
    # integers and decimal amounts (sound operand binding; verifier composability
    # wiring is a follow-up, like the filter_f64 building-block precedent).
    "filter_signed_int_d2",
    "filter_signed_int_d4",
    "filter_decimal_i3_f2",
    "filter_f64",
    # [OPUS-4.8] sq-mslu (sq-7lrq part-2 / sq-lxi7): general xsd:double decimal->
    # IEEE-754 FILTER building block for fractional/scientific lexical forms over
    # the SOUND integer-valued fragment. Raw-b_bits building block (like
    # filter_f64); not yet manifest-composable (canonical-printing binding gap).
    "filter_f64_dec",
    "filter_f64_d1",
    "filter_f64_d2",
    "filter_f64_d3",
    "filter_f64_d4",
    "revoke_unset_d10",
    "hidden_issuer_d4",
    "holder_pok",
    # [OPUS-4.8] sq-3c00: hidden-holder-SET anonymity tier (Merkle holder-set
    # membership; the holder analogue of hidden_issuer_d4). Opt-in, NOT-yet-sound
    # (sq-qhy4) -- the verifier remains NOT-yet-sound; this is not a soundness change.
    "holder_set_d4",
    "join_eq_na16_nb16",
    # [OPUS-4.8] sq-pzet: remaining hidden-join graph-size members (the N=64
    # bucket) so a join composes with an n=64 scan.
    "join_eq_na16_nb64",
    "join_eq_na64_nb16",
    "join_eq_na64_nb64",
]
