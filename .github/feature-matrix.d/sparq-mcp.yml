# Feature-matrix fragment for `sparq-mcp`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits only THIS file, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# [OPUS-4.8] sq-0z43i (gh #909): the `stdio` transport is the only feature-gated
# surface — it adds the line-delimited JSON-RPC serve loop. This leg builds + tests
# the feature-ON state, including tests/stdio.rs (`#![cfg(feature = "stdio")]`: the
# real serve-loop round-trip), with `clippy --all-targets -D warnings`. The DEFAULT
# (feature-OFF) build — the transport-agnostic `handle_message` dispatch core and the
# in-memory MCP round-trip — is covered by the workspace lane.
- name: "sparq-mcp (stdio — JSON-RPC stdio transport serve loop)"
  crate: "sparq-mcp"
  features: "stdio"
  test: true

# [OPUS-4.8] sq-jxjgr (2026-06-23 design call): the opt-in server-side natural-language
# `ask` tool wiring sparq-nlq's NL→SPARQL loop behind the `nlq` feature (OFF by default —
# it pulls sparq-nlq + the configurable LLM backends, so it must not touch the lean
# default build). This leg builds + tests the feature-ON state — the src/nlq.rs unit
# suite (the REAL loop with a scripted in-process backend, no network) PLUS the
# tests/ask.rs integration suite (`#![cfg(feature = "nlq")]`: the fail-closed
# "not configured" degrade path through the real MCP dispatch) — with `clippy
# --all-targets -D warnings`. The structured `shapes` tool (sq-zak4f) is NOT
# feature-gated (it ships in the default build with no model), so it is covered by the
# workspace lane, not here. The DEFAULT (feature-OFF) build is covered by the workspace
# lane.
- name: "sparq-mcp (nlq — server-side NL ask tool wiring sparq-nlq)"
  crate: "sparq-mcp"
  features: "nlq"
  test: true

# [FABLE-5] sq-u16eq: the opt-in pod-backed MCP surface — LDP resource/container CRUD
# tools over sparq-solid's `PodStore` per the MCP-Solid proposal draft
# (site/specs/mcp-solid.typ §6.4/§7.3/§9.3). OFF by default — it pulls in `sparq-solid`
# + `oxrdf`, so it must not touch the lean default build. This leg builds + tests the
# feature-ON state — the src/solid.rs unit suite PLUS tests/solid.rs
# (`#![cfg(feature = "solid")]`: end-to-end tool round-trips through the real JSON-RPC
# dispatch against a real PodStore with a materialized WAC view, incl. the existence
# non-disclosure + ACL write-through invariants) — with `clippy --all-targets
# -D warnings`. The DEFAULT (feature-OFF) build is covered by the workspace lane.
- name: "sparq-mcp (solid — pod-backed LDP resource/container CRUD tools)"
  crate: "sparq-mcp"
  features: "solid"
  test: true

# [FABLE-5] sq-lsp7k.10: the template + full-text-search tool surfaces. `templates`
# (template_list / template_invoke over sparq-engine's `templates` module — typed
# fail-closed JSON binding; UPDATE templates behind the same allow_update gate as the raw
# update tool) and `text` (text_search over sparq-text's BM25 literal index,
# default-features = false: pure index, no rayon/engine seam). Both surfaces + the
# tests/templates_text.rs integration suite (`#![cfg(all(feature = "templates",
# feature = "text"))]`: template invocation result-equivalence, fail-closed arguments,
# the gated-update posture incl. the hostile-literal scenario, BM25 and/any/prefix search,
# update-then-search reconcile) are compiled EMPTY by the default build, so this ONE
# combined leg (they co-enable cleanly and share no cfg divergence) closes the gap.
- name: "sparq-mcp (templates, text — named-template invocation + BM25 text search tools)"
  crate: "sparq-mcp"
  features: "templates,text"
  test: true
