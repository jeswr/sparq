# Feature-matrix fragment for `sparq-reason`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits only THIS file, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# sparq-reason: derivation explanations ("proof trees").
- name: "sparq-reason (explain)"
  crate: "sparq-reason"
  features: "explain"
  test: true

# [SONNET-4.6] sq-pbz04.5.3: RIF/XML presentation-syntax importer. rif-xml is opt-in
# (off by default); enables `sparq_reason::rif_xml::import` and pulls in quick-xml.
# Wired here post-Opus adversarial-verify so CI covers capture-avoidance + fail-closed
# + xsd:string whitespace tests in the feature-ON state.
- name: "sparq-reason (rif-xml)"
  crate: "sparq-reason"
  features: "rif-xml"
  test: true

# [FABLE-5] sq-pbz04.1.1: the shared substrate-join sweep (the rdfs2/3/7 predicate join,
# sq-yk6or, + the rdfs9 type join). DISCOVERED GAP closed here: sq-yk6or (#1301) landed the
# feature and its behaviour-neutrality equivalence tests but wired NO matrix leg, so
# `substrate_join_emits_identical_plain_branch` ran in NO CI lane. This leg builds + tests +
# clippies the feature-ON state (the per-branch equivalence tests + the whole-closure
# byte-identity pin).
- name: "sparq-reason (substrate-join)"
  crate: "sparq-reason"
  features: "substrate-join"
  test: true
