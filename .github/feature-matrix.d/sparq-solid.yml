# Feature-matrix fragment for `sparq-solid`.
#
# One self-contained leg mapping per opt-in feature(group). Assembled into the
# feature-matrix `opt-in-features` strategy by scripts/assemble-feature-matrix.py
# (the `setup` job emits the combined matrix as JSON consumed via fromJSON). Adding a
# leg for THIS crate edits no OTHER crate's fragment, so concurrent opt-in-feature PRs for
# DIFFERENT crates never textually conflict (bead sq-ibrze). [OPUS-4.8]
# SCOPE ([SONNET-4.6] issue #2384): a leg change is a TWO-FILE change — this fragment
# AND scripts/tests/feature-matrix-legnames.golden.txt. See README.md in this directory.
#
# CONTRACT (gate-critical): each leg's emitted check-run NAME is `opt-in <name>`,
# discovered as a REQUIRED check by the ci-summary `gate` aggregator BY NAME. Keep
# `name` free of the whole words "advisory"/"informational" or the leg stops gating.
# Fields: name (required -> check-run name), crate (required), features (required,
# non-empty comma list), test (bool — run `cargo test` for the leg).

# [OPUS-4.8] sq-h3uk: the ODRL->AUTH_GRAPH bridge (pulls the optional
# sparq-policy ODRL evaluator) — keeps the opt-in ON path from rotting.
- name: "sparq-solid (odrl-bridge)"
  crate: "sparq-solid"
  features: "odrl-bridge"
  test: true

# [OPUS-4.8] sq-58mh: sparq-solid STATEFUL `odrl:count` wired THROUGH the bridge
# (a bridged grant self-retracts on exhaustion). The whole
# tests/odrl_count_bridge.rs file is `#![cfg(feature = "count-enforcement")]`
# and `materialize_odrl_permission_counted` + the `count` module are
# feature-gated, so without this leg the bridge's count path NEVER runs. The
# feature implies `odrl-bridge` + `sparq-policy/count-enforcement` (std-only, no
# new dep) — keeps the opt-in ON path from rotting.
- name: "sparq-solid (count-enforcement)"
  crate: "sparq-solid"
  features: "count-enforcement"
  test: true

# [OPUS-4.8] sq-gq28y (issue #1546): the `legacy-union-default-graph` escape hatch. The
# DEFAULT read path is now spec-conformant (empty standing default graph + explicit-union
# opt-in), covered by the plain `sparq-solid` leg (tests/union_default_graph.rs runs by
# default). This feature CHANGES a `not(feature=…)` code path back to union-always
# (query_as/query_json_as/ask_as), and the legacy-gated tests in tests/e2e.rs and
# tests/hardening.rs are `#[cfg(feature = "legacy-union-default-graph")]` — so per this
# workflow's GUARD rule (b) it needs its OWN ISOLATED leg (NOT combined with
# odrl-bridge/trust-graph, whose probes now assume the empty-default and use explicit
# `GRAPH ?g`). No new dependency (a pure query-rewrite change). Without this leg the
# union-always escape-hatch behaviour is never exercised.
- name: "sparq-solid (legacy-union-default-graph)"
  crate: "sparq-solid"
  features: "legacy-union-default-graph"
  test: true

# [FABLE-5] sq-lrtc3.3: pattern-scoped (sub-named-graph) result masking. The whole
# surface (src/pattern_scope.rs + tests/pattern_scope.rs, incl. the differential
# battery vs a physically-reduced oracle store) is `#[cfg(feature = "pattern-scope")]`,
# so without this leg the masking path NEVER runs in CI. No new dependency (public
# sparq-core/sparq-engine APIs only) — keeps the opt-in ON path from rotting.
- name: "sparq-solid (pattern-scope)"
  crate: "sparq-solid"
  features: "pattern-scope"
  test: true
