# Feature-matrix fragment for `sparq-wrapper-shacl`.
#
# [FABLE-5] sq-1rg2q.12: SHACL-shapes -> Rust object-model generation is default-OFF,
# and BOTH integration tests are `#![cfg(feature = "oo-models")]`, so ci.yml's
# default-feature lane compiles them EMPTY. This leg is their only executor (the C1
# guard, scripts/check-feature-test-execution.py, fails without it).
- name: "sparq-wrapper-shacl (oo-models)"
  crate: "sparq-wrapper-shacl"
  features: "oo-models"
  test: true
