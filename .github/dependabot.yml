# Dependabot — automated dependency-update PRs across every ecosystem this
# repo ships (sq-biyi). Supply-chain hygiene mapped from prod-solid-server.
#
# Policy:
#   - Weekly cadence, Monday off-peak (one batched sweep, not per-commit noise).
#   - Routine minor/patch bumps are GROUPED into a single PR per ecosystem to
#     keep review load low; SECURITY updates are deliberately left UNGROUPED so
#     each advisory fix is its own reviewable, fast-mergeable PR.
#   - GitHub Actions are version-pinned by SHA in the workflows; Dependabot
#     still tracks them (it follows the trailing `# vX.Y.Z` comment) and will
#     bump the pin + comment together.
# [OPUS-4.8]
version: 2

updates:
  # ---- Rust workspace (Cargo) ----
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Security updates are NOT grouped (applies-to: security-updates omitted),
    # so each advisory remediation lands as its own PR.

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # [OPUS-4.8] sq-sski: do NOT let Dependabot version-bump dtolnay/rust-toolchain.
      # Its release tags are *Rust toolchain versions*, not action releases — the
      # trailing `# 1.88` comment on the MSRV-check pin in .github/workflows/ci.yml is
      # the declared workspace floor (root Cargo.toml `[workspace.package]
      # rust-version = "1.88"`, driven by geo@0.33.1 + the released ox* parser stack).
      # Bumping that pin to e.g. 1.100 would raise the *tested* floor above the
      # *declared* floor, so the MSRV job would stop verifying the declared floor —
      # defeating its purpose. This pin must move only in lockstep with the root
      # rust-version, by hand. Dependabot grouped PR #26 (actions-minor-patch) kept
      # proposing 1.88->1.100; ignore minor/major version-updates here so it stops
      # re-opening. The action stays SHA-pinned and tracked: security-updates are NOT
      # ignored, and every other action in this ecosystem still gets its grouped
      # minor/patch bumps.
      - dependency-name: "dtolnay/rust-toolchain"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # [OPUS-5] #4572: do NOT let Dependabot version-bump the SLSA trusted builder.
      # `slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml`
      # is referenced by TAG in all three isolated-provenance lanes (release.yml#provenance,
      # release.yml#provenance-artifacts, dist.yml#provenance) — the ONE documented exception
      # to this repo's SHA-pin convention, because the generator derives the trusted-builder
      # identity baked into the provenance (the identity `slsa-verifier` matches a consumer
      # policy against) from its own `@ref`. Moving that tag changes the builder identity every
      # downstream verification policy is written against, so it is a TRUST decision taken
      # deliberately on a cadence — see compliance/slsa/trusted-builder-pin-policy.md and the
      # quarterly tick in .github/workflows/slsa-builder-pin-review.yml — not a batched bump
      # swept into the `actions-minor-patch` group.
      #
      # The trailing `*` matters: Dependabot may surface a reusable-workflow reference under
      # either `owner/repo` or the full `owner/repo/.github/workflows/<file>.yml` name, and the
      # glob has to cover both forms or the ignore silently does nothing.
      #
      # The `update-types` list is REQUIRED, not decoration: a bare `dependency-name` entry with
      # no `update-types` ignores SECURITY updates too, which is the opposite of what we want
      # here. Listing the three `version-update:*` types silences routine bumps while leaving
      # advisory-driven security updates flowing.
      - dependency-name: "slsa-framework/slsa-github-generator*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # ---- npm (the @jeswr/sparq wasm package) ----
  - package-ecosystem: npm
    directory: "/js"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- pip (the `sparq` Python bindings build/test deps) ----
  - package-ecosystem: pip
    directory: "/crates/sparq-py"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
