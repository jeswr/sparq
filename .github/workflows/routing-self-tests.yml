# routing-self-tests — cheap, hermetic validation of the orchestration routing contract.
# [OPUS-4.8] #3423: routing changes must fail on the PR that introduces them, rather
# than waiting for an out-of-band retriage run or a maintainer's local invocation.
#
# The pull-request path filter covers the routing table, the three validation/planning
# scripts, ready-issues.py (which dispatch-plan.py imports and exercises), and the
# batch-merge.py <- ci_select.py import pair (#3433: the batcher reuses the selector's
# change-class allowlist, so a drift on either side must fail on ITS PR, not at the
# batcher's next live run). The workflow itself is included so edits to this gate
# validate their replacement.
#
# Gate integration: the job name contains neither "advisory" nor "informational", so
# ci-summary auto-discovers it as a gating sibling. merge_group cannot use a paths
# filter; it runs this seconds-cheap job unconditionally so the queue ref exposes the
# same gating check. No build, network access, package install, or write permission.
name: routing-self-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "orchestration/routing.toml"
      - "scripts/routing-validate.py"
      - "scripts/route-resolve.py"
      - "scripts/dispatch-plan.py"
      - "scripts/ready-issues.py"
      # [OPUS-5] the bd->issues migration pair. Their --self-tests were DEAD in this repo's
      # PR CI: bd-to-issues.py's was invoked by no workflow at all, and
      # ci-close-merged-beads.py's ran only POST-merge inside bead-autoclose.yml
      # (pull_request_target: [closed], ref: main), i.e. after the change it would have
      # caught was already on main. They also share a marker regex that must not drift
      # ("keep in sync with scripts/ci-close-merged-beads.py _MARKER_RE"), so a change to
      # either must re-run BOTH here.
      - "scripts/bd-to-issues.py"
      - "scripts/ci-close-merged-beads.py"
      # batch-merge.py imports ci_select.classify_change (#3433 class-partitioned
      # batching) — run its hermetic self-test on the PR that could break either side.
      - "scripts/batch-merge.py"
      - "scripts/ci_select.py"
      # [OPUS-5] the readiness VISIBILITY suite — pins the occupancy-attribution,
      # in-progress-review and local/orchestrator-parity contracts, and pins this
      # workflow's own run block to the scripts it must invoke.
      - "scripts/tests/test_readiness_visibility.py"
      # [OPUS-5] the model-DEPRECATION guard (maintainer directive 2026-07-26: fable + opus-4.8
      # retired in favour of opus5; docs writing off haiku/sonnet onto sol). It is cross-surface
      # — a model is selected in FOUR places, not just the routing table — so each guarded
      # surface is its own trigger. Without these entries a PR could reintroduce a retired model
      # in settings.json or a workflow JS dispatch site without ever running this gate.
      - "scripts/tests/test_no_deprecated_models.py"
      - ".claude/settings.json"
      - ".claude/workflows/fable-architect-drain.js"
      - ".github/workflows/routing-self-tests.yml"
      # [OPUS-5] reg#677 — PR `area:` attribution. The scheduler partitions by
      # `area:<name>`; an unlabelled PR takes the serializing `__global__` partition
      # and defers EVERY issue, so a drift in the deriver, its declared table, or the
      # labelling workflow must fail on ITS OWN PR, not at the next dispatch tick.
      - "scripts/pr-area-labels.py"
      - "ci/area-labels.toml"
      - "scripts/tests/test_pr_area_labels.py"
      - ".github/workflows/pr-area-label.yml"
  merge_group:
  push:
    branches: [main]
    paths:
      - "orchestration/routing.toml"
      - "scripts/routing-validate.py"
      - "scripts/route-resolve.py"
      - "scripts/dispatch-plan.py"
      - "scripts/ready-issues.py"
      # [OPUS-5] the bd->issues migration pair. Their --self-tests were DEAD in this repo's
      # PR CI: bd-to-issues.py's was invoked by no workflow at all, and
      # ci-close-merged-beads.py's ran only POST-merge inside bead-autoclose.yml
      # (pull_request_target: [closed], ref: main), i.e. after the change it would have
      # caught was already on main. They also share a marker regex that must not drift
      # ("keep in sync with scripts/ci-close-merged-beads.py _MARKER_RE"), so a change to
      # either must re-run BOTH here.
      - "scripts/bd-to-issues.py"
      - "scripts/ci-close-merged-beads.py"
      # batch-merge.py imports ci_select.classify_change (#3433 class-partitioned
      # batching) — run its hermetic self-test on the PR that could break either side.
      - "scripts/batch-merge.py"
      - "scripts/ci_select.py"
      # [OPUS-5] the readiness VISIBILITY suite — pins the occupancy-attribution,
      # in-progress-review and local/orchestrator-parity contracts, and pins this
      # workflow's own run block to the scripts it must invoke.
      - "scripts/tests/test_readiness_visibility.py"
      # [OPUS-5] the model-DEPRECATION guard (maintainer directive 2026-07-26: fable + opus-4.8
      # retired in favour of opus5; docs writing off haiku/sonnet onto sol). It is cross-surface
      # — a model is selected in FOUR places, not just the routing table — so each guarded
      # surface is its own trigger. Without these entries a PR could reintroduce a retired model
      # in settings.json or a workflow JS dispatch site without ever running this gate.
      - "scripts/tests/test_no_deprecated_models.py"
      - ".claude/settings.json"
      - ".claude/workflows/fable-architect-drain.js"
      - ".github/workflows/routing-self-tests.yml"
      # [OPUS-5] reg#677 — PR `area:` attribution. The scheduler partitions by
      # `area:<name>`; an unlabelled PR takes the serializing `__global__` partition
      # and defers EVERY issue, so a drift in the deriver, its declared table, or the
      # labelling workflow must fail on ITS OWN PR, not at the next dispatch tick.
      - "scripts/pr-area-labels.py"
      - "ci/area-labels.toml"
      - "scripts/tests/test_pr_area_labels.py"
      - ".github/workflows/pr-area-label.yml"

permissions:
  contents: read

concurrency:
  group: routing-self-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Routing contract self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate routing schema and resolver/planner contracts
        run: |
          set -euo pipefail
          python3 scripts/routing-validate.py --self-test
          python3 scripts/routing-validate.py
          python3 scripts/route-resolve.py --self-test
          # [OPUS-5] ready-issues.py was in the `paths:` filter above but its --self-test was
          # NEVER invoked here, so its assertions were dead in this repo's CI and first ran
          # inside the registry's dispatch tick — where a failure breaks EVERY target at once.
          python3 scripts/ready-issues.py --self-test
          python3 scripts/dispatch-plan.py --self-test
          python3 scripts/batch-merge.py --self-test
          python3 scripts/tests/test_readiness_visibility.py
          # [OPUS-5] a deprecated model must not reappear in ANY routing position — the routing
          # table, a .claude/settings.json agent hook, a workflow JS dispatch site, or agent
          # frontmatter. This suite also pins its OWN wiring in this workflow structurally
          # (parsed YAML, not substrings), so `if: false` on the job or the step reds it.
          python3 scripts/tests/test_no_deprecated_models.py
          # [OPUS-5] reg#677: the PR `area:` deriver + its YAML seam. The suite is
          # invoked HERE and that invocation is itself pinned by
          # test_pr_area_labels.py::TestSelfTestIsActuallyInvoked — a suite nobody
          # runs cannot go red.
          python3 scripts/pr-area-labels.py --self-test
          python3 scripts/tests/test_pr_area_labels.py

      # [OPUS-5] The bd->issues migration pair, previously ungated on a PR (see the `paths:`
      # note above). Both are hermetic: stdlib only, every subprocess boundary stubbed, no
      # gh/network/token. `bd-to-issues.py --self-test` carries the migration TRUST-BOUNDARY
      # assertions (_writer_logins permission contract + the migration_owned author check),
      # which is precisely the surface that must fail on the PR that weakens it rather than
      # at the next bulk `--apply`.
      - name: Validate the bd->issues migration and autoclose contracts
        run: |
          set -euo pipefail
          python3 scripts/bd-to-issues.py --self-test
          python3 scripts/ci-close-merged-beads.py --self-test
