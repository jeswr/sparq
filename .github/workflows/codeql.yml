# CodeQL SAST — static security/quality analysis for the Rust workspace.
# Resolves the OpenSSF Scorecard `SAST` alert. ADVISORY at merge time ([FABLE-5]
# 2026-07-17 maintainer decision, below); CodeQL findings still land in the
# code-scanning dashboard and the Copilot/CodeQL PR review. [OPUS-4.8]
#
# [FABLE-5] CODEQL IS NON-BLOCKING (2026-07-17 maintainer decision — merge-queue
# throughput). Serial CodeQL-rust runs waiting 20–40 min in merge-group gates were
# the single heaviest drag on queue throughput, so CodeQL no longer blocks merges
# on ANY event: the job names below carry the whole-word `advisory` token, and the
# ci-summary aggregator (scripts/ci_summary_gate.py §CODEQL DEMOTION) additionally
# demotes ANY check-run matching `\bcodeql\b` — belt and braces, covering even the
# code-scanning app's own check-runs — and no longer WAITS on non-gating legs.
# WHAT DID NOT CHANGE: CodeQL still RUNS everywhere it did (per-PR, merge_group,
# push-to-main, weekly schedule) — visibility, the dashboard, and the Copilot/
# CodeQL PR review are unchanged; only the blocking is removed. The #3420
# rust-path skip (the `changes` pre-job) also stays.
# RETROACTIVE TRIAGE: open code-scanning alerts are swept DAILY into one rolling
# issue ("CodeQL alerts requiring retroactive triage") by
# .github/workflows/codeql-alert-sweep.yml + scripts/codeql_alert_sweep.py.
# TRADEOFF (explicit maintainer call): a vulnerable change can merge before its
# alert is triaged. Policy doc: docs/branch-protection.md §CodeQL is advisory.
#
# Rust CodeQL is GA, so we analyse the `rust` language. We use CodeQL's buildless
# extraction (`build-mode: none`): the Rust extractor reads the Cargo workspace +
# sources directly, so no `cargo build` step is needed and the analysis is not gated on
# the whole workspace compiling under instrumentation (which would duplicate ci.yml's
# build job and be slow). If a future CodeQL release needs a trace-based build for a
# query pack we rely on, switch this matrix entry to `build-mode: manual` + a
# `cargo build --workspace` step (see the CodeQL Rust docs).
#
# [FABLE-5] sq-6vshe.6 heavy-lane placement — CodeQL PLACEMENT DECISION (measured):
# KEEP per-push (per-PR) analysis; do NOT demote to merge_group + nightly.
# (2026-07-17 UPDATE: the paragraph below predates the non-blocking decision above.
# Its PLACEMENT half stands — CodeQL keeps running per-PR — but its "merge_group
# CodeQL still gates every merge / alerts-at-zero" GATING half is superseded:
# CodeQL is now advisory everywhere and alerts are triaged retroactively.)
# The bead's decision rule is CONDITIONAL: demote CodeQL to the merge queue + nightly
# ONLY IF it is a post-piapk wall-time POLE. It is NOT. MEASURED per-PR / merge_group
# wall time over 20+ recent runs is ~3.8–4.8 min (this workflow uses `build-mode: none`
# BUILDLESS extraction — the Rust extractor reads the workspace directly with no
# instrumented `cargo build`), comparable to the bench lane (~4 min) and FASTER than the
# fuzz lane (~6–8.5 min per-PR before its sq-6vshe.6 replay demotion). So per-push CodeQL
# is not on the critical path and demoting it would trade the earlier per-PR security
# signal (Copilot/CodeQL PR review + alerts-at-zero pre-merge) for essentially no wall-
# clock win — a net LOSS of security posture. The historical "CodeQL-rust ~20–40 min pole"
# concern predates the buildless migration (a trace-based `build-mode: manual` full-compile
# analysis); this config already fixed that. If a future query pack forces a return to
# trace-based build (see the `build-mode: manual` note below) and wall time regresses past
# the pole threshold, revisit the demotion — merge_group CodeQL still gates every merge, so
# alerts-at-zero would be preserved even then. This is the maintainer security-posture
# sign-off item (design §10.2); proceeding on the MEASURED "keep it" default per the
# proceed-and-document rule (steer issue filed).
#
# Third-party actions pinned by full commit SHA (supply-chain hardening); the trailing
# `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
name: codeql

on:
  push:
    branches: [main]
  # [FABLE-5] Draft-tier CI: default types + ready_for_review, so the un-draft
  # moment runs the analysis the draft head skipped (the `analyze` job below is
  # guarded off draft PR heads) BEFORE the PR can reach the merge queue.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # [FABLE-5] Merge queue: kept so the exact merged tree still gets an advisory analysis
  # feeding the dashboard (visibility only — since the 2026-07-17 demotion the
  # ci-summary aggregator neither waits on nor reds because of CodeQL legs, so
  # this trigger is no longer needed to unblock the gate). (Bare `merge_group` —
  # it fires on every enqueue against the base branch.)
  merge_group:
  # Weekly cadence so the latest CodeQL query packs are re-run against an otherwise
  # quiet default branch (catches newly-published queries on unchanged code).
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC (off-peak, odd minute)

# Top-level read-only; the analysis job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [OPUS-4.8] path-aware CI (maintainer ask): "CodeQL doesn't even need to run if
  # no Rust files are changed." CodeQL analyses the RUST workspace, so a PR whose
  # diff touches NO Rust (orchestration/workflow/docs-only — e.g. routing.toml +
  # triage.py) has nothing for CodeQL to analyse. This cheap pre-job computes
  # whether the diff touches Rust and the `analyze` job below `if:`s on it, exactly
  # mirroring ci.yml's `changes` (dorny paths-filter) mechanism.
  #
  # SOUNDNESS (identical to the draft-tier skip already in effect):
  #   * The single REQUIRED context is `ci-summary / gate`; the CodeQL analysis leg
  #     is NOT individually required (docs/branch-protection.md §Required status
  #     checks) — and since 2026-07-17 it is ADVISORY outright (header above), so
  #     a skip is doubly non-blocking.
  #   * The live `main` ruleset carries NO `code_scanning` rule (verified
  #     2026-07-17 via `gh api repos/sparq-org/sparq/rulesets/<id>`), so nothing
  #     independently requires code-scanning results at merge time.
  #     A non-Rust PR skip is sound regardless — there is genuinely no Rust to
  #     analyse.
  #   * SAFE-BY-DEFAULT: rust_changed is forced 'true' on EVERY event except a
  #     `pull_request` (push-to-main, merge_group, weekly schedule all run CodeQL in
  #     full), and the Rust path set is broad: any *.rs / **/Cargo.toml / Cargo.lock /
  #     rust-toolchain* / any build.rs (covered by *.rs? build.rs IS a .rs file) /
  #     the codeql wiring itself. If the diff cannot be computed, we never silently
  #     skip: off the PR path we hard-force 'true'.
  changes:
    # ", advisory" token: non-gating by the ci-summary name rule (a failure here
    # skips `analyze` via needs — that must not red the gate either).
    name: detect rust changes (codeql, advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_changed: ${{ steps.decide.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
      - name: Decide rust_changed (safe-by-default off the PR path)
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} -> forcing rust_changed=true (full CodeQL)"
          else
            echo "rust_changed=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "pull_request -> paths-filter says rust=${{ steps.filter.outputs.rust }}"
          fi

  analyze:
    # ", advisory" token ([FABLE-5] 2026-07-17): non-gating by the ci-summary name
    # rule; the gate neither waits on nor reds because of this leg. The analysis
    # itself is unchanged — findings land in the code-scanning dashboard and are
    # triaged retroactively via the daily alert sweep.
    name: CodeQL analysis (rust, advisory)
    needs: changes
    # [FABLE-5] Draft-tier CI: SKIPPED on draft PR heads (this analysis is one of
    # the slowest per-push lanes and the fleet's draft review-fix churn re-ran it
    # on every push). A draft head still gets analysed before merge in practice:
    # the ready_for_review full-tier run analyses the same head SHA (types above)
    # and the merge_group + push-to-main + weekly-schedule runs are untouched —
    # but that analysis is ADVISORY (header above): nothing blocks a merge on it
    # (the live ruleset has no `code_scanning` rule; see the `changes` job note),
    # and its alerts are triaged retroactively via the daily sweep. Fail-open off
    # the PR path: any non-pull_request event satisfies the first disjunct => RUN.
    # [OPUS-4.8] path-aware CI: ALSO skipped when the PR diff touches no Rust
    # (needs.changes.outputs.rust_changed == 'false') — nothing for CodeQL to
    # analyse. rust_changed is forced 'true' off the PR path (see `changes`), so
    # merge_group / push-to-main / schedule always analyse in full.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Read the workspace.
      contents: read
      # Needed by CodeQL on private repos / for some workflow events.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Initialise the CodeQL tooling + database for the matrix language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality runs the security queries plus the maintainability/
          # reliability quality queries — the SAST gate Scorecard's `SAST` check wants.
          queries: security-and-quality
          # [OPUS-4.8] Config file adds a query-filter that excludes exactly one
          # redundant, note-level quality query: `rust/unused-variable`. It is NOT a
          # security query (security coverage is unchanged) and is redundant with the
          # repo's real unused-variable gate — clippy `-D warnings` in ci.yml, which
          # understands `format!` captures. CodeQL's Rust analyzer false-positives on
          # variables used only inside `format!(...)` macro args (confirmed: positional
          # args in PR #311 did not stop the flags). Removes FP alerts #150/#151/#170.
          config-file: ./.github/codeql/codeql-config.yml

      # Buildless extraction (build-mode: none) above means no explicit build step is
      # required for Rust. If a build mode that traces compilation is adopted later,
      # add the `cargo build --workspace` here.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
