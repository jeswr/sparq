# CodeQL SAST — static security/quality analysis for the Rust workspace.
# Resolves the OpenSSF Scorecard `SAST` alert and is the security-quality SAST gate
# (the `analyze` job feeds the ci-summary aggregator; CodeQL findings also land in the
# code-scanning dashboard and the Copilot/CodeQL PR review). [OPUS-4.8]
#
# Rust CodeQL is GA, so we analyse the `rust` language. We use CodeQL's buildless
# extraction (`build-mode: none`): the Rust extractor reads the Cargo workspace +
# sources directly, so no `cargo build` step is needed and the analysis is not gated on
# the whole workspace compiling under instrumentation (which would duplicate ci.yml's
# build job and be slow). If a future CodeQL release needs a trace-based build for a
# query pack we rely on, switch this matrix entry to `build-mode: manual` + a
# `cargo build --workspace` step (see the CodeQL Rust docs).
#
# [FABLE-5] sq-6vshe.6 heavy-lane placement — CodeQL PLACEMENT DECISION (measured):
# KEEP per-push (per-PR) analysis; do NOT demote to merge_group + nightly.
# The bead's decision rule is CONDITIONAL: demote CodeQL to the merge queue + nightly
# ONLY IF it is a post-piapk wall-time POLE. It is NOT. MEASURED per-PR / merge_group
# wall time over 20+ recent runs is ~3.8–4.8 min (this workflow uses `build-mode: none`
# BUILDLESS extraction — the Rust extractor reads the workspace directly with no
# instrumented `cargo build`), comparable to the bench lane (~4 min) and FASTER than the
# fuzz lane (~6–8.5 min per-PR before its sq-6vshe.6 replay demotion). So per-push CodeQL
# is not on the critical path and demoting it would trade the earlier per-PR security
# signal (Copilot/CodeQL PR review + alerts-at-zero pre-merge) for essentially no wall-
# clock win — a net LOSS of security posture. The historical "CodeQL-rust ~20–40 min pole"
# concern predates the buildless migration (a trace-based `build-mode: manual` full-compile
# analysis); this config already fixed that. If a future query pack forces a return to
# trace-based build (see the `build-mode: manual` note below) and wall time regresses past
# the pole threshold, revisit the demotion — merge_group CodeQL still gates every merge, so
# alerts-at-zero would be preserved even then. This is the maintainer security-posture
# sign-off item (design §10.2); proceeding on the MEASURED "keep it" default per the
# proceed-and-document rule (steer issue filed).
#
# Third-party actions pinned by full commit SHA (supply-chain hardening); the trailing
# `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
name: codeql

on:
  push:
    branches: [main]
  # [FABLE-5] Draft-tier CI: default types + ready_for_review, so the un-draft
  # moment runs the analysis the draft head skipped (the `analyze` job below is
  # guarded off draft PR heads) BEFORE the PR can reach the merge queue.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # [OPUS-4.8] Merge queue: CodeQL surfaces a check on PRs, so it must also run on the
  # queue's merge_group ref or the required ci-summary would wait for a sibling that
  # never appears on that ref and time out. (Bare `merge_group` — it fires on every
  # enqueue against the base branch.)
  merge_group:
  # Weekly cadence so the latest CodeQL query packs are re-run against an otherwise
  # quiet default branch (catches newly-published queries on unchanged code).
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC (off-peak, odd minute)

# Top-level read-only; the analysis job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis (rust)
    # [FABLE-5] Draft-tier CI: SKIPPED on draft PR heads (this analysis is one of
    # the slowest per-push lanes and the fleet's draft review-fix churn re-ran it
    # on every push). VERIFIED before changing: CodeQL is NOT schedule/main-only —
    # it runs per-PR — but the pre-merge guarantee is preserved because the
    # ready_for_review full-tier run analyses the same head SHA (types above) and
    # the merge_group + push-to-main + weekly-schedule runs are untouched; the
    # branch-protection `code_scanning` alert rule therefore still sees a CodeQL
    # analysis of the head before any merge. Fail-open off the PR path: any
    # non-pull_request event satisfies the first disjunct => RUN.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Read the workspace.
      contents: read
      # Needed by CodeQL on private repos / for some workflow events.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Initialise the CodeQL tooling + database for the matrix language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality runs the security queries plus the maintainability/
          # reliability quality queries — the SAST gate Scorecard's `SAST` check wants.
          queries: security-and-quality
          # [OPUS-4.8] Config file adds a query-filter that excludes exactly one
          # redundant, note-level quality query: `rust/unused-variable`. It is NOT a
          # security query (security coverage is unchanged) and is redundant with the
          # repo's real unused-variable gate — clippy `-D warnings` in ci.yml, which
          # understands `format!` captures. CodeQL's Rust analyzer false-positives on
          # variables used only inside `format!(...)` macro args (confirmed: positional
          # args in PR #311 did not stop the flags). Removes FP alerts #150/#151/#170.
          config-file: ./.github/codeql/codeql-config.yml

      # Buildless extraction (build-mode: none) above means no explicit build step is
      # required for Rust. If a build mode that traces compilation is adopted later,
      # add the `cargo build --workspace` here.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
