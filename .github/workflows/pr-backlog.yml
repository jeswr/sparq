# [OPUS-4.8] PR-backlog hygiene groomer (scheduled; NON-gating).
# Authored by Opus 4.8 (1M context) — Fable unavailable; flag for re-review when Fable returns.
#
# WHAT: a DAILY cron (+ manual dispatch) that keeps the open-PR backlog tidy via the pure
# policy in scripts/pr-backlog.py (NO model calls). It:
#   1. Closes a dependabot PR whose required checks (the ci-summary `gate`) have CONCLUDED in
#      failure and re-routes the bump to a deduped `deps:` issue (a still-running gate is
#      skipped this run). Green dependabot PRs are left alone.
#   2. Labels open non-dependabot PRs stale (>7d no update) `backlog:stale` and files a
#      deduped per-PR resolution issue.
#   3. Never touches the release-plz PR, any needs:user / trust:* PR, a sparq-agent/ review
#      draft, or the excluded in-review PR.
#
# NOT A GATE. This runs on `schedule` / `workflow_dispatch`, NEVER on a PR's head commit, so
# `ci-summary / gate` (which polls check-runs on the PR head while the PR is OPEN) never sees
# it — it cannot register as a required/blocking check, and it is intentionally NOT added to
# the branch-protection required-checks set. The job name carries no `advisory`/`informational`
# token (so it stays visible in the Actions UI) but, being scheduled, it is structurally
# non-gating: the ci-summary aggregator is untouched by this file.
name: pr-backlog

on:
  schedule:
    # Every 4 hours — a daily-only groomer lags exactly when repo activity is highest
    # (maintainer-directed 2026-07-17). The run is a handful of API reads; the event
    # trigger below covers the latency-sensitive case in between crons.
    - cron: "0 */4 * * *"
  # Event trigger: the moment CI CONCLUDES on a dependabot branch, groom immediately —
  # a failing dependabot PR is closed + re-routed to a `deps:` issue within minutes
  # instead of waiting for the next cron. workflow_run only fires for workflows on the
  # default branch, and the job-level guard below restricts it to dependabot heads.
  workflow_run:
    workflows: ["ci-summary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute + print the plan but perform NO gh mutations"
        required: false
        default: "false"

# Least privilege for the policy actions: comment on / close / label PRs, and create issues.
# Read the repo for the checked-out script. NOTHING else (no code-scanning, no attestations).
permissions:
  pull-requests: write
  issues: write
  contents: read

# A groomer must never overlap itself (two runs would double-file / double-close). Never
# cancel an in-flight run — let it finish so a scheduled + a manual dispatch don't race.
concurrency:
  group: pr-backlog
  cancel-in-progress: false

jobs:
  # Job name deliberately WITHOUT `advisory`/`informational` (stays visible) and, because
  # this workflow never runs on a PR head commit, it is NOT part of the required-checks gate.
  groom:
    name: groom
    # On the event trigger, run only for a FAILED ci-summary on a dependabot branch —
    # the exact case the dependabot policy acts on. Green runs and non-dependabot
    # branches change nothing the next cron wouldn't handle, so skip the noise.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (only the groomer script is needed)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # [OPUS-5] #1135: check out the whole `scripts` directory (cone mode) rather
          # than a hand-maintained file list. pr-backlog.py imports the sibling
          # scripts/release_pr_guard.py (the Release-PR exclusion), and a manifest that
          # enumerates only the entry point silently drops sibling imports — the exact
          # class of drift scripts/tests/test_arm_capability_wiring.py::
          # TestSparseCheckoutManifest exists to red, and which it caught on this change.
          # Matches auto-arm.yml / rearm-sweeper.yml, which already do this.
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Self-test the policy (hermetic; gh stubbed; fail fast on a logic regression)
        run: python3 scripts/pr-backlog.py --self-test

      - name: Groom the PR backlog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR #2431 is in review right now — exclude it. (Update/remove when it merges.)
          EXCLUDE_PR: "2431"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --exclude-pr "$EXCLUDE_PR" --summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/pr-backlog.py "${args[@]}"
