# [OPUS-4.8] sq-v286.2: the SINGLE source of truth for the hardware-tiered sparq native-binary
# build matrix. Reusable workflow (`workflow_call`) invoked by release.yml (versioned archives +
# SHA256SUMS) and dist.yml (bare per-tier binaries for the fat-package launcher). Before this,
# release.yml#package and dist.yml#build carried two hand-synced copies of the same 10-tier
# matrix + identical build steps — the duplication the release-CI design record flags to remove
# (research/release-ci-design.md §5 "Reuse, do not duplicate" and §6 sequencing item 2:
# "Unify the duplicated build matrix via workflow_call").
#
# [OPUS-4.8] sq-v286.6: this matrix ships BOTH native binaries per tier — `sparq-cli` AND
# `sparq-server` — closing the release-CI design record's §3c / §4 gap ("sparq-server native
# binary archive — a real gap … ships ONLY as a container today … add a second `-p sparq-server`
# build; feasible-now") and §6 sequencing item 6. sparq-server carries no sys/C/platform dep that
# sparq-cli does not already build on all 10 tiers — its only C dependency (mimalloc, the global
# allocator) is the SAME `mimalloc 0.1` sparq-cli enables by default, so it cross-builds on every
# tier (incl. the single win-arm64 MSVC cross-link) by parity with the proven sparq-cli matrix.
# Its binary target requires the `server` feature, which is default-on, so a plain `-p sparq-server`
# build produces the binary.
#
# The matrix (runner labels + target triple + target-cpu + binary extension) and the build
# steps (checkout -> Rust+target -> cargo-auditable -> two `cargo auditable build` invocations)
# are now defined ONCE here. Each caller selects the artifact SHAPE via the `mode` input:
#   mode: archive  -> release.yml: tar.gz / zip of BOTH binaries + README + LICENSE + CHANGELOG,
#                     uploaded as pkg-<tier>; the release job adds SHA256SUMS over them.
#   mode: binary   -> dist.yml: bare binaries copied to sparq-{cli,server}-<tier><ext>, uploaded
#                     as sparq-cli-<tier>; the launcher's fat package selects from these.
# Both modes embed the dependency manifest via cargo-auditable (GX-7 / GX-9) into EACH binary and
# emit an SLSA build-provenance attestation over EVERY byte they upload — both binaries (sq-zqq6).
#
# Microarch tier rationale (target-cpu=native is a NO-OP on Apple silicon; the x86-64
# {,-v2,-v3,-v4} ladder; arm64 neoverse-n1 +lse; win-arm64 cross-linked from the x64 runner)
# is unchanged - see research/hardware/optimization-findings.md.
name: build-matrix

on:
  workflow_call:
    inputs:
      mode:
        description: "Artifact shape: 'archive' (versioned tar.gz/zip + docs, for release.yml) or 'binary' (bare per-tier binary, for dist.yml)."
        required: true
        type: string
      # [OPUS-4.8] sq-gl3cf: the version token used in the `archive`-mode PKG name. Threaded from
      # release.yml's `setup` job so a workflow_dispatch release names archives by the dispatch tag
      # (on dispatch, this workflow's own `github.ref_name` is the BRANCH, which would mis-name
      # every archive). Empty default => callers that pass nothing (dist.yml) fall back to
      # `github.ref_name`, preserving the prior behavior exactly. `binary` mode names by tier only,
      # so it does not consume this input.
      version:
        description: "Release version token for the archive PKG name (defaults to github.ref_name when empty)."
        required: false
        type: string
        default: ""
    # [OPUS-5] sq-toze.25 (GX-11): the `archive`-mode subjects blob for the ISOLATED
    # trusted-builder provenance job in release.yml. The build matrix NEVER signs this — it only
    # publishes the digests of the bytes it uploaded; the signing happens in a separate,
    # user-unreachable job (see release.yml#provenance). Empty on `binary` mode (the `hashes`
    # job below is skipped), which is what dist.yml expects — it consumes no outputs.
    outputs:
      hashes:
        description: >-
          base64(sha256sum lines) over every archive this run uploaded, in the format
          `slsa-framework/slsa-github-generator`'s generic generator takes as `base64-subjects`.
          Empty unless `mode: archive`.
        value: ${{ jobs.hashes.outputs.hashes }}

# Default read-only; the matrix job opts into the OIDC + attestation writes it needs (below).
# A reusable workflow's effective permissions are the INTERSECTION of this declaration and the
# permissions the CALLER's invoking job grants - both callers grant id-token+attestations:write.
permissions:
  contents: read

jobs:
  # ---- build + package per hardware tier (THE shared matrix) ----
  build:
    name: ${{ inputs.mode == 'archive' && 'package' || 'build' }} ${{ matrix.tier }}
    runs-on: ${{ matrix.os }}
    # sq-zqq6 / GX-9: build-provenance attestation over the uploaded bytes needs the OIDC
    # token + attestation write. Read-only on the repo otherwise.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Apple ----
          # Apple silicon (M1-M4): ONE binary, no target-cpu (Darwin baseline already enables
          # every Apple-silicon feature - measured; see research/hardware/optimization-findings.md).
          - { tier: arm64-darwin,     os: macos-14,         target: aarch64-apple-darwin,      cpu: "",          ext: "" }
          # Intel Macs: x86-64-v3 (every Intel Mac since ~2015 / Haswell has AVX2).
          # macos-*-intel is the supported Intel runner line (the retired macos-13 label is gone).
          - { tier: x64-darwin,       os: macos-15-intel,   target: x86_64-apple-darwin,       cpu: x86-64-v3,   ext: "" }
          # ---- x86-64 Linux ----
          # baseline (SSE2) + v2 (SSE4.2) + v3 (AVX2/BMI2/FMA) + v4 (AVX-512). The launcher
          # picks the tier by /proc/cpuinfo.
          - { tier: x64-baseline,     os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  cpu: x86-64,      ext: "" }
          - { tier: x64-v2,           os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  cpu: x86-64-v2,   ext: "" }
          - { tier: x64-v3,           os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  cpu: x86-64-v3,   ext: "" }
          - { tier: x64-v4,           os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  cpu: x86-64-v4,   ext: "" }
          # Generic aarch64 Linux (Graviton/Ampere, Raspberry Pi 4+): neoverse-n1 + LSE.
          - { tier: arm64-linux,      os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, cpu: neoverse-n1, ext: "" }
          # ---- Windows ----
          - { tier: win-x64-baseline, os: windows-latest,   target: x86_64-pc-windows-msvc,    cpu: x86-64,      ext: ".exe" }
          - { tier: win-x64-v3,       os: windows-latest,   target: x86_64-pc-windows-msvc,    cpu: x86-64-v3,   ext: ".exe" }
          # Windows on ARM - cross-compiled from the x64 runner (MSVC cross-links; no cross/QEMU).
          - { tier: win-arm64,        os: windows-latest,   target: aarch64-pc-windows-msvc,   cpu: "",          ext: ".exe" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      # GX-7 / GX-9: cargo-auditable embeds the exact dependency manifest (versions + sources)
      # INTO the released binary, so the shipped artifact is self-describing for post-build audit
      # (`cargo audit bin <file>` / `auditable info <file>`). Negligible size cost; no runtime overhead.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-auditable
      - name: Build sparq-cli + sparq-server (${{ matrix.cpu || 'default-cpu' }})
        shell: bash
        run: |
          FLAGS=""
          [ -n "${{ matrix.cpu }}" ] && FLAGS="-Ctarget-cpu=${{ matrix.cpu }}"
          [ "${{ matrix.tier }}" = "arm64-linux" ] && FLAGS="$FLAGS -Ctarget-feature=+lse"
          # `cargo auditable build` is a drop-in for `cargo build` that embeds the dep
          # manifest into the binary (GX-7); `--locked` pins the materials (Cargo.lock).
          # [OPUS-4.8] sq-v286.6: build BOTH shipped binaries with the SAME tier flags so the
          # microarch tier + cargo-auditable posture cover sparq-server identically to sparq-cli.
          # sparq-server's binary target has `required-features = ["server"]`, which is in its
          # `default` set, so a plain `-p sparq-server` build produces the binary (no extra
          # `--features` needed). One build per package keeps the dep manifest each binary embeds
          # scoped to that binary's own tree.
          RUSTFLAGS="$FLAGS" cargo auditable build --release --locked -p sparq-cli --target ${{ matrix.target }}
          RUSTFLAGS="$FLAGS" cargo auditable build --release --locked -p sparq-server --target ${{ matrix.target }}

      # ---- archive mode (release.yml): versioned tar.gz/zip + README + LICENSE + CHANGELOG ----
      # [OPUS-4.8] sq-v286.6: the per-tier archive now carries BOTH binaries (sparq-cli +
      # sparq-server). The archive name is unchanged (`sparq-cli-<ver>-<tier>`) to keep the
      # release SHA256SUMS / asset naming consistent — release.yml downloads `pkg-*` wholesale
      # and sums every file, so it is agnostic to the archive's internal contents.
      # [OPUS-4.8] sq-gl3cf: the `<ver>` token is the threaded `version` input when the caller
      # supplies it (release.yml's resolved version, correct on dispatch), else GITHUB_REF_NAME
      # (unchanged behavior for callers that pass nothing).
      - name: Package (binaries + README + LICENSE + CHANGELOG)
        if: inputs.mode == 'archive'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VER="${VERSION:-$GITHUB_REF_NAME}"
          PKG="sparq-cli-${VER}-${{ matrix.tier }}"
          mkdir -p "pkg/$PKG"
          cp "target/${{ matrix.target }}/release/sparq-cli${{ matrix.ext }}" "pkg/$PKG/"
          cp "target/${{ matrix.target }}/release/sparq-server${{ matrix.ext }}" "pkg/$PKG/"
          cp README.md "pkg/$PKG/"
          # LICENSE is copied when present (license = MIT is declared in Cargo.toml; adding
          # the LICENSE file itself is on the pre-release checklist in docs/release.md).
          if [ -f LICENSE ]; then cp LICENSE "pkg/$PKG/"; fi
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "pkg/$PKG/"; fi
          cd pkg
          case "${{ matrix.tier }}" in
            win-*) 7z a "$PKG.zip" "$PKG" ;;
            *)     tar czf "$PKG.tar.gz" "$PKG" ;;
          esac
      # IN-BAND provenance (SLSA Build L2). Retained deliberately: it is what
      # `gh attestation verify <archive> --repo jeswr/sparq` reads, and the release notes point
      # consumers at that command. It is NOT the basis of the L3 claim — see the digest step
      # below + release.yml#provenance (sq-toze.25 / GX-11).
      - name: Attest build provenance (archives)
        if: inputs.mode == 'archive'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            pkg/*.tar.gz
            pkg/*.zip
      # [OPUS-5] sq-toze.25 (GX-11): publish THIS tier's archive digest(s) as data — nothing
      # more. The isolated trusted builder (release.yml#provenance) turns these subjects into
      # signed provenance in a job that runs no user build step and holds the signing identity
      # this job never sees. Emitting a digest is not signing it: a compromised build step here
      # can only ever describe the bytes it actually produced, which is precisely the L3
      # property `actions/attest-build-provenance` cannot give while it shares this job.
      # `sha256sum` basenames (cd pkg) so each subject name is the RELEASED asset name.
      - name: Record archive digests (subjects for the isolated provenance builder)
        if: inputs.mode == 'archive'
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          shopt -s nullglob
          archives=( *.tar.gz *.zip )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: packaging produced no archive to attest for tier ${{ matrix.tier }}" >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > "archive-hashes-${{ matrix.tier }}.txt"
          cat "archive-hashes-${{ matrix.tier }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'archive'
        with:
          # NOT `pkg-*`: release.yml downloads `pattern: pkg-*` wholesale into the release
          # assets, and the digest list is an internal hand-off, not a published asset.
          name: archive-hashes-${{ matrix.tier }}
          path: pkg/archive-hashes-${{ matrix.tier }}.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'archive'
        with:
          name: pkg-${{ matrix.tier }}
          path: |
            pkg/*.tar.gz
            pkg/*.zip
          if-no-files-found: error

      # ---- binary mode (dist.yml): bare per-tier binaries for the launcher fat-package ----
      # [OPUS-4.8] sq-v286.6: stage BOTH bare binaries per tier. Both are uploaded under the
      # existing `sparq-cli-<tier>` artifact name (dist.yml's launcher selects by tier); the
      # attestation covers both.
      - name: Stage dist binaries
        if: inputs.mode == 'binary'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sparq-cli${{ matrix.ext }}" "dist/sparq-cli-${{ matrix.tier }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/sparq-server${{ matrix.ext }}" "dist/sparq-server-${{ matrix.tier }}${{ matrix.ext }}"
      - name: Attest build provenance (dist binaries)
        if: inputs.mode == 'binary'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/sparq-cli-${{ matrix.tier }}${{ matrix.ext }}
            dist/sparq-server-${{ matrix.tier }}${{ matrix.ext }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'binary'
        with:
          name: sparq-cli-${{ matrix.tier }}
          path: |
            dist/sparq-cli-${{ matrix.tier }}${{ matrix.ext }}
            dist/sparq-server-${{ matrix.tier }}${{ matrix.ext }}

  # ---- collect the per-tier archive digests into ONE `base64-subjects` blob ----
  # [OPUS-5] sq-toze.25 (GX-11). WHY A SEPARATE JOB: a matrix job cannot carry a per-row job
  # output (every row writes the same `outputs.*` key and the last writer wins), so the ten
  # tiers hand their digests over as `archive-hashes-<tier>` artifacts and this job concatenates
  # them. It runs NO build step — it downloads text, validates its shape, and base64-encodes it.
  # It is deliberately NOT the signer either: it holds no OIDC token and declares
  # `contents: read` only. The signing happens one job further out, in the trusted builder
  # (release.yml#provenance), which is the whole point of the L3 boundary.
  hashes:
    name: collect archive digests
    if: inputs.mode == 'archive'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-hashes-*
          path: archive-hashes
          merge-multiple: true
      # FAIL-CLOSED. An empty or malformed subjects blob would make the generator produce
      # provenance over nothing (or fail opaquely), and "provenance exists" would then be a
      # vacuous claim — exactly the failure mode the compliance register warns about. So every
      # line must be a real `<64-hex>  <name>` sha256sum record, and there must be at least one.
      - name: Combine + base64-encode the subjects
        id: combine
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=( archive-hashes/*.txt )
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "ERROR: no archive-hashes-* artifact was produced by the build matrix" >&2
            exit 1
          fi
          cat -- "${parts[@]}" > all.sha256
          if ! [ -s all.sha256 ]; then
            echo "ERROR: the combined subjects list is empty" >&2
            exit 1
          fi
          while read -r digest name; do
            if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$' || [ -z "$name" ]; then
              echo "ERROR: malformed sha256sum record: '$digest  $name'" >&2
              exit 1
            fi
          done < all.sha256
          echo "subjects for the isolated provenance builder:"
          cat all.sha256
          echo "hashes=$(base64 -w0 all.sha256)" >> "$GITHUB_OUTPUT"
