name: CI

# Correctness gate (roadmap G1). Build + test the whole workspace on every push to main and every
# PR — the regression safety net the "no regressions in functionality" constraint requires. fmt +
# clippy run informationally for now (the codebase predates a rustfmt.toml; tightened in a later
# pass). Heavy benchmarks live in bench.yml / bench-ec2.yml, NOT here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm build (sparq-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build sparq-wasm for the browser target
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown

  lint:
    name: fmt + clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
        continue-on-error: true
      - name: clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  conformance:
    # W3C SPARQL conformance RATCHET (roadmap T13/38). The full 1229-test scope is at
    # 1225 pass + 4 documented divergences / 0 fail / 0 skip — 1229/1229. The 4
    # divergences are expected-results files that are provably wrong against the spec
    # and their own approved siblings (rendered distinctly in the report with full
    # rationale; rdf-tests issues drafted in docs/upstream-proposals.md). The six
    # former parser-posture failures are fixed in the vendored spargebra
    # (vendor/spargebra/SPARQ-PATCHES.md; upstream PRs drafted). This job GATES: a
    # drop below the ratchet count is a conformance regression and fails CI. Never
    # lower the ratchet.
    name: W3C SPARQL conformance (ratchet >= 1229 pass+divergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch W3C test suites (pinned)
        run: ./scripts/fetch-conformance.sh
      - name: Run conformance suites
        # [OPUS-4.8] --bin is REQUIRED: the crate now ships two binaries
        # (sparq-conformance + sparq-inference-conformance, added in 058bdbf5),
        # so a bare `cargo run -p sparq-conformance` is ambiguous and exits 101.
        run: cargo run --release -p sparq-conformance --bin sparq-conformance
      - name: Summarize
        run: cat conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1229
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> skip — ...**
          # (group subtotals use the same shape, so parse the line after "## Overall")
          OVERALL=$(grep -A2 '^## Overall' conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.md

  inference-conformance:
    # Inference/reasoning conformance RATCHET: RDF Semantics (rdf-mt), OWL 2 RL
    # (W3C OWL WG test cases), the w3c/N3 community-group suite, and
    # sparql11/entailment — run against sparq-reason by the
    # sparq-inference-conformance binary. Current snapshot (2026-06): rdf-mt
    # 48/48; OWL 2 RL 78 pass + 13 documented divergences / 0 fail; N3 1464
    # pass + 4 divergences / 0 fail; sparql11/entailment 47 pass / 0 fail —
    # overall 1637 pass + 17 documented divergences = 1654, 0 fail (100.0% of
    # run). Every divergence carries its rationale in the report;
    # research/inference-completeness-audit.md is the per-gap map. This job
    # GATES exactly like the SPARQL ratchet above: a drop below the count is a
    # conformance regression and fails CI. Never lower the ratchet.
    name: Inference conformance (ratchet >= 1654 pass+divergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch inference test suites (pinned)
        run: ./scripts/fetch-inference-suites.sh
      - name: Run inference suites
        run: cargo run --release -p sparq-conformance --bin sparq-inference-conformance
      - name: Summarize
        run: cat inference-conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1654
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> out-of-scope — ...**
          # (suite subtotals use the same shape, so parse the line after the
          # final "## Overall (all inference suites)")
          OVERALL=$(grep -A2 '^## Overall (all inference suites)' inference-conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::inference conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-conformance-report
          path: inference-conformance-report.md
