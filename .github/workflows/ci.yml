name: CI

# Correctness gate (roadmap G1). Build + test the whole workspace on every push to main and every
# PR — the regression safety net the "no regressions in functionality" constraint requires. fmt +
# clippy run informationally for now (the codebase predates a rustfmt.toml; tightened in a later
# pass). Heavy benchmarks live in bench.yml / bench-ec2.yml, NOT here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm build (sparq-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build sparq-wasm for the browser target
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown

  lint:
    name: fmt + clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
        continue-on-error: true
      - name: clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  conformance:
    # W3C SPARQL conformance RATCHET (roadmap T13/38). The full 1229-test scope reached
    # 1218 pass / 0 skip (the 11 fails are external: upstream spargebra posture + suite
    # conventions — see crates/sparq-conformance/FINDINGS.md). This job now GATES: a drop
    # below the ratchet count is a conformance regression and fails CI. Raise the ratchet
    # when external blockers clear; never lower it.
    name: W3C SPARQL conformance (ratchet >= 1218)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch W3C test suites (pinned)
        run: ./scripts/fetch-conformance.sh
      - name: Run conformance suites
        run: cargo run --release -p sparq-conformance
      - name: Summarize
        run: cat conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass count must not regress)
        run: |
          RATCHET=1218
          # The Overall section emits: **<N> pass / <M> fail / <K> skip — ...**
          PASS=$(grep -oE '\*\*[0-9]+ pass /' conformance-report.md | grep -oE '[0-9]+' | head -1)
          echo "passing: ${PASS:-unknown} (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$PASS" -ge "$RATCHET" ] || { echo "::error::conformance regressed below the ratchet ($PASS < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.md
