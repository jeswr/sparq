name: CI

# Correctness gate (roadmap G1). Build + test the whole workspace on every push to main and every
# PR — the regression safety net the "no regressions in functionality" constraint requires.
# clippy now GATES with -D warnings (the workspace is warning-clean). rustfmt runs informationally
# until the one-time `cargo fmt --all` reformat lands (deferred behind the in-flight branches —
# see rustfmt.toml); flip it to a hard gate once that reformat merges. Heavy benchmarks live in
# bench.yml / bench-ec2.yml, NOT here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # [OPUS-4.8] manual trigger forces the nightly tier regardless of the freshness gate
  # [OPUS-4.8] Nightly schedule drives the heavy coverage tier (sq-hbg7): the
  # `coverage-nightly` job runs the sparq-vectors 50k recall/diskann accuracy
  # tests under llvm-cov instrumentation, which a per-commit job cannot afford
  # (measured >10 min for that ONE crate under instrumentation — see the job
  # comment + bench/coverage-floor.json). 03:17 UTC daily.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # [OPUS-4.8] sq-x4jy: run the unit/integration suite under cargo-nextest with
      # --retries 2. nextest runs each test in its OWN process (so a stray abort can't
      # take the whole binary down), reports a test BINARY that "was never executed" as a
      # DETERMINISTIC failure (instead of a bare exit-101 with no FAILED line — the exact
      # flake this bead tracks), and the retries let any residual transient binary race on
      # the shared runner self-heal. SHA-pinned install action (reuses a pin already vetted
      # elsewhere in this workflow). NOTE: nextest does NOT run doctests, so a separate
      # `cargo test --doc` step below preserves the doctest coverage `cargo test` gave us.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: nextest
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test (nextest, retry transient binary races)
        run: cargo nextest run --workspace --retries 2
      - name: Doctests (nextest does not run these)
        run: cargo test --workspace --doc

  wasm:
    name: wasm build (sparq-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build sparq-wasm for the browser target
        run: cargo build -p sparq-wasm --target wasm32-unknown-unknown
      # [OPUS-4.8] sq-085p follow-up: clippy AGAINST the wasm32 target (the target is
      # already installed for this job). The native `lint` job's `clippy --all-targets`
      # compiles sparq-wasm for the HOST triple, so it never sees wasm32-cfg'd code paths
      # and misses wasm-target-only lints — e.g. the `needless_update` just fixed. -D
      # warnings makes those a hard failure here, where the native clippy can't reach them.
      - name: clippy (wasm32 target, deny warnings)
        run: cargo clippy -p sparq-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Guard the wasm dependency graph (no native-only deps)
        # [OPUS-4.8] sq-9qz6: enforce the "flate2/zstd/rayon/sparq-parse must never
        # enter the wasm graph" invariant (was comment-only) — fails if a native-only
        # dep leaks into sparq-wasm's wasm32 graph (bundle bloat / broken browser build).
        run: ./scripts/wasm-deps-guard.sh
      # [OPUS-4.8] Headless wasm tests of the REAL #[wasm_bindgen] exports
      # (crates/sparq-wasm/tests/web.rs). `cargo build --target wasm32` above never
      # RUNS the exported API (JsError/serialisation across the JS boundary), so the
      # web.rs #[wasm_bindgen_test]s run via wasm-pack in the Node executor — closing
      # exactly that gap. Verified locally: 20 passed.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - name: Headless wasm tests (wasm-pack test --node)
        working-directory: crates/sparq-wasm
        run: wasm-pack test --node

  # NOTE: sparq-py's pytest suite (incl. the new test_parity.py result-parity +
  # panic-surface tests) is run by the dedicated `python.yml` workflow ("Python
  # bindings"), which builds with the correct --profile python-release (unwinding
  # panics — needed by the panic-surface test). No duplicate job here. [OPUS-4.8]

  lint:
    name: clippy (gate) + fmt (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # GATES: the whole workspace (sparq-py included) is clippy-clean under -D warnings.
      # A new warning — from new code or a Rust-stable bump that adds a lint — fails CI.
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Informational until the deferred `cargo fmt --all` reformat lands (see rustfmt.toml).
      - name: rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

  msrv:
    # [OPUS-4.8] sq-ucwf: ENFORCE the declared MSRV. The workspace pins
    # `rust-version = "1.88"` in the root Cargo.toml ([workspace.package]); without a
    # job that actually compiles on that toolchain the floor is just documentation — a
    # new use of a >floor stdlib/lang feature would silently raise the real MSRV. This
    # builds the whole workspace on the pinned floor toolchain so the declared floor is a
    # checked invariant, GATING.
    #
    # [OPUS-4.8] (sq-qmth) Floor BUMPED 1.85 -> 1.88. Upstream-driven, verified
    # empirically (cargo +1.87/+1.88 check, this exact --exclude scope): on 1.87 the
    # resolver rejects ONLY `geo@0.33.1 requires rustc 1.88` (a transitive dep of
    # sparq-geo); the released oxigraph parser stack (oxrdf/oxttl/oxrdfio/spargebra/…)
    # needs 1.87; on 1.88 the whole MSRV-scope workspace builds clean. So 1.88 is the
    # true minimal floor — not an over-bump. Keep this pin == root rust-version.
    #
    # Two crates are excluded, each for a concrete reason:
    #   - sparq-py: pyo3/maturin extension module (excluded from native jobs throughout
    #     this workflow; built by python.yml with the correct profile).
    #   - sparq-hdt: declares its own `rust-version = "1.87"` for the wrapped `hdt` crate
    #     (see crates/sparq-hdt/Cargo.toml). Now AT/BELOW the 1.88 floor, so its
    #     exclusion is no longer load-bearing, but kept to decouple sparq-hdt from the
    #     workspace-floor pin.
    # If the root MSRV is bumped, update the `@1.88` toolchain pin below to match.
    name: MSRV check (Rust 1.88, declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust (pinned MSRV)
        uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c # 1.88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo check on the declared MSRV
        run: cargo check --workspace --exclude sparq-py --exclude sparq-hdt

  conformance:
    # W3C SPARQL conformance RATCHET (roadmap T13/38). The full 1229-test scope is at
    # 1225 pass + 4 documented divergences / 0 fail / 0 skip — 1229/1229. The 4
    # divergences are expected-results files that are provably wrong against the spec
    # and their own approved siblings (rendered distinctly in the report with full
    # rationale; rdf-tests issues drafted in docs/upstream-proposals.md). The six
    # former parser-posture failures are fixed in the vendored spargebra
    # (vendor/spargebra/SPARQ-PATCHES.md; upstream PRs drafted). This job GATES: a
    # drop below the ratchet count is a conformance regression and fails CI. Never
    # lower the ratchet.
    name: W3C SPARQL conformance (ratchet >= 1229 pass+divergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Fetch W3C test suites (pinned)
        run: ./scripts/fetch-conformance.sh
      - name: Run conformance suites
        # [OPUS-4.8] --bin is REQUIRED: the crate now ships two binaries
        # (sparq-conformance + sparq-inference-conformance, added in 058bdbf5),
        # so a bare `cargo run -p sparq-conformance` is ambiguous and exits 101.
        run: cargo run --release -p sparq-conformance --bin sparq-conformance
      - name: Summarize
        run: cat conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1229
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> skip — ...**
          # (group subtotals use the same shape, so parse the line after "## Overall")
          OVERALL=$(grep -A2 '^## Overall' conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-report
          path: conformance-report.md

  shacl-conformance:
    # [OPUS-4.8] W3C SHACL conformance RATCHET (sq-qap0). The data-shapes
    # sht:Validate suites run as `cargo test` (the runners live in
    # crates/sparq-shacl/tests/w3c_core.rs + w3c_sparql.rs, each carrying its own
    # pinned pass-count floor); the normal `cargo test --workspace` job runs
    # OFFLINE and the runners self-SKIP when the fixtures are absent, so this
    # dedicated job fetches the pinned suite first (mirroring the fetch-then-run
    # split of the SPARQL/inference jobs above), then runs the runners with
    # --nocapture and re-checks the scoreboard floor here. The runner's internal
    # `assert!(pass >= BASELINE_PASS)` is the primary gate; the grep below is the
    # same `>= N` belt-and-braces check the conformance jobs use. Never lower the
    # ratchet (raise BASELINE_PASS / SHACL_SPARQL_FLOOR as coverage grows).
    name: W3C SHACL conformance (ratchet — core >= 98, sparql >= 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Fetch W3C SHACL test suite (pinned)
        run: ./crates/sparq-shacl/fetch-shacl-tests.sh
      - name: Run SHACL core + SHACL-SPARQL suites
        # The runners assert their own pinned floors; capture the scoreboards so
        # the grep gate below can re-check the pass counts.
        run: |
          cargo test -p sparq-shacl --test w3c_core --test w3c_sparql -- --nocapture \
            | tee shacl-conformance.out
      - name: Enforce ratchet (pass counts must not regress)
        run: |
          CORE_FLOOR=98
          SPARQL_FLOOR=5
          # core runner prints: "TOTAL  <pass> <fail> <skip>"
          CORE_PASS=$(grep -E '^TOTAL ' shacl-conformance.out | awk '{print $2}' | head -1)
          # sparql runner prints: "pass <n> / fail <m> / skip <k>"
          SPARQL_PASS=$(grep -oE 'pass [0-9]+ / fail' shacl-conformance.out | grep -oE '[0-9]+' | head -1)
          echo "SHACL core pass: ${CORE_PASS:-unknown} (floor $CORE_FLOOR); SHACL-SPARQL pass: ${SPARQL_PASS:-unknown} (floor $SPARQL_FLOOR)"
          [ -n "$CORE_PASS" ] && [ "$CORE_PASS" -ge "$CORE_FLOOR" ] || { echo "::error::SHACL core regressed below the ratchet (${CORE_PASS:-?} < $CORE_FLOOR)"; exit 1; }
          [ -n "$SPARQL_PASS" ] && [ "$SPARQL_PASS" -ge "$SPARQL_FLOOR" ] || { echo "::error::SHACL-SPARQL regressed below the ratchet (${SPARQL_PASS:-?} < $SPARQL_FLOOR)"; exit 1; }
      - name: Upload scoreboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shacl-conformance
          path: shacl-conformance.out

  inference-conformance:
    # Inference/reasoning conformance RATCHET: RDF Semantics (rdf-mt), OWL 2 RL
    # (W3C OWL WG test cases), the w3c/N3 community-group suite, and
    # sparql11/entailment — run against sparq-reason — PLUS the W3C rdf-turtle
    # suite run through the sparq Turtle parser (parse_to_triples, the B4
    # rejection oracle) — all by the sparq-inference-conformance binary. Current
    # snapshot (2026-06): rdf-mt 48/48; OWL 2 RL 78 pass + 13 documented
    # divergences / 0 fail; N3 1464 pass + 4 divergences / 0 fail;
    # sparql11/entailment 47 pass / 0 fail; W3C rdf-turtle 313 pass / 0 fail —
    # overall 1950 pass + 17 documented divergences = 1967, 0 fail (100.0% of
    # run). Every divergence carries its rationale in the report;
    # research/inference-completeness-audit.md is the per-gap map. This job
    # GATES exactly like the SPARQL ratchet above: a drop below the count is a
    # conformance regression and fails CI. Never lower the ratchet.
    name: Inference conformance (ratchet >= 1967 pass+divergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Fetch inference test suites (pinned)
        run: ./scripts/fetch-inference-suites.sh
      - name: Run inference suites
        run: cargo run --release -p sparq-conformance --bin sparq-inference-conformance
      - name: Summarize
        run: cat inference-conformance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ratchet (pass+divergence count must not regress)
        run: |
          RATCHET=1967
          # The Overall section emits:
          # **<N> pass / <M> fail / <D> documented divergence / <K> out-of-scope — ...**
          # (suite subtotals use the same shape, so parse the line after the
          # final "## Overall (all inference suites)")
          OVERALL=$(grep -A2 '^## Overall (all inference suites)' inference-conformance-report.md | grep -E '\*\*[0-9]+ pass /')
          PASS=$(echo "$OVERALL" | grep -oE '[0-9]+ pass' | grep -oE '[0-9]+' | head -1)
          DIV=$(echo "$OVERALL" | grep -oE '[0-9]+ documented divergence' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PASS:-0} + ${DIV:-0} ))
          echo "pass: ${PASS:-unknown} + documented divergences: ${DIV:-0} = $TOTAL (ratchet: $RATCHET)"
          [ -n "$PASS" ] && [ "$TOTAL" -ge "$RATCHET" ] || { echo "::error::inference conformance regressed below the ratchet ($TOTAL < $RATCHET)"; exit 1; }
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: inference-conformance-report
          path: inference-conformance-report.md

  coverage:
    # [OPUS-4.8] PER-CRATE line-coverage RATCHET + test-PRESENCE gate (sq-hbg7).
    # Mirrors the conformance-ratchet idiom above: a checked-in per-crate FLOOR
    # (bench/coverage-floor.json) that may only RISE, plus a per-crate #[test]
    # count floor (bench/coverage-presence.json) that catches a whole crate
    # losing its tests — which a % gate alone can miss (e.g. the subprocess-
    # driven sparq-cli, which reports ~0% by construction).
    #
    # WHY PER-CRATE, NOT `cargo llvm-cov --workspace`: a single whole-workspace
    # instrumented run does NOT finish in a bounded window. So scripts/coverage.sh
    # measures PER-CRATE, with these audit-discovered quirks (no silent caps —
    # research/coverage-and-benchmark-plan.md §2.2/§2.3):
    #   - sparq-core measured with --features dict-spill (else dictspill/extsort 0%);
    #   - W3C fixtures fetched FIRST (SHACL/reason-explain/EYE/rdf-turtle suites
    #     SKIP when fixtures are absent -> misleadingly-low + flaky number);
    #   - the two sparq-vectors *_recall_at_10_vs_brute_force_on_50k tests (HNSW +
    #     DiskANN, 50k vecs each) are EXCLUDED here (measured >10 min for that ONE
    #     crate under instrumentation) and run in `coverage-nightly` instead;
    #   - sparq-cli / sparq-conformance / sparq-gpu have floor 0 (subprocess
    #     artifact / test-driver / device-gated) — guarded by the presence gate.
    # sparq-py is excluded (pyo3/maturin, not an llvm-cov target).
    #
    # TIERING (timing-justified): the per-commit set is the FAST/MEDIUM crates,
    # well under the ~15-20 min budget; only the heavy sparq-vectors full set is
    # nightly. Never silently drop a crate — every exclusion is in the floor file.
    name: coverage ratchet + test-presence gate (per-crate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c # cargo-llvm-cov
      - name: Test-presence gate (fast, no compile)
        run: python3 scripts/coverage-presence.py --check
      - name: Measure + enforce per-crate coverage (per-commit tier, re-measure backstop)
        # [OPUS-4.8] sq-x4jy (2nd flake): measure -> check; if the ratchet FAILS, RE-MEASURE
        # the whole suite ONCE and re-check before declaring failure. scripts/coverage.sh
        # already serialises each binary's tests (--test-threads=1) to kill the profraw-merge
        # race that intermittently undercounted sparq-core (~71% vs ~91%); this is a
        # belt-and-braces backstop for any residual run-to-run profraw flake of THAT shape.
        #
        # WHY THIS IS SAFE (does NOT mask a real regression): it RE-MEASURES the same tests
        # and re-applies the floor — it never ACCEPTS the low number. A genuine coverage drop
        # is reproducible and fails BOTH passes; a transient profraw-merge undercount is not
        # reproducible and passes the second pass. This is categorically different from
        # retrying-and-accepting a valid-but-low value (which coverage.sh deliberately refuses
        # to do, for exactly this reason — see its retry comment).
        run: |
          set -o pipefail
          ./scripts/coverage.sh
          if python3 scripts/coverage-gate.py --check target/coverage/coverage-summary.json; then
            exit 0
          fi
          echo "::warning::coverage gate failed on pass 1 — RE-MEASURING once (profraw-merge flake backstop; a real regression will fail again)"
          ./scripts/coverage.sh
          python3 scripts/coverage-gate.py --check target/coverage/coverage-summary.json
      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary
          path: target/coverage/coverage-summary.json

  nightly-gate:
    # [OPUS-4.8] Freshness gate for ALL nightly (schedule-triggered) jobs: run them
    # only if HEAD changed since the last nightly run — so the heavy nightly tier does
    # not re-run on an unchanged repo. Compares github.sha to the head_sha of the most
    # recent COMPLETED schedule-triggered run of this workflow (ci.yml). A manual
    # workflow_dispatch always passes; if the lookup fails or no prior nightly exists,
    # we FAIL-OPEN (run) so a transient API error never silently disables the nightly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      fresh: ${{ steps.gate.outputs.fresh }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — running nightly"; exit 0
          fi
          CUR='${{ github.sha }}'
          PREV=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=1" \
                   --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          echo "current HEAD=$CUR ; last nightly HEAD=${PREV:-<none>}"
          if [ -z "$PREV" ] || [ "$PREV" != "$CUR" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "new commit(s) since last nightly — running"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "no new commit since last nightly ($PREV) — skipping"
          fi

  coverage-nightly:
    # [OPUS-4.8] NIGHTLY heavy-coverage tier (sq-hbg7). Runs the FULL per-crate
    # set INCLUDING the sparq-vectors 50k recall/diskann accuracy tests that the
    # per-commit `coverage` job skips (those run >10 min for that one crate under
    # llvm-cov instrumentation — too slow for per-commit, hence this split). The
    # gate is the SAME floor file; --check verifies the nightly numbers still meet
    # their floors. Triggered by the `schedule:` cron (or manual dispatch), and only
    # when the nightly-gate says HEAD changed since the last nightly.
    name: coverage (nightly, full incl. heavy vectors)
    needs: nightly-gate
    if: needs.nightly-gate.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c # cargo-llvm-cov
      - name: Test-presence gate
        run: python3 scripts/coverage-presence.py --check
      - name: Measure + enforce per-crate coverage (FULL tier, re-measure backstop)
        # [OPUS-4.8] sq-x4jy (2nd flake): same SAFE re-measure backstop as the per-commit
        # `coverage` job — measure -> check; if the ratchet fails, RE-MEASURE the full tier
        # ONCE and re-check before failing. coverage.sh serialises each binary's tests
        # (--test-threads=1) to kill the profraw-merge undercount race; this re-measures
        # (never accepts a low number), so a real regression fails BOTH passes. Within the
        # 60-min nightly budget.
        run: |
          set -o pipefail
          COVERAGE_TIER=nightly ./scripts/coverage.sh
          if python3 scripts/coverage-gate.py --check target/coverage/coverage-summary.json; then
            exit 0
          fi
          echo "::warning::coverage gate failed on pass 1 — RE-MEASURING once (profraw-merge flake backstop; a real regression will fail again)"
          COVERAGE_TIER=nightly ./scripts/coverage.sh
          python3 scripts/coverage-gate.py --check target/coverage/coverage-summary.json
      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary-nightly
          path: target/coverage/coverage-summary.json

  geiger:
    # [OPUS-4.8] sq-emay: INFORMATIONAL `unsafe`-usage report (cargo-geiger). Pure
    # visibility — surfaces the ~40 unsafe sites concentrated in sparq-core (mmap, the
    # zero-copy dictionary, SIMD) so a PR that ADDS unsafe is visible in the run summary
    # without blocking. Non-gating by design: every step is `continue-on-error: true`
    # (cargo-geiger fails the run on some dependency-graph shapes, and we never want this
    # report to break CI). Promote to a gate later only with a checked-in unsafe-count
    # ratchet (mirroring the coverage/conformance idiom) — out of scope here.
    name: unsafe report (cargo-geiger, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-geiger
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-geiger
        continue-on-error: true
      - name: Report unsafe usage across the workspace
        # `--all-features` would drag in device/heavy optional deps; the default feature
        # set already covers the unsafe of interest (sparq-core). sparq-py is skipped
        # (pyo3 extension module — not a plain cargo-geiger target, like the other jobs).
        run: cargo geiger --workspace --exclude sparq-py >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
