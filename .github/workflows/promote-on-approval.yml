# [OPUS-4.8] Trust promotion (review S3). GitHub Actions has NO reaction trigger, so this cron polls
# quarantined (trust:untrusted) issues and promotes any that a maintainer has 👍-approved AFTER the
# issue's last edit (revision-bound — an UNTRUSTED-sender edit after approval re-quarantines, with an
# explicit revert notice; a trusted sender's edit does not, see triage-issue.yml / #2476). Uses the
# tested pure cores scripts/promote.py + scripts/triage.py.
#
# [OPUS-5] sparq#5425: the driver was inline `python3 - <<'PY'` heredoc python that enumerated the
# queue with `gh issue list --label trust:untrusted --limit 200`. `--limit` truncates SILENTLY and
# newest-first, so past 200 open quarantined issues the OLDEST were never polled again — and inline
# heredoc python has no --self-test, so nothing could go red on the PR that introduced it. It now
# lives in scripts/promote-poll.py (cursor-paginated, ceiling-guarded, hermetically self-tested).
name: promote-on-approval
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # A broken poller must red BEFORE it is trusted to write. Hermetic: stdlib only, no gh, no
      # network — it drives the real driver against a stub that emulates both `gh` fetch shapes.
      - name: Self-test the promotion policy and the quarantine poll
        run: |
          set -euo pipefail
          python3 scripts/promote.py --self-test
          python3 scripts/promote-poll.py --self-test
      - name: Poll quarantined issues for maintainer approval
        run: |
          set -euo pipefail
          python3 scripts/promote-poll.py --repo "$REPO" --apply
