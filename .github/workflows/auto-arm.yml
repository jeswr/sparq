# [GPT-5] Issue #447 — arm reviewed worker PRs without bypassing the merge queue.
name: auto-arm

on:
  pull_request:
    types: [labeled]
  schedule:
    # Explicit minutes make the ten-minute backstop auditable (no */N shorthand).
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

# Enabling auto-merge needs repository contents + pull-request WRITE access. Both are
# load-bearing: enablePullRequestAutoMerge is a repository write operation, so demoting
# `contents` to `read` makes every arm fail with "Resource not accessible by integration
# (enablePullRequestAutoMerge)" — the #3760 outage, which the re-arm sweeper hit with
# exactly that misconfiguration while THIS workflow armed fine (runs 30033315483 vs
# 30027010495). Pinned by scripts/tests/test_arm_capability_wiring.py.
permissions:
  contents: write
  pull-requests: write

# A label event and the sweep must never race each other into a double arm.
concurrency:
  group: auto-arm
  cancel-in-progress: false

jobs:
  arm:
    name: arm reviewed PRs
    if: github.event_name != 'pull_request' || github.event.label.name == 'review:pass'
    runs-on: ubuntu-latest
    # 10 (was 5): headroom for the #3759 bounded transient-retry backoff (up to
    # 10s+30s per idempotent READ during a platform blip) without hitting the
    # job ceiling; the sweep itself is unchanged.
    timeout-minutes: 10
    steps:
      # Run the trusted default-branch policy, never code from the candidate PR head.
      - name: Checkout auto-arm policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # [OPUS-5] #3776 — CHECK OUT THE WHOLE DIRECTORY, never a file-by-file manifest.
          # This step's `ref:` is the DEFAULT BRANCH, but on a `pull_request` event the
          # WORKFLOW FILE (and so this manifest) comes from the PR's own ref. Enumerating
          # individual files therefore couples a default-branch script to a per-ref
          # snapshot of its dependency list: #3766 added `import gh_retry` to
          # scripts/auto-arm.py and `scripts/gh_retry.py` to this list in one commit, and
          # every PR ref cut before that commit kept the one-entry manifest — so the new
          # script ran without gh_retry.py and died with ModuleNotFoundError on a GATING
          # check (#3434, run 30143852994). A directory pattern cannot go stale when a new
          # sibling import is added, so the skew is structurally impossible from here on.
          # Cone mode (the actions/checkout default) is what makes `scripts` recursive;
          # do NOT reintroduce `sparse-checkout-cone-mode: false`, under which this bare
          # word would be a gitignore pattern with different semantics. Pinned by
          # scripts/tests/test_arm_capability_wiring.py::TestSparseCheckoutManifest.
          sparse-checkout: scripts

      - name: Self-test policy
        run: |
          python3 scripts/gh_retry.py --self-test
          # [OPUS-5] #1135: the Release-PR exclusion this sweep consults. Its own
          # self-test runs FIRST so a regression in the shared predicate reds the
          # cron before any arm is attempted.
          python3 scripts/release_pr_guard.py --self-test
          python3 scripts/auto-arm.py --self-test

      # [OPUS-5] #3760 — fail loud ONCE at the start when the token provably cannot arm,
      # instead of a per-PR failure on every label event. Must use the same GH_TOKEN
      # expression as the arm step below (pinned by the wiring test).
      - name: Probe arm capability (one loud error, never per-PR)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/auto-arm.py
          --repo "$REPO"
          --default-branch "$DEFAULT_BRANCH"
          --probe-arm-capability

      # A per-PR arm failure no longer re-raises out of the sweep (pre-#3760 it did, so a
      # single failing PR stopped every later candidate from ever being armed). Failures
      # are collected, summarised, and the run exits non-zero.
      - name: Arm eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # [FABLE-5] #3759 finding 5: the label-triggered (pull_request) invocation is
          # EVENT mode — it has no per-PR cron backstop, so an exhausted transient must
          # exit non-zero (visibly red + retried), NOT the sweep's lenient ::warning+0.
          # The scheduled/dispatch runs are SWEEP mode (a missed cycle is cron-covered).
          ARM_MODE: ${{ github.event_name == 'pull_request' && 'event' || 'sweep' }}
          # [OPUS-5] #3776: WHICH PR this run answers for. Empty on schedule/dispatch (=>
          # whole-repo sweep, the backstop); the triggering PR's number on a label event,
          # so one permanently un-armable PR can no longer red this GATING check on every
          # OTHER PR's label event. Pinned by
          # scripts/tests/test_arm_capability_wiring.py::TestEventModeIsPerPr.
          # NOTE: this expression is the FORWARD-LOOKING half only. Like the
          # sparse-checkout manifest above, it is snapshotted per PR ref, so already-stale
          # refs never pass it — which is why scripts/auto-arm.py ALSO derives the number
          # from the runner environment (GITHUB_EVENT_PATH / GITHUB_REF). That script comes
          # from the default branch, so it is the only half that can heal a frozen ref.
          ARM_PR: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/auto-arm.py
          --repo "$REPO"
          --default-branch "$DEFAULT_BRANCH"
          --mode "$ARM_MODE"
          --pr "$ARM_PR"
