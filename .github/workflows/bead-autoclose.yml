# [OPUS-4.8] Durable bead auto-close-on-merge (bead sq-84a8).
# Authored by Opus 4.8 (Fable unavailable; flag for re-review when Fable returns).
#
# REPLACES the EPHEMERAL session-scoped "watcher b1kzhfxq5". That watcher was a
# per-session Monitor/Task: it did not persist, so once the arming session ended no
# automation closed a bead when its PR merged, and the orchestrator had to `bd close`
# every mapped bead by hand each tick (e.g. sq-v286.11/sq-4wo.2/sq-v286.10 stayed
# in_progress after PRs #818/#819/#821 merged). This COMMITTED workflow is durable.
#
# TRIGGER: a merged PR (`pull_request: [closed]` gated on `merged == true`) — the same
# proven shape as flow-on.yml. A squash-merge carries the `(sq-XXXX)` bead token in the
# PR title (the repo's convention), so the title is the reliable extraction source; we
# additionally scan the merge-commit subject as a fallback.
#
# NOT A GATE. It runs AFTER merge (on `closed`), never on the PR head commit during the
# PR's open lifecycle, so `ci-summary / gate` (which polls check-runs on the PR head while
# the PR is OPEN) never sees it — it cannot register as a required/blocking check. The job
# name carries no `advisory`/`informational` token (so it stays visible in the UI) but,
# being post-merge, it is structurally non-gating. It also never blocks a merge (the merge
# already happened). flow-on.yml uses the identical trigger and is likewise non-gating.
#
# SAFETY: scripts/ci-close-merged-beads.py verifies the merge against the GitHub API,
# closes ONLY beads whose exact sq-XXXX(.NN) id is a token in the PR title / merge subject
# AND are currently open/in_progress/blocked, is idempotent (already-closed => no-op), and
# does a MINIMAL in-place edit of .beads/issues.jsonl (only the matched lines), so the
# committed diff stays tiny and does not fight the orchestrator's canonical `bd export`.
name: bead-autoclose

on:
  pull_request:
    types: [closed]

# Least privilege: we commit the regenerated .beads/issues.jsonl back to main, nothing more.
permissions:
  contents: write

# Serialize per-merge so two near-simultaneous merges don't race the commit-back to main.
# `cancel-in-progress: false` — every merge must be processed; never drop one.
concurrency:
  group: bead-autoclose
  cancel-in-progress: false

jobs:
  close-merged-beads:
    name: close-merged-beads
    # Only act on a genuine MERGE (not a closed-unmerged PR). This is the authoritative
    # GitHub-side gate; the script re-verifies the merge via the API as defense-in-depth.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (we commit the bead JSONL back to main, not the merged ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # A token with push is needed for the commit-back; the default GITHUB_TOKEN
          # (contents: write above) is used by the explicit git push step below.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Self-test the close logic (hermetic; fail fast on a logic regression)
        run: python3 scripts/ci-close-merged-beads.py --self-test

      - name: Close mapped bead(s) for the merged PR (minimal in-place JSONL edit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # Merge-commit subject as a token fallback (defensive; the title is primary).
          SUBJECT="$(git log -1 --format=%s "$MERGE_SHA" 2>/dev/null || true)"
          python3 scripts/ci-close-merged-beads.py \
            --pr "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --subject "$SUBJECT" \
            --jsonl .beads/issues.jsonl

      # [OPUS-4.8] FAIL-SOFT push (sq-roe3). The default GITHUB_TOKEN CANNOT push to the
      # protected `main` branch: the repo ruleset (id 17688455, rules: pull_request +
      # required_status_checks "gate" + code_scanning + non_fast_forward) rejects a direct
      # push with `GH013: Repository rule violations` and an empty bypass list. Confirmed on
      # the first real run (bead-autoclose.yml #27828093722, PR #830):
      #   remote: error: GH013: Repository rule violations found for refs/heads/main
      #   remote: - Changes must be made through a pull request.
      #   remote: - Required status check "gate" is expected.
      #   remote: - Code scanning is waiting for results from CodeQL ...
      # Until a ruleset bypass-list entry for the github-actions bot exists (owner-only,
      # needs:user) OR bead-state is folded into the periodic .beads-export PR (sq-2xdg),
      # the push WILL be rejected. This job runs post-merge (on `closed`) and never gates a
      # PR, so a red run is pure noise — but it should not be red. We therefore treat a
      # rejected push as a best-effort no-op: warn clearly and exit 0. The bead-ID
      # extraction + close logic above still runs every time, so the moment pushing becomes
      # possible (bypass added) this lands the close with no further change. The orchestrator
      # closes beads manually in the interim.
      - name: Commit the regenerated bead JSONL back to main (best-effort; non-fatal on ruleset-blocked push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .beads/issues.jsonl; then
            echo "no bead status change for PR #${PR_NUMBER} — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .beads/issues.jsonl
          git commit -m "chore(beads): auto-close bead(s) mapped to merged PR #${PR_NUMBER} [skip ci]" \
                     -m "Durable replacement for the ephemeral watcher b1kzhfxq5 (sq-84a8). [OPUS-4.8]"
          # Best-effort push. A protected-branch ruleset rejection (GH013) or a
          # non-fast-forward race must NOT fail this non-gating post-merge job. Disable
          # `errexit` only around the push so we can inspect its status and fail soft.
          set +e
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=bead-autoclose push declined::Could not push the .beads close for PR #${PR_NUMBER} to protected main (git push exit ${push_rc}; likely GH013 ruleset rejection — direct pushes to main are blocked). Best-effort no-op: the bead-ID extraction + close logic ran, but the commit was NOT landed. Resolve by adding the github-actions bot to the main ruleset bypass list (owner-only; sq-roe3 needs:user) or folding bead-state into the periodic .beads-export PR (sq-2xdg). The orchestrator closes the bead(s) manually in the meantime."
            exit 0
          fi
          echo "committed + pushed bead auto-close for PR #${PR_NUMBER} to main."
