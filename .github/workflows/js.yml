# Informational CI for the npm package (js/) wrapping crates/sparq-wasm.
# Builds the wasm artifact with wasm-pack, compiles the TypeScript wrapper,
# runs the node:test suite, and checks that `npm pack` stays publishable.
name: js

on:
  push:
    branches: [main]

# [OPUS-4.8] Least-privilege default (Scorecard TokenPermissions): this informational
# build/test job only reads the repo; grant nothing more. Jobs needing writes opt in per-job.
permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: js-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # wasm-pack BEFORE `npm ci`: the package's `prepare` lifecycle (sq-bkag git-pin
      # build) runs on `npm ci` and needs wasm-pack on PATH to compile the wasm engine.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Build (wasm-pack + tsc)
        run: npm run build

      - name: Test (node --test)
        run: npm test

      # Publish guardrail + git-pin verification (sq-bkag): `prepare` wired, the
      # `files` allowlist intact, and the packed tarball actually ships dist/ + wasm/.
      - name: Package guardrail check
        run: npm run check:package

      - name: Report wasm size
        run: ls -l wasm/sparq_wasm_bg.wasm
