# Informational CI for the npm package (js/) wrapping crates/sparq-wasm.
# Builds the wasm artifact with wasm-pack, compiles the TypeScript wrapper,
# runs the node:test suite, and checks that `npm pack` stays publishable.
name: js

on:
  push:
    branches: [main]

# [OPUS-4.8] Least-privilege default (Scorecard TokenPermissions): this informational
# build/test job only reads the repo; grant nothing more. Jobs needing writes opt in per-job.
permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: js-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Build (wasm-pack + tsc)
        run: npm run build

      - name: Test (node --test)
        run: npm test

      - name: Pack check
        run: npm pack --dry-run

      - name: Report wasm size
        run: ls -l wasm/sparq_wasm_bg.wasm
