      # lacked secrets), the ring MUST fail-closed on
      #   github.event.workflow_run.head_repository.full_name == github.repository
      # at the job level, with same-repo+same-head-SHA defense in depth in the
      # head_sha->PR resolution and a live head_repo/head_sha re-check before the
      # dispatch. This REGRESSION checker PINS THE WHOLE WORKFLOW DOCUMENT byte-exact
      # against scripts/tests/fast-fix-ring.golden.yml (after semantically-inert
      # trailing-whitespace/newline normalization only), so ANY edit to the file reds:
      # a job-level guard weakening (OR-wrap, negation, operand swap, demoted-to-comment
      # predicate, uncalled-function move, alt dispatch spelling, dropped select conjunct,
      # inverted `!=`, changed permission, dispatch-target swap), a SECOND token consumer
      # in ANY syntax (dotted or `secrets['...']` bracket), a workflow-level `env:` a
      # second job inherits, or a workflow-level `defaults.run.shell` wrapper. The
      # whole-file pin SUBSUMES the former whole-job pin (there is no level above the
      # whole file), which is why it is terminal (self-test proves it with the full
      # round-1..5 mutation table via the live --root path). Pure stdlib — no PyYAML.
      - name: Self-test the fast-fix ring cross-repo guard (#3475 negative fixtures)
        run: python3 scripts/check-fast-fix-ring-guard.py --self-test
      - name: "Enforce the fast-fix ring fail-closed cross-repo guard (#3475) — GATING"
        run: python3 scripts/check-fast-fix-ring-guard.py
      # [OPUS-5] sparq-org/sparq#3760 — THE ARM PATH. The re-arm sweeper spent days unable
      # to enable auto-merge at all ("Resource not accessible by integration
      # (enablePullRequestAutoMerge)") because its job declared `contents: read` while the
      # operation needs repository WRITE. Both arm policies now (a) probe their token's arm
      # capability at job start and fail with ONE actionable ::error, and (b) collect per-PR
      # arm failures instead of aborting the sweep. Their own self-tests only ran inside the
      # scheduled arm workflows, i.e. never on the PR that broke them — so they gate HERE:
      #   * rearm-sweeper.py --self-test / auto-arm.py --self-test — probe verdicts
      #     (can-arm / cannot-arm / inconclusive), per-PR failure collection + continue,
      #     one-::error-per-run, and the exit semantics (an arm failure never exits 0).
      #     [OPUS-5] #3766 adds the STICKY-FAILURE PRECEDENCE sequences —
      #     `collected-failure > transient-exhaustion > clean` — because collecting the
      #     failures was only half the job: the collected state lived in a LOCAL, so a
      #     LATER candidate's exhausted transient unwound past the accumulated-failure
      #     check and reported ::warning + exit 0, discarding a real arm failure.
      #   * test_arm_capability_wiring.py — cross-file pins: `contents: write` +
      #     `pull-requests: write` on both workflows (a downgrade reproduces #3760 and is
      #     invisible in a python-only diff), the probe step present and BEFORE the arm step
      #     with a byte-identical GH_TOKEN expression, the remediation naming every
      #     flippable lever, and no drift between the two deliberately duplicated copies.
      # The wiring test needs PyYAML — installed once in the shared setup above.
      - name: Self-test the re-arm sweeper policy (arm capability + failure isolation — #3760)
        run: python3 scripts/rearm-sweeper.py --self-test
      - name: Self-test the auto-arm policy (arm capability + failure isolation — #3760)
        run: python3 scripts/auto-arm.py --self-test
      - name: "Arm-path wiring inspection (contents: write + probe-before-arm — #3760)"
        run: python3 scripts/tests/test_arm_capability_wiring.py

  # ----------------------------- ADVISORY -----------------------------
  # [FABLE-5] sq-6vshe.20: the three former advisory jobs as step-groups on ONE
  # runner. The job NAME carries the advisory token (ci-summary exclusion +
  # advisory-registry entry `docs-quality quick-advisory (advisory)`), and every
  # finding is swallowed AT THE STEP exactly as before (`|| true`, step-level
  # continue-on-error on vale/reviewdog, lychee `fail: false`) so the check-run
  # concludes SUCCESS. Job-level continue-on-error stays as defence-in-depth only
  # (it alone would NOT stop the check-run from concluding failure — PR #42).
  # A step promotes to HARD by MOVING into quick-gates (registry criteria).
  quick-advisory:
    name: docs-quality quick-advisory (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # ---- former job: markdownlint-advisory (whole repo) ----
      - name: markdownlint-advisory (whole repo) — full-corpus visibility for the staged rollout
        run: |
          set -uo pipefail
          # The advisory config (same tuned rules) must be named with a supported
          # prefix so it's accepted by --config. Pass whole-repo globs explicitly.
          # [OPUS-4.8] sq-5reoy: dropped the "#zk/xpath/vendor" exclude — the zk/xpath
          # tree (and its vendored ieee754 copy) was externalized to sparq-org/noir_XPath
          # (#1599); the generic "#**/vendor" glob still covers any remaining vendor dir.
          npx --yes markdownlint-cli2@0.18.1 \
            --config advisory.markdownlint-cli2.jsonc \
            "**/*.md" "#node_modules" "#**/node_modules" "#target" "#**/target" \
            "#vendor" "#**/vendor" \
            > md-advisory.txt 2>&1 || true
          n=$(grep -cE ' MD[0-9]+/' md-advisory.txt || true)
          {
            echo "### markdownlint-advisory (whole repo): ${n} finding(s)"
            echo ""
            echo "Out-of-HARD-scope dirs (bench/, .claude/) — staged rollout. (research/ + zk/ are HARD as of sq-rqyo.)"
            echo ""
            echo '```'
            grep -oE ' (MD[0-9]+/[a-z0-9-]+)' md-advisory.txt | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- former job: vale (prose, advisory) ----
      - name: vale (prose, advisory) — vendored styles, no network
        # [OPUS-4.8] STEP-level continue-on-error: reviewdog exits 1 on findings, and
        # JOB-level continue-on-error does NOT make the job's check-run conclude success
        # (it only stops the run from failing) — so ci-summary, which fails iff any
        # check-run concluded failure, would wrongly block on this advisory job. Swallowing
        # at the step makes the job conclude success while the findings still print.
        continue-on-error: true
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.9.1
          files: README.md AGENTS.md CONTRIBUTING.md SECURITY.md skills docs crates
          fail_on_error: false
          # `local` reporter prints to the job log — no PR-annotation write scope
          # needed (top-level permissions stay read-only). Advisory anyway.
          reporter: local
          token: ${{ github.token }}

      # ---- former job: external-links (lychee online, advisory) ----
      - name: external-links (lychee online; dead http(s) links — network-flaky → advisory)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200..=206,429
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
            './skills/**/*.md' './docs/**/*.md' './crates/**/*.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
