# docs-quality — documentation-quality CI (bead sq-5fd1). [OPUS-4.8]
#
# [FABLE-5] sq-6vshe.20 (design: research/ci-runner-consolidation-2026-07.md §4.1):
# CONSOLIDATED from 13 sub-minute jobs to 2 bucket jobs. Every job was a separate
# runner claim (queue wait + claim + checkout + action setup) for seconds of real
# linting, and this is the repo's highest-frequency workflow (pull_request +
# merge_group + main push) — the churn fed the documented congestion-collapse mode.
# The former jobs survive VERBATIM as named sequential step-groups inside:
#
#   * `quick-gates`   ("docs-quality quick-gates") — every HARD gate. NO
#     continue-on-error anywhere: any failing step fails the job, the single
#     gating check-run reds, and the required ci-summary `gate` reds. Former job
#     names survive as step names for log greppability + blame attribution.
#   * `quick-advisory` ("docs-quality quick-advisory (advisory)") — the three
#     advisory checks. The job NAME carries the advisory token (ci-summary
#     exclusion) and findings stay swallowed AT THE STEP exactly as before.
#
# Gate-contract safety: ci-summary's aggregator polls check-runs (created PER JOB)
# by name — jobs merge freely as long as (a) every formerly-GATING check still runs
# inside an advisory-token-free job and (b) every ADVISORY check stays under an
# advisory-token name concluding SUCCESS. Registry: the three former advisory job
# entries in .github/advisory-registry.json are replaced by one entry for the
# consolidated advisory job (same PR, C2-checked by the ci-scripts step below).
#
# WHAT: lints the repo's markdown for spelling, link integrity, style, and the
# house rules (no baked-in perf numbers; concise crate-README template). Two tiers:
#
#   HARD gates (FAIL the build; picked up by the ci-summary aggregator):
#     • markdownlint  — structural markdown defects over the user-facing + governance
#                       doc surface (root docs, skills/, docs/, crates/, and — as of
#                       sq-rqyo — research/ + zk/). Tuned to the repo's house style via
#                       .markdownlint-cli2.jsonc.
#     • typos         — high-confidence spelling errors in those same docs (markdown
#                       only), with a domain allowlist in _typos.toml.
#     • internal-links — lychee --offline over those docs: every relative link AND
#                       heading-anchor (#fragment) must resolve. Deterministic (no net).
#     • privacy-claims — greps the OUTWARD claim surface for unqualified ZK/MPC
#                       privacy/soundness claims (the empirical-honesty mandate; the v1
#                       ZK verifier is pending external audit + sparq-mpc is semi-honest
#                       only). A hit fails unless the line carries an inline
#                       `privacy-claims-allow: <why>` marker. (scripts/check-privacy-claims.sh;
#                       beads sq-toze.35 / sq-qhy4.)
#     • terminology    — greps the doc surface for deprecated RDF/SPARQL wording: the
#                       community-era "RDF-star"/"RDF*"/"SPARQL-star"/"quoted triple"/
#                       "embedded triple" are now RDF 1.2 / SPARQL 1.2 / "triple term" /
#                       "reified triple". A hit fails unless the line is a proper noun
#                       (the W3C RDF-star WG/CG), a paper title, a third-party doc name, a
#                       URL, or carries `terminology-allow: <why>`. research/ is exempt
#                       (prior-art discussion). Source of truth: skills/terminology/SKILL.md.
#                       (scripts/check-terminology.py; bead sq-2p8z / issue #812.)
#     • no-perf-numbers — greps user-facing docs for baked-in benchmark figures (AGENTS.md
#                       house rule; scripts/check-no-perf-numbers.py --enforce). PROMOTED
#                       from advisory to HARD by sq-8ic6 once the backlog cleared (the last
#                       stray, skills/cli/SKILL.md's inline ratio, was reworded to cite the
#                       canonical measured source). Deterministic, grep-only, no network.
#     • no-dyn-dispatch — perf-NEUTRALITY structural gate over the sparq-substrate hot loops
#                       (the shared zero-overhead eval substrate, epic sq-6tykl/sq-qonbz):
#                       FAILS if `dyn`/`Box<dyn>`/`&dyn` trait-object dispatch appears in the
#                       leaf crate's hot paths (src/{join,numeric,rows,lib}.rs), which must stay
#                       MONOMORPHISED so the substrate is free for sparq-engine AND the reasoners
#                       (research/shared-eval-substrate.md §2.3/§4). Comment-aware (the source
#                       documents the invariant in prose) + a narrow `// perf-neutrality-allow:
#                       <reason>` per-line opt-out for a cold path. scripts/check-no-dyn-dispatch.py;
#                       bead sq-0ja86. Deterministic, grep-only, no network, no build.
#     • readme-template — crate-README length cap + 🚀/✨/📚 sections + License
#                       (scripts/check-readme-template.py --enforce). PROMOTED from advisory
#                       to HARD by sq-8ic6's deferred half once the sq-9jw5 README-overhaul
#                       epic cleared the backlog (sq-inzv brought 20 publish=true crate
#                       READMEs to the template; sq-4lvq finished the 3 deferred crates) and
#                       sq-ixsf tightened the stub classifier (an explicit `internal-stub`
#                       HTML-comment directive is now required). 0 deviations across all 35
#                       READMEs. Deterministic (line-count/grep), no network; carries a
#                       hermetic --self-test step. The exact string `readme-template (template)`
#                       is deliberately pinned as the step name (de-facto REQUIRED gate).
#     • ci-scripts     — the CI-helper self-tests + workflow lints bucket (absorbed whole;
#                       it was already the in-file precedent for step-bucket consolidation).
#
#   ADVISORY (findings swallowed at the STEP → reported, never block a merge):
#     • markdownlint-advisory — same rules over the WHOLE repo MINUS the HARD-gated dirs
#                       (research/ + zk/ are now HARD, per sq-rqyo); covers the remaining
#                       not-yet-clean dirs (bench/, .claude/) so any backlog stays visible.
#     • vale          — prose hygiene: weasel words, wordy phrases, adjective puffery.
#     • external-links — lychee online: dead http(s) links (network-flaky → advisory).
#
# WHY this split: markdownlint/typos/internal-links/no-perf-numbers/readme-template are
# deterministic and now pass on the scoped doc surface, so they gate. Vale/external-links
# carry a network dependency or a pre-existing prose-style backlog, so they advise until
# their scope is clean, then flip to HARD.
#
# ci-summary aggregation: it polls every check-run on the head commit and fails iff one
# concluded failure. So every ADVISORY job must CONCLUDE SUCCESS or it would block the
# gate. JOB-level `continue-on-error: true` is NOT sufficient — it stops the run from
# failing but the job's check-run still concludes `failure` (verified: vale showed as a
# failing check on PR #42). Therefore advisory jobs make their findings non-fatal AT THE
# STEP: script steps end with `|| true` (markdownlint-advisory, custom-checks); action
# steps that exit non-zero on findings (vale/reviewdog) carry step-level
# `continue-on-error: true`. (lychee uses `fail: false`.) Job-level continue-on-error is
# kept as defence-in-depth. [OPUS-4.8]
#
# Third-party actions are pinned by full commit SHA with a trailing `# vX.Y.Z`
# (repo hard rule, #34) so the supply chain + Scorecard/CodeQL stay green.
name: docs-quality

on:
  pull_request:
    # [FABLE-5] Draft-tier CI: + ready_for_review so the un-draft moment re-runs
    # this gate-feeding lane (docs/branch-protection.md §Draft-tier CI).
    types: [opened, synchronize, reopened, ready_for_review]
  # [OPUS-4.8] Merge queue: docs-quality surfaces checks on PRs (some gating, some
  # advisory/informational which ci-summary excludes), so it must also run on the
  # queue's merge_group ref or the required ci-summary would wait for siblings that
  # never appear there. The concurrency group below uses
  # `github.event.pull_request.number || github.ref`, which falls back to the unique
  # merge_group ref — no cross-event collision.
  merge_group:
  push:
    branches: [main]

# Read-only: every job only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------- HARD GATES -----------------------------
  # [FABLE-5] sq-6vshe.20: the ten former gating jobs as sequential step-groups on
  # ONE runner. Fail-fast: NO continue-on-error — any red step reds this job's
  # check-run, which reds the required ci-summary `gate`. The job name carries no
  # advisory/informational whole word, so the aggregator gates on it. Fastest greps
  # first, the big ci-scripts bucket last. Shared setup (one checkout + node +
  # python/PyYAML + typos/lychee binaries) replaces ~10 duplicated setups.
  quick-gates:
    name: docs-quality quick-gates
    runs-on: ubuntu-latest
    steps:
      # ---- shared setup ----
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # [OPUS-4.8] HASH-pinned (Scorecard PinnedDependenciesID): a `==` version pin
        # still trusts whatever PyPI serves, so --require-hashes verifies every artifact's
        # sha256 against .github/requirements/docs-quality.txt before use. PyYAML has no
        # runtime deps, so that file is the full closure. See its header to bump/regenerate.
        # Consumers here: skill-frontmatter + the ci-scripts selection-wiring inspection.
        run: pip install --require-hashes -r .github/requirements/docs-quality.txt
      - name: Install typos
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: typos@1.47.2
      - name: Install lychee (for the site-links self-test)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: lychee@0.23.0

      # ---- former job: markdownlint (docs) ----
      - name: markdownlint (docs)
        # npx pins the exact cli2 version; the config (.markdownlint-cli2.jsonc) carries
        # the tuned ruleset AND the HARD-scope globs (root docs + skills/ + docs/ + crates/).
        run: npx --yes markdownlint-cli2@0.18.1

      # ---- former job: typos (docs) ----
      - name: typos (docs)
        # Scope to the SAME doc surface as markdownlint: root *.md + skills + docs +
        # crates, markdown only (typos over the full tree would flag code-side tokens
        # out of this gate's scope). _typos.toml holds the domain-term allowlist.
        run: |
          set -euo pipefail
          # HARD scope = root *.md + skills/ + docs/ + crates/ (markdown only).
          # `git ls-files '*.md'` matches at any depth, so EXCLUDE the out-of-scope
          # dirs to land exactly on the same set markdownlint's config globs (49 files).
          git ls-files '*.md' \
            ':!:research/**' ':!:zk/**' ':!:bench/**' ':!:js/**' \
            ':!:.beads/**' ':!:.claude/**' ':!:.github/**' \
            ':!:vendor/**' ':!:**/vendor/**' | sort -u > /tmp/doc-md.txt
          echo "Scanning $(wc -l < /tmp/doc-md.txt) markdown file(s) for typos:"
          typos --file-list /tmp/doc-md.txt
      # [OPUS-4.8] sq-hyzq: both-direction self-test for the _typos.toml allow-list — the
      # recurring "ALL-CAPS SPARQL keyword + lowercase suffix" false-positives (DELETEd,
      # INSERTed, "3 OPTIONALs", invokable, …) must stay SUPPRESSED, AND a genuine ALL-CAPS
      # misspelling + ordinary lowercase typos must STILL fire (so the regex keeps its
      # teeth). Hermetic (temp fixtures, no repo scan, no network); runs in this same HARD
      # job so an allow-list over- or under-reach also fails the ci-summary gate.
      - name: Self-test the typos allow-list (both directions)
        run: bash scripts/tests/test_typos_allowlist.sh

      # ---- former job: internal-links (lychee --offline) ----
      - name: "internal-links (lychee --offline: relative links + anchors)"
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --offline → no network (deterministic); --include-fragments validates
          # #heading anchors. fail=true makes broken internal links a HARD failure.
          args: >-
            --offline
            --include-fragments
            --no-progress
            README.md AGENTS.md ASSURANCE.md CONTRIBUTING.md SECURITY.md CHANGELOG.md CLAUDE.md
            './skills/**/*.md' './docs/**/*.md' './crates/**/*.md'
          fail: true
          # Don't post a tracking issue (read-only token; gating is enough).
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ---- former job: skill-frontmatter (Agent-Skills YAML) ----
      # [OPUS-4.8] HARD gate (beads sq-56im + sq-tstv): every skills/**/SKILL.md AND
      # every .claude/agents/*.md must have YAML frontmatter that actually parses
      # (yaml.safe_load) and carries non-empty string `name` + `description`. Catches the
      # GitHub "mapping values are not allowed in this context" render error caused by an
      # UNQUOTED colon in a description value (reported on full-text-search/SKILL.md, and
      # later on the sparq-site.md agent's "GitHub Pages app: …" — hence the agent-file
      # coverage). The validation itself is deterministic (no network). [OPUS-4.8]
      - name: skill-frontmatter (Agent-Skills YAML) — validate SKILL.md + .claude/agents
        run: python3 scripts/check-skill-frontmatter.py
      # [OPUS-4.8] sq-tstv: hermetic self-test of the gate's classification — an
      # unquoted-colon agent description must FAIL, a quoted one must PASS, and the
      # default glob must cover both the skills/ and .claude/agents/ families. Runs in
      # this same HARD job so a coverage regression also fails the ci-summary gate.
      - name: Self-test the skill-frontmatter gate
        run: python3 scripts/tests/test_skill_frontmatter.py

      # ---- former job: privacy-claims (ZK/MPC honesty gate) ----
      # [OPUS-4.8] HARD gate (bead sq-toze.35 + sq-qhy4): the empirical-honesty mandate
      # in CI form. The v1 ZK verifier is pending external cryptographer sign-off and
      # `sparq-mpc` is honest-majority semi-honest only (SECURITY.md; research/zk-*-audit.md),
      # so NO outward doc / README / SKILL / site-copy / compliance-index string may assert a
      # ZK/MPC privacy-or-soundness property as a SETTLED, achieved fact without the
      # not-yet-sound caveat. The script greps the outward claim surface for forbidden
      # unqualified-claim phrases; a hit fails the build unless the line carries an inline
      # `privacy-claims-allow: <why>` justification marker (the allow-list). Deterministic,
      # no network, grep-only. [OPUS-4.8]
      - name: privacy-claims (ZK/MPC honesty gate) — no unqualified claims
        run: bash scripts/check-privacy-claims.sh
      # [OPUS-4.8] sq-qhy4: both-direction self-tests for the predicate-form soundness
      # coverage — should-FAIL overclaims ("the verifier is sound", "…are COMPLETE and
      # SOUND", "provably sound") must be caught; should-PASS negated/hedged/non-crypto
      # lines (incl. the canonical "SOUND as landed for the … threat model" verdict) must
      # not regress. Hermetic (no git/network) — pins the gate classification. Runs in
      # this same HARD job so a coverage regression also fails the ci-summary gate.
      - name: Self-test the privacy-claims gate (both directions)
        run: bash scripts/tests/test_privacy_claims.sh

      # ---- former job: terminology (RDF 1.2 / SPARQL 1.2 wording) ----
      # [OPUS-4.8] sq-2p8z (issue #812): the terminology HARD gate. The feature historically
      # nicknamed "RDF-star"/"RDF*" is STANDARDISED in RDF 1.2 (the construct is a "triple
      # term", with "reifiers"/"reified triples" + rdf:reifies); "SPARQL-star" → "SPARQL 1.2".
      # The community spellings are imprecise (a non-spec version name AND the wrong, old
      # subject+object model), so no user-facing / governance markdown may carry them. The
      # script greps the same doc surface the other HARD gates use (root *.md + skills/ +
      # docs/ + crates/), exempts research/ (the sanctioned home for prior-art + competitor
      # discussion), and recognises the legitimate proper-noun / paper-title / third-party-
      # doc-name / URL exceptions (+ an inline `terminology-allow: <why>` marker). The single
      # source of truth for preferred wording is skills/terminology/SKILL.md. Deterministic,
      # grep-only, no network.
      #
      # Pins the gate's own classification before it is trusted to guard the docs:
      # should-FAIL banned spellings must fire AND should-PASS proper-noun / paper-title /
      # third-party-doc / URL / allow-marker lines (+ the GeoSPARQL / italic-closer / bold
      # false-positive families) must not regress. Hermetic (no git/network).
      - name: Self-test the terminology gate (both directions)
        run: python3 scripts/check-terminology.py --self-test
      - name: terminology (RDF 1.2 / SPARQL 1.2 wording) — GATING
        run: python3 scripts/check-terminology.py

      # ---- former job: no-perf-numbers (docs) ----
      # [OPUS-4.8] sq-8ic6: PROMOTED to a HARD gate. The no-perf-numbers backlog cleared —
      # `scripts/check-no-perf-numbers.py --enforce` is GREEN on main (the last residual stray,
      # `skills/cli/SKILL.md:111`'s inline ratio, was reworded to point at the canonical
      # measured source instead of baking the figure inline; same pattern as
      # skills/data-formats/SKILL.md). So the no-perf-numbers house rule (AGENTS.md) now FAILS
      # the build instead of advising. The check is deterministic (grep-only, no network). [OPUS-4.8]
      - name: no-perf-numbers (docs) — GATING
        run: python3 scripts/check-no-perf-numbers.py --enforce

      # ---- former job: no-dyn-dispatch (substrate) ----
      # [OPUS-4.8] sq-0ja86 (epic sq-6tykl / sq-qonbz — the shared zero-overhead eval substrate):
      # a perf-NEUTRALITY structural gate. crates/sparq-substrate is a leaf crate (depends only on
      # sparq-core) holding the shared evaluation substrate consumed by BOTH sparq-engine AND the
      # reasoners; the maintainer invariant (research/shared-eval-substrate.md §2.3/§4) is that its
      # hot loops — the four join kernels behind the generic JoinKeys descriptor + generic Budget
      # cancel hook (src/join.rs) and the XSD numeric value tower (src/numeric.rs) — stay
      # MONOMORPHISED: NO `dyn`/`Box<dyn>`/`&dyn` trait-object dispatch on a per-row / per-key-group
      # hot loop, so the substrate is zero-overhead for both consumers and the deterministic byte
      # ratchets (wasm_bundle_bytes, store/dict bytes) do not regress. A generic `<B: Budget>` bound
      # is FINE (it monomorphises); a trait OBJECT is not. The check (scripts/check-no-dyn-dispatch.py)
      # is COMMENT-AWARE (the source legitimately documents "NO Box<dyn>…" in prose) and supports a
      # narrow `// perf-neutrality-allow: <reason>` per-line opt-out for a genuinely-cold path.
      # Deterministic, grep-only, no network, no build.
      - name: no-dyn-dispatch (substrate) — GATING
        run: python3 scripts/check-no-dyn-dispatch.py

      # ---- former job: readme-template (template) ----
      # [OPUS-4.8] sq-8ic6 (deferred half): PROMOTED to a HARD gate. The README-overhaul epic
      # (sq-9jw5) cleared the backlog — sq-inzv (#751) brought 20 publish=true crate READMEs to
      # the template and sq-4lvq finished the 3 deferred crates (sparq-hdt/introspect/sim), so
      # `scripts/check-readme-template.py --enforce` is now GREEN across ALL 35 READMEs (0
      # deviations). sq-ixsf tightened the stub classifier first (an EXPLICIT `internal-stub`
      # HTML-comment directive is now required, instead of a body-prose substring match that
      # could silently exempt a real deviation). So the crate-README template (length cap +
      # 🚀/✨/📚 + License) now FAILS the build instead of advising. Deterministic (grep/
      # line-count only, no network). The exact string `readme-template (template)` is
      # deliberately preserved as a step name (de-facto REQUIRED gate — sq-6vshe.20). [OPUS-4.8]
      #
      # [OPUS-4.8] sq-ixsf: hermetic self-test of the stub-classification + section/cap
      # logic — a re-broadening back to a prose substring match (which would let real
      # deviations through) fails the gate HERE. Mirrors the coverage-gate.py / perf-gate.py
      # --self-test pattern; runs in this same HARD job so a regression also reds ci-summary.
      - name: Self-test the readme-template stub classifier (pure logic)
        run: python3 scripts/check-readme-template.py --self-test
      - name: readme-template (template) — crate-README cap + sections (sq-9jw5) — GATING
        run: python3 scripts/check-readme-template.py --enforce

      # ---- former job: ci-scripts (CI-helper self-tests + workflow lints) ----
      # [OPUS-4.8] sq-6uc7: HARD self-tests for the shared CI disk-reclaim script
      # (scripts/ci-free-disk.sh). #462 folded `/usr/local/share/boost` + the env-named
      # `$AGENT_TOOLSDIRECTORY` toolcache into that one script (instead of a 2nd inline
      # step). The toolcache is UNSET on a non-GitHub host and the script runs `set -u`,
      # so the load-bearing invariants are: (1) an unset/empty `$AGENT_TOOLSDIRECTORY`
      # must NOT trip `set -u`; (2) an absent path must never red the step; (3) the
      # reclaim still FIRES when the path is present. The harness is hermetic (PATH-shadows
      # sudo/df/docker — touches no real system path) and runs unconditionally on every PR
      # (the script gates `build-archive` + every heavy lane, which are themselves
      # Rust-gated, so it is validated HERE rather than only when Rust changes).
      - name: shellcheck ci-free-disk.sh + its self-test
        run: shellcheck scripts/ci-free-disk.sh scripts/tests/test_ci_free_disk.sh
      - name: Self-test ci-free-disk.sh (set -u safety + existence guards + #462 fold)
        run: bash scripts/tests/test_ci_free_disk.sh
      # [OPUS-4.8] sq-4vo9m: the per-tick disk guard (df-check + merged-worktree prune +
      # gated main-target reclaim) that stops the autonomous loop from filling the work box
      # to ENOSPC. Validated HERE (hermetic: the harness PATH-shadows df/pgrep and sandboxes
      # the main checkout / worktree-gc, so it touches no real disk/worktree) — it has no
      # runtime in CI itself, but a regression in its gated-escalation / busy-build-guard /
      # state→exit / non-fatal-delegation logic must be caught before it is trusted to broom
      # the work box. Both the script's own pure-predicate self-test AND the end-to-end
      # harness run.
      - name: shellcheck disk-guard.sh + its self-test
        run: shellcheck scripts/disk-guard.sh scripts/tests/test_disk_guard.sh
      - name: Self-test disk-guard.sh (threshold math + state→exit-code, hermetic)
        run: bash scripts/disk-guard.sh --dry-run-self-test
      - name: Self-test disk-guard.sh (gated escalation + busy-build guard, end-to-end)
        run: bash scripts/tests/test_disk_guard.sh
      # [OPUS-4.8] sq-h34dc: worktree-gc.sh's COMPLETED-but-unmerged reclaim (--reclaim-completed)
      # removes clean+pushed wf_/agent- worktrees with no live owning task — strictly more
      # aggressive than the default MERGED-or-GONE broom, so its safety (opt-in, workflow-named
      # only, KEEP-if-dirty/unpushed/in-use) is pinned by a hermetic harness that builds real git
      # repos + worktrees and spawns a live in-use process. The script's own pure self-test (the
      # is_workflow_branch predicate + in-use probe callability) runs too. (shellcheck of
      # worktree-gc.sh is included — it carries the load-bearing in-use guard.)
      - name: shellcheck worktree-gc.sh + its completed-reclaim self-test
        run: shellcheck scripts/worktree-gc.sh scripts/tests/test_worktree_gc_completed.sh
      - name: Self-test worktree-gc.sh (pure predicates incl. is_workflow_branch, hermetic)
        run: bash scripts/worktree-gc.sh --dry-run-self-test
      - name: Self-test worktree-gc.sh (completed-reclaim opt-in + workflow-only + in-use guard, end-to-end)
        run: bash scripts/tests/test_worktree_gc_completed.sh
      # [OPUS-4.8] sq-13uyp: the per-tick merged-bead reconcile sweep — closes bd-OPEN beads
      # whose fix already MERGED so they stop wasting frontier dispatches (it COMPLEMENTS
      # push-frontier's open-PR exclusion, sq-7mwun). Its correctness rests on a conservative
      # EXACT-token match (the `sq-ixc3.1` must-NOT-match-`sq-ixc3.11` guard) and a
      # never-auto-close gate for epics / umbrella-parents / needs:user beads — a regression in
      # either would mass-close or mis-close real backlog, so both the pure self-test AND the
      # end-to-end harness run HARD here, before the sweep is trusted.
      - name: shellcheck reconcile-merged-beads.sh + its self-test
        run: shellcheck scripts/reconcile-merged-beads.sh scripts/tests/test_reconcile_merged_beads.sh
      - name: Self-test reconcile-merged-beads.sh (boundary match + gating, hermetic)
        run: bash scripts/reconcile-merged-beads.sh --dry-run-self-test
      - name: Self-test reconcile-merged-beads.sh (exact-match + gating + apply/idempotency, end-to-end)
