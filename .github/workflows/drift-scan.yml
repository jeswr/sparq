# [OPUS-4.8] Periodic drift sweep (bead sq-ncvq.11, epic sq-ncvq).
# Authored by Opus 4.8 (Fable unavailable; flag for re-review when Fable returns).
#
# The SCHEDULED audit half of the maintenance flow-on system
# (research/maintenance-flow-on-automation-design.md §5). It complements:
#   - the per-PR merge GATES (scripts/gate-*.py) that stop NEW drift, and
#   - the merge-triggered flow-on ENGINE (flow-on.yml) that mints follow-ons.
# This lane sweeps the WHOLE repo weekly for EXISTING drift the gates predate,
# and opens/updates idempotent `drift` + `auto` GitHub issues for each item.
#
# This is NOT a PR gate: it runs on a schedule (and on-demand), never on a
# pull_request, and never blocks a merge. It only files follow-on issues; the
# orchestrator reconciles them into beads out-of-band (we do NOT touch
# `bd` / `.beads/` in CI).
name: drift-scan

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. A periodic audit cadence (cf. the design §5
    # "periodic full sweep") — frequent enough to catch drift soon after it
    # lands, infrequent enough to avoid issue churn.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-scan
  cancel-in-progress: false

jobs:
  drift-scan:
    name: drift-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run drift scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/drift-scan.py
