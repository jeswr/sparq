# [GPT-5] Issue #3742 — detect flaky merge-group legs before omnibus bisection.
#
# This trusted, non-gating observer runs only after the batcher closes an omnibus and
# leaves its machine marker. It finds the closed PR's most recent synthetic merge-group
# head, reruns each failed non-summary Actions job exactly once against that same SHA,
# and reports a green flip loudly. A flipped check is renamed with the whole-word
# `advisory` token used by ci-summary, so a later v2 bisection collector cannot mistake
# that historical flaky failure for a deterministic culprit.
#
# This workflow never creates a check on the omnibus head (pull_request_target runs on
# the default branch), so it is structurally outside `ci-summary / gate`.
name: omnibus flake quarantine

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  checks: write
  contents: read
  issues: write

concurrency:
  group: omnibus-flake-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect and quarantine flaky omnibus legs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'sparq-omnibus/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect marker, rerun failed legs once, and quarantine green flips
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const marker = 'sparq-omnibus-failure:v1';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            if (!comments.some(c => (c.body || '').includes(marker))) {
              core.notice(`Omnibus #${pr.number} has no failure marker; nothing to inspect.`);
              return;
            }

            // Merge-queue refs contain the constituent PR number. Prefer the newest
            // failed merge_group run; fall back to the PR head for pre-queue failures.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, event: 'merge_group', status: 'completed', per_page: 100
            });
            const needle = `/pr-${pr.number}-`;
            const failedRun = runs
              .filter(r => (r.head_branch || '').includes(needle))
              .filter(r => ['failure', 'timed_out', 'cancelled'].includes(r.conclusion))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
            const headSha = failedRun ? failedRun.head_sha : pr.head.sha;
            core.info(`Inspecting omnibus #${pr.number} at ${headSha}` +
                      (failedRun ? ` (merge-group run ${failedRun.id})` : ' (PR head fallback)'));

            const initial = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, status: 'completed', per_page: 100
            });
            const isAdvisory = name => /\b(advisory|informational)\b/i.test(name || '');
            const failed = initial.filter(c =>
              ['failure', 'timed_out', 'cancelled'].includes(c.conclusion) &&
              !isAdvisory(c.name) &&
              c.name !== 'gate' &&
              c.name !== 'ci-summary / gate' &&
              /\/actions\/runs\/\d+\/job\/\d+/.test(c.details_url || '')
            );
            if (!failed.length) {
              core.notice(`No rerunnable failed leg found on ${headSha}.`);
              return;
            }
            const initialIds = new Set(initial.map(c => c.id));

            const probe = async check => {
              const match = check.details_url.match(/\/actions\/runs\/(\d+)\/job\/(\d+)/);
              const jobId = Number(match[2]);
              core.warning(`Flake probe: rerunning "${check.name}" job ${jobId} once on ${headSha}.`);
              await github.request('POST /repos/{owner}/{repo}/actions/jobs/{job_id}/rerun', {
                owner, repo, job_id: jobId
              });

              let replacement;
              for (let attempt = 0; attempt < 30; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 15000));
                const checks = await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: headSha, status: 'completed', per_page: 100
                });
                replacement = checks
                  .filter(c => c.name === check.name && (
                    !initialIds.has(c.id) ||
                    (c.id === check.id && new Date(c.updated_at) > new Date(check.updated_at))
                  ))
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
                if (replacement) break;
              }
              if (!replacement) {
                core.warning(`Rerun of "${check.name}" did not conclude before the probe timeout.`);
                return;
              }
              if (replacement.conclusion !== 'success') {
                core.info(`"${check.name}" reproduced as ${replacement.conclusion}; deterministic.`);
                return;
              }

              return {check, replacement};
            };

            const probeResults = await Promise.all(failed.map(probe));
            const flips = probeResults.filter(Boolean);
            if (!flips.length) return;
            const names = flips.map(f => f.check.name).sort().join(', ');
            const title = `ci: quarantine flaky omnibus leg(s): ${names}`.slice(0, 250);
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            let issue = existing.find(i => i.title === title && !i.pull_request);
            if (!issue) {
              const rows = flips.map(f => `- \`${f.check.name}\`: [failed check](${f.check.html_url}), [green rerun](${f.replacement.html_url})`).join('\n');
              issue = (await github.rest.issues.create({
                owner, repo, title,
                body: `> 🤖 SPARQ agent — omnibus flake detector for #${pr.number}.\n\n` +
                      `A gating leg failed on merge-group head \`${headSha}\` and passed when rerun once ` +
                      `against the identical head. The detector will attempt to rename each failed check with ` +
                      `the whole-word \`advisory\` quarantine token so it cannot enter culprit bisection; ` +
                      `any rename failure remains recorded here.\n\n${rows}\n\n` +
                      `Source omnibus: #${pr.number}.`
              })).data;
            }

            const quarantined = [];
            for (const flip of flips) {
              const quarantinedName = `${flip.check.name} (advisory, flaky quarantine)`;
              try {
                await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', {
                  owner, repo, check_run_id: flip.check.id, name: quarantinedName
                });
                quarantined.push(flip);
                core.error(`FLAKY LEG QUARANTINED: "${flip.check.name}" flipped green on one rerun.`);
              } catch (error) {
                core.warning(`Could not quarantine "${flip.check.name}": ${error.message}`);
              }
            }
            if (!quarantined.length) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `> 🤖 SPARQ agent — flake detector quarantined ${quarantined.length} gating leg(s).\n\n` +
                    `They failed on \`${headSha}\` but passed on one same-head rerun: ` +
                    `${quarantined.map(f => `\`${f.check.name}\``).join(', ')}. Tracking: #${issue.number}.`
            });
