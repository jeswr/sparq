# Automated semantic-release driver (release-plz) — epic sq-v286, item sq-v286.4.
#
# [OPUS-4.8] 🤖 SPARQ agent. Design record: research/release-ci-design.md
#   §2  (tool selection: release-plz, release-PR model, git-cliff changelog engine)
#   §6  item 4 ("Add the release-plz release-pr + release workflow … on merge tags
#       vX.Y.Z, which fires the EXISTING release.yml unchanged").
#
# WHAT THIS DOES — the two-step release-plz flow, anchored on release-plz.toml
# (#789 / sq-v286.3: the version_group over the 17 publishable crates that keeps the
# locked single-version model):
#
#   1. release-pr  — on every push to main, release-plz reads the conventional-commit
#                    history (+ cargo-semver-checks API-break detection), computes the
#                    next single workspace version, and opens/UPDATES one "Release-PR"
#                    that bumps the version across the version_group + rewrites
#                    CHANGELOG.md (git-cliff) + updates Cargo.lock. Nothing is released
#                    yet — a human reviews + merges that PR.
#
#   2. release     — when the Release-PR MERGES, its version-bump commit lands on main;
#                    this push re-runs the workflow and `release-plz release` detects the
#                    new version is not yet tagged and CREATES the `v<version>` git tag
#                    (name from release-plz.toml `git_tag_name = "v{{ version }}"`).
#
# THE HANDOFF — tag → reuse existing release.yml (the whole point; do NOT duplicate the
# build matrix here). The EXISTING release.yml triggers on `push: tags: ["v*"]`, so the
# tag this job creates fires release.yml unchanged → its proven build-matrix.yml archive
# matrix + CycloneDX SBOM/VEX + SLSA provenance + SHA256SUMS + GitHub Release + ghcr
# container path all run exactly as today. This workflow adds NO build/package steps.
#
# SCOPE / RECONCILIATION (design §6 item 4 "Reconcile the two crates.io paths"):
#   * GitHub Release ownership — release.yml's `release` job creates the GitHub Release
#     (archives + SBOM/VEX + SHA256SUMS). release-plz's own GitHub-release creation is
#     therefore DISABLED (`git_release_enable = false` in release-plz.toml) so the two do
#     not collide on the same tag. release-plz creates the TAG ONLY; release.yml owns the
#     Release. This is the "scope release-plz to the tag only" arm of design §6 item 4.
#   * crates.io publish — kept MANUAL for now (`publish = false` in release-plz.toml):
#     the `CARGO_REGISTRY_TOKEN` secret does not exist yet (it is the needs:user bead
#     sq-v286.5 "complete out-of-repo publish prerequisites"). With publish disabled,
#     `release-plz release` skips `cargo publish` and proceeds straight to tag creation —
#     without that, cargo-publish-before-tag would fail with no token and the tag (hence
#     the whole release) would never be cut. Flip to release-plz-driven publish once the
#     token lands (then publish.yml only ATTESTS .crate bytes — the point of adoption).
#
# CARE — this workflow does NOT run on this PR (its triggers are push:main and the
# Release-PR-merge push, never pull_request / merge_group), so it does NOT register on the
# `ci-summary / gate` aggregator and cannot block this PR. The trade-off: a defect surfaces
# only at release time, so trigger keys / action inputs / permissions / the tag→release.yml
# handoff were hand-verified (see the PR body).
name: release-plz

on:
  push:
    branches: [main]

# Default to no permissions; each job opts into exactly what it needs (least privilege).
permissions: {}

# Serialize release-plz runs on main so two quick pushes cannot race to open/update the
# same Release-PR. cancel-in-progress: false — never abort a run that may be cutting a
# tag/release mid-flight (matches release-plz's documented recommendation).
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. Release-PR: open/update the version-bump + changelog PR on every push to main.
  #
  # [FABLE-5] ADVISORY + 403 containment. The repo/org setting "Allow GitHub Actions to create
  # and approve pull requests" is DISABLED, so GITHUB_TOKEN cannot create PRs: every main push
  # failed with `ERROR Failed to open PR ... HTTP status client error (403 Forbidden) for url
  # (https://api.github.com/repos/sparq-org/sparq/pulls)` (live: run 29988505600), and the old
  # job name carried no "advisory" token, so the failure GATED the ci-summary `gate` red on main.
  # The in-repo App-token pattern (ORCHESTRATOR_APP_ID / create-github-app-token, batch-merge.yml)
  # would bypass that setting, but the App secrets are NOT configured (live: batch-merge run
  # 29990467905 — ORCHESTRATOR_APP_ID empty, HAVE_APP_TOKEN=false, hygiene-only mode), so there is
  # no working token to switch to. Instead: (1) the job name now contains the whole word
  # "advisory", which ci-summary's `\b(advisory|informational)\b` name rule excludes from the
  # gating set; (2) the KNOWN 403 (PR-creation setting disabled) is tolerated loudly — a
  # `::warning` naming the needed setting, exit 0 — while ANY OTHER failure still fails the (now
  # advisory) job, never silently swallowed. DURABLE FIX (maintainer): enable
  # Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
  # (or configure the ORCHESTRATOR_APP secrets and switch this job's token to a minted App token).
  release-plz-pr:
    name: release-plz / Release-PR (advisory)
    # Guard against forks: release-plz needs repo write + would open PRs on a fork clone.
    # Mirrors bench-ec2.yml's `github.repository == 'sparq-org/sparq'` guard.
    if: github.repository == 'sparq-org/sparq'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the version bump + changelog onto the Release-PR branch
      pull-requests: write  # open / update the Release-PR
    steps:
      - name: Checkout (full history for changelog generation)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # release-plz / git-cliff walk the full commit history to build the changelog.
          fetch-depth: 0
          # Do not leave the default GITHUB_TOKEN in the local git config; release-plz uses
          # its own `token:` input for forge operations (release-plz docs recommendation).
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      # [OPUS-4.8] sq-v286.4: official release-plz action, SHA-pinned (code-scanning=0;
      # the repo SHA-pins ALL actions). v0.5.130 — pin verified to peel to this commit via
      # `gh api repos/release-plz/action/git/tags/<annotated> --jq .object.sha`.
      - name: Run release-plz (open/update Release-PR)
        id: releasepr
        # [FABLE-5] continue-on-error so the containment step below can classify the failure:
        # the KNOWN 403 (Actions PR-creation setting disabled) is tolerated with a ::warning;
        # anything else re-fails the job. See the job-level comment.
        continue-on-error: true
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # GITHUB_TOKEN is what release-plz uses to open/update the Release-PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # [FABLE-5] Classify a release-plz failure: tolerate ONLY the known 403 (repo setting
      # "Allow GitHub Actions to create and approve pull requests" disabled — live: run
      # 29988505600). The probe below deterministically reproduces the exact call release-plz
      # failed on (POST /repos/:repo/pulls with this job's GITHUB_TOKEN) WITHOUT side effects:
      # head==base is invalid, so a token PERMITTED to create PRs gets 422 Validation Failed and
      # no PR is ever created, while a token blocked by the Actions PR-creation setting gets the
      # same 403 release-plz hit (the authorization check precedes body validation). 403 =>
      # loud ::warning + exit 0; anything else => the failure was NOT the known blocked-setting
      # condition, so fail the (advisory) job — never silently swallow a different error.
      - name: Contain the known 403 (Actions PR-creation setting disabled)
        if: steps.releasepr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/rp-probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
            -d '{"title":"release-plz 403 probe (never created: head==base is invalid)","head":"main","base":"main"}')
          echo "PR-creation probe HTTP status: ${code}"
          if [ "${code}" = "403" ]; then
            echo "::warning title=release-plz Release-PR blocked by repo setting::GITHUB_TOKEN cannot create pull requests: the repo/org setting 'Settings → Actions → General → Allow GitHub Actions to create and approve pull requests' is disabled, so the Release-PR was NOT opened (known condition; tolerated as advisory). Durable fix: a maintainer enables that setting, or configures the ORCHESTRATOR_APP_ID/_PRIVATE_KEY App secrets and switches this job's token to a minted App token (batch-merge.yml pattern), which bypasses the setting."
            exit 0
          fi
          echo "::error::release-plz release-pr failed, and the PR-creation probe returned HTTP ${code} (not the known 403 blocked-setting condition) — this is a DIFFERENT, real failure. See the 'Run release-plz' step log above. Probe response body follows."
          cat /tmp/rp-probe.json || true
          exit 1

  # ---- 2. release: when the Release-PR's version commit is on main, create the v<version>
  #         git tag. That tag fires the EXISTING release.yml (push: tags: ["v*"]) which does
  #         all the building/packaging/releasing. No build matrix here by design.
  release-plz-release:
    name: release-plz / tag (handoff to release.yml)
    if: github.repository == 'sparq-org/sparq'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create + push the v<version> git tag
      # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (step b of release-plz.toml's
      # `publish` note). UNCOMMENT the next line together with the auth-action step + the
      # CARGO_REGISTRY_TOKEN env below, and set `publish = true` in release-plz.toml:
      # id-token: write  # OIDC token crates-io-auth-action exchanges for a short-lived crates.io token
    steps:
      - name: Checkout (full history for tag detection)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy (2026-07-18 directive): the ubuntu runner image
        # ships a rustup stable toolchain; the SHA-pinned action's `rustup
        # toolchain install stable` re-downloads the whole toolchain whenever
        # the image lags the newest release. Use the preinstalled one —
        # `rustup default`/`component add` never trigger a toolchain download.
        run: |
          rustup default stable
          rustup show active-toolchain
      # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (continued). When flipping
      # `publish = true`, release-plz runs `cargo publish` BEFORE tagging and needs a crates.io
      # credential in CARGO_REGISTRY_TOKEN. crates.io Trusted Publishing (GA 2025-07, RFC 3691)
      # supplies a SHORT-LIVED token via OIDC — no long-lived secret. UNCOMMENT this step (it
      # must run BEFORE the release-plz step) and wire its `token` output into the env below:
      #   - name: Mint short-lived crates.io token (OIDC trusted publishing)
      #     id: cratesio-auth
      #     uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # [OPUS-4.8] sq-v286.4: `release` command. With `publish = false` +
      # `git_release_enable = false` in release-plz.toml, this creates ONLY the v<version>
      # git tag — it skips cargo publish and skips its own GitHub Release (release.yml owns
      # that). The pushed tag then triggers release.yml.
      - name: Run release-plz (create v<version> tag on version commit)
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # Tagging is a forge operation done with GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [OPUS-4.8] sq-v286.11 — crates.io TRUSTED-PUBLISHING FLIP (step b, continued). With
          # `publish = false`, no crates.io credential is passed (publish is skipped, only the
          # tag is cut). To flip, UNCOMMENT the auth-action step above + this line:
          # CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
