# [OPUS-4.8] sq-40y0 — deploy the sparq feature-showcase site (site/) to GitHub Pages.
#
# WHAT THIS PUBLISHES: the Next.js static export under the Pages base path /sparq,
# PLUS the existing benchmark dashboard preserved at /sparq/dev/. The dashboard tree
# (`dev/`) lives on the `benchmark-data` branch (written by bench.yml); this workflow
# fetches that tree and OVERLAYS it into the export's `out/dev/` before upload, so a
# single Pages artifact serves both the new showcase root and the unchanged dashboard
# at /sparq/dev/bench/.
#
# HOW /dev/bench IS PRESERVED (traced):
#   1. Pages is served at https://jeswr.github.io/sparq/. Today (build_type: legacy)
#      the source is the `benchmark-data` branch root: a root index.html redirect +
#      a dev/ tree (dev/bench/{index.html,dashboard.js,dashboard.css,data.js,...}).
#   2. This workflow does NOT touch the `benchmark-data` branch — bench.yml keeps
#      writing data.js + dev/bench/* there exactly as before. We only READ it.
#   3. After `next build` writes the showcase to out/ (with its OWN root index.html),
#      we `git archive` the `benchmark-data` branch's `dev/` directory into `out/dev/`.
#      The showcase root replaces the old redirect; the dashboard is carried forward
#      verbatim, so https://jeswr.github.io/sparq/dev/bench/ keeps working.
#   4. `out/.nojekyll` disables Jekyll so `_next/` (underscore-prefixed) assets serve.
#
# ONE-TIME PAGES SETTING (needs:user): the repo's Pages source must be switched from
# "Deploy from a branch" (legacy) to "GitHub Actions" in Settings → Pages for this
# workflow's deploy step to publish. Until that flip, the existing legacy dashboard
# keeps serving untouched and this workflow's deploy step is a no-op/failure that
# never modifies the live site. (The alternative — committing out/ onto benchmark-data —
# was rejected: it couples site source to the data branch and races bench.yml's root
# index.html seed.)

name: pages

on:
  push:
    # [OPUS-4.8] sq-gdhy — rebuild on TWO sources so the paper factory's live numbers
    # stay current. (1) `main`: the site source itself changes (pages, papers, the
    # COMMITTED site/src/data/benchmarks.generated.json). (2) `benchmark-data`: bench.yml
    # pushes a fresh benchmark point THERE (not to main), and the paper/showcase numbers
    # are synced FROM that branch at build time (site/scripts/sync-benchmarks.mjs reads
    # origin/benchmark-data:dev/bench/data.js). Before this, a new benchmark point only
    # reached the published papers on the NEXT unrelated main push — the data-branch
    # change alone did not re-publish. A benchmark-data-triggered run still builds the
    # `main` site source (the benchmark-data branch is an orphan dashboard branch with no
    # site/), so it rebuilds main's site against the freshly-pushed data.
    #
    # NO double-fire: bench.yml writes benchmark-data in TWO separate pushes — (a) the
    # github-action-benchmark data.js push (the one carrying the new numbers; NO [skip ci],
    # so it triggers this rebuild) and (b) the "Seed Pages dashboard" push, whose commit
    # message carries [skip ci] (so it never re-triggers). The `concurrency: pages` group
    # below already serialises any overlapping main+benchmark-data runs into one live deploy.
    branches: [main, benchmark-data]
  workflow_dispatch:

# Least-privilege (Scorecard TokenPermissions): read by default; the deploy job
# opts into the Pages/OIDC writes it needs.
permissions:
  contents: read

# Never cancel an in-flight Pages deploy; queue instead so a half-uploaded artifact
# can't leave the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Gate the publish to the two first-party branches CI writes (PRs build nothing here).
    # [OPUS-4.8] sq-gdhy — `benchmark-data` joins `main` so a fresh benchmark point
    # re-publishes the paper factory; both are CI-written branches, never PR refs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/benchmark-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # [OPUS-4.8] sq-gdhy — ALWAYS build the `main` site source, even when this run was
          # triggered by a benchmark-data push: the benchmark-data branch is an orphan
          # dashboard branch (dev/ + a root redirect, NO site/), so checking it out would
          # have nothing to build. fetch-depth:0 still pulls origin/benchmark-data so the
          # overlay + sync-benchmarks steps read its freshly-pushed dev/bench/data.js.
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # Build the lean wasm bundle (crates/sparq-wasm → js/wasm) that the live REPL loads.
      - name: Build sparq wasm bundle
        working-directory: js
        run: |
          npm ci
          npm run build:wasm

      # [OPUS-4.8] sq-0po6 — build the tier-b "W-reason" bundle (crates/sparq-reason-wasm,
      # with --features explain) that drives the live /surface/inference page. Its
      # wasm-pack output stays in the crate's pkg/; the site's prebuild sync-wasm step
      # copies it into public/wasm/reason/. Separate from the lean bundle so the landing
      # page stays light (the page lazy-loads it on first interaction).
      - name: Build W-reason wasm bundle
        working-directory: js
        run: npm run build:reason-wasm

      # [OPUS-4.8] sq-11zy — build the tier-b "W-rsp" bundle (crates/sparq-rsp-wasm, the
      # windowed RSP-QL stream processor) that drives the live /surface/streaming-rsp page.
      # Its wasm-pack output stays in the crate's pkg/; the site's prebuild sync-wasm step
      # copies it into public/wasm/rsp/. Separate from the lean bundle so the landing page
      # stays light (the page lazy-loads it on first interaction).
      - name: Build W-rsp wasm bundle
        working-directory: js
        run: npm run build:rsp-wasm

      # [OPUS-4.8] sq-xoxu — build the tier-b "W-text" bundle (crates/sparq-text-wasm, the
      # BM25 inverted index + `text:` magic predicates) that drives the live
      # /surface/full-text page. Its wasm-pack output stays in the crate's pkg/; the site's
      # prebuild sync-wasm step copies it into public/wasm/text/. Separate from the lean
      # bundle so the landing page stays light (the page lazy-loads it on first interaction).
      - name: Build W-text wasm bundle
        working-directory: js
        run: npm run build:text-wasm

      # [OPUS-4.8] sq-gum8 — install the Typst CLI so the paper-factory build step
      # (site/scripts/build-papers.mjs, run by `prebuild`) can compile site/papers/*.typ
      # into the downloadable PDFs + the in-site HTML renders. Pinned to a release tag +
      # SHA-256-verified so the toolchain is reproducible. (ubuntu-latest is x86_64.)
      - name: Install Typst CLI
        run: |
          set -euo pipefail
          TYPST_VERSION=v0.15.0
          TYPST_SHA256=59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
          url="https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -sSfL -o /tmp/typst.tar.xz "$url"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xf /tmp/typst.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          cp /tmp/typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      - name: Build static site
        working-directory: site
        run: |
          npm ci
          npm run build   # prebuild copies js/wasm → site/public/wasm + builds papers, then next build → out/

      # [OPUS-4.8] sq-d8or — anti-drift: link-check the BUILT site HTML before publish.
      # The docs-quality `internal-links` job (sq-5fd1) lychee-checks the repo MARKDOWN;
      # this extends that scope to the static-export HTML the Pages site actually serves —
      # catching renamed routes / stale cross-links / dangling #anchors that markdown linting
      # cannot see. lychee runs --offline (deterministic, no network) over site/out, remapping
      # the /sparq GitHub-Pages base path to the export root. Runs BEFORE the dev/ overlay so
      # it checks only THIS site's source (the overlaid benchmark dashboard is excluded by the
      # script anyway). The remap + teeth live in a shared, self-tested script
      # (scripts/check-site-links.sh + scripts/tests/test_check_site_links.sh, run in
      # docs-quality's ci-scripts job) so the logic is pinned and reusable locally. A broken
      # internal link FAILS the build → no broken deploy. lychee is installed via the same
      # SHA-pinned taiki-e/install-action this repo already trusts (cf. docs-quality typos);
      # 0.23.0 is the version lycheeverse/lychee-action@v2.8.0 ships, so behaviour matches the
      # markdown gate.
      - name: Install lychee
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        with:
          tool: lychee@0.23.0
      - name: Link-check the static-export HTML (lychee --offline)
        run: bash scripts/check-site-links.sh site/out

      # ---- Preserve the existing benchmark dashboard(s) at /sparq/dev/ ----
      # [OPUS-4.8] sq-zngy — fold ALL `dev/bench*` subtrees (not just dev/bench).
      # bench.yml writes benchmark-data:dev/bench (benchmark-data-dir-path: dev/bench);
      # bench-ec2.yml writes benchmark-data:dev/bench-ec2 (benchmark-data-dir-path:
      # dev/bench-ec2) — a SECOND live dashboard dir on the SAME benchmark-data branch.
      # The `git archive origin/benchmark-data dev` below already carries the ENTIRE
      # dev/ tree verbatim (so any dev/bench* subtree that exists on the branch lands in
      # out/dev/ — the EC2 dashboard does NOT 404 after the Pages-source cutover). The
      # per-subtree assertion that follows makes that GLOB explicit + regression-proof:
      # every dev/bench* on the branch MUST appear in the assembled artifact, so a future
      # narrowing of the archive scope (e.g. back to just `dev/bench`) fails the build.
      - name: Overlay benchmark dashboard(s) (dev/bench*) from benchmark-data
        working-directory: site
        run: |
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet origin/benchmark-data >/dev/null; then
            echo "Overlaying dev/ (all dev/bench* subtrees) from origin/benchmark-data into out/dev/"
            mkdir -p out/dev
            # Extract the WHOLE dev/ subtree of benchmark-data straight into out/dev/.
            # This carries every dev/bench* dashboard dir (dev/bench, dev/bench-ec2, …).
            git -C "$GITHUB_WORKSPACE" archive origin/benchmark-data dev \
              | tar -x --strip-components=1 -C out/dev
            # GLOB-FOLD ASSERTION: every dev/bench* subtree that exists on the branch must
            # have been folded into the artifact. Catches a regressed/narrowed archive scope.
            missing=0
            while IFS= read -r sub; do
              [ -n "$sub" ] || continue
              if [ -d "out/dev/${sub#dev/}" ]; then
                echo "OK: folded benchmark-data:${sub} -> out/dev/${sub#dev/}"
              else
                echo "::error::benchmark-data:${sub} exists on the branch but is MISSING from the Pages artifact (overlay regression)"
                missing=1
              fi
            done < <(git -C "$GITHUB_WORKSPACE" ls-tree -d --name-only origin/benchmark-data dev/ \
                       | grep -E '^dev/bench' || true)
            [ "$missing" -eq 0 ] || { echo "::error::one or more dev/bench* dashboards were not folded into out/dev/"; exit 1; }
          else
            echo "::warning::origin/benchmark-data not found — dashboard NOT overlaid this run."
          fi
          # Static-export hygiene: disable Jekyll so _next/ assets are served.
          touch out/.nojekyll

      # [OPUS-4.8] sq-zngy — ARTIFACT-LEVEL smoke check (NOT a live-URL check).
      # The Pages Source flip to "GitHub Actions" (sq-vbq9) is a pending needs:user action,
      # so a live https://jeswr.github.io/sparq/dev/... probe would 404 pre-cutover and would
      # be wrong. This step instead asserts the ASSEMBLED Pages output dir (site/out, the exact
      # tree handed to upload-pages-artifact below) — so it catches the dev/bench* reconciliation
      # regression regardless of the Pages-source state. It verifies the artifact CONTENTS, NOT
      # that the site is being served.
      - name: Smoke-check assembled Pages artifact (dev/bench* dashboards)
        working-directory: site
        run: |
          set -euo pipefail
          fail=0
          # Core dashboard (dev/bench) MUST always be present — these are hard requirements.
          #   present:            dev/bench/index.html, dev/bench/dashboard.js
          #   present + NON-EMPTY: dev/bench/data.js (the benchmark series; empty = broken overlay)
          for f in out/dev/bench/index.html out/dev/bench/dashboard.js; do
            if [ -f "$f" ]; then echo "OK present: ${f#out/}"; else echo "::error::missing required artifact file: ${f#out/}"; fail=1; fi
          done
          if [ -s out/dev/bench/data.js ]; then
            echo "OK present + non-empty: dev/bench/data.js ($(wc -c < out/dev/bench/data.js) bytes)"
          else
            echo "::error::dev/bench/data.js is missing or EMPTY in the assembled artifact"; fail=1
          fi
          # EC2 dashboard (dev/bench-ec2): assert presence-in-artifact IFF it exists on the
          # benchmark-data branch. bench-ec2.yml is not live until AWS_BENCH_ROLE_ARN is set, so
          # dev/bench-ec2 may not exist on the branch yet — hard-failing on its absence would
          # brick every deploy and regress sq-iigf. But once the EC2 lane HAS pushed, a missing
          # out/dev/bench-ec2/index.html means the overlay dropped a subtree → hard fail.
          if git -C "$GITHUB_WORKSPACE" ls-tree -d --name-only origin/benchmark-data dev/bench-ec2 2>/dev/null | grep -q .; then
            if [ -f out/dev/bench-ec2/index.html ]; then
              echo "OK present: dev/bench-ec2/index.html (EC2 dashboard folded)"
            else
              echo "::error::dev/bench-ec2 exists on benchmark-data but dev/bench-ec2/index.html is MISSING from the artifact"; fail=1
            fi
          else
            echo "::warning::dev/bench-ec2 not yet present on benchmark-data (bench-ec2.yml has not pushed) — skipping its artifact assertion this run"
          fi
          [ "$fail" -eq 0 ] || { echo "::error::Pages artifact smoke check failed — see errors above"; exit 1; }
          echo "OK: Pages artifact smoke check passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    # [OPUS-4.8] sq-gdhy — mirror the build gate: deploy for either CI-written branch.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/benchmark-data'
    runs-on: ubuntu-latest
    # Pages deployment requires these two writes; everything else stays read-only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
