# Supply-chain gate (sq-0sye / sq-2abm / sq-jfer) — practices mapped from
# prod-solid-server onto this Rust workspace.
#
#   audit : cargo-deny over advisories + bans + sources + licenses. ALL GATING
#           (advisories un-degraded — sq-toze.2/GX-1; CVSS-4.0 blocker sq-q8de resolved).
#   sbom  : cargo-cyclonedx -> CycloneDX JSON SBOM, uploaded as an artifact.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening);
# the trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
# [OPUS-4.8]
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  # [OPUS-4.8] Merge queue: supply-chain (cargo-deny etc.) surfaces a check on PRs, so
  # it must also run on the queue's merge_group ref or the required ci-summary would
  # wait for a sibling that never appears there and time out.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [OPUS-4.8] merge-throughput: path-filtered gate (same pattern as ci.yml's `changes`).
  # cargo-deny / cargo-vet / the SBOM all read the resolved DEPENDENCY GRAPH (Cargo.lock /
  # Cargo.toml) and the source tree — a doc-only PR changes none of that, so the result is
  # identical and these legs can skip while the required ci-summary gate still resolves
  # SUCCESS (the skipped legs' `skipped` conclusion is non-failing in the aggregator). The
  # daily dependency-monitoring.yml watchdog remains the defence-in-depth for advisories
  # disclosed BETWEEN PRs on an unchanged graph. SAFE-BY-DEFAULT: rust_changed is forced
  # 'true' on every event except `pull_request`, so the canonical push/merge_group/manual
  # supply-chain runs ALWAYS execute the full set. The `vex-deny-sync` job is deliberately
  # NOT gated: it validates the checked-in deny.toml↔vex.cdx.json invariant (which a doc/
  # config PR can touch without changing Rust) and is fast pure-Python.
  changes:
    name: detect rust changes (supply-chain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_changed: ${{ steps.decide.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'deny.toml'
              - 'supply-chain/**'
              - '.github/workflows/supply-chain.yml'
      - name: Decide rust_changed (safe-by-default off the PR path)
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} -> forcing rust_changed=true (full supply-chain)"
          else
            echo "rust_changed=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "pull_request -> paths-filter says rust=${{ steps.filter.outputs.rust }}"
          fi

  # ---- cargo-deny: advisories, bans, sources, licenses (all gating) ----
  audit:
    name: cargo-deny (advisories + bans + sources + licenses)
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] (sq-qmth) Run cargo-deny on the HOST stable toolchain, NOT the
      # EmbarkStudios Docker action. That action runs inside a container whose bundled
      # cargo is too old (1.83) to parse the vendored `spargebra` (it requires the
      # `edition2024` cargo feature, stabilized in 1.85), so `cargo metadata` — which
      # cargo-deny shells out to — fails before any check runs. The host stable cargo
      # (>=1.85) parses it fine; `cargo deny check` then passes (verified locally).
      # The vendored spargebra path source is allowlisted in deny.toml.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-deny
      # [OPUS-4.8] GATING: integrity checks that don't read the RustSec advisory DB.
      - name: cargo-deny check (bans + sources + licenses) — GATING
        run: cargo deny check bans sources licenses
      # [OPUS-4.8] sq-toze.2 (GX-1): advisories is GATING again. The CVSS-4.0 parse
      # blocker (sq-q8de) that forced `continue-on-error` is RESOLVED — cargo-deny >= 0.19
      # parses CVSS v4.0 advisories, so the freshly-cloned RustSec DB loads and the
      # per-advisory `ignore` rules apply as intended. The deny.toml policy is fail-closed:
      # `yanked = "deny"` and (advisories v2) every unignored advisory FAILS the check;
      # only the two justified `unmaintained` ignores (paste / rustls-pemfile, each with a
      # documented reason + tracking bead) are tolerated. A REAL vulnerability or a yanked
      # crate now blocks the PR. Verified: removing either justified ignore makes
      # `cargo deny check advisories` exit non-zero ("advisories FAILED"); with the ignores
      # in place it is "advisories ok". This is the PR-time gate; the daily watchdog
      # (dependency-monitoring.yml) remains as defence-in-depth for advisories disclosed
      # between PRs.
      - name: cargo-deny check (advisories) — GATING
        run: cargo deny check advisories

  # ---- cargo-vet: per-dependency audit attestations ----
  # [OPUS-4.8] sq-toze.8 (GX-7): GATING. `cargo vet` verifies every crate in the tree is
  # either (a) audited by us, (b) covered by an imported trusted audit set (Mozilla,
  # Google, Bytecode Alliance, ISRG, Embark, Zcash — see supply-chain/config.toml
  # [imports.*]), or (c) carries an explicit `[[exemptions.*]]` entry in
  # supply-chain/config.toml. The bootstrap exemption set (the tree at adoption time) makes
  # this PASS today; the gate's value is the RATCHET — a NEW dependency added in a PR fails
  # `cargo vet` until it is audited or a deliberate exemption is added, so unaudited supply
  # cannot enter silently. Run `cargo vet` locally to reproduce; `cargo vet suggest` lists
  # what to audit to shrink the exemption set. NOTE: the job name has NO "advisory"/
  # "informational" word, so ci-summary treats it as GATING (intentional).
  vet:
    name: cargo-vet (per-dependency audit attestations) — GATING
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # [OPUS-4.8] PIN the cargo-vet version. The committed supply-chain/imports.lock
      # contains a `trusted-publisher = "github:..."` publisher entry (crates.io Trusted
      # Publishing), whose parsing was ONLY added in cargo-vet 0.10.2 (CHANGELOG #671,
      # 2026-01-12). An UNPINNED `tool: cargo-vet` resolves to whatever the installed
      # install-action build defaults to: v2.81.10 had no native cargo-vet support and
      # fell back to cargo-binstall -> 0.10.2 (parses it, PASS), but v2.82.0 added native
      # cargo-vet support pinned to 0.10.0, which CANNOT parse `trusted-publisher` and dies
      # with `missing field user-id for key publisher.wasm-encoder` -> reds this GATING leg.
      # That divergence is exactly what broke PR #704 (the install-action 2.81->2.82 bump).
      # Pinning to >= 0.10.2 makes the version independent of the install-action default so
      # the GATING parse is reproducible. Bump this in lock-step with any new imports.lock
      # schema feature. (bead sq-miwt)
      - name: Install cargo-vet
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-vet@0.10.2
      # [OPUS-4.8] `--locked` pins evaluation to the committed Cargo.lock. `--frozen`
      # (requires the cargo cache populated, hence the `cargo fetch --locked` above) keeps
      # the verification deterministic — it does NOT re-resolve the tree — while still
      # FAILING on a genuinely new/unaudited crate (the committed imports.lock won't cover
      # it). Imports are refreshed deliberately by re-running `cargo vet` (without
      # `--frozen`) when updating the checked-in supply-chain/ evidence, not in the gate.
      - name: Populate cargo cache (for --frozen vet)
        run: cargo fetch --locked
      - name: cargo-vet check — GATING
        run: cargo vet --locked --frozen

  # ---- VEX ↔ deny.toml drift gate ----
  # [OPUS-4.8] sq-toze.29 (GS-5): the published VEX (supply-chain/vex.cdx.json) and the
  # ACTUAL cargo-deny gate (deny.toml [advisories].ignore) name the same set of tolerated
  # advisories; they were kept in step by a "KEEP THIS IN SYNC" comment + manual review.
  # This job makes the invariant a CI gate: it fails if the deny.toml ignore-id set and the
  # VEX vulnerabilities[].id set drift apart (so the public exploitability story can never
  # silently disagree with the gate that's actually enforced). Source of truth is deny.toml.
  # Pure-stdlib Python (tomllib/json on the runner's 3.12); also runs the hermetic self-test
  # so a regression in the check itself is caught. NOTE: the job name has NO "advisory"/
  # "informational" WHOLE WORD, so the ci-summary aggregator treats it as GATING (intentional
  # — see ci-summary.yml's \b(advisory|informational)\b rule; "advisories" plural here is in
  # the comment, not the name).
  vex-deny-sync:
    name: VEX ↔ deny.toml sync (GS-5) — GATING
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: VEX ↔ deny.toml drift self-test
        run: python3 scripts/tests/test_vex_deny_drift.py
      - name: VEX ↔ deny.toml drift check — GATING
        run: python3 scripts/check-vex-deny-drift.py

  # ---- OpenSSF Best-Practices (CII) self-cert evidence gate ----
  # [OPUS-4.8] sq-toze.5 (GX-4): the machine-readable badge self-certification
  # (compliance/openssf/best-practices-self-cert.json) is the import-ready, structured form
  # of the drafted bestpractices.dev answers. This job keeps it HONEST at PR time: every
  # cited evidence path must resolve to a real repo artifact, every status/family token must
  # be legal, ids unique, and a `filed:true` may never appear without a recorded badge_url —
  # so the "evidence-grounded" self-cert can never silently drift as files move or tokens
  # change. Filing the badge on bestpractices.dev itself stays an EXTERNAL human-owned step;
  # this gate covers only the in-repo answer payload. Pure-stdlib Python (json/pathlib on the
  # runner's 3.12); runs the hermetic self-test first so a regression in the check itself is
  # caught. ALWAYS-ON (no rust-change gating: the inputs are checked-in markdown/JSON, not the
  # dependency graph). NOTE: the job name has NO "advisory"/"informational" WHOLE WORD, so the
  # ci-summary aggregator treats it as GATING (intentional).
  openssf-selfcert:
    name: OpenSSF Best-Practices self-cert evidence (GX-4) — GATING
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: self-cert evidence-gate self-test
        run: python3 scripts/tests/test_bestpractices_evidence.py
      - name: self-cert evidence check — GATING
        run: python3 scripts/check-bestpractices-evidence.py

  # ---- CycloneDX SBOM ----
  sbom:
    name: generate CycloneDX SBOM
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-cyclonedx
      - name: Warm registry cache (retry transient crates.io fetch)
        # [OPUS-4.8] sq-hxn7: `cargo cyclonedx` runs `cargo metadata`, which fetches the
        # crates.io registry. That fetch is TRANSIENTLY flaky on hosted runners (observed
        # `curl ... [16] Error in the HTTP2 framing layer` -> `cargo metadata exited with
        # an error`, which failed this GATING job on unrelated PRs #719/#734/#749).
        # Warm the registry/source cache up front in a bounded shell retry so the bulk of
        # the network work — and the H2 framing flake — is absorbed here BEFORE the SBOM
        # step. Fails only if all 3 attempts fail (a genuine outage). No new action dep.
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Generate SBOM (CycloneDX 1.5 JSON, whole workspace)
        # --all emits one SBOM per workspace member + an aggregate; JSON format.
        # [OPUS-4.8] sq-toze.28 (GS-4 / CDX-3): --spec-version 1.5 (cargo-cyclonedx
        # 0.5.9 defaults to 1.3) so the CI SBOM matches the published 1.5 SBOM/VEX;
        # the 1.5 metadata.lifecycles slot is populated by scripts/sbom-normalize.jq.
        # [OPUS-4.8] sq-hxn7: wrapped in a bounded shell retry — cargo-cyclonedx's internal
        # `cargo metadata` can still touch the network even with the cache warmed above, so
        # retry the transient HTTP2-framing crates.io flake here too (fail only if all
        # attempts fail). No new GitHub Action dependency (keeps code-scanning posture).
        run: |
          set -euo pipefail
          n=0
          until cargo cyclonedx --all --format json --spec-version 1.5; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo cyclonedx failed after $n attempts" >&2
              exit 1
            fi
            echo "cargo cyclonedx attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Normalize SBOM (strip host-revealing absolute build paths)
        # [OPUS-4.8] sq-toze.30 (GS-6 / F-6): cargo-cyclonedx stamps the absolute build dir
        # into every workspace/path-dependency bom-ref + purl, which would leak the CI
        # runner's filesystem layout into this uploaded artifact. Rewrite each generated SBOM
        # in place through the same deterministic, idempotent jq transform release.yml uses
        # (scripts/sbom-normalize.jq), keeping the dependency graph internally consistent.
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            jq -f scripts/sbom-normalize.jq "$f" > "$f.norm"
            mv "$f.norm" "$f"
            if grep -qE 'path\+file://|download_url=file://|/home/' "$f"; then
              echo "ERROR: host path leaked into $f after normalization" >&2
              exit 1
            fi
          done < <(find . -name '*.cdx.json' -print0)
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error

  # ---- purl-canonicality assertion ----
  # [OPUS-4.8] sq-tmyw: BACKSTOP for the GS-6/GS-7 normalizer. cargo-cyclonedx 0.5.9
  # decorates workspace/path purls with the runner's filesystem layout
  # (`?download_url=file://…`, `#src/…`); scripts/sbom-normalize.jq strips that so the
  # PUBLISHED SBOM carries only canonical `pkg:cargo/<name>@<version>` purls (sq-toze.30 +
  # sq-uujh). That normalizer is hand-written against the EXACT shapes 0.5.9 emits — a
  # future cargo-cyclonedx upgrade could re-introduce a DIFFERENT decoration the pattern
  # misses, silently re-leaking a host path / non-canonical purl. This job regenerates the
  # SBOM, runs it through the same normalizer, and asserts EVERY purl matches
  # `^pkg:cargo/[^?#]+@[^?#]+$` (scripts/check-sbom-purl-canonical.py) — so a regression
  # in the normalizer-vs-tool contract FAILS the PR instead of shipping. NOTE: the job name
  # has NO `advisory`/`informational` WHOLE WORD, so the ci-summary aggregator treats it as
  # GATING (intentional). Also runs the hermetic self-tests so a regression in the checks
  # themselves is caught:
  #   * test_sbom_purl_canonical.py — the purl half (GS-7).
  #   * test_sbom_bomref_canonical.py — the bom-ref half (GS-6, sq-9gli): pins that the SBOM
  #     ROOT COMPONENT's `bom-ref` (and every workspace/path ref + dependency edge) is
  #     rewritten from the `path+file:///abs/build/dir/...#ver` form to the canonical
  #     `pkg:cargo/<name>@<version>` identity, so no build-machine path leaks into the
  #     PUBLISHED SBOM. With the toolchain installed below, its live-workspace assertion runs
  #     here (not skipped) over the same normalizer the publication path uses.
  sbom-purl-canonical:
    name: SBOM purl-canonicality assertion (GS-6/GS-7) — GATING
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-cyclonedx
      - name: purl-canonicality check self-test
        run: python3 scripts/tests/test_sbom_purl_canonical.py
      - name: bom-ref-canonicality check self-test (GS-6)
        run: python3 scripts/tests/test_sbom_bomref_canonical.py
      - name: Warm registry cache (retry transient crates.io fetch)
        # [OPUS-4.8] sq-hxn7: same transient `cargo metadata` H2-framing crates.io flake as
        # the `sbom` job — warm the cache in a bounded shell retry before this GATING SBOM
        # regeneration so a registry hiccup doesn't fail an unrelated PR.
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Generate + normalize SBOM, then assert canonical purls — GATING
        run: |
          set -euo pipefail
          # [OPUS-4.8] sq-hxn7: bounded shell retry around the transient crates.io fetch
          # inside cargo-cyclonedx's `cargo metadata` (fail only if all attempts fail).
          n=0
          until cargo cyclonedx --all --format json --spec-version 1.5; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo cyclonedx failed after $n attempts" >&2
              exit 1
            fi
            echo "cargo cyclonedx attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
          # cargo-cyclonedx writes <crate>.cdx.json next to each member's Cargo.toml, so
          # the freshly-generated SBOMs live under crates/. Scope the normalize+assert to
          # those (NOT the committed supply-chain/vex.cdx.json, which is a VEX, carries no
          # component purls, and must not be mutated). Normalize through the SAME transform
          # the publication path uses, then assert every purl in the normalized output is
          # canonical.
          mapfile -d '' -t generated < <(find crates -name '*.cdx.json' -print0)
          if [ "${#generated[@]}" -eq 0 ]; then
            echo "::error::no generated SBOM found under crates/ — cargo cyclonedx produced nothing"
            exit 1
          fi
          for f in "${generated[@]}"; do
            jq -f scripts/sbom-normalize.jq "$f" > "$f.norm"
            mv "$f.norm" "$f"
          done
          python3 scripts/check-sbom-purl-canonical.py "${generated[@]}"

  # ---- per-component supplier-name assertion (NTIA N1) ----
  # [OPUS-4.8] sq-toze.26 (GS-1 / NTIA N1): BACKSTOP for the supplier-derivation in
  # scripts/sbom-normalize.jq. cargo-cyclonedx 0.5.9 leaves the per-component
  # `supplier`/`publisher` slot empty, so the NTIA "Supplier Name" minimum element was
  # unpopulated. The normalizer now derives a supplier HONESTLY from each component's
  # identity (crates.io-published / first-party workspace / vendored upstream), never
  # fabricated. This job regenerates the SBOM, runs it through the SAME normalizer the
  # publication path uses, and asserts EVERY cargo component carries a supplier.name
  # (scripts/check-sbom-supplier.py) — so a future cargo-cyclonedx bump that changes the
  # component shape and silently stops the derivation FAILS the PR instead of shipping an
  # SBOM that regressed to the empty-supplier state. NOTE: the job name has NO
  # `advisory`/`informational` WHOLE WORD, so the ci-summary aggregator treats it as GATING
  # (intentional). Also runs the hermetic self-test so a regression in the check itself is
  # caught.
  sbom-supplier:
    name: SBOM per-component supplier-name assertion (GS-1) — GATING
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-cyclonedx
      - name: supplier-name check self-test
        run: python3 scripts/tests/test_sbom_supplier.py
      - name: Warm registry cache (retry transient crates.io fetch)
        # [OPUS-4.8] sq-hxn7: same transient `cargo metadata` H2-framing crates.io flake as
        # the `sbom` job — warm the cache in a bounded shell retry before this GATING SBOM
        # regeneration so a registry hiccup doesn't fail an unrelated PR.
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Generate + normalize SBOM, then assert per-component supplier — GATING
        run: |
          set -euo pipefail
          # [OPUS-4.8] sq-hxn7: bounded shell retry around the transient crates.io fetch
          # inside cargo-cyclonedx's `cargo metadata` (fail only if all attempts fail).
          n=0
          until cargo cyclonedx --all --format json --spec-version 1.5; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo cyclonedx failed after $n attempts" >&2
              exit 1
            fi
            echo "cargo cyclonedx attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
          # cargo-cyclonedx writes <crate>.cdx.json next to each member's Cargo.toml; scope
          # the normalize+assert to those generated SBOMs (NOT the committed VEX). Normalize
          # through the SAME transform the publication path uses, then assert every cargo
          # component in the normalized output carries a supplier.name.
          mapfile -d '' -t generated < <(find crates -name '*.cdx.json' -print0)
          if [ "${#generated[@]}" -eq 0 ]; then
            echo "::error::no generated SBOM found under crates/ — cargo cyclonedx produced nothing"
            exit 1
          fi
          for f in "${generated[@]}"; do
            jq -f scripts/sbom-normalize.jq "$f" > "$f.norm"
            mv "$f.norm" "$f"
          done
          python3 scripts/check-sbom-supplier.py "${generated[@]}"

  # ---- JS / npm-lockfile SBOM (published WASM client) ----
  # [OPUS-4.8] sq-toze.27 (GS-3): SBOM the PUBLISHED npm surface (`js/` = @jeswr/sparq, the
  # WASM client). The Rust workspace is SBOM'd above, but the JS lockfile tree was not.
  # `site/` (Next.js demo) is `private: true` (never published) and intentionally OUT — see
  # scripts/gen-js-sbom.sh for the scope rationale. Produces a runtime-tree SBOM (what a
  # consumer installs) + a full build-tree SBOM (devDeps; SSDF parity), both CycloneDX 1.5,
  # both schema-validated by cyclonedx-npm's built-in --validate (default on) and uploaded
  # as an artifact. NOTE: the job name has NO `advisory`/`informational` whole word, so
  # ci-summary gates it (a failure to enumerate the published JS supply chain is a real
  # signal). `--package-lock-only` reads the committed lockfile — no network install.
  js-sbom:
    name: JS/npm CycloneDX SBOM (published WASM client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Generate JS SBOM (runtime + full tree)
        run: scripts/gen-js-sbom.sh
      - name: Upload JS SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-js-cyclonedx
          path: sbom/sparq-js*.cdx.json
          if-no-files-found: error
