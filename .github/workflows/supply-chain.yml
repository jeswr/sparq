# Supply-chain gate (sq-0sye / sq-2abm / sq-jfer) — practices mapped from
# prod-solid-server onto this Rust workspace.
#
#   audit : cargo-deny over advisories + bans + sources + licenses. GATING.
#   sbom  : cargo-cyclonedx -> CycloneDX JSON SBOM, uploaded as an artifact.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening);
# the trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
# [OPUS-4.8]
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- cargo-deny: advisories, bans, sources, licenses (all gating) ----
  audit:
    name: cargo-deny (advisories + bans + sources + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # EmbarkStudios/cargo-deny-action installs a pinned cargo-deny and runs the
      # checks. `command` defaults to `check` (all four checks); spelled out for
      # clarity. The vendored spargebra path source is allowlisted in deny.toml.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@e2f4ede4a4e60ea15ff31bc0647485d80c66cfba # v2.0.4
        with:
          command: check advisories bans sources licenses

  # ---- CycloneDX SBOM ----
  sbom:
    name: generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c # v2.49.0
        with:
          tool: cargo-cyclonedx
      - name: Generate SBOM (CycloneDX JSON, whole workspace)
        # --all emits one SBOM per workspace member + an aggregate; JSON format.
        run: cargo cyclonedx --all --format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
