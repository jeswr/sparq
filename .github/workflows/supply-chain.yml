# Supply-chain gate (sq-0sye / sq-2abm / sq-jfer) — practices mapped from
# prod-solid-server onto this Rust workspace.
#
#   audit : cargo-deny over advisories + bans + sources + licenses. GATING.
#   sbom  : cargo-cyclonedx -> CycloneDX JSON SBOM, uploaded as an artifact.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening);
# the trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
# [OPUS-4.8]
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- cargo-deny: advisories, bans, sources, licenses (all gating) ----
  audit:
    name: cargo-deny (advisories + bans + sources + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # [OPUS-4.8] (sq-qmth) Run cargo-deny on the HOST stable toolchain, NOT the
      # EmbarkStudios Docker action. That action runs inside a container whose bundled
      # cargo is too old (1.83) to parse the vendored `spargebra` (it requires the
      # `edition2024` cargo feature, stabilized in 1.85), so `cargo metadata` — which
      # cargo-deny shells out to — fails before any check runs. The host stable cargo
      # (>=1.85) parses it fine; `cargo deny check` then passes (verified locally).
      # The vendored spargebra path source is allowlisted in deny.toml.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c # v2.49.0
        with:
          tool: cargo-deny
      # [OPUS-4.8] GATING: integrity checks that don't read the RustSec advisory DB.
      - name: cargo-deny check (bans + sources + licenses) — GATING
        run: cargo deny check bans sources licenses
      # [OPUS-4.8] sq-q8de: `advisories` is temporarily NON-gating. cargo-deny 0.19.8
      # (the latest) can't parse RustSec advisories that use CVSS v4.0 (e.g.
      # RUSTSEC-2026-0124) — it fails LOADING the freshly-cloned advisory DB
      # ("unsupported CVSS version: 4.0"), a DB-wide parse error before any per-advisory
      # `ignore` applies, so it can't be configured around. This is an upstream tooling
      # lag (not a vulnerability in our tree). Keep it reported (continue-on-error) so the
      # advisory output is still visible; the REAL advisory gate is the daily cargo-audit
      # monitor (dependency-monitoring.yml). Flip back to gating once cargo-deny ships
      # CVSS-4.0 support (sq-q8de tracks it).
      - name: cargo-deny check (advisories) — informational until CVSS-4.0 support lands
        continue-on-error: true
        run: cargo deny check advisories

  # ---- CycloneDX SBOM ----
  sbom:
    name: generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c # v2.49.0
        with:
          tool: cargo-cyclonedx
      - name: Generate SBOM (CycloneDX JSON, whole workspace)
        # --all emits one SBOM per workspace member + an aggregate; JSON format.
        run: cargo cyclonedx --all --format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
