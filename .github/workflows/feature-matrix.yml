# feature-matrix — GATING build/test/clippy lane for the OPT-IN (default-OFF) cargo
# features. [OPUS-4.8]
#
# WHY (CDMC cert finding sq-kzfi; bead labelled cert,ci,opt-in): ci.yml builds, tests
# and clippies only the DEFAULT feature set of every crate. Several capabilities ship
# behind default-OFF opt-in features (serializers, federation SERVICE + descriptors,
# the vec:/text: rewrites, derivation explanations, the CS planner, the zk-trace seam,
# coordinate reprojection, the seedable MPC test RNG, …). Code that CI never compiles
# rots: a default-feature change can silently break an opt-in build/clippy and nobody
# notices until a consumer enables it. The CDMC audit flagged exactly this (it's why
# the catalogue capability scored 3 not 4). This lane compiles + clippies (and tests,
# where dedicated offline tests exist) the opt-in features so they stay green.
#
# GATING: this workflow is PR/merge_group/push-triggered, and every job NAME here is
# free of the words "advisory"/"informational", so the single required `ci-summary /
# gate` aggregator (ci-summary.yml) auto-discovers each matrix leg as a REQUIRED check
# and fails the merge if any opt-in build/clippy/test breaks. No edit to ci-summary.yml
# is needed — the aggregator polls by name, not by a hard-coded list.
#
# STRUCTURE — DYNAMIC, PER-CRATE-FRAGMENT MATRIX (bead sq-ibrze). [OPUS-4.8] The
# opt-in leg list used to be ONE static `include:` block inside this file. Every
# opt-in-feature PR appended a leg to that shared list, so concurrent PRs collided
# textually on adjacent additions (this cost ~8 merge-fixer passes in a single session:
# #1160/#1187/#1200/#1202/#1207/#1212). The list now lives in PER-CRATE fragment files
# under `.github/feature-matrix.d/<crate>.yml`; the `setup` job below assembles them
# (scripts/assemble-feature-matrix.py) into the matrix JSON and the `opt-in-features`
# job consumes it via `fromJSON`. Adding a crate's leg now edits ONLY that crate's
# fragment, so concurrent PRs for DIFFERENT crates never touch the same file and
# auto-merge. The emitted check-run NAME is `opt-in <name>` exactly as before — the
# assembler's `--names` mode dumps the full set and `scripts/tests/test_feature_matrix_
# assemble.py` asserts it is byte-identical to the pre-split static list, so the gate
# aggregator + branch protection keep recognising every required leg.
#
# [FABLE-5] GROUPED RUNNERS (CI-economy, maintainer directive 2026-07-18): the legs no
# longer map 1:1 onto runner jobs. The assembler's `--grouped` mode bin-packs them
# (same-crate legs clustered; per-leg cost = the fragment's optional `weight:` field,
# defaulting to a crate-source-size heuristic; each group targets <5 min of warm-cache
# work) and `opt-in-features` runs ONE JOB PER GROUP. The gate-critical per-leg
# `opt-in <name>` check-runs are still emitted, byte-identical — but across a TRUSTED
# BOUNDARY (PR #3511 review, finding 1): the group job executes PR-controlled code
# (build scripts/proc macros/tests) UNPRIVILEGED (contents: read, persist-credentials:
# false, no token in the environment) and writes per-leg outcomes to an ARTIFACT.
# The reporter is NOT a job here — it lives in the separate, DEFAULT-BRANCH-owned
# .github/workflows/feature-matrix-report.yml, triggered by `workflow_run` on this
# workflow's completion, so GitHub always runs the reviewed default-branch copy of the
# reporter workflow AND of scripts/run-feature-matrix-group.py — a PR cannot edit
# either to forge check-runs with the `checks: write` token (the pwn-requests fix).
# The reporter downloads THIS run's artifacts (per-leg results + the SELECTED-matrix
# and metadata this workflow's `setup` job uploads), validates them hostile-input-
# style against the selected leg set, validates the recorded head SHA against the
# server-supplied workflow_run.head_sha, and posts the check-runs. Names byte-
# identical, so the aggregator, branch protection and the golden self-test contract
# are all unchanged; the group jobs' OWN conclusions remain the always-gating coarse
# signal on the PR head, independent of reporter timing.
#
# GUARD — THE RULE THAT KEEPS THIS LANE HONEST (sq-vya1). A test module/file behind
# `#[cfg(feature = "X")]` / `#![cfg(feature = "X")]` for a DEFAULT-OFF feature is compiled
# EMPTY by ci.yml's `cargo nextest archive --workspace --all-targets` (it passes NO
# `--features`), so the sharded `test` lane there runs ZERO of those tests — silently. The
# ONLY thing that exercises such a suite is a leg HERE whose `cargo test -p <crate>
# --features <…>` set is a SUPERSET of every feature the suite's cfg names. THEREFORE:
# whenever you add (or feature-gate) a test behind a default-OFF feature, you MUST either
#   (a) add that feature to a leg below whose crate matches (combine with an existing leg
#       if the features co-enable cleanly — see the sparq-server `audit-log,access-audit,…`
#       leg), OR
#   (b) add a NEW leg (if the feature must be isolated — e.g. it changes a `not(feature=…)`
#       code path, like brTPF vs TPF — give it its own leg so both code paths are tested).
# To verify a suite is actually wired: `cargo nextest list -p <crate> --features <set>`
# must SHOW the previously-skipped test names. The aggregator gate (ci-summary.yml) treats
# every leg NAME here as REQUIRED (none contains the words "advisory"/"informational"), so
# a broken opt-in build/clippy/test blocks the merge — but ONLY for suites a leg reaches.
# A suite with no leg and no default coverage is the silent gap this whole lane exists to
# close; do NOT let one back in. (ci.yml carries the mirror-image of this guard.)
#
# [OPUS-5] sq-p1ccp — THE GUARD ABOVE IS NOW ENFORCED, NOT MERELY REVIEW DISCIPLINE. The
# gating `setup` job runs `python3 scripts/feature-matrix-tiers.py --enforce`, which REDs
# that job (and so withholds the ENTIRE opt-in matrix — see AGENTS.md's MISSING-LEG-
# ATTRIBUTION rule before triaging a phantom leg failure) on either violation:
#   (1) a leg carries `tier: check` while the detector still classifies one of its features
#       SENSITIVE — a `cfg(feature = "F")` hit under `tests/`/`benches/`, a `#[cfg(test)]`/
#       `#[test]`-adjacent hit under `src/`, or ANY `cfg(not(feature = "F"))` in the crate —
#       and the fragment carries no reviewed `tier-reason:` override. This is the RATCHET:
#       feature-gating a test under a demoted feature reds the NEXT PR until the leg is
#       promoted back to `tier: test`.
#   (2) a SENSITIVE (crate, feature) appears in no `test: true` leg FOR THAT CRATE — the
#       sq-vya1 guard itself, mechanized. The silent gap now fails the gate instead of
#       awaiting a reviewer. BOTH invariants key on the (crate, feature) PAIR, never the
#       bare feature name: cargo feature names are crate-LOCAL and 15 are shared across
#       crates today (`arrow`, `service`, `templates`, …), so a `test: true` leg for `F`
#       in crate A never stands in for a sensitive `F` in crate B. The ONLY exit from (2)
#       is a written `test-reason:` on the leg, for coverage that genuinely cannot be a
#       `cargo test` leg — today exactly one: sparq-py's `arrow`, reachable only through
#       the pymodule (`[lib] test = false`), whose executor is the gating maturin `arrow`
#       pytest job in python.yml. Prefer adding the leg to writing a reason.
# The detector is FAIL-CLOSED: any parse/IO error classifies the leg SENSITIVE (keep the
# full leg), never a silent demotion. Options (a)/(b) above are still exactly what you DO —
# what changed is that skipping them is now caught mechanically.
#
# TIERS — the optional `tier:` field on a fragment leg (design: research/feature-matrix-
# pyramid.md §3/§4):
#   • `tier: test` — the DEFAULT, and what a MISSING `tier:` means: the full
#     build+test+clippy leg in the `opt-in-features` matrix. Unchanged behaviour. A
#     present-but-unrecognised value (typo, null, non-string) is a HARD assembler ERROR,
#     not a silent fallback — a demotion is only ever a reviewed `tier: check` edit.
#   • `tier: check` — DEMOTED. On pull_request/merge_group the assembler's `--tier check`
#     mode routes the leg OUT of that matrix and into the `check-tier` job below, which runs
#     `cargo clippy -p <crate> --features <F> -- -D warnings` and NOTHING else — no test
#     execution, and deliberately no `--all-targets` (by the demotion criterion the feature
#     has no gated test code). On push-to-main (and workflow_dispatch/schedule) the check
#     tier assembles EMPTY and the leg runs as a FULL build+test leg in the matrix above:
#     the per-merge backstop, so a demoted leg's residual risk surfaces within minutes of
#     the merge that broke it rather than never.
# Nothing is demoted by default, by omission, or by a detector run — only by a reviewed
# fragment edit that `--enforce` then holds to the evidence. As of 2026-07-26 NO fragment
# carries `tier:`, so both `check-tier` shards assemble a zero-leg set and are green-empty.
# They are REQUIRED checks regardless — post-#3773 a check GATES unless it is DECLARED in
# .github/advisory-registry.json, and neither `check-tier` shard is declared there — so the
# first demotion is gated on arrival: its compile/clippy break blocks the merge in the
# check tier instead of via its former `opt-in <name>` leg.
#
# SCOPE — what this lane deliberately does NOT cover, and why (each is a separate gate
# or a documented exclusion, NOT an oversight):
#   • `zlib-ng` (sparq-cli / sparq-server / sparq-parse / sparq-hdt): swaps flate2's
#     backend for the zlib-ng C library — needs a C toolchain/cmake and is a pure
#     perf backend with no first-party Rust code of its own, so compiling it here buys
#     no rot-protection for sparq's own source. Left out to keep the lane fast + free
#     of a C build dep.
#   • [FABLE-5] sq-8ju74: the `hdt`/`hdt-write` (sparq-cli) + `write` (sparq-hdt) legs
#     USED to be excluded here because the wrapped `hdt` crate declares MSRV 1.87 and
#     the workspace floor was 1.85 ("needs its own toolchain lane"). That reason is
#     STALE — the floor is 1.88, at/above sparq-hdt's 1.87 — so the legs now exist in
#     .github/feature-matrix.d/{sparq-cli,sparq-hdt}.yml and the former silent gaps
#     (tests/hdt_cli.rs, tests/hdt_write_cli.rs, tests/write_roundtrip.rs) gate normally.
#   • `live` (sparq-nlq) / `embeddings` (sparq-vectors): enable a REAL network client
#     (reqwest against the Anthropic / OpenAI-compatible endpoints). They are off in CI
#     by contract (the eval harness runs on recorded fixtures) and must not open a
#     socket on a runner, so they are not built/tested here.
#   • `mimalloc` (sparq-cli, default-ON) is not opt-in; it is exercised by the default
#     build already.
#   • [OPUS-4.8] sq-evb1: `sparq-reason-el` (the opt-in OWL 2 EL classifier) is a
#     SEPARATE CRATE with NO intra-crate cargo feature — depending on the crate IS the
#     opt-in (the spike's preferred shape, keeping sparq-reason lean). Its whole surface
#     (lib unit tests + the tests/differential.rs ELK-calculus oracle + clippy + rustdoc)
#     is therefore built/tested by ci.yml's `cargo {build,nextest,clippy,doc} --workspace`
#     lanes already — for the E1 default surface there is no default-OFF feature to toggle.
#     [OPUS-4.8] sq-xetf7: Phase E2 ADDED the default-OFF `rbox` feature (RBox / property
#     chain + transitive-role saturation, CR10/CR11), so the leg this NOTE anticipated now
#     exists below as the `sparq-reason-el (rbox …)` matrix entry. [OPUS-4.8] sq-s2nob: Phase
#     E3 ADDED the default-OFF `hasse` feature (transitive reduction → direct-subsumer Hasse
#     diagram), so a second `sparq-reason-el (hasse …)` leg now exists below too.

name: feature-matrix

on:
  push:
    branches: [main]
  # [FABLE-5] sq-fmx4u.5: react to labeled/unlabeled too so toggling the `ci-full`
  # label re-evaluates change-based selection for the opt-in leg set as well (the
  # `setup` assembler filters legs by the selection outputs). Default types are
  # listed explicitly so adding the label events does not drop `synchronize`.
  # [FABLE-5] LABEL-TRIGGER GUARD (full rationale: ci.yml's pull_request note): only
  # the `ci-full` toggle starts real work off a label event — the review pipeline's
  # review:*/status:* flips otherwise restarted this workflow on an unchanged head
  # SHA, and the concurrency-cancelled `select` check-runs REDdened the ci-summary
  # gate. The guard is the job-level `if:` on the root `changes` job (everything else
  # needs:-chains from it); the `select` pre-job stays UNCONDITIONAL and runs to a
  # cheap success (a skipped select would poison the gate — ci_summary_gate.py
  # requires every selection check-run to conclude `success`). Label events also get
  # a per-run concurrency group below so a flip never cancels an in-flight run.
  # [FABLE-5] Draft-tier CI: + ready_for_review, so the un-draft moment re-assembles
  # the opt-in leg set at FULL tier (the select job name drops its ", draft-tier"
  # marker) and the required gate stops honouring the draft-tier-assembled set —
  # see docs/branch-protection.md §Draft-tier CI. Independent of the label guard
  # above: a non-`ci-full` label flip stays a no-op regardless of draft state.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Merge queue: mirror the PR check-set onto the merge_group ref so the required
  # ci-summary gate finds the same legs it finds on a PR (matches ci.yml/ci-summary.yml).
  merge_group:

permissions:
  contents: read

concurrency:
  # [FABLE-5] label-trigger guard: labeled/unlabeled pull_request events get a
  # PER-RUN group — a label-flip run entering the shared per-ref group would cancel
  # the in-flight real run on the SAME head SHA (run-level cancellation precedes job
  # `if:` evaluation), leaving cancelled check-runs that RED the ci-summary gate.
  # All other events keep the shared per-ref group + cancel-in-progress as before.
  group: feature-matrix-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && github.run_id || 'shared' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # [SONNET-4.6] sq-6vshe.1: CI build-profile speedup (mirrors ci.yml). See ci.yml's
  # global env comment for the full rationale. lld is pre-installed on ubuntu-24.04
  # runners and also provided via the Rust toolchain's rust-lld, so no per-job install
  # step is needed.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  # [OPUS-4.8] merge-throughput: path-filtered gate (same pattern as ci.yml's `changes`).
  # The opt-in feature matrix only compiles/tests Rust, so a doc-only PR can skip it while
  # the required ci-summary gate still resolves SUCCESS (the aggregator treats the skipped
  # leg's `skipped` conclusion as non-failing). SAFE-BY-DEFAULT: rust_changed is forced
  # 'true' on push/schedule/workflow_dispatch, so the canonical push/manual runs ALWAYS
  # compile the full feature matrix — only a purely non-Rust PR diff skips.
  # [FABLE-5] MERGE-GROUP CHANGE-CLASS GATE (extends #3420/#3421 to this layer; full
  # doctrine: ci.yml's `changes` job header). merge_group used to hard-force
  # rust_changed=true, so a docs-only/orchestration-only queued batch still paid this
  # workflow's rust_changed-only jobs (setup / check-tier / fedclient-boundary) on every
  # enqueue. The decide step now diffs the queued batch (base_sha...head_sha, the #3421
  # fetch pattern) and classifies it with `scripts/ci_select.py --classify-only` — the
  # SAME classify_change() the `select` pre-job runs on this event (no duplicated path
  # lists). docs-only/orchestration-only => rust_changed=false; any other class, an
  # unresolvable SHA pair, or any classifier error => true (fail-safe = full run). The
  # skipped legs report `skipped` and the required ci-summary gate attributes them to
  # the green same-diff `select` pre-job (attributed skips, never missing legs).
  changes:
    name: detect rust changes (feature-matrix)
    # [FABLE-5] label-trigger guard (see the pull_request trigger note): a
    # labeled/unlabeled event for any label other than `ci-full` skips this root job,
    # and with it every needs:-dependent (setup/opt-in legs/check-tier/no-default-
    # features lanes/fedclient-boundary). The `select` pre-job deliberately stays
    # unguarded (its success is required by the gate on every trigger).
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      github.event.label.name == 'ci-full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_changed: ${{ steps.decide.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/feature-matrix.yml'
              # [OPUS-4.8] sq-ibrze: editing a per-crate fragment (adding/changing an
              # opt-in leg) or the assembler MUST re-run the full matrix so the new/edited
              # leg actually builds+tests — even on an otherwise non-Rust PR.
              - '.github/feature-matrix.d/**'
              - 'scripts/assemble-feature-matrix.py'
              # [FABLE-5] PR #3511 review finding 2: the grouped-runner engine is as
              # load-bearing as the assembler — a PR changing ONLY this script must
              # still run setup (its self-test gates there) + the grouped execution
              # + the reporter. Wiring pinned by test_feature_matrix_assemble.py.
              - 'scripts/run-feature-matrix-group.py'
              # [FABLE-5] PR #3511 review round-3 finding 2: the PRIVILEGED reporter
              # workflow is the trust-boundary half of finding 1. A PR changing ONLY
              # .github/workflows/feature-matrix-report.yml would otherwise skip setup,
              # so its dedicated trusted-boundary self-tests (run in setup) never run —
              # a change to the privileged reporter must re-run them. Wiring pinned by
              # test_feature_matrix_assemble.py.
              - '.github/workflows/feature-matrix-report.yml'
              # [FABLE-5] PR #3511 review finding 4: the assembler/runner self-test is
              # the mechanized guard for the gate-critical leg-name contract AND the
              # trusted-boundary wiring. A test-only edit that WEAKENS it must still
              # re-run the setup self-test (which runs this file) — otherwise a PR
              # could gut the guard while skipping the very job that enforces it.
              - 'scripts/tests/test_feature_matrix_assemble.py'
      - name: Decide rust_changed (safe-by-default off the PR path)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "rust_changed=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "pull_request -> paths-filter says rust=${{ steps.filter.outputs.rust }}"
          elif [ "${EVENT_NAME}" = "merge_group" ]; then
            # [FABLE-5] MERGE-GROUP CHANGE-CLASS GATE (see the job header note): diff the
            # queued batch (#3421 fetch pattern) and classify via scripts/ci_select.py
            # --classify-only. docs-only/orchestration-only batch => skip; any other
            # class, unknown token, unresolvable SHAs, or classifier error => full
            # (fail-safe).
            rust=true
            ok=true
            # --depth=2147483647 (--unshallow, valid on complete repos too): the
            # depth-1 checkout leaves the three-dot diff with no merge-base — a
            # shallow SHA fetch passes the cat-file guards yet the diff dies, so
            # the fail-safe would force class=engine on EVERY batch (silent
            # no-op gate). Full rationale: ci.yml's decide step.
            git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" "${MG_HEAD_SHA}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=2147483647 origin "${MG_BASE_SHA}" 2>/dev/null \
              || ok=false
            git cat-file -e "${MG_BASE_SHA}^{commit}" 2>/dev/null || ok=false
            git cat-file -e "${MG_HEAD_SHA}^{commit}" 2>/dev/null || ok=false
            if [ "${ok}" = "true" ]; then
              cls="$(python3 scripts/ci_select.py --classify-only --event merge_group \
                       --base "${MG_BASE_SHA}" --head "${MG_HEAD_SHA}")" || cls=engine
              case "${cls}" in
                docs-only|orchestration-only) rust=false ;;
                *) rust=true ;;
              esac
            else
              echo "::warning::could not resolve merge_group base/head SHAs for the batch diff — running the full feature matrix (fail-safe)."
            fi
            echo "rust_changed=${rust}" >> "$GITHUB_OUTPUT"
            echo "merge_group -> change_class=${cls:-<unresolved>} rust_changed=${rust}"
          else
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT_NAME} -> forcing rust_changed=true (full feature matrix)"
          fi

  # [FABLE-5] sq-fmx4u.3: change-based test-selection pre-job (reusable — doctrine
  # in .github/workflows/ci-select.yml; same instance shape as ci.yml's). The
  # `setup` job below consumes its outputs to FILTER the assembled leg list when
  # selection is ENFORCED (mode == 'selected'); shadow/full/missing outputs
  # fail-close to the full leg set inside scripts/assemble-feature-matrix.py.
  # UNCONDITIONAL (no needs/if): the ci-summary gate requires every selection
  # check-run to conclude success before any skipped sibling counts as satisfied.
  # NOTE (why assembly-time filtering, not the per-leg job-level `if:` guard the
  # design sketched): the `matrix` context is NOT available in jobs.<job_id>.if
  # (GitHub contexts-availability), where a `matrix.crate` reference silently
  # evaluates EMPTY — under enforcement that would skip EVERY leg unconditionally.
  # Filtering in the (unit-tested) assembler keeps the per-leg decision in Python;
  # an unassembled leg spawns no check-run, which the polling aggregator simply
  # never waits on (requiredness flows through `ci-summary / gate`, not per-leg
  # names — bead sq-fmx4u.4 verifies this against live branch protection).
  select:
    name: select
    uses: ./.github/workflows/ci-select.yml
    permissions:
      contents: read

  # [OPUS-4.8] sq-ibrze: assemble the dynamic matrix from the per-crate fragment files.
  # This decouples adding a leg (edit one `.github/feature-matrix.d/<crate>.yml`) from
  # this shared workflow file, killing the recurring adjacent-append merge conflict. The
  # job NAME ("assemble feature matrix") is free of the words "advisory"/"informational",
  # so it is itself a REQUIRED check — correctly: if assembly fails (a malformed fragment
  # or a duplicate leg name that would collapse two gating checks into one), the gate
  # MUST block the merge rather than silently run a truncated matrix. It is path-filtered
  # behind the same `changes` gate as the legs, so a non-Rust PR skips it (and the legs
  # below `need` it, so they skip too — the aggregator treats both as non-failing).
  setup:
    needs: [changes, select]
    if: needs.changes.outputs.rust_changed == 'true'
    name: assemble feature matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.assemble.outputs.matrix }}
      # [FABLE-5] sq-fmx4u.3: leg COUNT, so `opt-in-features` can skip (instead of
      # exploding on an empty matrix) when enforced selection filters every leg out.
      legs: ${{ steps.assemble.outputs.legs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # [OPUS-4.8] HASH-pinned (Scorecard PinnedDependenciesID): reuses the same
        # full-closure PyYAML 6.0.2 hash set the docs-quality skill-frontmatter job pins,
        # so --require-hashes verifies every artifact's sha256 before use. PyYAML has no
        # runtime deps, so that file is the complete dependency closure.
        run: pip install --require-hashes -r .github/requirements/docs-quality.txt
      - name: Self-test the assembler + gate-critical leg-name preservation
        # [OPUS-4.8] sq-ibrze: run the hermetic test BEFORE assembling so a fragment edit
        # that would rename/drop/add a gating leg (or reintroduce a static list, or name a
        # leg "advisory"/"informational") fails THIS gating job — i.e. the gate-critical
        # invariant is enforced on every PR that touches a fragment, not just by review.
        run: python3 scripts/tests/test_feature_matrix_assemble.py
      - name: Enforce tier ratchet + sq-vya1 guard (feature-matrix-tiers.py --enforce)
        # [SONNET-4.6] sq-ldg8c (design §4): mechanizes the sq-vya1 GUARD as a HARD gate.
        # Reds THIS gating job if a leg carries `tier: check` while the detector still finds
        # feature-gated test code / a `cfg(not(feature))` brace (and no reviewed
        # `tier-reason:` override), OR if any sensitive feature has no `test: true` leg. So a
        # future feature-gated test added under a demoted feature re-promotes it at the next
        # PR — the ratchet. Fail-closed: a detector/IO error classifies a leg SENSITIVE (keep
        # the full leg), never a silent demotion. Stdlib + the PyYAML installed above; it
        # scans crates/ (checked out above). At ZERO annotations this is a no-op green.
        run: python3 scripts/feature-matrix-tiers.py --enforce
      - name: Structural guard C1 — feature-gated test execution (sq-qcnn.31)
        # [SONNET-4.6] sq-qcnn.31: Fail-closed guard — every feature-gated test module or
        # target (tests/ files with #![cfg(feature = "F")] inner attributes, OR [[test]]/
        # [[bench]] Cargo.toml entries with required-features) MUST map to a CI executor
        # (a feature-matrix leg, a coverage.sh case arm) or an explicit entry in
        # scripts/check-feature-test-execution.allowlist.json. A gated test with no
        # executor and no allowlist entry fails this gating job immediately — silently-
        # never-running tests are structurally impossible from the first commit they are
        # added. The --self-test run verifies the detector is not broken (exits 1 if the
        # negative fixture is unexpectedly clean, i.e. the guard would be dark). PyYAML
        # already installed by the step above.
        run: |
          set -euo pipefail
          python3 scripts/check-feature-test-execution.py --self-test
          python3 scripts/check-feature-test-execution.py --check
      - name: Assemble matrix from .github/feature-matrix.d/*.yml
        id: assemble
        # Emit the leg set as a one-line JSON object on the `matrix` output. The
        # assembler validates every fragment (required keys, non-empty features, no
        # duplicate leg names) and exits non-zero on any malformed fragment, so a bad
        # fragment fails THIS gating job instead of producing a silently-truncated matrix.
        # [FABLE-5] sq-fmx4u.3: --select-mode/--affected filter the legs to the
        # affected closure ONLY when the selection pre-job says mode == 'selected';
        # shadow/full/empty/malformed inputs fail-close to the FULL leg set inside
        # the assembler (unit-tested). `legs` is the post-filter count.
        env:
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_AFFECTED: ${{ needs.select.outputs.affected }}
        run: |
          set -euo pipefail
          # [FABLE-5] CI-economy: --grouped emits ONE matrix entry per bin-packed
          # GROUP of legs (see the opt-in-features job note); `legs` is the TOTAL
          # leg count across groups, so the skip-on-zero contract is unchanged.
          MATRIX="$(python3 scripts/assemble-feature-matrix.py --grouped --event "${{ github.event_name }}" --select-mode "${SELECT_MODE:-}" --affected "${SELECT_AFFECTED:-}")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          LEGS="$(echo "$MATRIX" | python3 -c 'import json,sys; m=json.load(sys.stdin)["include"]; print(sum(g["count"] for g in m))')"
          NGROUPS="$(echo "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')"
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          echo "Assembled $LEGS opt-in leg(s) into $NGROUPS group(s) (select mode: ${SELECT_MODE:-<unset>}, event ${{ github.event_name }}). Full leg-name set:"
          python3 scripts/assemble-feature-matrix.py --names
      - name: Emit the SELECTED leg set + metadata for the trusted reporter
        # [FABLE-5] PR #3511 review findings 1+2: the reporter runs in the separate,
        # default-branch-owned feature-matrix-report.yml (workflow_run) so it never
        # executes PR-controlled code with `checks: write`. It needs (a) the EXACT
        # legs this run should produce — the UNGROUPED selected set (same --event/
        # --select-mode/--affected filters as the grouped matrix, so byte-identical
        # legs) — as its completeness ground truth (finding 2), and (b) the head SHA
        # + originating event as metadata so it can validate the SHA against the
        # server-supplied workflow_run.head_sha (finding 1). This step runs PR-
        # controlled assembler code, so it holds NO token and NO checks:write — the
        # artifact is DATA the trusted reporter validates hostile-input-style.
        if: needs.changes.outputs.rust_changed == 'true'
        env:
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_AFFECTED: ${{ needs.select.outputs.affected }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p fmg-selected fmg-metadata
          python3 scripts/assemble-feature-matrix.py \
            --event "${EVENT_NAME}" --select-mode "${SELECT_MODE:-}" \
            --affected "${SELECT_AFFECTED:-}" > fmg-selected/selected-matrix.json
          python3 -c 'import json,os; json.dump({"head_sha": os.environ["HEAD_SHA"], "event": os.environ["EVENT_NAME"]}, open("fmg-metadata/metadata.json","w"))'
      - name: Upload the selected-matrix artifact (reporter completeness ground truth)
        if: needs.changes.outputs.rust_changed == 'true' && steps.assemble.outputs.legs != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-matrix-selected
          path: fmg-selected/selected-matrix.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload the run metadata artifact (head SHA + event for the reporter)
        if: needs.changes.outputs.rust_changed == 'true' && steps.assemble.outputs.legs != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-matrix-metadata
          path: fmg-metadata/metadata.json
          retention-days: 1
          if-no-files-found: error
      - name: Loud failure attribution — the opt-in matrix was NOT generated
        # [FABLE-5] sq-2wo5t: when THIS job fails (golden leg-name drift after adding
        # a new opt-in leg, the C1 structural guard, the tier ratchet, or a malformed
        # fragment), the matrix output is never produced, so the `opt-in-features` job
        # spawns ZERO legs and EVERY required `opt-in <crate> (…)` check on the PR goes
        # expected-but-MISSING. That absence historically misread as "one specific leg
        # failing across multiple unrelated PRs" — a false main-regression signature
        # (the 2026-07-11 'spqv-provenance' drain-blocker alarm; none of the PRs
        # touched the crate). This step fires ONLY when an earlier step in this job
        # failed and emits an unmissable ::error annotation + job-summary block that
        # attributes the missing legs to THIS job, so triage starts at the real failing
        # step instead of chasing a phantom cross-PR leg regression. It cannot rescue
        # the job (the earlier failure already decides the job's conclusion, which the
        # required ci-summary gate REDs on) — the fail-closed guards are unchanged.
        # The wiring + this script's output are pinned by
        # scripts/tests/test_feature_matrix_assemble.py (TestAssembleFailureAnnotation).
        if: failure()
        run: |
          set -euo pipefail
          echo "::error title=opt-in feature matrix NOT generated::The 'assemble feature matrix' job failed, so NO 'opt-in *' matrix legs were spawned for this commit. Every required 'opt-in <crate> (...)' check is therefore MISSING, not failing — a missing leg is not a failing leg, and this is NOT a regression in any single opt-in leg. Fix the failing step in THIS job first. Common causes: golden leg-name drift (a new opt-in leg without a matching line in scripts/tests/feature-matrix-legnames.golden.txt), the C1 feature-gated-test-execution guard (scripts/check-feature-test-execution.py), the tier ratchet (scripts/feature-matrix-tiers.py), or a malformed .github/feature-matrix.d fragment."
          {
            echo "## opt-in feature matrix NOT generated"
            echo
            echo "This \`assemble feature matrix\` job **failed**, so the matrix JSON was never produced and **no \`opt-in *\` check-runs were spawned** for this commit."
            echo
            echo "**Every required \`opt-in <crate> (…)\` check on this PR is MISSING, not failing.** A missing leg is not a failing leg — do not triage individual opt-in legs, and do not suspect a cross-PR / main regression in one of them."
            echo
            echo "Fix the failing step above first. Common causes:"
            echo
            echo "- **Golden leg-name drift** — a new opt-in leg was added without updating \`scripts/tests/feature-matrix-legnames.golden.txt\` (the assembler self-test)."
            echo "- **Structural guard C1** — a feature-gated test with no CI executor and no allowlist entry (\`scripts/check-feature-test-execution.py --check\`)."
            echo "- **Tier ratchet** — \`scripts/feature-matrix-tiers.py --enforce\`."
            echo "- **Malformed fragment** — a broken or duplicate-name leg in \`.github/feature-matrix.d/<crate>.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  opt-in-features:
    needs: [changes, setup]
    # [FABLE-5] sq-fmx4u.3: `legs != '0'` skips this job when enforced selection
    # filtered EVERY leg out (an empty `include` would otherwise be a matrix
    # error, i.e. a false RED). Fail-closed: a missing/empty `legs` output is
    # != '0' => run; and if `setup` itself failed, this job skips via `needs`
    # while the gate REDs on setup's failure.
    if: needs.changes.outputs.rust_changed == 'true' && needs.setup.outputs.legs != '0'
    # [FABLE-5] CI-economy GROUPED LEGS (maintainer directive 2026-07-18). The matrix
    # is ONE ENTRY PER BIN-PACKED GROUP of legs (assembler --grouped; same-crate legs
    # clustered, each group targeting <5 min of warm-cache work) instead of one runner
    # per leg — 159 legs used to mean 159 runners each paying checkout + toolchain +
    # cache-restore + the dependency compile.
    #
    # NAME CONTRACT PRESERVED: the gate-critical `opt-in <name>` check-run for EVERY
    # leg is still emitted, byte-identical (proven against the golden snapshot by
    # scripts/tests/test_feature_matrix_assemble.py) — but NOT from this job. THIS
    # JOB IS DELIBERATELY UNPRIVILEGED (PR #3511 review, critical finding): it
    # executes PR-controlled code — cargo build scripts, proc macros, tests, clippy
    # lints, plus the whole third-party dependency graph's build-time code — so it
    # must NEVER hold a `checks: write` token (malicious build code could forge
    # arbitrary check runs, incl. gate-critical sibling names) nor persisted git
    # credentials. It runs scripts/run-feature-matrix-group.py with NO token in the
    # environment and writes each leg's outcome to a results file, uploaded below as
    # an artifact for the separate, DEFAULT-BRANCH-owned reporter workflow
    # (feature-matrix-report.yml, workflow_run — see finding 1 in this file's header),
    # which executes no PR build code, validates the artifact hostile-input-style, and
    # posts the per-leg check-runs. A failed leg does not stop the group (the old fail-fast: false),
    # and the group job then FAILS LOUDLY naming exactly which legs failed — this
    # job's own conclusion is a required gating signal via `ci-summary / gate`
    # regardless of any check-run posting (sq-fmx4u.4).
    #
    # [OPUS-4.8] sq-ibrze (unchanged): legs are ASSEMBLED from the per-crate fragment
    # files (`.github/feature-matrix.d/<crate>.yml`). To add a leg, edit ONLY the
    # relevant crate fragment — do NOT reintroduce a static `include:` list here.
    name: opt-in group (${{ matrix.group }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # PR-controlled build code runs in this job — never leave it the
          # persisted GITHUB_TOKEN in .git/config (PR #3511 review).
          persist-credentials: false
      - name: Rust (preinstalled stable + clippy)
        # [FABLE-5] CI-economy: the ubuntu runner image ships a rustup stable
        # toolchain (with the default profile, incl. clippy). dtolnay/rust-toolchain
        # runs `rustup toolchain install stable`, which re-downloads the whole
        # toolchain whenever the image lags the newest release. `component add` is a
        # no-op when the component is already present — never a toolchain download.
        run: |
          rustup default stable
          rustup component add clippy
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # [OPUS-4.8] sq-3sbrr — PER-CRATE cache key + save-only-on-main, unchanged
          # in strategy: rust-cache stores the DEPENDENCY build only, so keying by
          # the group's DOMINANT crate (groups are same-crate-clustered by the
          # assembler precisely so this key stays meaningful) keeps ONE dependency
          # cache per crate instead of one per leg — the demand that used to blow
          # the repo's 10 GB Actions-cache budget and LRU-evict everything. Grouping
          # REDUCES total demand further (38-ish groups vs 159 leg jobs restoring).
          # `save-if` keeps PR and ephemeral merge_group runs RESTORE-ONLY; the
          # post-merge push-to-main run seeds/refreshes the caches.
          shared-key: feature-matrix-${{ matrix.cache_crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (retry transient crates.io fetch)
        # [OPUS-4.8] sq-hhxc: transient crates.io fetch flake absorbed by a bounded
        # retry so the per-leg builds resolve from the warm cache. Fails only if
        # all 3 attempts fail (a genuine outage). No new GitHub Action dependency.
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Run the group's legs (build -> test -> clippy; results to artifact)
        # Each leg: build (bounded sq-hhxc retry) -> test (where the fragment says
        # so) -> clippy --all-targets -D warnings — the exact step set of the old
        # per-leg job. NO token here (see the job note): outcomes go to the
        # results file; the trusted default-branch reporter workflow posts the
        # check-runs (feature-matrix-report.yml, workflow_run — finding 1).
        env:
          GROUP_LEGS: ${{ matrix.legs }}
          GROUP_NAME: ${{ matrix.group }}
          FMG_RESULTS: fmg-results/results.json
        run: python3 scripts/run-feature-matrix-group.py
      - name: Upload per-leg results for the trusted reporter
        # `!cancelled()`: a group with FAILED legs must still ship its results so
        # the reporter posts the red per-leg check-runs. `overwrite: true` keeps
        # re-runs of failed jobs working (v4+ artifacts are otherwise immutable
        # within a run). The artifact name is unique per matrix entry.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-matrix-results-${{ strategy.job-index }}
          path: fmg-results/results.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # [FABLE-5] PR #3511 review, CRITICAL finding 1: the per-leg `opt-in <name>`
  # check-run reporter is NO LONGER a job in this PR-triggered workflow. It moved to
  # the separate, DEFAULT-BRANCH-owned .github/workflows/feature-matrix-report.yml,
  # triggered by `workflow_run` on this workflow's completion. Rationale: the reporter
  # is the only holder of `checks: write`, and a `checks: write` job that checks out
  # the PR head and runs the PR's copy of scripts/{assemble-feature-matrix,run-feature-
  # matrix-group}.py is the pwn-requests anti-pattern — a PR could edit either script
  # to forge `gate` or sibling check-runs. `workflow_run` always runs the default-
  # branch copy of the reporter workflow AND those scripts, isolated from PR-head
  # content; it downloads THIS run's artifacts (results + the selected-matrix +
  # metadata this workflow uploads), treats them strictly as validated DATA, validates
  # the recorded head SHA against the server-supplied workflow_run.head_sha, and posts
  # the per-leg + `feature-matrix report` summary check-runs onto the head commit.
  # See feature-matrix-report.yml for the full threat model + adversarial self-check.
  # The ALWAYS-gating coarse signal is unchanged: the opt-in-features group jobs run
  # on THIS (PR/merge_group) event, so their own conclusions are discovered directly
  # by ci-summary regardless of reporter timing (sq-fmx4u.4).

  # [SONNET-4.6] sq-ldg8c: T1 CHECK TIER — compile+clippy (NO test run) for the opt-in legs a
  # fragment has DEMOTED with `tier: check`. Design: research/feature-matrix-pyramid.md §3/§5.
  # The assembler (`--tier check`) emits ONLY the demoted legs on pull_request/merge_group;
  # on push/schedule/workflow_dispatch it emits NONE — those events run the FULL `opt-in`
  # matrix above as the per-merge backstop, so the check tier is empty there. TWO shards
  # (sparq-engine legs vs the rest) each reuse ONE target dir, so a shard's crate+dependency
  # stack compiles once across its legs (engine's per-feature-state frontend recompile is the
  # dominant cost — design §3). No `--all-targets`: a demoted leg has, by the demotion
  # criterion, no feature-gated test code, so the class-A signal is the lib/bin compile+lint.
  #
  # BEHAVIOUR-PRESERVING AT MERGE: with ZERO fragments annotated (the state this bead lands
  # in — the demotion flip is the separate bead sq-s5dvo), the assembler emits an EMPTY leg
  # set for BOTH shards, so every Rust step is skipped and the job is GREEN-EMPTY (proven by
  # scripts/tests/test_feature_matrix_assemble.py's behaviour-preservation tests). The job
  # NAME ("feature-matrix check-tier (<shard>)") is free of the words "advisory"/
  # "informational", so the single required `ci-summary / gate` aggregator auto-discovers
  # each shard as a REQUIRED check — once a leg is demoted, its compile/clippy break still
  # blocks the merge via T1 instead of its old `opt-in <name>` leg. Same assembly-time-
  # filtering mechanism as the matrix above (sq-fmx4u.4): no ci-summary edit, no ruleset
  # change. Selection is applied INSIDE the assemble step (env), never the job-level `if:`.
  check-tier:
    needs: [changes, select]
    if: needs.changes.outputs.rust_changed == 'true'
    name: feature-matrix check-tier (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [engine, rest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # [OPUS-4.8] HASH-pinned (Scorecard PinnedDependenciesID): same full-closure PyYAML
        # 6.0.2 hash set the setup job pins; --require-hashes verifies every artifact.
        run: pip install --require-hashes -r .github/requirements/docs-quality.txt
      - name: Assemble demoted (tier:check) legs for this shard
        id: legs
        # [SONNET-4.6] sq-ldg8c: --tier check emits the demoted legs for this shard, further
        # filtered by the SAME change-based selection the setup job applies (fail-closed to
        # the full set inside the assembler). GREEN-EMPTY today: legs=0 => the Rust steps
        # below all skip.
        env:
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_AFFECTED: ${{ needs.select.outputs.affected }}
        run: |
          set -euo pipefail
          CHECK="$(python3 scripts/assemble-feature-matrix.py \
            --event "${{ github.event_name }}" --tier check --shard "${{ matrix.shard }}" \
            --select-mode "${SELECT_MODE:-}" --affected "${SELECT_AFFECTED:-}")"
          echo "matrix=$CHECK" >> "$GITHUB_OUTPUT"
          N="$(echo "$CHECK" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')"
          echo "legs=$N" >> "$GITHUB_OUTPUT"
          echo "check-tier shard '${{ matrix.shard }}': $N demoted leg(s) (event ${{ github.event_name }}, select ${SELECT_MODE:-<unset>})"
      - name: Rust (preinstalled stable + clippy)
        if: steps.legs.outputs.legs != '0'
        # [FABLE-5] CI-economy: preinstalled runner-image stable (see the
        # opt-in-features note) — `component add` is a no-op when present.
        run: |
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.legs.outputs.legs != '0'
        with:
          shared-key: feature-matrix-check-tier-${{ matrix.shard }}
          # [OPUS-4.8] sq-3sbrr: restore-only off main (see the opt-in-features note).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (retry transient crates.io fetch)
        if: steps.legs.outputs.legs != '0'
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Clippy each demoted leg (shared target dir, -D warnings)
        if: steps.legs.outputs.legs != '0'
        env:
          CHECK_MATRIX: ${{ steps.legs.outputs.matrix }}
        run: |
          set -euo pipefail
          # One clippy per demoted leg, sequentially, sharing the single target dir so the
          # crate + dependency stack compiles once across the shard's legs. mapfile keeps the
          # loop in the MAIN shell so `set -e` fails the step on the first clippy error.
          mapfile -t LEGS < <(printf '%s' "$CHECK_MATRIX" | python3 -c '
          import json, sys
          for leg in json.load(sys.stdin)["include"]:
              print("{}\t{}".format(leg["crate"], leg["features"]))
          ')
          for line in "${LEGS[@]:-}"; do
            [ -z "$line" ] && continue
            crate="${line%%$'\t'*}"
            features="${line#*$'\t'}"
            echo "::group::clippy -p ${crate} --features ${features}"
            cargo clippy -p "${crate}" --features "${features}" -- -D warnings
            echo "::endgroup::"
          done

  # [GPT-5.6] sq-r1ei8: the opt-in fragment matrix can only add Cargo features,
  # so it cannot express the core tier of a default-on feature. This dedicated
  # lane gates the exact pure-Solid build: `/sparql` and the query-engine normal
  # dependencies are absent, while the feature-off LDP CRUD + WAC test remains
  # executable. The sibling fragment leg covers the explicit full-tier spelling.
  lws-core-no-sparql-endpoint:
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-lws-core"'))
    name: sparq-lws-core pure Solid (--no-default-features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Cargo build-time code runs here — no persisted token (PR #3511 review).
          persist-credentials: false
      - name: Rust (preinstalled stable + clippy)
        # [FABLE-5] CI-economy: preinstalled runner-image stable (see the
        # opt-in-features note) — `component add` is a no-op when present.
        run: |
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: feature-matrix-sparq-lws-core-no-default-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (retry transient crates.io fetch)
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Build core tier (--no-default-features)
        run: cargo build -p sparq-lws-core --no-default-features
      - name: Test core tier — route absence plus LDP CRUD and WAC
        run: cargo test -p sparq-lws-core --no-default-features
      - name: Assert endpoint-only dependencies are absent from the core tier
        run: |
          set -euo pipefail
          if cargo tree -p sparq-lws-core --no-default-features --edges normal | grep -Eq 'async-lock v|spargebra v|sparq-(core|engine) v'; then
            echo "::error::SPARQL endpoint dependency leaked into the pure Solid tier" >&2
            exit 1
          fi
      - name: Clippy core tier (--all-targets -D warnings)
        run: cargo clippy -p sparq-lws-core --no-default-features --all-targets -- -D warnings

  # [OPUS-4.8] sq-1b390: THE pure-serialiser-library build of sparq-server — i.e. the crate
  # with `--no-default-features` (the `server` async HTTP stack OFF), the contract a consumer
  # relies on when it wants only the XML/CSV/TSV/graph serialisers without dragging in
  # axum/hyper/tokio. ci.yml only ever clippies the DEFAULT (server-ON) set and the
  # opt-in-features matrix above only ADDS features, so NOTHING gated this config and it had
  # rotted: the integration-test files (`tests/{hardening,subscriptions,protocol,…}.rs`)
  # referenced the `server`-gated `sparq_server::router`/`AppState`/axum API unconditionally,
  # so `cargo clippy -p sparq-server --no-default-features --all-targets` failed on unresolved
  # imports (the bug sq-1b390 fixes by `#![cfg(feature = "server")]`-gating each server-only
  # suite). This job locks the pure-library build green: build + `clippy --all-targets -D
  # warnings` + `cargo test` of the suites that STAY compiled with the feature off (the two
  # serialiser-oracle tests). The job NAME is free of "advisory"/"informational", so the
  # required `ci-summary / gate` aggregator auto-discovers it as REQUIRED (no edit to
  # ci-summary.yml).
  server-no-default-features:
    # [FABLE-5] sq-fmx4u.3: single-crate lane (`-p sparq-server` only) — skip when
    # ENFORCED selection proves sparq-server unaffected (fail-closed guard: empty/
    # missing outputs or shadow/full mode => run).
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-server"'))
    name: sparq-server pure-serialiser (--no-default-features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Cargo build-time code runs here — no persisted token (PR #3511 review).
          persist-credentials: false
      - name: Rust (preinstalled stable + clippy)
        # [FABLE-5] CI-economy: preinstalled runner-image stable (see the
        # opt-in-features note) — `component add` is a no-op when present.
        run: |
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: feature-matrix-sparq-server-no-default-features
          # [OPUS-4.8] sq-3sbrr: restore-only off main so PR/merge_group runs don't
          # write branch-scoped caches that churn the shared 10 GB budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (retry transient crates.io fetch)
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Build (-p sparq-server --no-default-features)
        run: cargo build -p sparq-server --no-default-features
      - name: Test (-p sparq-server --no-default-features) — the still-compiled pure-serialiser suites
        run: cargo test -p sparq-server --no-default-features
      - name: Rustdoc (-p sparq-server --no-default-features, -D warnings)
        # [OPUS-5] sq-d661l: the repo-wide rustdoc gate (ci.yml) runs --all-features, where
        # an intra-doc link from an ALWAYS-compiled doc-comment to a `server`-gated item
        # RESOLVES — the break only surfaces in the async-stack-less doc build, and this lane
        # ran build/test/clippy but NOT rustdoc, so that state was unchecked and had rotted
        # (lib.rs -> health_probe::run_probe / http::harden / ServerConfig::*, redact.rs ->
        # ServerConfig::redact_logs; fixed under sq-d661l by demoting each to a code span, the
        # standing rule for cfg-gated link targets). This step locks that state, mirroring the
        # sparq-geo lane below.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p sparq-server --no-deps --no-default-features
      - name: Clippy (--no-default-features --all-targets -D warnings)
        run: cargo clippy -p sparq-server --no-default-features --all-targets -- -D warnings

  # [FABLE-5] sq-wo5jw: THE pure-geometry-library build of sparq-geo — the crate with
  # `--no-default-features` (the default-ON `engine` feature OFF): WKT/GML parsing, the
  # plain-Rust `geof` API and the R-tree GeoIndex, with no SPARQL engine in the
  # dependency graph. ci.yml exercises only the DEFAULT (engine-ON) set and the
  # opt-in-features matrix above only ADDS features, so nothing gated this config's
  # DOCTESTS — and the crate-level doc (the included README quickstart, which drives
  # `geof_registry` through `sparq_engine::query_with_functions`) failed to COMPILE
  # under --no-default-features until lib.rs feature-gated the README attachment
  # (bead sq-wo5jw; the lib/integration suites were already green there, only no lane
  # ran them). This job locks the whole engine-less state green: build + `cargo test`
  # (lib + the engine-less integration suites) + an EXPLICIT `--doc` step (so the
  # doctest target stays covered even if a later edit narrows the main test step) +
  # `clippy --all-targets -D warnings`. The job NAME is free of the words
  # "advisory"/"informational", so the single required `ci-summary / gate` aggregator
  # auto-discovers it as a REQUIRED check (no edit to ci-summary.yml).
  geo-no-default-features:
    # Single-crate lane (`-p sparq-geo` only) — skip when ENFORCED selection proves
    # sparq-geo unaffected (fail-closed guard: empty/missing outputs or shadow/full
    # mode => run), mirroring server-no-default-features above.
    needs: [changes, select]
    if: >-
      needs.changes.outputs.rust_changed == 'true' &&
      (needs.select.outputs.mode != 'selected' ||
       contains(needs.select.outputs.affected, '"sparq-geo"'))
    name: sparq-geo pure-geometry (--no-default-features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Cargo build-time code runs here — no persisted token (PR #3511 review).
          persist-credentials: false
      - name: Rust (preinstalled stable + clippy)
        # [FABLE-5] CI-economy: preinstalled runner-image stable (see the
        # opt-in-features note) — `component add` is a no-op when present.
        run: |
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: feature-matrix-sparq-geo-no-default-features
          # [OPUS-4.8] sq-3sbrr: restore-only off main so PR/merge_group runs don't
          # write branch-scoped caches that churn the shared 10 GB budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch dependencies (retry transient crates.io fetch)
        run: |
          set -euo pipefail
          n=0
          until cargo fetch --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::cargo fetch failed after $n attempts (registry outage?)" >&2
              exit 1
            fi
            echo "cargo fetch attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done
      - name: Build (-p sparq-geo --no-default-features)
        run: cargo build -p sparq-geo --no-default-features
      - name: Test (-p sparq-geo --no-default-features) — lib + the engine-less suites
        run: cargo test -p sparq-geo --no-default-features
      - name: Doctests (-p sparq-geo --no-default-features --doc) — sq-wo5jw regression lane
        run: cargo test -p sparq-geo --no-default-features --doc
      - name: Rustdoc (-p sparq-geo --no-default-features, -D warnings)
        # The repo-wide rustdoc gate runs --all-features, where an intra-doc link from
        # an always-compiled doc-comment to an `engine`-gated item RESOLVES — the break
        # only surfaces in the engine-less doc build (bit geof.rs -> registry::geof_registry,
        # fixed under sq-wo5jw by demoting to a code span). This step locks that state.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p sparq-geo --no-deps --no-default-features
      - name: Clippy (--no-default-features --all-targets -D warnings)
        run: cargo clippy -p sparq-geo --no-default-features --all-targets -- -D warnings

  # [OPUS-4.8] sq-s1uy (epic sq-dnko): THE load-bearing Phase-0 deliverable. Assert the
  # lean core (sparq-core + sparq-engine) has NO dependency edge to the OPT-IN federation
  # client sparq-fedclient — in BOTH feature states (the guard resolves --all-features, so
  # an edge added under any feature is caught). The dependency arrow points ONE WAY into
  # the engine; this job fails the merge if a future edit reverses it. The job NAME is
  # free of the words "advisory"/"informational", so the single required `ci-summary /
  # gate` aggregator auto-discovers it as a REQUIRED check (no edit to ci-summary.yml).
  fedclient-boundary:
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    name: fedclient dependency-boundary guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Cargo build-time code runs here — no persisted token (PR #3511 review).
          persist-credentials: false
      - name: Rust (preinstalled stable)
        # [FABLE-5] CI-economy: preinstalled runner-image stable (see the
        # opt-in-features note); no extra component needed here.
        run: rustup default stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: fedclient-boundary
          # [OPUS-4.8] sq-3sbrr: restore-only off main (see the opt-in-features note).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Assert sparq-core/sparq-engine have no edge to sparq-fedclient
        run: scripts/fedclient-boundary-guard.sh
