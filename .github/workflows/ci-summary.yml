# ci-summary — the SINGLE required status check for branch protection on `main`
# (bead sq-prg4). [OPUS-4.8]
#
# WHY: sparq's gates live across many workflows + jobs (ci.yml's build/test/clippy/
# conformance/SHACL/inference/coverage/wasm/MSRV, supply-chain.yml, python.yml,
# js.yml, codeql.yml, scorecard.yml, …). Requiring each by name in the branch-
# protection ruleset is brittle: every job rename or added gate breaks the rule and
# silently weakens the gate. `needs:` cannot span workflows, so we cannot aggregate
# with a normal dependency edge. Instead this workflow contributes ONE check —
# `ci-summary / gate` — that the ruleset requires; it POLLS every OTHER check-run on
# the head commit and passes iff none failed. Add/rename jobs freely; the gate adapts.
# (Pattern ported from jeswr/prod-solid-server's pr-gate.yml, incl. its stability-
# window race fix.)
#
# SEMANTICS: success / skipped / neutral are non-failing; failure / cancelled /
# timed_out / action_required / stale fail the gate. The gate EXCLUDES ITSELF (no
# self-deadlock). It waits until EVERY discovered sibling check-run is terminal
# (pending == 0) AND that all-terminal state has HELD for a short settle window,
# bounded below by a startup-race floor and above by the job timeout. This converges
# FAST once the last sibling finishes — including a `build + test` MATRIX whose shards
# register/complete at staggered times — instead of repeatedly re-waiting a long
# unchanged-name window per late arrival (the thrash @jeswr saw after the test job was
# split into shards). A stable-empty set passes (e.g. a docs-only change that triggers
# no other workflow). [OPUS-4.8]
#
# STILL-SETTLING SET ROBUSTNESS (bead sq-ipkku). [OPUS-4.8] The settle is re-armed
# ONLY by genuinely-new PENDING work (`pending > 0`), NOT by a check-run that arrives
# already TERMINAL. Earlier the settle reset on ANY change to the sibling NAME set, so
# a flurry of late-but-already-green check-runs trickling in (observed on #997: the set
# grew 81 -> 86 mid-poll while every check was terminal+green) reset the settle on each
# injection, never let it reach the window, and the loop hit its cap and emitted a
# FALSE RED — even though nothing failed. Now an already-terminal injection cannot
# starve convergence: only unfinished work (pending) holds or re-arms the gate. And
# loop-budget exhaustion with everything terminal renders the REAL verdict on the full
# terminal set rather than blind-failing; a genuine hang is the only timeout RED.
#
# ADAPTIVE SATURATION BUDGET (bead sq-90cv4). [FABLE-5] This gate is a WAITER that
# occupies a runner slot while polling. Under org-pool saturation (many PRs → many
# concurrent gates), the waiters starve the very builds they wait on, the base budget
# expires with siblings still QUEUED, and the old unconditional timeout-RED emitted a
# FALSE gate=FAILURE on PRs whose real legs were green/pending (the 2026-07-02
# congestion collapse). Runner saturation is a THROUGHPUT signal, not a hang — so at
# base-budget exhaustion with work still pending, the loop now extends its wait (at a
# slower poll cadence) ONLY while the repo's Actions queue is deep or sibling
# completions are still landing, up to a hard absolute cap; an idle-queue/no-progress
# pending set still REDs immediately (genuine hang), and every verdict — including
# after an extension — is rendered by the SAME all-terminal gating semantics, so a
# real failure can never become a pass and the wait can never be infinite. The
# queue-depth signal needs `actions: read` (read-only) on the token. The deeper fix
# (moving the waiter OFF the build-runner slot entirely) is a design-record follow-up.
#
# ADVISORY/INFORMATIONAL checks are NON-GATING (bead sq-wjth). [OPUS-4.8] A check
# whose NAME contains the WHOLE WORD "advisory" or "informational" (case-insensitive,
# `\b(advisory|informational)\b`) is excluded from the gating set entirely — its
# conclusion (even `failure`) can never fail the gate. This is a rule, not a hard-
# coded name list, so it adapts as advisory jobs are added/renamed. The word-boundary
# match excludes the standalone words (incl. hyphen-/paren-/comma-delimited) but NOT a
# word that merely contains them as a substring — notably "cargo-deny (advisories, …)"
# (plural) is REQUIRED and is NOT excluded. It currently covers, by name:
#   • "unsafe report (cargo-geiger, informational)"   (ci.yml `geiger`)
#   • "markdownlint-advisory (whole repo)"            (docs-quality.yml)
#   • "external-links (lychee online, advisory)"      (docs-quality.yml)
#   • "vale (prose, advisory)"                        (docs-quality.yml)
# ([OPUS-4.8] sq-8ic6: "readme-template (template, advisory)" was PROMOTED to the HARD
#  gate "readme-template (template)" — no advisory token, so it now GATES — once the
#  sq-9jw5 README-overhaul backlog cleared and sq-ixsf tightened the stub classifier.)
# REQUIRED checks (gate / build+test / clippy / coverage / the conformance + perf
# ratchets / wasm / MSRV / supply-chain / …) do NOT contain those words, so they
# still gate normally. Rationale: an advisory job that concludes `failure` (e.g.
# cargo-geiger erroring on the virtual workspace manifest) must never block a merge —
# the step-level `continue-on-error`/`|| true` in those jobs is a best-effort first
# line, and THIS name-rule is the load-bearing backstop that makes advisory failures
# strictly non-gating regardless of how the job concludes.
#
# CHANGE-BASED TEST-SELECTION semantics (bead sq-fmx4u.3). [FABLE-5] The wide
# per-crate lanes in ci.yml / feature-matrix.yml may now be SKIPPED (or, for the
# cross-crate bulk shards, narrowed) when the `select (change-based test
# selection)` pre-job (.github/workflows/ci-select.yml, reused by both workflows)
# proves their crate outside the affected closure. The gate's rule (design §5.3):
# a `skipped` conclusion is satisfied ONLY when every selection check-run on the
# commit concluded SUCCESS — a present-but-not-success select REDs the gate
# outright even if all other siblings are green, because the thing that decided
# the skips was never soundly observed. With select green (or absent — a
# pre-selection sibling set), `skipped` stays non-failing exactly as before, and
# a job that FAILED still fails the gate regardless (selection can never mask a
# real failure). [FABLE-5] sq-fmx4u.5: selection is now ENFORCED by default (the
# shadow rollout is flipped) — a not-affected crate's lane reports `skipped`, which
# the rule above counts as satisfied only under a successful select. This is safe
# because the ruleset requires exactly one check (this `gate`); no per-leg name is
# individually required, so a plain-skipped leg can never hang the merge queue
# (verified in bead sq-fmx4u.4). The `ci-full` PR label + the nightly cron full run
# are the permanent backstops; CI_SELECT_MODE=shadow is the report-only rollback.
#
# DRAFT-TIER CI (docs/branch-protection.md §Draft-tier CI). [FABLE-5] Draft PR
# heads run a REDUCED sibling set (coverage / bench / CodeQL / heavy shards /
# wasm-equality skipped; the crate legs stay change-scoped by ci-select) so the
# review-fix churn of many concurrent draft worker PRs stops saturating the runner
# pool. THE INVARIANT — a draft-tier gate result must NEVER admit a PR to the merge
# queue — is STRUCTURAL: the gate job's own check-run NAME is tiered. On a draft
# pull_request payload the job below is named `gate, draft-tier`, NOT `gate`, so a
# draft-tier run never produces the required `gate` context at all and the
# ruleset's required_status_checks entry ({context: "gate"}) is unsatisfiable by
# draft-tier results. From the un-draft moment until the full-tier run's fresh
# `gate` concludes, the required context is simply ABSENT — which branch protection
# treats as blocking — so there is no supersession window to race: GitHub event
# latency, a dropped ready_for_review event, or an Actions outage all leave the PR
# blocked, never admitted (`gh pr ready && gh pr merge --auto` arms and waits).
# scripts/ci_summary_gate.py adds defense-in-depth on top: each run knows its own
# tier from the trigger payload (PR_DRAFT below); a draft-tier run re-checks the
# PR's CURRENT draft state via the API before any SUCCESS (un-drafted => FAILURE,
# "stale draft-tier run, full run pending"); a full-tier pull_request run refuses
# to conclude while ANY draft-tier-marked ci-select INSTANCE lacks its own later
# full-tier successor (per-instance — ci/bench/feature-matrix/fuzz all expose the
# identical select check-run name); and stale `gate, draft-tier` check-runs are
# excluded from every sibling set as tier artifacts. `ready_for_review` below
# re-runs this gate (and every tiered sibling workflow) at the un-draft moment,
# producing the first (and only) `gate` check-run on the head SHA. merge_group
# behaviour is untouched (always full tier, on a fresh ref).
#
# IMPLEMENTATION (sq-90cv4). [FABLE-5] The poll loop + verdict live in
# scripts/ci_summary_gate.py (extracted from the previous inline bash so the
# semantics are UNIT-TESTED — scripts/tests/test_ci_summary_gate.py, run as a HARD
# step in docs-quality.yml's `ci-scripts` job). This file keeps the doctrine; the
# script keeps the mechanics.
name: ci-summary

on:
  # [FABLE-5] Draft-tier CI: the default types PLUS ready_for_review — without it
  # the un-draft moment would run NOTHING and the head would keep its draft-tier
  # gate result (the exact stale-green the integrity invariant forbids).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # [OPUS-4.8] Merge queue: GitHub runs the required check(s) on a temporary
  # `merge_group` ref before merging. ci-summary is the SINGLE required check, so it
  # MUST run here to produce the `ci-summary / gate` check on that ref — and every
  # sibling workflow it aggregates (ci/bench/codeql/docs-quality/supply-chain) also
  # triggers on merge_group, so the discovery below finds the identical check-set it
  # finds on a PR. Without this the queue would hang forever waiting for the check.
  merge_group:
  push:
    branches: [main]

# Read-only: the gate READS check-runs + commit statuses for the head commit, plus
# the repo's queued workflow-run count (`actions: read` — the sq-90cv4 saturation
# signal; a permissions failure there degrades to the progress-only signal, it never
# fails the gate by itself), plus the PR's live draft state (`pull-requests: read`
# — the draft-tier conclusion-time re-check; a failure there fail-closes to RED,
# never to a pass).
permissions:
  checks: read
  statuses: read
  contents: read
  actions: read
  pull-requests: read

# One in-flight gate per PR (or per branch on push). Cancel a superseded run so a
# new push doesn't leave a stale, slowly-timing-out gate behind.
concurrency:
  group: ci-summary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # [FABLE-5] Draft-tier CI: the check-run name is TIERED (the same marker
    # expression ci-select.yml uses). A draft pull_request payload renders
    # `gate, draft-tier`; every other event/state (non-draft PR, merge_group,
    # push) renders EXACTLY `gate` — the branch-protection ruleset's required
    # context, which a draft-tier run therefore can never satisfy (the
    # structural half of the integrity invariant above). Pinned by
    # scripts/tests/test_ci_select_wiring.py::TestRequiredCheckAnchor.
    name: gate${{ github.event.pull_request.draft == true && ', draft-tier' || '' }}
    runs-on: ubuntu-latest
    # > the loop's ABSOLUTE budget: ~37 min base (unchanged from the pre-sq-90cv4
    # cap) + up to ~30 min of saturation extension + API overhead. The loop caps
    # itself under this wall-clock so it emits a clear timeout error first. In the
    # normal (unsaturated) case the gate converges exactly as fast as before —
    # the extension only ever activates at base-budget exhaustion under a
    # saturated/progressing queue.
    timeout-minutes: 80
    steps:
      # Sparse checkout of ONLY the gate script: the gate needs no sources. (No
      # partial-clone filter is configured — this is sparse checkout only, not a
      # blobless clone.) Same trust model as before — on pull_request the workflow
      # file itself already comes from the merge ref, so scripting from the same ref
      # does not widen anything. [FABLE-5] [SONNET-4.6]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_summary_gate.py
          sparse-checkout-cone-mode: false
      - name: Wait for all other checks, then aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # On pull_request the head commit is the PR head; on push AND on merge_group
          # it's github.sha (the merge_group ref's commit) — github.event.pull_request
          # is undefined there, so the fallback selects the right SHA automatically and
          # the check-run discovery reads the merge_group commit's siblings. [OPUS-4.8]
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # This workflow RUN's id — unique to THIS gate run. Every check-run's
          # details_url embeds the run id of the workflow run that produced it
          # (…/actions/runs/<RUN_ID>/job/<JOB_ID>), so we self-exclude by exact
          # run id rather than by the job NAME. A name match ("gate") is fragile:
          # it would also drop any FUTURE sibling job literally named `gate` in any
          # workflow, undermining the "add/rename jobs freely" goal. The run id is
          # ours alone, so the exclusion is exact and collision-proof (anchored to
          # "/runs/<id>(/|$)" in the script). [OPUS-4.8]
          SELF_RUN_ID: ${{ github.run_id }}
          # [FABLE-5] Draft-tier CI: the tier THIS run evaluates is decided by its
          # own trigger payload — pull_request + draft == true => draft tier. The
          # script re-checks the PR's LIVE draft state (PR_NUMBER) at conclusion
          # time and refuses a draft-tier success on a now-ready PR ("stale
          # draft-tier run, full run pending"). All three are empty off the PR
          # path (push/merge_group), which the script reads as full tier.
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci_summary_gate.py
