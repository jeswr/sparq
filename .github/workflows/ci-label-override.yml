# [GPT-5.6] #5215 — one server-side router for the three explicit CI override
# labels. The review pipeline also changes review:*, status:*, trust-surface and
# area:* labels. Letting each heavy workflow subscribe to every label event made
# those ordinary transitions instantiate four unconditional selector jobs (and
# vectorized-feature-off's two real jobs) on an unchanged head.
#
# A reusable-workflow call is a job, so GitHub evaluates each `if:` before asking
# for a runner. Ordinary label events therefore create only terminal skipped
# metadata: zero selector jobs and zero runner claims. The three override labels
# retain their exact semantics, including removal: the called workflows inherit
# this pull_request payload, so `unlabeled` re-evaluates the current label set.
name: ci-label-override

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.label.name == 'ci-full'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  feature-matrix:
    if: github.event.label.name == 'ci-full'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/feature-matrix.yml

  bench:
    if: contains(fromJSON('["ci-full","bench-full"]'), github.event.label.name)
    permissions:
      contents: write
      deployments: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/bench.yml

  fuzz:
    if: contains(fromJSON('["ci-full","fuzz-full"]'), github.event.label.name)
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/fuzz.yml

  vectorized-feature-off:
    if: github.event.label.name == 'ci-full'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/vectorized-feature-off.yml
