# GitHub Release pipeline (T20): tag `vX.Y.Z` -> build, package, checksum, release, docker.
#
# [OPUS-4.8] sq-v286.2: the per-hardware-tier build matrix is no longer inlined here. It is
# defined ONCE in the reusable workflow `build-matrix.yml` and invoked below with
# `mode: archive` (the `package` job is a `workflow_call`). release.yml remains THE entry point
# for cutting a release (it fires on a `v*` tag and is the path the release-plz tag flow will
# drive — research/release-ci-design.md §6 item 4); dist.yml is now dispatch-only and calls the
# same reusable matrix with `mode: binary`. This ends the hand-synced double-matrix +
# double-build the design record flags (§5 "Reuse, do not duplicate"; §6 item 2 "Unify the
# duplicated build matrix via workflow_call; drop dist.yml's tags trigger").
#
# Release artifacts keep their distinct shape vs dist's bare binaries: versioned archives
# (tar.gz / zip) containing the binary + README + LICENSE + CHANGELOG, plus a SHA256SUMS
# manifest — produced by the reusable workflow's `archive` mode + the `release` job below.
#
# Triggers: version tags only. NO schedule, NO pull_request — releasing is a deliberate act.
name: release

on:
  push:
    tags: ["v*"]

# Default: read-only. Jobs that need more (release: contents, docker: packages) opt in below.
permissions:
  contents: read

jobs:
  # ---- 1. build + package per hardware tier ----
  # [OPUS-4.8] sq-v286.2: invoke the shared reusable matrix in `archive` mode. The 10-tier
  # runner-label matrix + build steps + the sq-zqq6 SLSA archive attestation all live in
  # build-matrix.yml now (single source of truth); this caller only selects the artifact shape.
  # The reusable workflow's matrix job attests + uploads `pkg-<tier>`; the `release` job below
  # consumes those artifacts. `permissions:` here is the ceiling passed down to the called
  # workflow — it must grant the OIDC + attestation writes the attestation step needs.
  package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-matrix.yml
    with:
      mode: archive

  # ---- 1b. per-release CycloneDX SBOM + VEX ----
  # [OPUS-4.8] sq-toze.3 (GX-2): emit a CycloneDX SBOM for each released binary plus a VEX
  # (the checked-in supply-chain/vex.cdx.json, version-stamped) justifying the advisories
  # cargo-deny is configured to ignore. Both are uploaded as an artifact for the `release`
  # job to attach to the GitHub Release, and SLSA-attested here (binding their digests to
  # this workflow run; verifiable with `gh attestation verify`).
  sbom:
    name: CycloneDX SBOM + VEX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        with:
          tool: cargo-cyclonedx
      # [OPUS-4.8] sq-toze.27 (GS-3): Node for the JS/npm SBOM of the published WASM client.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Generate per-release SBOM + VEX
        run: scripts/gen-sbom-vex.sh
      # [OPUS-4.8] sq-toze.27 (GS-3): per-release CycloneDX SBOM for the published npm
      # client (`js/` = @jeswr/sparq). Writes sbom/sparq-js-<ver>.sbom.cdx.json (runtime
      # tree) + sbom/sparq-js-dev-<ver>.sbom.cdx.json (full build tree) into the same
      # sbom/ dir, so they are attested + attached + checksummed alongside the Rust SBOMs.
      - name: Generate per-release JS/npm SBOM (published WASM client)
        run: scripts/gen-js-sbom.sh
      - name: Attest build provenance (SBOM + VEX)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            sbom/*.sbom.cdx.json
            sbom/*.vex.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-vex
          path: sbom/*.json
          if-no-files-found: error

  # ---- 2. checksums + GitHub Release ----
  release:
    name: create GitHub Release
    needs: [package, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets — the only write this pipeline needs
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-*
          path: assets
          merge-multiple: true
      # [OPUS-4.8] sq-toze.3 (GX-2): pull the SBOM + VEX in alongside the archives so they
      # are covered by SHA256SUMS and attached to the release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-vex
          path: assets
      - name: Generate SHA256SUMS
        run: cd assets && sha256sum -- * > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: assets/*
          generate_release_notes: true
          # CHANGELOG.md is the curated source of truth; point readers at it.
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the curated changelog.

            `SHA256SUMS` covers every attached archive plus the CycloneDX SBOM + VEX: `shasum -a 256 -c SHA256SUMS`.

            **Supply chain:** each release carries a CycloneDX SBOM per binary (`*-${{ github.ref_name }}.sbom.cdx.json`), a CycloneDX SBOM for the published npm/WASM client (`sparq-js-${{ github.ref_name }}.sbom.cdx.json` runtime tree + `sparq-js-dev-${{ github.ref_name }}.sbom.cdx.json` full build tree), and a VEX (`sparq-${{ github.ref_name }}.vex.cdx.json`) stating the exploitability of every advisory the dependency policy ignores. All artifacts (archives, SBOMs, VEX) are SLSA build-provenance attested — verify with `gh attestation verify <file> --repo ${{ github.repository }}`.
          fail_on_unmatched_files: true

  # ---- 3. server container -> ghcr.io ----
  # Pushes ghcr.io/<owner>/sparq-server using the workflow's own GITHUB_TOKEN — ghcr needs no
  # extra secrets. This workflow only runs on tags, so every run pushes; a maintainer who does
  # not want container publishing can delete this job (or add `if: false`) without affecting
  # the binaries/release jobs above.
  docker:
    name: build + push container (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
      # [OPUS-4.8] sq-zqq6: buildkit attaches SLSA provenance + an SBOM to the
      # pushed image; the OIDC token is what signs the provenance attestation.
      id-token: write
      attestations: write
      # [OPUS-4.8] sq-p9xq: upload the released image's Trivy SARIF to the
      # code-scanning dashboard (Security tab) so a vuln in the published artifact
      # is visible there, not just in the run log.
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels from the git tag)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sparq-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # [OPUS-4.8] sq-n6rv: SMOKE BEFORE PUSH. Build the image locally first, `docker run`
      # it, and prove it serves /health + a query — so a container that exits immediately on
      # boot (the sq-n6rv regression) can never reach ghcr.io. The build is cached to GHA, so
      # the subsequent push step is a cache hit (it does not rebuild from scratch).
      - name: Build image for smoke test (load locally)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: sparq-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (docker run + /health + ASK query)
        run: scripts/docker-smoke.sh sparq-server:smoke 3030
      # [OPUS-4.8] sq-p9xq: SCAN BEFORE PUSH. cargo-deny gates the Rust dependency tree, but
      # the distroless base layer (glibc / libgcc / CA certs) is outside that scope — a CVE
      # disclosed there would ship in the released image unscanned. Trivy scans the exact
      # `sparq-server:smoke` artifact built above (same bytes that get pushed) for OS-package
      # AND library vulns, and FAILS the release on a FIXABLE HIGH/CRITICAL so a vulnerable
      # image never reaches ghcr.io. `container-scan.yml` runs the same scan on PRs/main/weekly
      # against the Dockerfile; this is the release-gate copy that scans the published bytes.
      #   exit-code: 1   => fail the step (and the release) on a non-ignored match.
      #   ignore-unfixed => only FIXABLE vulns gate; a CVE with no upstream fix yet cannot
      #                     block a release (it is still surfaced in the SARIF pass below).
      #   trivyignores   => the shared .trivyignore allowlist for triaged/accepted CVEs.
      - name: Trivy scan released image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparq-server:smoke
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore
      # Second pass: SARIF for the code-scanning dashboard. exit-code 0 (the gating decision
      # is the table pass above) and includes unfixed findings so the Security tab shows the
      # full picture of the released image for triage.
      - name: Trivy scan released image (SARIF for code-scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparq-server:smoke
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore
      - name: Upload Trivy SARIF to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # [OPUS-4.8] sq-zqq6: max-mode SLSA provenance + an embedded SBOM,
          # attached to the image in ghcr.io (verifiable via cosign / gh).
          provenance: mode=max
          sbom: true
