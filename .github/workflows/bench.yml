name: Benchmarks

# Cross-commit performance tracking (roadmap G2). On every push to main, run the engine over a
# synthetic dataset, emit per-subsystem latencies, and store them with github-action-benchmark so
# the trend is graphed across commits and a large regression raises an alert/comment. Runs on free
# GitHub-hosted runners (no EC2 → no cost). Heavy/long benches that need real hardware are in the
# separate cost-capped bench-ec2.yml (G3).
#
# [OPUS-4.8] Also runs on pull_request so contributors get perf feedback BEFORE merge — but PRs only
# COMPUTE + COMMENT (auto-push gated to main below), so they compare against the published series
# WITHOUT polluting it. The history branch (benchmark-data) is also the source for a public GitHub
# Pages dashboard:
#
#   PUBLIC DASHBOARD — REPO-OWNER TOGGLE REQUIRED (one-time, can't be set from a workflow):
#   Settings → Pages → "Build and deployment" → Source = "Deploy from a branch",
#   Branch = `benchmark-data` / `/ (root)` → Save. The chart then renders at
#   https://sparq.jeswr.org/dev/bench (the action writes index.html + data.js under dev/bench
#   on the benchmark-data branch — see gh-pages-branch + benchmark-data-dir-path below). No new
#   branch is created; Pages just serves the existing benchmark-data branch.
on:
  push:
    branches: [main]
    # [OPUS-4.8] ANTI-LOOP: the auto-ratchet step below commits bench/perf-baseline.json back to main.
    # paths-ignore stops that floor-only commit from re-triggering this workflow (belt; the [skip ci]
    # in the commit message is the suspenders). A real perf change always touches code/scripts too, so
    # ignoring the baseline path alone never masks a genuine bench-worthy push.
    paths-ignore:
      - 'bench/perf-baseline.json'
  # [SONNET-4.6] sq-mel85 (design §5.2, phase 2b): react to labeled/unlabeled too so
  # toggling the `ci-full` label re-evaluates the change-based selection for the bench
  # lane (ci-select.yml maps the label to `--full`, which forces the perf gate to run).
  # The default types (opened/synchronize/reopened) are listed explicitly so adding the
  # label events does NOT drop `synchronize` (the push-to-PR trigger).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # [OPUS-4.8] Merge queue: the perf gate must run on the queue's merge_group ref so
  # the required ci-summary aggregates the benchmark check. The auto-push / baseline-
  # commit / benchmark-data steps are all gated on push-to-main (see the step guards)
  # — on merge_group github.ref is refs/heads/gh-readonly-queue/main/…, so (exactly as
  # on a PR) they SKIP and only the perf gate computes + enforces the floor.
  merge_group:
  workflow_dispatch:
  # [SONNET-4.6] sq-mel85 (design §6.1): the nightly FULL-RUN BACKSTOP for change-based
  # selection. bench.yml previously had NO schedule trigger, so a PR that selection-
  # skipped the bench lane (its closure provably unaffected) had no regular full-matrix
  # re-run to catch a latent regression other than the next push-to-main. A `schedule`
  # event carries no PR diff, so ci_select.py returns mode=full and the `bench` job's
  # `mode != 'selected'` disjunct RUNS the whole suite + the hard perf gate. This run is
  # a PURE VERIFICATION backstop: the auto-ratchet + benchmark-data history steps are
  # gated on `github.event_name == 'push'` (see below), so a nightly run NEVER commits
  # the floor or pushes a duplicate history point — the "one entry per commit" trend and
  # the source-of-record ratchet stay continuous on the push-to-main path alone.
  # 05:29 UTC — offset from ci.yml (03:17) + fuzz.yml (04:23) so the three nightly heavy
  # lanes do not contend for the same runner window.
  schedule:
    - cron: "29 5 * * *"

# [OPUS-4.8] Least-privilege default (Scorecard TokenPermissions): top-level is read-only
# so the dashboard-labels job (and any future read-only job) inherits no write scope. The
# writes the benchmark job needs (push to benchmark-data, deployment status, PR comment) are
# scoped to the `bench` job below.
permissions:
  contents: read

# Do NOT cancel an in-progress benchmark run (it would corrupt the stored series).
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # [SONNET-4.6] sq-mel85 (design §5.2, phase 2b): the change-based test-selection
  # pre-job (the reusable .github/workflows/ci-select.yml — doctrine there). The
  # `bench` job below guards on its benchmarked-crate closure so a PR that touches
  # neither the benchmarked crates NOR their reverse-dependency closure skips the
  # (release build + full bench suite + perf gate) run entirely. UNCONDITIONAL (no
  # needs/if): the ci-summary gate REQUIRES every "change-based test selection"
  # check-run to conclude success before any skipped sibling counts as satisfied, so
  # this job must exist + be green on every trigger (design §5.3). Fail-closed:
  # ci_select.py returns mode=full for every §4.1 trigger (shared crate / build file /
  # .github/** / Cargo.lock / selector-self change) and for ANY internal error, and an
  # empty/missing output satisfies the guard's `mode != 'selected'` first disjunct =>
  # the bench lane RUNS. On push-to-main + schedule (the full backstop) the event
  # carries no PR diff => mode=full => the bench lane runs the whole suite.
  select:
    name: select
    uses: ./.github/workflows/ci-select.yml
    permissions:
      contents: read

  # [OPUS-4.8] sq-ocuf: fast, dependency-light gate for the dashboard's readable labels. Runs on
  # PRs + main (no rust/wasm build) so a query added/renamed without regenerating metric-labels.json
  # fails BEFORE merge: validates the JSON, runs the generator's --check drift gate, syntax-checks
  # dashboard.js, and runs the node smoke test (scripts/dashboard-smoke.js).
  dashboard-labels:
    name: dashboard labels (lint + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Validate metric-labels.json
        run: python3 -c "import json; json.load(open('bench/dashboard/metric-labels.json')); print('metric-labels.json is valid JSON')"
      - name: Drift gate (regenerate + diff)
        run: python3 scripts/gen-metric-labels.py --check
      - name: Syntax-check dashboard.js
        run: node --check bench/dashboard/dashboard.js
      - name: Dashboard smoke test
        run: node scripts/dashboard-smoke.js

  bench:
    name: run + track benchmarks
    # [SONNET-4.6] sq-mel85 (design §5.2, phase 2b): scope the perf gate by the
    # benchmarked-crate closure. Seeds (single source of truth: `_LANE_SEEDS["bench"]`
    # in scripts/ci_select.py, pinned by scripts/tests/test_ci_select_wiring.py):
    # sparq-engine (headline benchmarked crate) + the release binaries this job builds
    # (sparq-cli + sparq-bench, which depend on sparq-core, so a core change — whose
    # store/dict/parse byte metrics are HARD-GATED — lands in the affected reverse
    # closure) + sparq-wasm (the wasm_bundle_bytes floor, enforced ONLY here; a wasm-
    # only diff does not flow up into engine/cli/bench, so sparq-wasm is a DIRECT seed).
    # Non-matrix job => the job-level `if:` can read needs.select.outputs (unlike the
    # ci.yml per-shard case, which must guard in a step). FAIL-CLOSED: the leading
    # `mode != 'selected'` disjunct means an empty/missing selection output RUNS the
    # lane; a selection-skipped job reports conclusion `skipped` (= satisfied) to the
    # ci-summary gate — no per-leg name is individually required (bead sq-fmx4u.4).
    # CRITICAL (design §6.1 continuity): push-to-main + schedule are NOT pull_request/
    # merge_group events, so ci_select.py returns mode=full and this disjunct is TRUE =>
    # the FULL suite runs on every main commit + on the nightly backstop. Selection can
    # ONLY narrow on pull_request / merge_group. That is what keeps the auto-ratchet
    # floor + benchmark-data history (both depend on every main commit being benchmarked)
    # continuous — see the push-gated history/ratchet steps below.
    needs: select
    if: >-
      needs.select.outputs.mode != 'selected' ||
      contains(needs.select.outputs.affected, '"sparq-engine"') ||
      contains(needs.select.outputs.affected, '"sparq-cli"') ||
      contains(needs.select.outputs.affected, '"sparq-bench"') ||
      contains(needs.select.outputs.affected, '"sparq-wasm"')
    runs-on: ubuntu-latest
    # [OPUS-4.8] Job-scoped writes (least privilege; the rest of the workflow stays read-only):
    #   contents: write     — auto-ratchet commits bench/perf-baseline.json back to main and
    #                         github-action-benchmark pushes the point to the benchmark-data branch
    #   deployments: write  — github-action-benchmark records a GitHub deployment status
    #   pull-requests: write— comment-always posts the comparison table on (same-repo) PRs;
    #                         fork PRs get a read-only token, so the action skips the comment.
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown   # enables the wasm bundle-size metric in ci-bench.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # [OPUS-4.8] (sq-7d3dj.14) binaryen (wasm-opt) — installed unconditionally so the
      # TREND-ONLY wasm_opt_bundle_bytes metric runs on BOTH PR and main tiers. ci-bench.sh
      # guards on `command -v wasm-opt` so the step is a no-op skip when absent. The version
      # is logged per CI run (see ci-bench.sh wasm_opt_bundle_bytes block).
      - name: Install binaryen (wasm-opt for shipped-size trend metric)
        run: sudo apt-get update -q && sudo apt-get install -y binaryen
      # [OPUS-4.8] Well-known-suite toolchains (sp2b/dbpsb/watdiv/bsbm/lubm), MAIN ONLY. On push to
      # main the full well-known-suite set runs; on PRs we DELIBERATELY do NOT install these, so the
      # ci-bench.sh suite hooks SKIP gracefully (each is guarded on `command -v <tool>`) and PR perf
      # feedback stays lean (synthetic + operator + memory/bundle metrics only). The full SF/scale
      # tiers are EC2/nightly (beads sq-uubq/xin1/8lgn/yc1q/z31u), NOT here.
      #   g++ is preinstalled on ubuntu-latest (watdiv). default-jre = java (bsbm) + JRE for lubm's
      #   javac comes from default-jdk... but default-jre has NO javac, so install default-jdk for
      #   lubm's `javac` guard; libboost-all-dev = watdiv's Boost; raptor2-utils = lubm's `rapper`;
      #   unzip = bsbm's distribution unpack.
      - name: Install well-known-suite toolchains (main only)
        if: github.ref == 'refs/heads/main'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev default-jdk raptor2-utils unzip
      # [OPUS-4.8] Per-suite generator-cache restore/save so the steady state does NO rebuild/refetch:
      # each suite's gen.sh/fetch.sh/run.sh build-once-and-cache their generator binary + the fixed
      # corpus under /tmp/<suite> (sp2b/watdiv/bsbm/lubm) or the pinned slice (/tmp/dbpsb). Keyed on the
      # generator scripts so a generator/pinning change busts the cache. PRs skip the toolchain install
      # above, so a cache miss on a PR is harmless (the hook skips); on main it just rebuilds once.
      - name: Cache sp2b generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/sp2b
          key: bench-sp2b-${{ runner.os }}-${{ hashFiles('bench/sp2b/gen.sh') }}
      - name: Cache watdiv generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/watdiv
          key: bench-watdiv-${{ runner.os }}-${{ hashFiles('bench/watdiv/gen.sh', 'bench/watdiv/files/words.txt') }}
      - name: Cache bsbm generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bsbm
          key: bench-bsbm-${{ runner.os }}-${{ hashFiles('bench/bsbm/gen.sh') }}
      - name: Cache lubm generator + corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/lubm
          key: bench-lubm-${{ runner.os }}-${{ hashFiles('bench/lubm/gen.sh') }}
      - name: Cache dbpsb pinned slice + cut
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dbpsb
          key: bench-dbpsb-${{ runner.os }}-${{ hashFiles('bench/dbpsb/fetch.sh') }}
      - name: Build release binaries
        run: cargo build --release -p sparq-cli -p sparq-bench
      - name: Run benchmarks
        run: bash scripts/ci-bench.sh 200000 bench-results.json
      # [OPUS-4.8] HARD regression RATCHET on the gated metrics (store/dict bytes-per-{triple,term},
      # store_bytes_per_triple_small, wasm_bundle_bytes = DETERMINISTIC byte counts; parse_ns_per_byte =
      # TIMING, made noise-robust via best-of-N re-measure — see the Hard gate step below).
      # github-action-benchmark's fail-on-alert is a single GLOBAL switch that would also trip on the noisy
      # wall-clock latencies, so it stays false (alert-comment only, below). This step is the TRUE gate.
      #
      # sq-52e: the gate now compares each metric against its COMMITTED best-ever FLOOR in
      # bench/perf-baseline.json (the source-of-record ratchet, reviewed in diffs like the conformance
      # RATCHET in ci.yml) — NOT the drifting previous point. A sub-threshold creep every commit therefore
      # can no longer slow-drift unbounded past the floor ("boiling frog"): each creep is measured against
      # the FIXED floor and trips once cumulative drift exceeds the band. See scripts/perf-gate.py header.
      #
      # Runs on push-to-main AND on PRs (PRs gate against the same committed floor — pre-merge feedback,
      # zero pollution since the baseline auto-update + benchmark-data push are main-only). DELIBERATE
      # increases (e.g. a wasm bump from a new feature): EITHER edit bench/perf-baseline.json to raise the
      # floor in the reviewed PR, OR set the workflow var PERF_GATE_ALLOW (e.g. 'wasm_bundle_bytes') — the
      # allowed metric passes AND is re-floored to the new value by the auto-ratchet step below.
      - name: Unit-test the hard-gate ratchet logic
        # Cheap (no build): asserts perf-gate.py fails on a real regression, on cumulative SLOW DRIFT
        # against the best-ever floor (the sq-52e adversarial test), and passes on noise / improvement /
        # missing-floor / deliberate-allow — and that improvements ratchet the floor DOWN while a one-off
        # noise-low does NOT. Catches a future edit that breaks the gate before it can silently let a
        # regression through. [OPUS-4.8]
        run: python3 scripts/perf-gate.py --self-test
      - name: Fetch previous benchmark series (for the noise-metric sustained-improvement check)
        id: prev_series
        # The committed floor lives in bench/perf-baseline.json (in this checkout) — the gate needs no
        # network. We still fetch data.js so the auto-ratchet step can damp the NOISE metric's floor with
        # the median of recent published points (never a one-off noise-low). Missing branch => skipped.
        run: |
          set -euo pipefail
          if git fetch --depth=20 origin benchmark-data 2>/dev/null; then
            git show FETCH_HEAD:dev/bench/data.js > prev-data.js 2>/dev/null \
              && echo "fetched previous benchmark-data/dev/bench/data.js" \
              || echo "benchmark-data branch has no dev/bench/data.js yet."
          else
            echo "benchmark-data branch not present yet (first run)."
          fi
      # [OPUS-4.8] (sq-dzfu) The DETERMINISTIC byte-count metrics are hard-gated strictly. The TIMING
      # metric (parse_ns_per_byte) is made robust to GitHub-runner noise via BEST-OF-N re-measure: if it
      # trips the band, the gate re-runs the CHEAP `ci-bench.sh --parse-only` path (no wasm build, no big
      # corpus, no well-known suites — ~sub-second using the binaries already built above) up to K times
      # and keeps the BEST (min) reading, only FAILING if the best of N still exceeds the band. Runner
      # noise only ever inflates a wall-clock reading, so a one-off spike is squeezed out while a real
      # parse regression (slow on EVERY reading) still fails. Mirrors PR #62's coverage re-measure fix.
      - name: Hard gate — perf regression (deterministic strict; timing best-of-N robust)
        env:
          # Deliberate-bump escape hatch: comma-separated metric names allowed to regress THIS run.
          # Leave empty normally; set to e.g. 'wasm_bundle_bytes' on a commit/run that intentionally
          # grows the bundle. The allowed metric passes here AND is re-floored by the auto-ratchet step.
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
        run: |
          python3 scripts/perf-gate.py bench-results.json bench/perf-baseline.json \
            --remeasure-cmd 'bash scripts/ci-bench.sh --parse-only /tmp/perf-remeasure.json >/dev/null 2>&1 && cat /tmp/perf-remeasure.json' \
            --remeasure-k 4
      # [OPUS-4.8] AUTO-RATCHET-DOWN (sq-52e): on push to main, AFTER the gate passes, lower any floor a
      # genuine improvement beat (auto metrics: current < floor; noise metric: only on a SUSTAINED
      # improvement — the median of recent published points below the floor, never a one-off noise-low),
      # and re-floor any PERF_GATE_ALLOW metric to its new value. If bench/perf-baseline.json changed,
      # commit it BACK to main so the floor (the source-of-record ratchet) only ever TIGHTENS automatically.
      #   ANTI-LOOP (two independent guards): (1) the commit message carries [skip ci]; (2) this workflow's
      #   on.push.paths-ignore excludes bench/perf-baseline.json, so a floor-only commit can't re-trigger it.
      # main only — PRs (esp. forks) get a read-only token and must never write to main. exit 3 = no change.
      #
      # [OPUS-4.8] FAIL-SOFT + FETCH-REBASE the commit-back (sq-llxc; sibling of sq-roe3 / PR #856). The
      # default GITHUB_TOKEN CANNOT push to protected `main`: this `push:main` run's HEAD is already
      # behind the remote tip (other merges land during the long bench job) so the direct `git push
      # HEAD:main` is rejected `! [rejected] HEAD -> main (fetch first)` (a non_fast_forward race), and
      # even past that race the `main` ruleset (id 17688455: pull_request + required_status_checks "gate"
      # + code_scanning + non_fast_forward, EMPTY bypass list) rejects it with `GH013`. Confirmed RED on
      # Benchmarks runs #27827073571 and #27826231986 (both push:main):
      #     1 file changed, 2 insertions(+), 2 deletions(-)
      #     ! [rejected]        HEAD -> main (fetch first)
      #     error: failed to push some refs to 'https://github.com/jeswr/sparq.git'
      # Under `set -euo pipefail` that turned the whole Benchmarks job RED on every improving push, AND
      # the floor never landed (the ratchet is silently a no-op on this path). Two changes below:
      #   (1) FETCH-REBASE: before the push, fetch the latest origin/main and rebase the floor-only commit
      #       onto it, so WHEN pushing is enabled the non_fast_forward race is survived (commit applies
      #       onto the current tip). bench/perf-baseline.json is touched by nothing else, so this rebase
      #       never conflicts.
      #   (2) FAIL-SOFT push: disable errexit only around the push, capture its exit code, and on non-zero
      #       emit a clear ::warning:: (naming the non_fast_forward / GH013 cause) and exit 0 so the job
      #       stays GREEN whether or not the push lands. The MEASUREMENT + perf-gate comparison above are
      #       UNTOUCHED — only this main-only commit-back is made non-fatal and race-safe.
      # RULESET-COMPATIBLE PATH (true floor-landing, deferred — same as sq-roe3/#856):
      #   Option A — add the github-actions bot to the `main` ruleset bypass list (owner-only → needs:user)
      #              so the rebased push actually lands; OR
      #   Option C — fold the baseline update into the periodic .beads / data-sync PR (sq-2xdg) through the
      #              normal PR → gate → merge flow.
      # The fail-soft is the immediate fix (stops the red runs); the floor-landing is deferred to that
      # decision.
      - name: Auto-ratchet the perf floor (commit improvements back to main)
        # [SONNET-4.6] sq-mel85: push-to-main ONLY (excludes the nightly `schedule`
        # backstop) so a scheduled full-run verifies the gate WITHOUT committing a new
        # floor — the source-of-record ratchet cadence stays tied to code-landing pushes.
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RECENT_ARG=()
          [ -f prev-data.js ] && RECENT_ARG=(--recent-data prev-data.js)
          set +e
          python3 scripts/perf-gate.py --update-baseline bench-results.json bench/perf-baseline.json "${RECENT_ARG[@]}"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "perf floor unchanged — nothing to commit."
            exit 0
          elif [ "$rc" != "0" ]; then
            echo "::error::perf-gate --update-baseline failed (exit $rc)"; exit "$rc"
          fi
          if git diff --quiet -- bench/perf-baseline.json; then
            echo "no diff in bench/perf-baseline.json despite update — nothing to commit."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bench/perf-baseline.json
          git commit -m "chore(bench): auto-ratchet perf floor to new best-ever [skip ci]" \
                     -m "Lowered by the bench workflow after a measured improvement (sq-52e perf ratchet)."
          # FETCH-REBASE the floor-only commit onto the latest origin/main tip so the push survives the
          # non_fast_forward race (main moves ahead during the long bench job). bench/perf-baseline.json
          # is written by nothing else, so this rebase never conflicts; if it somehow does, fail soft.
          if git fetch origin main 2>/dev/null && git rebase FETCH_HEAD 2>/dev/null; then
            echo "rebased the floor-only commit onto the latest origin/main tip."
          else
            git rebase --abort 2>/dev/null || true
            echo "::warning title=perf-floor rebase skipped::Could not rebase the floor commit onto origin/main (fetch or rebase failed); attempting push as-is."
          fi
          # Best-effort push. A protected-branch ruleset rejection (GH013) or a residual non_fast_forward
          # race must NOT fail this non-gating main-only commit-back. Disable errexit only around the push
          # so we can inspect its status and fail soft (the measurement + perf-gate above are untouched).
          set +e
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning title=perf-floor push declined::Could not push the tightened perf floor to protected main (git push exit ${push_rc}; likely a non_fast_forward race or the GH013 ruleset rejection — direct pushes to main are blocked, empty bypass list). Best-effort no-op: the perf measurement + hard gate ran and the floor WAS computed, but the bench/perf-baseline.json update was NOT landed. Resolve by adding the github-actions bot to the main ruleset bypass list (owner-only; sq-llxc/sq-roe3 needs:user) or folding the baseline update into the periodic .beads / data-sync PR (sq-2xdg). The floor only tightens via a human/orchestrator commit in the meantime."
            exit 0
          fi
          echo "committed + pushed tightened perf floor to main."
      # [OPUS-4.8] First-run bootstrap: github-action-benchmark does
      # `git fetch origin benchmark-data:benchmark-data` and hard-fails with
      # "couldn't find remote ref benchmark-data" when the history branch does
      # not yet exist (it does NOT auto-create it — see its docs/write.ts). Create
      # the orphan branch on origin if missing so the very first run (and any run
      # after the branch is deleted) self-heals instead of failing. Idempotent.
      - name: Ensure benchmark-data history branch exists
        # main only: PRs (esp. from forks) get a read-only GITHUB_TOKEN and must never write the
        # history branch — they only compare against it. [OPUS-4.8]
        # [SONNET-4.6] sq-mel85: push-to-main ONLY (the nightly `schedule` backstop is a pure
        # verification run — it never writes the history branch, so it needs no bootstrap).
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin benchmark-data >/dev/null 2>&1; then
            echo "benchmark-data branch already exists on origin — nothing to do."
          else
            echo "benchmark-data branch missing on origin — creating an orphan branch."
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" checkout -q --orphan benchmark-data
            git -C "$tmp" -c user.name=github-actions[bot] \
                          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                          commit -q --allow-empty -m "chore(bench): initialise benchmark-data history branch"
            git -C "$tmp" push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              benchmark-data:benchmark-data
            echo "Created and pushed orphan benchmark-data branch."
          fi
      # [OPUS-4.8] sq-owci — clean the working tree before github-action-benchmark switches branches.
      # ROOT CAUSE: the "Run benchmarks" step (scripts/ci-bench.sh) does `cd bench/zk && cargo bench`
      # and `cd bench/zk-trace && cargo bench` (two STANDALONE cargo projects, run WITHOUT --locked),
      # so Cargo re-resolves and REWRITES their committed bench/zk{,-trace}/Cargo.lock. That leaves the
      # working tree dirty. The Store step below then runs with auto-push=true (main only), and the
      # action internally does `git fetch ... benchmark-data:benchmark-data` + `git switch benchmark-data`,
      # which ABORTS: "Your local changes to the following files would be overwritten by checkout:
      # bench/zk-trace/Cargo.lock, bench/zk/Cargo.lock ... Aborting" (live: Benchmarks run 27867742598).
      # That failed the whole (non-gating) Benchmarks job on every main push and masked real CI signal.
      # It only ever bit main because on PRs auto-push=false, so the action never switches branches.
      #
      # FIX: restore exactly the TRACKED files the build/bench dirtied, so the action's branch switch is
      # clean. `git checkout --` only touches tracked paths, so the UNtracked run outputs the next step
      # reads (bench-results.json, prev-data.js) are left intact. Enumerating via `git diff --name-only`
      # (tracked-modified only) future-proofs this against any other lockfile a future bench may rewrite.
      # This does NOT alter the measurement — bench-results.json is already written; we only drop the
      # incidental lockfile churn. main-guarded to mirror the auto-push gate (the only path that switches).
      - name: Clean bench-induced tracked churn before history switch (main only)
        # [SONNET-4.6] sq-mel85: push-to-main ONLY. This cleanup exists solely so the
        # auto-push branch switch below is clean; the nightly `schedule` backstop never
        # switches branches (auto-push is push-gated), so it needs no cleanup.
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          dirty="$(git diff --name-only)"
          if [ -n "$dirty" ]; then
            echo "Restoring tracked files the benchmark run modified (incidental Cargo.lock re-resolve):"
            while IFS= read -r f; do echo "  $f"; done <<< "$dirty"
            # Restore ALL tracked modifications. `git checkout -- .` only rewrites TRACKED paths,
            # so the untracked run outputs the next step reads (bench-results.json, prev-data.js)
            # are left intact — and it is whitespace-safe (no word-splitting of the path list).
            git checkout -- .
          else
            echo "Working tree clean — no tracked churn to restore."
          fi
          git status --porcelain
      - name: Store + compare against history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: sparq engine
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # [OPUS-4.8] auto-push ONLY on main: pushes the new point to the benchmark-data history
          # branch (which feeds the public Pages chart). On a PR this is false, so the run COMPUTES
          # + COMPARES against the published series and COMMENTS, but does NOT write benchmark-data —
          # contributors get pre-merge feedback with zero pollution of the public trend.
          # [SONNET-4.6] sq-mel85: ALSO false on the nightly `schedule` backstop — a scheduled run
          # shares the last main commit's SHA, so pushing would append a DUPLICATE per-commit point
          # and pollute the "one entry per commit" trend. The backstop verifies the gate only; the
          # history + ratchet stay on the push-to-main path (design §6.1 continuity).
          auto-push: ${{ github.event_name != 'schedule' && github.ref == 'refs/heads/main' }}
          # The history branch doubles as the Pages source: the action writes index.html + data.js
          # under dev/bench here, so once the owner points Settings → Pages at branch benchmark-data
          # /(root) the dashboard renders at https://sparq.jeswr.org/dev/bench (see header).
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          # [OPUS-4.8] sq-3g6q: CAP the retained history. github-action-benchmark accumulates EVERY
          # commit's point with NO bound by default, so dev/bench/data.js grew unbounded (was 4.4 MB /
          # ~160k lines → slow dashboard load). max-items-in-chart slices entries["sparq engine"] to the
          # most-recent N COMMITS (one entry per commit; each entry carries ALL metrics, so N commits =
          # N points per metric for the trend charts). N is deliberately modest because each entry is
          # heavy: the suite now reports ~270 metrics/commit (~28 KB serialized), so the COMMIT COUNT —
          # not a notional total-point count — is what drives file size. N=20 keeps a 20-commit trend
          # window for every metric while holding data.js well under 1 MB (~0.74 MB). The dashboard
          # (bench/dashboard/dashboard.js) renders the latest values + trend sparklines from exactly
          # this bounded window. Matches the one-time prune of the existing benchmark-data history.
          max-items-in-chart: 20
          # Comment + job-summary on EVERY run (incl. PRs) so the comparison table is always visible
          # pre-merge, not only when an alert fires. [OPUS-4.8]
          comment-always: true
          summary-always: true
          # GitHub-hosted runners are noisy, so this action's gate only flags a *large* regression and
          # never hard-fails: fail-on-alert stays false because this single GLOBAL switch would otherwise
          # trip on the noisy wall-clock latencies. The TRUE hard gate is the dedicated "Hard gate" step
          # ABOVE (scripts/perf-gate.py): the DETERMINISTIC byte counts (store/dict bytes-per-{triple,term},
          # store_bytes_per_triple_small, wasm_bundle_bytes) are gated strictly, and the TIMING metric
          # parse_ns_per_byte is made robust to runner noise via best-of-N re-measure (real regressions
          # still fail). This action keeps the trend chart + alert comment for ALL metrics (including the
          # latency trends) for human review. [OPUS-4.8]
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@jeswr'
      # [OPUS-4.8] Seed the custom Pages dashboard onto benchmark-data IF ABSENT (or stale).
      # github-action-benchmark only writes its DEFAULT index.html when one does NOT already exist
      # (fs.stat early-return) but OVERWRITES data.js every run — so a CUSTOM dashboard committed
      # once is preserved forever while the data refreshes. This step pulls the freshly-pushed
      # benchmark-data branch and copies bench/dashboard/{index.html,dashboard.js,dashboard.css}
      # into dev/bench/ when dev/bench/dashboard.js is missing OR differs, then commits + pushes.
      # Idempotent + MAIN ONLY (PRs/forks get a read-only token and never write the history branch),
      # mirroring the "Ensure benchmark-data history branch exists" bootstrap above.
      - name: Seed Pages dashboard onto benchmark-data (if absent)
        # [SONNET-4.6] sq-mel85: push-to-main ONLY — the nightly `schedule` backstop never
        # writes the history branch, so it must not seed/update the Pages dashboard either.
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/bench/dashboard"
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tmp" fetch -q --depth=1 origin benchmark-data
          git -C "$tmp" checkout -q -B benchmark-data FETCH_HEAD
          mkdir -p "$tmp/dev/bench"
          changed=0
          # [OPUS-4.8] metric-labels.json (sq-ocuf) is part of the served dashboard — copy it
          # alongside index.html/dashboard.js/dashboard.css so dashboard.js can fetch it.
          # [OPUS-4.8] vendor/Chart.min.js (sq-0rv3) is loaded by index.html now that the
          # CDN dep is dropped — seed it (in its subdir) so the published Pages dashboard
          # doesn't 404. The path has a dirname, so mkdir -p before copying.
          # [OPUS-4.8] competitors.json (sq-kehk) is FETCHED by dashboard.js boot() (sq-rltn / #200)
          # as the single competitor-data sink — copy it alongside metric-labels.json so the live
          # fetch resolves instead of 404ing into the empty embedded COMPETITORS_DATA mirror.
          for f in index.html dashboard.js dashboard.css metric-labels.json competitors.json vendor/Chart.min.js; do
            if [ ! -f "$tmp/dev/bench/$f" ] || ! cmp -s "$src/$f" "$tmp/dev/bench/$f"; then
              mkdir -p "$(dirname "$tmp/dev/bench/$f")"
              cp "$src/$f" "$tmp/dev/bench/$f"
              changed=1
            fi
          done
          # [OPUS-4.8] root redirect (sq-pages-root): the bare Pages root would 404 because the
          # dashboard lives under dev/bench/. Seed bench/dashboard/root-redirect.html to the
          # benchmark-data branch ROOT as index.html so https://sparq.jeswr.org/ bounces to
          # dev/bench/. github-action-benchmark only writes data.js + dev/bench/index.html (never a
          # root index.html), so this coexists with its data and is preserved across runs.
          if [ ! -f "$tmp/index.html" ] || ! cmp -s "$src/root-redirect.html" "$tmp/index.html"; then
            cp "$src/root-redirect.html" "$tmp/index.html"
            changed=1
          fi
          if [ "$changed" = "0" ]; then
            echo "dev/bench dashboard already up to date — nothing to seed."
            exit 0
          fi
          git -C "$tmp" -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        add index.html dev/bench/index.html dev/bench/dashboard.js dev/bench/dashboard.css \
                            dev/bench/metric-labels.json dev/bench/competitors.json dev/bench/vendor/Chart.min.js
          git -C "$tmp" -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        commit -q -m "chore(bench): seed/update Pages dashboard (dev/bench + root redirect) [skip ci]"
          git -C "$tmp" push -q origin benchmark-data:benchmark-data
          echo "Seeded/updated the custom Pages dashboard on benchmark-data."
