name: Benchmarks

# Cross-commit performance tracking (roadmap G2). On every push to main, run the engine over a
# synthetic dataset, emit per-subsystem latencies, and store them with github-action-benchmark so
# the trend is graphed across commits and a large regression raises an alert/comment. Runs on free
# GitHub-hosted runners (no EC2 → no cost). Heavy/long benches that need real hardware are in the
# separate cost-capped bench-ec2.yml (G3).
#
# [OPUS-4.8] Also runs on pull_request so contributors get perf feedback BEFORE merge — but PRs only
# COMPUTE + COMMENT (auto-push gated to main below), so they compare against the published series
# WITHOUT polluting it. The history branch (benchmark-data) is also the source for a public GitHub
# Pages dashboard:
#
#   PUBLIC DASHBOARD — REPO-OWNER TOGGLE REQUIRED (one-time, can't be set from a workflow):
#   Settings → Pages → "Build and deployment" → Source = "Deploy from a branch",
#   Branch = `benchmark-data` / `/ (root)` → Save. The chart then renders at
#   https://jeswr.github.io/sparq/dev/bench (the action writes index.html + data.js under dev/bench
#   on the benchmark-data branch — see gh-pages-branch + benchmark-data-dir-path below). No new
#   branch is created; Pages just serves the existing benchmark-data branch.
on:
  push:
    branches: [main]
    # [OPUS-4.8] ANTI-LOOP: the auto-ratchet step below commits bench/perf-baseline.json back to main.
    # paths-ignore stops that floor-only commit from re-triggering this workflow (belt; the [skip ci]
    # in the commit message is the suspenders). A real perf change always touches code/scripts too, so
    # ignoring the baseline path alone never masks a genuine bench-worthy push.
    paths-ignore:
      - 'bench/perf-baseline.json'
  pull_request:
  # [OPUS-4.8] Merge queue: the perf gate must run on the queue's merge_group ref so
  # the required ci-summary aggregates the benchmark check. The auto-push / baseline-
  # commit / benchmark-data steps are all gated `if: github.ref == 'refs/heads/main'`
  # — on merge_group github.ref is refs/heads/gh-readonly-queue/main/…, so (exactly as
  # on a PR) they SKIP and only the perf gate computes + enforces the floor.
  merge_group:
  workflow_dispatch:

# [OPUS-4.8] Least-privilege default (Scorecard TokenPermissions): top-level is read-only
# so the dashboard-labels job (and any future read-only job) inherits no write scope. The
# writes the benchmark job needs (push to benchmark-data, deployment status, PR comment) are
# scoped to the `bench` job below.
permissions:
  contents: read

# Do NOT cancel an in-progress benchmark run (it would corrupt the stored series).
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # [OPUS-4.8] sq-ocuf: fast, dependency-light gate for the dashboard's readable labels. Runs on
  # PRs + main (no rust/wasm build) so a query added/renamed without regenerating metric-labels.json
  # fails BEFORE merge: validates the JSON, runs the generator's --check drift gate, syntax-checks
  # dashboard.js, and runs the node smoke test (scripts/dashboard-smoke.js).
  dashboard-labels:
    name: dashboard labels (lint + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Validate metric-labels.json
        run: python3 -c "import json; json.load(open('bench/dashboard/metric-labels.json')); print('metric-labels.json is valid JSON')"
      - name: Drift gate (regenerate + diff)
        run: python3 scripts/gen-metric-labels.py --check
      - name: Syntax-check dashboard.js
        run: node --check bench/dashboard/dashboard.js
      - name: Dashboard smoke test
        run: node scripts/dashboard-smoke.js

  bench:
    name: run + track benchmarks
    runs-on: ubuntu-latest
    # [OPUS-4.8] Job-scoped writes (least privilege; the rest of the workflow stays read-only):
    #   contents: write     — auto-ratchet commits bench/perf-baseline.json back to main and
    #                         github-action-benchmark pushes the point to the benchmark-data branch
    #   deployments: write  — github-action-benchmark records a GitHub deployment status
    #   pull-requests: write— comment-always posts the comparison table on (same-repo) PRs;
    #                         fork PRs get a read-only token, so the action skips the comment.
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown   # enables the wasm bundle-size metric in ci-bench.sh
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # [OPUS-4.8] Well-known-suite toolchains (sp2b/dbpsb/watdiv/bsbm/lubm), MAIN ONLY. On push to
      # main the full well-known-suite set runs; on PRs we DELIBERATELY do NOT install these, so the
      # ci-bench.sh suite hooks SKIP gracefully (each is guarded on `command -v <tool>`) and PR perf
      # feedback stays lean (synthetic + operator + memory/bundle metrics only). The full SF/scale
      # tiers are EC2/nightly (beads sq-uubq/xin1/8lgn/yc1q/z31u), NOT here.
      #   g++ is preinstalled on ubuntu-latest (watdiv). default-jre = java (bsbm) + JRE for lubm's
      #   javac comes from default-jdk... but default-jre has NO javac, so install default-jdk for
      #   lubm's `javac` guard; libboost-all-dev = watdiv's Boost; raptor2-utils = lubm's `rapper`;
      #   unzip = bsbm's distribution unpack.
      - name: Install well-known-suite toolchains (main only)
        if: github.ref == 'refs/heads/main'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev default-jdk raptor2-utils unzip
      # [OPUS-4.8] Per-suite generator-cache restore/save so the steady state does NO rebuild/refetch:
      # each suite's gen.sh/fetch.sh/run.sh build-once-and-cache their generator binary + the fixed
      # corpus under /tmp/<suite> (sp2b/watdiv/bsbm/lubm) or the pinned slice (/tmp/dbpsb). Keyed on the
      # generator scripts so a generator/pinning change busts the cache. PRs skip the toolchain install
      # above, so a cache miss on a PR is harmless (the hook skips); on main it just rebuilds once.
      - name: Cache sp2b generator + corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/sp2b
          key: bench-sp2b-${{ runner.os }}-${{ hashFiles('bench/sp2b/gen.sh') }}
      - name: Cache watdiv generator + corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/watdiv
          key: bench-watdiv-${{ runner.os }}-${{ hashFiles('bench/watdiv/gen.sh', 'bench/watdiv/files/words.txt') }}
      - name: Cache bsbm generator + corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/bsbm
          key: bench-bsbm-${{ runner.os }}-${{ hashFiles('bench/bsbm/gen.sh') }}
      - name: Cache lubm generator + corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/lubm
          key: bench-lubm-${{ runner.os }}-${{ hashFiles('bench/lubm/gen.sh') }}
      - name: Cache dbpsb pinned slice + cut
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/dbpsb
          key: bench-dbpsb-${{ runner.os }}-${{ hashFiles('bench/dbpsb/fetch.sh') }}
      - name: Build release binaries
        run: cargo build --release -p sparq-cli -p sparq-bench
      - name: Run benchmarks
        run: bash scripts/ci-bench.sh 200000 bench-results.json
      # [OPUS-4.8] HARD regression RATCHET on the gated metrics (store/dict bytes-per-{triple,term},
      # store_bytes_per_triple_small, wasm_bundle_bytes = DETERMINISTIC byte counts; parse_ns_per_byte =
      # TIMING, made noise-robust via best-of-N re-measure — see the Hard gate step below).
      # github-action-benchmark's fail-on-alert is a single GLOBAL switch that would also trip on the noisy
      # wall-clock latencies, so it stays false (alert-comment only, below). This step is the TRUE gate.
      #
      # sq-52e: the gate now compares each metric against its COMMITTED best-ever FLOOR in
      # bench/perf-baseline.json (the source-of-record ratchet, reviewed in diffs like the conformance
      # RATCHET in ci.yml) — NOT the drifting previous point. A sub-threshold creep every commit therefore
      # can no longer slow-drift unbounded past the floor ("boiling frog"): each creep is measured against
      # the FIXED floor and trips once cumulative drift exceeds the band. See scripts/perf-gate.py header.
      #
      # Runs on push-to-main AND on PRs (PRs gate against the same committed floor — pre-merge feedback,
      # zero pollution since the baseline auto-update + benchmark-data push are main-only). DELIBERATE
      # increases (e.g. a wasm bump from a new feature): EITHER edit bench/perf-baseline.json to raise the
      # floor in the reviewed PR, OR set the workflow var PERF_GATE_ALLOW (e.g. 'wasm_bundle_bytes') — the
      # allowed metric passes AND is re-floored to the new value by the auto-ratchet step below.
      - name: Unit-test the hard-gate ratchet logic
        # Cheap (no build): asserts perf-gate.py fails on a real regression, on cumulative SLOW DRIFT
        # against the best-ever floor (the sq-52e adversarial test), and passes on noise / improvement /
        # missing-floor / deliberate-allow — and that improvements ratchet the floor DOWN while a one-off
        # noise-low does NOT. Catches a future edit that breaks the gate before it can silently let a
        # regression through. [OPUS-4.8]
        run: python3 scripts/perf-gate.py --self-test
      - name: Fetch previous benchmark series (for the noise-metric sustained-improvement check)
        id: prev_series
        # The committed floor lives in bench/perf-baseline.json (in this checkout) — the gate needs no
        # network. We still fetch data.js so the auto-ratchet step can damp the NOISE metric's floor with
        # the median of recent published points (never a one-off noise-low). Missing branch => skipped.
        run: |
          set -euo pipefail
          if git fetch --depth=20 origin benchmark-data 2>/dev/null; then
            git show FETCH_HEAD:dev/bench/data.js > prev-data.js 2>/dev/null \
              && echo "fetched previous benchmark-data/dev/bench/data.js" \
              || echo "benchmark-data branch has no dev/bench/data.js yet."
          else
            echo "benchmark-data branch not present yet (first run)."
          fi
      # [OPUS-4.8] (sq-dzfu) The DETERMINISTIC byte-count metrics are hard-gated strictly. The TIMING
      # metric (parse_ns_per_byte) is made robust to GitHub-runner noise via BEST-OF-N re-measure: if it
      # trips the band, the gate re-runs the CHEAP `ci-bench.sh --parse-only` path (no wasm build, no big
      # corpus, no well-known suites — ~sub-second using the binaries already built above) up to K times
      # and keeps the BEST (min) reading, only FAILING if the best of N still exceeds the band. Runner
      # noise only ever inflates a wall-clock reading, so a one-off spike is squeezed out while a real
      # parse regression (slow on EVERY reading) still fails. Mirrors PR #62's coverage re-measure fix.
      - name: Hard gate — perf regression (deterministic strict; timing best-of-N robust)
        env:
          # Deliberate-bump escape hatch: comma-separated metric names allowed to regress THIS run.
          # Leave empty normally; set to e.g. 'wasm_bundle_bytes' on a commit/run that intentionally
          # grows the bundle. The allowed metric passes here AND is re-floored by the auto-ratchet step.
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
        run: |
          python3 scripts/perf-gate.py bench-results.json bench/perf-baseline.json \
            --remeasure-cmd 'bash scripts/ci-bench.sh --parse-only /tmp/perf-remeasure.json >/dev/null 2>&1 && cat /tmp/perf-remeasure.json' \
            --remeasure-k 4
      # [OPUS-4.8] AUTO-RATCHET-DOWN (sq-52e): on push to main, AFTER the gate passes, lower any floor a
      # genuine improvement beat (auto metrics: current < floor; noise metric: only on a SUSTAINED
      # improvement — the median of recent published points below the floor, never a one-off noise-low),
      # and re-floor any PERF_GATE_ALLOW metric to its new value. If bench/perf-baseline.json changed,
      # commit it BACK to main so the floor (the source-of-record ratchet) only ever TIGHTENS automatically.
      #   ANTI-LOOP (two independent guards): (1) the commit message carries [skip ci]; (2) this workflow's
      #   on.push.paths-ignore excludes bench/perf-baseline.json, so a floor-only commit can't re-trigger it.
      # main only — PRs (esp. forks) get a read-only token and must never write to main. exit 3 = no change.
      - name: Auto-ratchet the perf floor (commit improvements back to main)
        if: github.ref == 'refs/heads/main'
        env:
          PERF_GATE_ALLOW: ${{ vars.PERF_GATE_ALLOW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RECENT_ARG=()
          [ -f prev-data.js ] && RECENT_ARG=(--recent-data prev-data.js)
          set +e
          python3 scripts/perf-gate.py --update-baseline bench-results.json bench/perf-baseline.json "${RECENT_ARG[@]}"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "perf floor unchanged — nothing to commit."
            exit 0
          elif [ "$rc" != "0" ]; then
            echo "::error::perf-gate --update-baseline failed (exit $rc)"; exit "$rc"
          fi
          if git diff --quiet -- bench/perf-baseline.json; then
            echo "no diff in bench/perf-baseline.json despite update — nothing to commit."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bench/perf-baseline.json
          git commit -m "chore(bench): auto-ratchet perf floor to new best-ever [skip ci]" \
                     -m "Lowered by the bench workflow after a measured improvement (sq-52e perf ratchet)."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "committed + pushed tightened perf floor to main."
      # [OPUS-4.8] First-run bootstrap: github-action-benchmark does
      # `git fetch origin benchmark-data:benchmark-data` and hard-fails with
      # "couldn't find remote ref benchmark-data" when the history branch does
      # not yet exist (it does NOT auto-create it — see its docs/write.ts). Create
      # the orphan branch on origin if missing so the very first run (and any run
      # after the branch is deleted) self-heals instead of failing. Idempotent.
      - name: Ensure benchmark-data history branch exists
        # main only: PRs (esp. from forks) get a read-only GITHUB_TOKEN and must never write the
        # history branch — they only compare against it. [OPUS-4.8]
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin benchmark-data >/dev/null 2>&1; then
            echo "benchmark-data branch already exists on origin — nothing to do."
          else
            echo "benchmark-data branch missing on origin — creating an orphan branch."
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" checkout -q --orphan benchmark-data
            git -C "$tmp" -c user.name=github-actions[bot] \
                          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                          commit -q --allow-empty -m "chore(bench): initialise benchmark-data history branch"
            git -C "$tmp" push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              benchmark-data:benchmark-data
            echo "Created and pushed orphan benchmark-data branch."
          fi
      - name: Store + compare against history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: sparq engine
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # [OPUS-4.8] auto-push ONLY on main: pushes the new point to the benchmark-data history
          # branch (which feeds the public Pages chart). On a PR this is false, so the run COMPUTES
          # + COMPARES against the published series and COMMENTS, but does NOT write benchmark-data —
          # contributors get pre-merge feedback with zero pollution of the public trend.
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          # The history branch doubles as the Pages source: the action writes index.html + data.js
          # under dev/bench here, so once the owner points Settings → Pages at branch benchmark-data
          # /(root) the dashboard renders at https://jeswr.github.io/sparq/dev/bench (see header).
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          # Comment + job-summary on EVERY run (incl. PRs) so the comparison table is always visible
          # pre-merge, not only when an alert fires. [OPUS-4.8]
          comment-always: true
          summary-always: true
          # GitHub-hosted runners are noisy, so this action's gate only flags a *large* regression and
          # never hard-fails: fail-on-alert stays false because this single GLOBAL switch would otherwise
          # trip on the noisy wall-clock latencies. The TRUE hard gate is the dedicated "Hard gate" step
          # ABOVE (scripts/perf-gate.py): the DETERMINISTIC byte counts (store/dict bytes-per-{triple,term},
          # store_bytes_per_triple_small, wasm_bundle_bytes) are gated strictly, and the TIMING metric
          # parse_ns_per_byte is made robust to runner noise via best-of-N re-measure (real regressions
          # still fail). This action keeps the trend chart + alert comment for ALL metrics (including the
          # latency trends) for human review. [OPUS-4.8]
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@jeswr'
      # [OPUS-4.8] Seed the custom Pages dashboard onto benchmark-data IF ABSENT (or stale).
      # github-action-benchmark only writes its DEFAULT index.html when one does NOT already exist
      # (fs.stat early-return) but OVERWRITES data.js every run — so a CUSTOM dashboard committed
      # once is preserved forever while the data refreshes. This step pulls the freshly-pushed
      # benchmark-data branch and copies bench/dashboard/{index.html,dashboard.js,dashboard.css}
      # into dev/bench/ when dev/bench/dashboard.js is missing OR differs, then commits + pushes.
      # Idempotent + MAIN ONLY (PRs/forks get a read-only token and never write the history branch),
      # mirroring the "Ensure benchmark-data history branch exists" bootstrap above.
      - name: Seed Pages dashboard onto benchmark-data (if absent)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/bench/dashboard"
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tmp" fetch -q --depth=1 origin benchmark-data
          git -C "$tmp" checkout -q -B benchmark-data FETCH_HEAD
          mkdir -p "$tmp/dev/bench"
          changed=0
          # [OPUS-4.8] metric-labels.json (sq-ocuf) is part of the served dashboard — copy it
          # alongside index.html/dashboard.js/dashboard.css so dashboard.js can fetch it.
          # [OPUS-4.8] vendor/Chart.min.js (sq-0rv3) is loaded by index.html now that the
          # CDN dep is dropped — seed it (in its subdir) so the published Pages dashboard
          # doesn't 404. The path has a dirname, so mkdir -p before copying.
          for f in index.html dashboard.js dashboard.css metric-labels.json vendor/Chart.min.js; do
            if [ ! -f "$tmp/dev/bench/$f" ] || ! cmp -s "$src/$f" "$tmp/dev/bench/$f"; then
              mkdir -p "$(dirname "$tmp/dev/bench/$f")"
              cp "$src/$f" "$tmp/dev/bench/$f"
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "dev/bench dashboard already up to date — nothing to seed."
            exit 0
          fi
          git -C "$tmp" -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        add dev/bench/index.html dev/bench/dashboard.js dev/bench/dashboard.css \
                            dev/bench/metric-labels.json dev/bench/vendor/Chart.min.js
          git -C "$tmp" -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        commit -q -m "chore(bench): seed/update Pages dashboard under dev/bench [skip ci]"
          git -C "$tmp" push -q origin benchmark-data:benchmark-data
          echo "Seeded/updated the custom Pages dashboard on benchmark-data."
