# Omnibus merge-queue batcher, v2 (scheduled / event-driven; NON-gating).
#
# WHAT: the pure policy in scripts/batch-merge.py batches ALL reviewed,
# orchestrator-armed sparq-agent/* worker PRs (2 or more; no size cap — one omnibus is
# ONE merge-queue entry however many constituents it carries) into ONE
# sparq-omnibus/<utcstamp> integration PR (fresh off main, no-ff merges; conflicting
# constituents are skipped and stay individually armed) and arms it — the merge queue
# picks the strategy. It also closes constituents of MERGED omnibus PRs whose branches
# now add nothing vs main, re-arms a young omnibus whose auto-merge arm was dropped by
# a failed merge group, and deletes stale sparq-omnibus/* branches. Failure triage is
# ordered, most-exculpatory first: a CONFLICTING omnibus (main moved under it) v1-closes
# and is rebuilt fresh off main — a conflict never implicates constituents; ONLY a
# strict concluded head-`gate` FAILURE recursively BISECTS the omnibus (halve-and-land,
# to DEPTH_CAP) until the culprit is isolated, commented, drafted and disarmed (the
# registry's `stranded` handoff); an infra-shaped ending (gate cancelled / timed_out,
# or the MAX_OMNIBUS_AGE_HOURS liveness bound for head-invisible failures) v1-closes
# WITHOUT bisection, and new-ROOT creation then waits out a durable
# generation/cooldown backstop (ROOT_COOLDOWN_HOURS, read from GitHub's closed-PR
# record) so a persistent outage can never flood the queue with rebuilt roots.
# Constituents stay individually armed through every path — nothing is ever lost. A
# possibly-truncated open-PR listing is fail-safe: no bisection, no stale-branch
# deletion, no new root on incomplete data. NO model calls; the policy is self-tested
# (gh + git stubbed) before it runs.
#
# NOT A GATE. This runs on `schedule` / `workflow_dispatch` / `workflow_run` / `push`,
# NEVER on a PR's head commit, so `ci-summary / gate` (which polls check-runs on the PR
# head) never sees it — it cannot register as a required/blocking check and is
# intentionally NOT in the branch-protection required-checks set. The sparq-omnibus/
# branch prefix (with NO review:* labels) keeps the omnibus PR out of the registry's
# worker-review enumeration, which admits only ^sparq-agent/issue-<n>- heads.
#
# TOKENS (load-bearing). The omnibus branch/PR MUST be pushed + created + armed with the
# sparq-orchestrator App installation token, NOT GITHUB_TOKEN: GitHub SUPPRESSES workflow
# events for GITHUB_TOKEN-created refs/PRs, so ci-summary would never run on the omnibus
# head, the required `gate` context would never report, and the merge queue would never
# ADMIT the PR — queue admission requires the required checks to pass on the head BEFORE
# entry; the merge_group evaluation only happens after admission. (Empirical in-repo
# proof: the GITHUB_TOKEN-created release-plz PR #1084 — zero check-runs, BLOCKED.)
# With the App token, head pull_request CI fires on the omnibus like on any worker PR.
# When the App secrets (ORCHESTRATOR_APP_ID / ORCHESTRATOR_APP_PRIVATE_KEY) are absent,
# the policy runs in --hygiene-only mode: closure / failure / re-arm / stale-branch legs
# only, NO new omnibus (fail-soft — the queue keeps draining constituents individually).
name: batch-merge

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute + print the plan but perform NO gh/git mutations"
        required: false
        default: "false"
  schedule:
    # Three times an hour, offset from the registry's on-the-hour/quarter crons.
    - cron: "7,27,47 * * * *"
  # The moment any head CI concludes the armed set may have grown past the window.
  workflow_run:
    workflows: [ci-summary]
    types: [completed]
  # A push to main means a merge landed -> ring the registry dispatcher (ring job ONLY;
  # the batch policy job never runs on push).
  push:
    branches: [main]

# Least privilege: push/delete sparq-omnibus/* branches (contents) and open/close/arm
# PRs (pull-requests). Nothing else.
permissions:
  contents: write
  pull-requests: write

# The batcher must never overlap itself (two runs would double-open an omnibus). Never
# cancel in-flight — let a run finish so a scheduled + an event run don't race.
concurrency:
  group: batch-merge
  cancel-in-progress: false

jobs:
  # Job name deliberately WITHOUT `advisory`/`informational` (stays visible); because
  # this workflow never runs on a PR head commit it is structurally non-gating.
  batch:
    name: batch overflow into omnibus
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secrets are not readable from step `if:` expressions — mirror the id into env so
      # the mint step can be skipped fail-soft when the App is not configured.
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
    steps:
      # See the TOKENS header note: without this App token no omnibus can ever pass its
      # required checks or enter the merge queue, so the policy degrades to hygiene-only.
      - name: Mint the sparq-orchestrator App token (omnibus head events must fire)
        id: app-token
        if: env.ORCHESTRATOR_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          # Least privilege — mirror the workflow's GITHUB_TOKEN permissions block
          # exactly: contents (push/delete sparq-omnibus/* branches, checkout) and
          # pull-requests (open/close/comment/arm/draft). Without these lines the
          # minted token carries EVERY permission the App installation has.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout (full history — the policy builds real merge commits and pushes)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # App token when available so the omnibus push fires pull_request CI;
          # falls back to the (event-suppressed) workflow token for hygiene-only runs.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Self-test the policy (hermetic; gh + git stubbed; fail fast on drift)
        run: python3 scripts/batch-merge.py --self-test

      - name: Run the omnibus policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HAVE_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "sparq-omnibus-batcher"
          git config user.email "noreply@users.noreply.github.com"
          args=(--repo "$REPO")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$HAVE_APP_TOKEN" != "true" ]; then
            echo "::notice::ORCHESTRATOR_APP_ID/_PRIVATE_KEY not configured — hygiene-only mode (a GITHUB_TOKEN-created omnibus cannot pass required checks or enter the merge queue, so none is created)."
            args+=(--hygiene-only)
          fi
          python3 scripts/batch-merge.py "${args[@]}"

  # Merged-PR pickup ring: a merge into main frees merge-queue/worker capacity — poke the
  # registry dispatcher immediately instead of waiting for its cron. Fail-soft: without
  # the secret this skips with a notice (the registry cron is the backstop).
  ring:
    name: ring registry dispatcher
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ring jeswr/agent-account-registry dispatch
        env:
          REGISTRY_RING_TOKEN: ${{ secrets.REGISTRY_RING_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_RING_TOKEN}" ]; then
            echo "::notice::REGISTRY_RING_TOKEN not configured — skipping the registry ring (the registry's own cron is the backstop)."
            exit 0
          fi
          GH_TOKEN="${REGISTRY_RING_TOKEN}" gh workflow run dispatch.yml -R jeswr/agent-account-registry
