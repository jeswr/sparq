# [OPUS-4.8] Issue triage + untrusted-input quarantine (review S2/S3). On a new/edited issue:
# trust-gate by the AUTHOR's repo permission; a third-party author is quarantined (trust:untrusted)
# and the maintainer is notified — its content is never inspected. A trusted author's issue is
# statically triaged (role/priority/status) by scripts/triage.py (no model call here).
# Approval interplay (#2476): a TRUSTED sender's edit never (re-)quarantines — a maintainer touching
# up a promoted issue must not revert their own approval. An UNTRUSTED sender's edit of a promoted
# issue DOES re-quarantine (approval is revision-bound — the S3 TOCTOU fix in scripts/promote.py),
# but now says so explicitly so the maintainer knows a fresh 👍 is needed.
name: triage-issue
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
      SENDER: ${{ github.event.sender.login }}
      ACTION: ${{ github.event.action }}
      # Whether the issue carried trust:untrusted when this event fired — if it did NOT and the
      # author is untrusted, a maintainer had lifted the quarantine (promote cron or manual).
      WAS_QUARANTINED: ${{ contains(github.event.issue.labels.*.name, 'trust:untrusted') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trust-gate the author and the event sender (repo permission, or the orchestrator App itself)
        id: trust
        run: |
          # The orchestrator GitHub App is our own automation identity, but an App is never a
          # collaborator, so the permission probe returns none and its issues (worker follow-ups)
          # were wrongly quarantined. Trust exactly that one bot login — no blanket [bot] trust.
          probe() {
            if [ "$1" = "sparq-orchestrator[bot]" ]; then echo 1; return; fi
            perm=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo 1 ;;
              *) echo 0 ;;
            esac
          }
          t=$(probe "$AUTHOR")
          echo "trusted=$t" >> "$GITHUB_OUTPUT"
          # For edited/reopened the sender may differ from the author: a trusted sender's action
          # must not re-quarantine a maintainer-approved issue (#2476).
          if [ "$SENDER" = "$AUTHOR" ]; then st=$t; else st=$(probe "$SENDER"); fi
          echo "sender_trusted=$st" >> "$GITHUB_OUTPUT"

      - name: Quarantine + notify (untrusted author)
        if: steps.trust.outputs.trusted != '1' && steps.trust.outputs.sender_trusted != '1'
        run: |
          gh issue edit "$NUM" -R "$REPO" --add-label trust:untrusted --add-label status:untriaged || true
          if [ "$ACTION" != "opened" ] && [ "$WAS_QUARANTINED" != "true" ]; then
            # The quarantine had been lifted (maintainer approval) and an untrusted sender changed
            # the issue: approval is revision-bound, so it no longer applies — say so out loud.
            gh issue comment "$NUM" -R "$REPO" \
              --body "> 🤖 automation — this issue was **${ACTION} by a non-collaborator after maintainer approval**, so the approval no longer applies (approval is bound to the revision the maintainer saw) and the issue is **re-quarantined** (\`trust:untrusted\`). A maintainer can re-approve the current revision with a fresh 👍 reaction (the promote cron picks it up)." || true
          else
            gh issue comment "$NUM" -R "$REPO" \
              --body "> 🤖 automation — this issue is from a non-collaborator, so it is **quarantined** (\`trust:untrusted\`) and its content is not acted on. A maintainer can approve it by adding a 👍 reaction (the promote cron picks it up)." || true
          fi

      - name: Static triage (trusted author)
        if: steps.trust.outputs.trusted == '1'
        run: |
          labels=$(gh issue view "$NUM" -R "$REPO" --json labels --jq '[.labels[].name]|join(",")')
          out=$(python3 scripts/triage.py --labels "$labels" --type task)
          add=$(printf '%s\n' "$out" | sed -n 's/^ADD: //p')
          rem=$(printf '%s\n' "$out" | sed -n 's/^REMOVE: //p')
          for l in $add; do gh issue edit "$NUM" -R "$REPO" --add-label "$l" || true; done
          for l in $rem; do gh issue edit "$NUM" -R "$REPO" --remove-label "$l" || true; done
