# [OPUS-4.8] sq-ymr2e.1 — ADVISORY site E2E-foundation lane.
#
# WHAT: runs the shared E2E foundation smoke (site/e2e/support/foundation.smoke.spec.ts) — the
# determinism-harness + hermetic-network demo — plus the deterministic no-timeout grep gate. The
# smoke drives a WASM-FREE, deterministic surface (the home hero runner's server-rendered
# idle-preview state), so this lane needs NO wasm bundle and NO Typst — it is fast and
# self-contained (contrast site-e2e.yml, which builds spec fragments for its ReSpec smoke).
#
# ADVISORY, by design: the whole word `advisory` in the job NAME is what excludes this lane from
# the `ci-summary` aggregator, so it NEVER gates the merge queue. Promotion to a required check is
# governed by the checked-in gating/probation policy `.github/E2E-GATING-POLICY.md` (advisory-first,
# promotion earned on a probation bar + flake-quarantine — bead sq-ymr2e.12; design
# research/web-gui-test-program.md §6.3). Promotion is the one-line flip in §4 of that policy (drop
# ` (advisory)` from the job name + remove the step `continue-on-error`). The browser-exec step is
# `continue-on-error` so a browser flake can never block a PR; the deterministic lint + grep-gate
# steps are hard (a broken foundation should be visible).
name: site-e2e-foundation (advisory)

on:
  pull_request:
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-foundation.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-e2e-foundation.yml"

# Least-privilege default (Scorecard TokenPermissions): read-only; this lane never writes.
permissions:
  contents: read

# One in-flight run per PR/branch; cancel a superseded run. Not a merge-queue lane.
concurrency:
  group: site-e2e-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-smoke:
    name: determinism gate + foundation smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Repo-root npm workspaces: `site/` is a member; `npm ci` run FROM site/ installs the site
      # member's closure from the root lock and does NOT trigger sibling members' lifecycle scripts
      # (verified in site-e2e.yml — js/'s wasm `prepare` is not run, so no Rust/wasm toolchain here).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies (from the repo-root workspace lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      # Deterministic, non-flaky — a HARD gate: zero page.waitForTimeout under site/e2e (§1.1).
      - name: Determinism grep gate (no time-based waits)
        run: npm run test:e2e:grep-gate

      # Cache the Playwright browser download keyed on the resolved @playwright/test version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      # ADVISORY: a browser flake never blocks a PR (§6.3). The spec is engineered to be
      # deterministic (frozen clock, seeded random, hermetic network, web-first waiters); its
      # anti-flake bar is `npm run test:e2e:stress` (--repeat-each=5 --retries=0), run pre-merge.
      - name: Foundation smoke (headless Chromium)
        continue-on-error: true
        run: npm run test:e2e -- support/foundation.smoke.spec.ts

      # [OPUS-4.8] sq-ymr2e.4 — ADVISORY axe-core WCAG 2.1 AA a11y scan of the P1 interactive
      # surfaces x their key UI states (research/web-gui-test-program.md §3.1). This lane builds no
      # wasm bundle, so the two engine-dependent states (home:results, /try:error) self-SKIP; the
      # wasm-free states (home:idle, /try default/palette/drawer, /download release+no-release) run.
      # Gate shape: serious+critical = ZERO on the ZERO-tier surfaces, a known-gap regression guard
      # on the beaded color-contrast surfaces, and a moderate/minor ratchet (bench/a11y-baseline.json).
      # continue-on-error keeps it advisory until the sq-ymr2e.12 promotion bar.
      - name: A11y — axe WCAG 2.1 AA (headless Chromium)
        continue-on-error: true
        run: npm run test:e2e -- a11y.spec.ts
