# Coverage-guided fuzz gate (bead sq-ovnf; threat-model T-PARSE-FUZZ + T-MMAP-FUZZ).
# [OPUS-4.8]
#
# WHAT: builds + runs the cargo-fuzz / libFuzzer targets in `fuzz/` against the RDF +
# SPARQL parsers and the mmap store loader. Each target's invariant is "hostile bytes
# must produce a clean Err or bounded behaviour — NEVER a panic, OOM/overflow abort,
# or UB"; libFuzzer reports any crash and (in CI) the run fails with the reproducer.
#
# TRIGGER + BUDGET (kept BOUNDED + non-flaky so it is a real but fast gate):
#   - pull_request : SHORT per-target smoke (`SMOKE_SECS`, default 30s each). This job
#     is auto-discovered by `ci-summary / gate` (its name has no "advisory"/
#     "informational" token) so a crash on a PR BLOCKS the merge — the gate sq-ovnf
#     wants. ~4 targets × 30s + build ≈ a few minutes on a warm cache.
#   - push to main : LONGER per-target run (`MAIN_SECS`, default 120s each) for deeper
#     coverage on the integration branch, where a few extra minutes are affordable.
#   - schedule (nightly) : HEAVY per-target run (`NIGHTLY_SECS`, default 600s each) to
#     let coverage accumulate well past what per-PR CI can afford.
#   - workflow_dispatch : manual run at the push (main) budget.
# The fuzz crate is OUTSIDE the cargo workspace (root `Cargo.toml` `exclude = [...,
# "fuzz"]`) and needs NIGHTLY (libFuzzer codegen), so it never touches the stable
# `cargo build`/`test`/`clippy --workspace` gate in ci.yml.
#
# CORPUS PERSISTENCE (bead sq-0iqzw). [FABLE-5] The accumulated libFuzzer corpus
# (fuzz/corpus/<target>, git-ignored) is cached across runs via actions/cache with a
# restore-keys prefix chain, so the nightly 600s soak DEEPENS coverage night over
# night instead of restarting empty; a committed minimal seed corpus lives in
# fuzz/seeds/<target> (tracked) and is passed as a second corpus dir on every run.
#
# DIFFERENTIAL SMOKE (bead sq-0iqzw). [FABLE-5] The separate `differential-smoke`
# job below is the PR-level BLOCKING wrong-answer gate: fixed sparq-vs-Oxigraph
# differential regression windows through crates/sparq-bench/src/fuzz.rs (stable
# toolchain, in-workspace — unlike the nightly-toolchain crash-oracle job above it).
# The nightly ADVANCING-window exploration lives in differential.yml.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening); the
# trailing `# vX.Y.Z` comment is what Dependabot follows to bump the pin.
name: fuzz

on:
  push:
    branches: [main]
  # [OPUS-4.8] sq-fmx4u.6: react to labeled/unlabeled too so toggling the `ci-full`
  # label re-evaluates the change-based selection for the fuzz lane (ci-select.yml
  # maps the label to `--full`, which forces the fuzz smoke to run). The default
  # types (opened/synchronize/reopened) are listed explicitly so adding the label
  # events does NOT drop `synchronize` (the push-to-PR trigger).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # [OPUS-4.8] Merge queue: fuzz surfaces a check on PRs, so it must also run on the
  # queue's merge_group ref or the required ci-summary would wait for a sibling that
  # never appears there. The budget step below maps merge_group to the fast SMOKE
  # budget (same as pull_request) — a pre-merge gate wants quick coverage, not the
  # nightly soak. github.ref in the concurrency group is the unique merge_group ref.
  merge_group:
  workflow_dispatch:
  # Daily heavy tier. 04:23 UTC (offset from ci.yml's 03:17 coverage cron so the two
  # heavy nightly lanes do not contend for the same runner window).
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Per-target wall-clock budgets by trigger (seconds). Bounded so the lane is fast +
  # non-flaky; libFuzzer's `-max_total_time` caps each target hard.
  SMOKE_SECS: "30"
  MAIN_SECS: "120"
  NIGHTLY_SECS: "600"
  # Build the fuzz targets for the GNU triple. On x86_64 Linux cargo-fuzz defaults to
  # the MUSL target (static libc), which the address sanitizer rejects; the gnu target
  # links libc dynamically and is sanitizer-compatible. (On the runner this is the host
  # triple, so it is also the cheapest to build.)
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  # [OPUS-4.8] sq-fmx4u.6 (design §5.2, phase 2): the change-based test-selection
  # pre-job (the reusable .github/workflows/ci-select.yml — doctrine there). The
  # `fuzz` job below guards on its affected-crate closure so a PR that touches
  # neither the fuzzed crates NOR their reverse-dependency closure skips the
  # (nightly-toolchain + 5-target sanitizer) build entirely. UNCONDITIONAL (no
  # needs/if): the ci-summary gate REQUIRES every "change-based test selection"
  # check-run to conclude success before any skipped sibling counts as satisfied,
  # so this job must exist + be green on every trigger (design §5.3). Fail-closed:
  # ci_select.py returns mode=full for every §4.1 trigger (shared crate / build
  # file / .github/** / Cargo.lock / selector-self change) and for ANY internal
  # error, and an empty/missing output satisfies the guard's `mode != 'selected'`
  # first disjunct => the fuzz lane RUNS. On schedule (the nightly heavy soak) the
  # event carries no PR diff => mode=full => the fuzz lane runs — the full-matrix
  # backstop (design §6.1) is preserved.
  select:
    name: select
    uses: ./.github/workflows/ci-select.yml
    permissions:
      contents: read

  fuzz:
    name: cargo-fuzz (parsers + mmap loader, bounded)
    # [OPUS-4.8] sq-fmx4u.6: the fuzz crate (fuzz/Cargo.toml) depends on exactly
    # sparq-core (RDF parsers + mmap loader), sparq-engine (SPARQL parse), and
    # sparq-shacl (SHACL validation), so the fuzz smoke is affected iff any of
    # those three is in the affected reverse-dep closure (single source of truth:
    # `_LANE_SEEDS["fuzz"]` in scripts/ci_select.py, pinned by
    # scripts/tests/test_ci_select_wiring.py). This is a job-level `if:` on a
    # NON-matrix job, so `needs.select.outputs` is available (unlike the ci.yml
    # per-shard case, which must guard in a step). FAIL-CLOSED: the leading
    # `mode != 'selected'` disjunct means an empty/missing selection output RUNS
    # the lane; a skipped job reports conclusion `skipped` (= satisfied) to the
    # ci-summary gate — no per-leg name is individually required (bead sq-fmx4u.4).
    needs: select
    if: >-
      needs.select.outputs.mode != 'selected' ||
      contains(needs.select.outputs.affected, '"sparq-core"') ||
      contains(needs.select.outputs.affected, '"sparq-engine"') ||
      contains(needs.select.outputs.affected, '"sparq-shacl"')
    runs-on: ubuntu-latest
    # Generous ceiling above the worst case (nightly: 4 targets × 600s + build) so a
    # hung target fails with a clear timeout rather than running away.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # [OPUS-4.8] sq-czlh: reclaim ~20-30 GB of pre-installed SDKs/toolchains BEFORE the
      # cargo-fuzz build. Each libFuzzer/sancov-instrumented target links a sanitizer
      # runtime + its own `fuzz/target` tree, on a runner that starts with only ~14 GB free
      # on `/` — the same `No space left on device` profile sq-c76x fixed in the load-aware
      # test lane. Same in-repo, SHA-pin-free, best-effort step (absent paths no-op). See
      # scripts/ci-free-disk.sh.
      - name: Free runner disk before build
        run: ./scripts/ci-free-disk.sh
      # cargo-fuzz REQUIRES nightly (libFuzzer sancov codegen / `-Zsanitizer`). Pin the
      # nightly channel by date so the lane is reproducible and a future nightly
      # regression cannot silently break it; bump the date deliberately.
      - name: Install Rust (nightly, pinned)
        # Same SHA-pinned dtolnay/rust-toolchain action the rest of CI uses; the
        # `toolchain:` input selects the NIGHTLY channel (the action reads the channel
        # from this input, not the pin), pinned by DATE so the lane is reproducible and
        # a future nightly regression cannot silently break it — bump the date
        # deliberately. cargo-fuzz REQUIRES nightly (libFuzzer sancov / `-Zsanitizer`).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly via toolchain input
        with:
          toolchain: nightly-2026-06-11
          components: rust-src
          # We build for the GNU triple explicitly (see FUZZ_BUILD_TARGET below): on an
          # x86_64 Linux runner cargo-fuzz DEFAULTS to `*-linux-musl`, whose statically
          # linked libc is incompatible with the sanitizer ("sanitizer is incompatible
          # with statically linked libc") and whose std is not installed — so we pin the
          # gnu target and ensure its std/core is present.
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The fuzz crate has its OWN target dir + lockfile under `fuzz/`; key the
          # cache on its manifests so it is not shared with the workspace build.
          workspaces: "fuzz"
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-fuzz
      # [FABLE-5] sq-0iqzw: persistent corpus. Without this, every run — including
      # the nightly 600s/target soak — restarted from an EMPTY corpus and coverage
      # never accumulated. actions/cache entries are immutable, so we use the
      # standard accumulation pattern: an always-unique primary key (never hits)
      # plus a restore-keys prefix chain that restores the most recent snapshot;
      # the paired SAVE step after the run persists the grown corpus. ONE cache
      # spans fuzz/corpus for ALL targets: `cargo fuzz list` auto-discovers
      # targets, so a hard-coded per-target key list would silently miss a newly
      # added target (and the per-target corpus dirs are tiny). Caches saved on
      # main (push/schedule) are restorable by every PR; PR-branch saves are
      # skipped (branch-scoped caches would be unreachable churn — see the save
      # step's guard).
      - name: Restore the accumulated fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v1-
      - name: Pick the per-target budget for this trigger
        id: budget
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)                     secs="$NIGHTLY_SECS" ;;
            # [OPUS-4.8] merge_group (the merge queue) takes the same fast SMOKE budget
            # as a PR — a pre-merge gate wants quick coverage, not the nightly soak.
            pull_request|merge_group)     secs="$SMOKE_SECS" ;;
            push|workflow_dispatch|*)     secs="$MAIN_SECS" ;;
          esac
          echo "secs=$secs" >> "$GITHUB_OUTPUT"
          echo "Per-target fuzz budget for '${{ github.event_name }}': ${secs}s"
      # Build every target ONCE up front so a compile error is reported distinctly
      # from a fuzzing crash, and the per-target runs below reuse the artifacts.
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly-2026-06-11 fuzz build --target "$FUZZ_BUILD_TARGET"
      # Runs ALL targets even if an earlier one crashes (each crash is recorded in
      # `status`), then fails the gate at the end if ANY target crashed. This is
      # deliberately run-all-then-fail rather than break-on-first: one CI run then
      # surfaces EVERY crashing target + uploads EVERY reproducer in one pass, instead
      # of hiding later findings behind the first failure. [OPUS-4.8]
      - name: Run each target (bounded; run all, fail at end if any crashed)
        working-directory: fuzz
        env:
          SECS: ${{ steps.budget.outputs.secs }}
        run: |
          set -euo pipefail
          # `cargo fuzz list` enumerates the targets so adding a new fuzz_target file
          # is picked up automatically (no list to keep in sync here).
          targets="$(cargo +nightly-2026-06-11 fuzz list)"
          echo "Targets: $targets"
          status=0
          for t in $targets; do
            echo "::group::fuzz $t (-max_total_time=${SECS}s)"
            # [FABLE-5] sq-0iqzw: pass the corpus dirs EXPLICITLY — the cached,
            # accumulating corpus/<t> first (libFuzzer writes new coverage there)
            # and the committed minimal seed corpus seeds/<t> second (read as
            # additional inputs). mkdir -p keeps a brand-new target (no cache, no
            # committed seeds yet) from failing on a missing dir.
            mkdir -p "corpus/$t" "seeds/$t"
            # -max_total_time bounds wall-clock; -rss_limit_mb caps an allocator OOM so
            # a hostile-bytes mega-allocation is reported as a finding, not a runner
            # kill; -print_final_stats surfaces coverage/exec counts in the log. A
            # nonzero exit (a crash/leak/timeout) is a genuine finding: we RECORD it in
            # `status` and keep going so the remaining targets still run, then fail the
            # gate once at the end (`exit "$status"`). [OPUS-4.8]
            if ! cargo +nightly-2026-06-11 fuzz run --target "$FUZZ_BUILD_TARGET" "$t" \
                  "corpus/$t" "seeds/$t" -- \
                  -max_total_time="${SECS}" -rss_limit_mb=2048 -print_final_stats=1; then
              echo "::error::fuzz target '$t' reported a crash/leak/timeout — see the log + the saved reproducer artifact."
              status=1
            fi
            echo "::endgroup::"
          done
          # Fail at the end iff ANY target above crashed (status was set to 1).
          exit "$status"
      # [FABLE-5] sq-0iqzw: persist the grown corpus — `if: always()` because a run
      # that FOUND a crash grew exactly the corpus worth keeping. Saved only from
      # main-scoped runs (push/schedule/dispatch on main): a cache saved on a PR
      # branch is scoped to that branch and unreachable from main or sibling PRs —
      # pure quota churn. PRs still RESTORE main's chain (deeper smoke coverage).
      - name: Save the accumulated fuzz corpus (main-scoped runs)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
      # On a crash, libFuzzer writes the reproducing input to fuzz/artifacts/<target>/.
      # Upload it so the failing case can be replayed locally with `cargo fuzz run
      # <target> <artifact>`.
      - name: Upload crash reproducers (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # [FABLE-5] PR-level differential smoke (bead sq-0iqzw) — the BLOCKING
  # wrong-answer gate. Runs the sparq-bench differential fuzzer (in-process
  # Oxigraph 0.5 oracle, crates/sparq-bench/src/fuzz.rs) over FIXED regression
  # windows:
  #   * seeds 0..2000 'all' — the canonical broad smoke (the honor-system
  #     `fuzz-smoke` entry from scripts/bench/run-all-benchmarks.sh, now enforced);
  #   * seeds 4695..6895 'equality' + 'filter' — the sq-lr2ii known-catch windows
  #     (the sargable-decimal f64-collapse bug reproduces ONLY in these dense
  #     categories; 'all' misses it), so that bug class can never merge silently
  #     again;
  #   * the same 0..2000 window through the mmap / block-compressed / dict-spill
  #     store rebuilds (env-selected read-path differentials).
  # Fixed windows => deterministic, ~a minute of fuzz compute; the nightly
  # ADVANCING-window exploration is differential.yml's job, not this gate's.
  # The job name carries no "advisory"/"informational" token, so `ci-summary /
  # gate` aggregates it as REQUIRED. It reuses this workflow's `select` pre-job:
  # the guard's seed closure is _LANE_SEEDS["differential-smoke"] in
  # scripts/ci_select.py (pinned by scripts/tests/test_ci_select_wiring.py) —
  # sparq-core/sparq-engine (the engine under test) + sparq-bench (the harness/
  # oracle itself). FAIL-CLOSED: empty/missing selection output => the leading
  # `mode != 'selected'` disjunct runs the lane; a selection-skipped job reports
  # `skipped` (= satisfied) to the gate exactly like the fuzz job above.
  differential-smoke:
    name: differential smoke (sparq vs Oxigraph, fixed regression windows)
    needs: select
    if: >-
      needs.select.outputs.mode != 'selected' ||
      contains(needs.select.outputs.affected, '"sparq-core"') ||
      contains(needs.select.outputs.affected, '"sparq-engine"') ||
      contains(needs.select.outputs.affected, '"sparq-bench"')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable via toolchain input
        with:
          toolchain: stable
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Share the nightly differential lane's cache key: both build the exact
          # same sparq-bench release binary, and differential.yml's main-scoped
          # nightly save keeps this warm for every PR.
          shared-key: differential-nightly
      # Build distinctly so a compile error is reported separately from a mismatch.
      - name: Build the differential fuzzer
        run: cargo build -p sparq-bench --release
      - name: Run the fixed differential regression windows
        run: |
          set -euo pipefail
          b=./target/release/sparq-bench
          # Canonical broad smoke (all categories, deterministic seeds).
          "$b" fuzz 0 2000 all
          # sq-lr2ii known-catch windows (category-dense; 'all' misses this class).
          "$b" fuzz 4695 2200 equality
          "$b" fuzz 4695 2200 filter
          # Store-mode read paths over the fixed window: the same seeds re-run with
          # the store rebuilt through mmap / block-compressed / dict-spill (the
          # dict-spill external build is the slowest per seed — smaller window).
          SPARQ_FUZZ_MMAP=1 "$b" fuzz 0 2000 all
          SPARQ_FUZZ_COMPRESS=1 "$b" fuzz 0 2000 all
          SPARQ_FUZZ_DICTSPILL=1 "$b" fuzz 0 500 all
