[workspace]
resolver = "2"
members = ["crates/sparq-core", "crates/sparq-engine", "crates/sparq-cli", "crates/sparq-bench", "crates/sparq-wasm", "crates/sparq-reason", "crates/sparq-server", "crates/sparq-serve", "crates/sparq-conformance", "crates/sparq-py", "crates/sparq-shacl", "crates/sparq-hdt", "crates/sparq-sim", "crates/sparq-geo", "crates/sparq-introspect", "crates/sparq-nlq", "crates/sparq-vectors", "crates/sparq-rsp", "crates/sparq-gpu", "crates/sparq-solid", "crates/sparq-parse", "crates/sparq-text", "crates/sparq-zk", "crates/sparq-zk-compose", "crates/sparq-mpc"]
exclude = ["vendor/spargebra"]

# Vendored spargebra 0.4.6 with surgical W3C-conformance parser fixes (see
# vendor/spargebra/SPARQ-PATCHES.md and docs/upstream-proposals.md — each fix is
# prepared as an upstream PR against oxigraph/oxigraph). Drop this patch once the
# fixes land upstream in a released spargebra.
[patch.crates-io]
spargebra = { path = "vendor/spargebra" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# [OPUS-4.8] (sq-qmth) MSRV floor 1.88. Upstream-driven: `geo@0.33.1` (a transitive dep
# of sparq-geo) requires rustc 1.88, and the released oxigraph parser stack
# (oxrdf/oxttl/oxrdfio/spargebra/… 0.2–0.4) requires 1.87. Verified empirically: the
# MSRV-scope workspace (--exclude sparq-py --exclude sparq-hdt) fails on 1.87 with ONLY
# `geo@0.33.1 requires rustc 1.88`, and builds clean on 1.88. Bump this AND the `msrv`
# job's toolchain pin in .github/workflows/ci.yml together; lower it only if geo (and the
# ox* stack) lower theirs.
rust-version = "1.88"
# Shared crates.io metadata (T20). Each publishable crate inherits these via
# `<field>.workspace = true` and adds its own `description`.
repository = "https://github.com/jeswr/sparq"
homepage = "https://github.com/jeswr/sparq"
keywords = ["rdf", "sparql", "semantic-web", "triplestore", "query-engine"]
categories = ["database-implementations", "parsing", "science"]

[workspace.dependencies]
# Term model + parsers (best-in-class; we build the store + engine ourselves).
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
# SPARQL syntax -> algebra (we build the planner + physical execution ourselves).
spargebra = { version = "0.4", features = ["sparql-12", "sep-0006"] }
# Fast hashing / maps.
rustc-hash = "2"
hashbrown = "0.17"
# Inline small rows (avoid a heap allocation per solution row).
smallvec = "1"
# Parallelism.
rayon = "1"
# SIMD byte search for the Turtle parallel-split terminator pre-scan (T2). Already in the
# tree transitively (via oxttl); promoted to a direct dep behind sparq-core's `parallel`
# feature so the wasm build (no `parallel`) does not pull it. [OPUS-4.8]
memchr = "2"
# Memory-mapped on-disk indexes (out-of-core, native only) — query datasets larger
# than RAM by letting the OS page in only the working set.
memmap2 = "0.9"
# RAM / free-disk detection for the spillable-dictionary build budget (native only,
# behind sparq-core's `dict-spill` feature — never reaches the wasm build).
libc = "0.2"
# HNSW approximate nearest-neighbour search (sparq-vectors only, GenAI phase 4).
# Chosen over hnsw_rs: pure Rust, minimal dependency tree, maintained (InstantDomain).
instant-distance = "0.6"

# sparq-vectors' accuracy gate (HNSW recall@10 vs brute force on 50k vectors) runs as
# an ordinary `cargo test`, but HNSW construction at opt-level 0 is minutes-slow. These
# overrides optimise ONLY the vector crates in dev builds (integration tests link the
# dev-profile lib); every other crate's dev build is untouched.
[profile.dev.package.sparq-vectors]
opt-level = 2
[profile.dev.package.instant-distance]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Python extension wheels (T21): release optimisation but UNWINDING panics, so a Rust
# panic inside the `sparq` Python module surfaces as `pyo3_runtime.PanicException`
# instead of `panic = "abort"` killing the whole interpreter. Used by
# `maturin build --profile python-release`; the default release profile is unchanged.
[profile.python-release]
inherits = "release"
panic = "unwind"

# A profile for benchmarking that keeps symbols for profiling.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
