# [OPUS-4.8] Flow-on rule table (bead sq-ncvq.1, epic sq-ncvq). Authored by
# Opus 4.8 (Fable unavailable; flag for re-review when Fable returns).
#
# This is the REACTIVE half of the maintenance flow-on engine
# (research/maintenance-flow-on-automation-design.md §2.2 / §3). It captures the
# *un-gateable* follow-on work — the maintenance that cannot be enforced as a
# merge gate because the artifact is produced out-of-band (a dashboard row, a
# competitor gather, a cert plan) or because it is judgment/research work.
#
# Each rule fires on a MERGED PR. scripts/flow-on.py reads the merged PR's
# changed-file list + labels + title, evaluates every rule, and for each match
# opens ONE GitHub issue (labelled `flow-on` + `auto`) per `create` template.
# The orchestrator later reconciles those issues into beads (`bd create`) — we do
# NOT touch `bd`/`.beads/` from CI because the dolt DB lives only in the
# orchestrator's checkout and is gitignored.
#
# Idempotency: every `create` template has a `dedup_key`. flow-on.py searches for
# an OPEN issue carrying a hidden marker `<!-- flow-on-key: <expanded-key> -->`;
# if one exists the create is skipped. So re-running the workflow (or re-merging)
# never duplicates a follow-on.
#
# ---------------------------------------------------------------------------
# Rule schema
# ---------------------------------------------------------------------------
#   [[rule]]
#   id          = "stable-slug"            # required; used in issue body for audit
#   description = "what this rule is for"  # optional human note
#
#   # Trigger predicates (a rule fires when ALL present predicates pass; an
#   # absent predicate is ignored). At least one must be present.
#   when_paths        = ["glob", ...]  # fnmatch-style globs over changed files (ANY match)
#   when_new_paths    = ["glob", ...]  # like when_paths but only counts ADDED files (status "A")
#   exclude_new_paths = ["glob", ...]  # added paths matching these are DROPPED from the
#                                      #   when_new_paths pool (a sub-tree owned by another gate)
#   unless_paths      = ["glob", ...]  # SUPPRESSION: the rule does NOT fire if ANY changed file
#                                      #   matches — the merged PR already did the follow-on's work
#   when_label        = "label"        # PR must carry this label (opt-in rules)
#   when_title        = "regex"        # case-insensitive regex over the PR title
#
#   # One or more follow-on issue templates. Placeholders expanded from the match:
#   #   {pr}        merged PR number
#   #   {pr_title}  merged PR title
#   #   {crate}       crate dir name, when a crates/<crate>/... path matched
#   #   {suite}       bench suite dir name, when a bench/<suite>/... path matched
#   #   {surface}     skill surface dir name, when a skills/<surface>/... path matched
#   #   {zk_circuit}  top-level zk/ circuit family dir (excludes zk/compose/; never bench/)
#   #   {package}      npm package short name, when an ADDED packages/<x>/package.json matched
#   #   {package_path} that package's repo-relative dir (differs from {package} only for js/)
#   [[rule.create]]
#   dedup_key = "kind-{crate}"            # required; expanded, then used as the idempotency key
#   title     = "..."                      # required; issue title (placeholders expanded)
#   body      = "..."                       # required; issue body (placeholders expanded)
#   labels    = ["extra", "labels"]         # optional; `flow-on` + `auto` are ALWAYS added
#
# [FABLE-5] (#2474) On top of `flow-on` + `auto` + these labels, flow-on.py appends
# role/priority/status ROUTING labels at creation via the shared static triage pass
# (scripts/triage.py + a default priority:P3) — GITHUB_TOKEN-created issues fire no
# `issues: opened` event, so triage-issue.yml can never label them post-hoc. Give a
# template a `kind:*` label (see triage.py ROLE_BY_KIND) to steer its role; without
# one the role falls back to type `task` → `role:impl` (a security keyword such as
# `zk` still forces `role:soundness`).
#
# [OPUS-4.8] (#2474 CI-fix) Every template MUST also carry an `area:<crate>` label.
# triage.py FAIL-CLOSES a no-area issue to `needs:area` + `status:untriaged` (a
# no-area issue reserves the readiness engine's serializing `__global__` partition,
# collapsing the whole dispatch frontier — scripts/triage.py / ready-issues.py), so
# a follow-on without an area could never reach the `status:ready` this PR promises.
# The area comes from the checked-in rule table (not third-party input), so setting
# it here is sound; pick the crate/surface the follow-on's work actually lands in.
# ---------------------------------------------------------------------------

# --- New crate → benchmark + README + SKILL.md  [REMOVED — owned by gate G1] ----
# There is intentionally NO reactive "register a bench / add a SKILL for the new
# crate {crate}" rule here. The PROACTIVE merge gate G1 (scripts/gate-new-crate.py,
# merged #221) ALREADY enforces — and BLOCKS the merge on — a registered benchmark
# + README + (for a public crate) a SKILL.md *in the same PR* that adds the crate.
# So by the time a new-crate PR is MERGED, those artifacts are guaranteed present;
# a post-merge follow-on issue would be pure noise (dogfooded: this rule minted the
# redundant #245 / #246 / #264 / #265 bench+SKILL follow-ons — bead sq-l0a0).
#
# G1 is the single owner of new-crate completeness. The stub escape hatch
# (`publish = false`) is likewise handled there. If G1 is ever relaxed to a
# non-blocking advisory, restore a SAFETY-NET reactive rule here — but it must
# CHECK that the crate genuinely lacks the bench/SKILL on `main` before creating
# (don't blindly mint), not re-emit unconditionally as the old rule did.

# --- Changed public feature → docs / SKILL.md update ---------------------------
# Trigger: a change under a published crate's surface, the CLI, the HTTP server,
# or the Py/WASM bindings, WITHOUT a corresponding SKILL.md edit.
#
# [OPUS-4.8] The `when_paths` glob is only a CHEAP PRE-FILTER. flow-on.py fires
# this rule ONLY when, in addition, (a) no skills/** file is in the same diff
# (SKILL_PATHS) AND (b) the PR's unified diff NET-changes a `pub `-exported item
# under one of these surfaces — using the SAME pub-item multiset diff as gate G2
# (scripts/pub_api_diff.py). A comment-only / lint-attribute-only / pure-relocation
# edit therefore does NOT mint a follow-on (dogfooded: PR #250 mis-fired this rule
# on a comment+lint-attr-only diff — bead sq-l0a0). Keeps the AGENTS.md
# public-API → SKILL.md norm from drifting without flagging inert edits.
[[rule]]
id = "changed-public-feature-docs"
description = "A NET public-API change to a surface without a SKILL.md update in the same PR."
when_paths = [
  "crates/sparq-cli/src/**",
  "crates/sparq-server/src/**",
  "crates/sparq-py/src/**",
  "crates/sparq-wasm/src/**",
]

[[rule.create]]
dedup_key = "skill-sync-pr-{pr}"
title = "docs: sync SKILL.md after public-surface change in PR #{pr}"
# [OPUS-4.8] area:docs → triage promotes to status:ready (role:docs) at creation.
labels = ["docs", "kind:docs", "area:docs"]
body = """
Merged PR #{pr} ({pr_title}) changed a public surface (CLI / HTTP / Py / WASM)
but did not touch any `skills/**/SKILL.md` in the same diff.

Per the AGENTS.md public-API → SKILL.md rule, update the matching
`skills/<surface>/SKILL.md` (and crate README / `llms.txt` if relevant) so the
docs match the shipped surface. If no doc change is warranted, note why and close.
"""

# --- New bench suite → dashboard row -------------------------------------------
# Trigger: a brand-new REGISTERED `bench/<suite>/` directory (detected via an
# added benchmarks.toml or run.sh under it, then resolved through the central
# registry). Unregistered harnesses and entries already carrying
# `featured = false` do not need a dashboard follow-on; this covers agent-token
# research harnesses that emit no performance metrics. A capability suite should
# get a FEATURED_SUITES row in the dashboard (produced out-of-band, so un-gateable).
[[rule]]
id = "new-bench-dashboard-row"
description = "A new bench suite landed; add a dashboard FEATURED_SUITES row (or flag it unfeatured)."
when_new_paths = ["bench/*/benchmarks.toml", "bench/*/run.sh"]

[[rule.create]]
dedup_key = "dashboard-row-{suite}"
title = "dashboard: add a FEATURED_SUITES row for bench suite {suite}"
# [OPUS-4.8] area:bench → triage promotes to status:ready (role:docs) at creation.
labels = ["docs", "dashboard", "kind:docs", "area:bench"]
body = """
Merged PR #{pr} ({pr_title}) added a new bench suite `bench/{suite}`.

Add a `FEATURED_SUITES` entry for it in `bench/dashboard/dashboard.js` (with the
correct `key`/`title`/`aliases`) so its metrics surface on the dashboard, or flag
it `featured = false` in its `benchmarks.toml` entry if it is intentionally
unfeatured (e.g. a research spike).
"""

# --- Competitor-relevant engine change → gather follow-up ----------------------
# Opt-in via the `competitor-relevant` label (the author marks engine/store work
# that moves us against a competitor). Triggers an out-of-band gather refresh.
[[rule]]
id = "competitor-feature-gather"
description = "A competitor-relevant engine/store change merged; refresh competitor baselines."
when_paths = [
  "crates/sparq-engine/src/exec/**",
  "crates/sparq-core/src/store/**",
]
when_label = "competitor-relevant"

[[rule.create]]
dedup_key = "gather-pr-{pr}"
title = "gather: refresh competitor baselines after PR #{pr}"
# [OPUS-4.8] area:bench → triage promotes to status:ready (role:perf) at creation.
labels = ["bench", "gather", "kind:perf", "area:bench"]
body = """
Merged PR #{pr} ({pr_title}) touched a competitor-relevant engine/store path and
was labelled `competitor-relevant`.

Re-run the competitor gather (`bench/` competitor harness) and refresh
`bench/competitors.json` so the dashboard's competitive deltas reflect this
change. This is out-of-band work that cannot be gated at merge time.
"""

# --- New top-level ZK circuit FAMILY → gate-count baseline note ----------------
# The compose-member gate-count snapshot is enforced in-tree by the HARD gate
# `snapshot_covers_every_member` (every `zk/compose/` member), and G5's
# `snapshot_covers_top_level_circuits` fails the build if a NEW top-level `bin`
# circuit elsewhere under `zk/` lacks a baseline. This flow-on is the reactive
# reminder for that new-FAMILY case.
#
# [OPUS-4.8] sq-fyzq7 (#1655): this rule previously mis-fired on a new
# `zk/compose/<member>/` addition — `fnmatch`'s `*` crosses `/`, so
# `zk/*/Nargo.toml` matched a two-level-deep member manifest — and named the
# phantom circuit `zk-compose` (the `{suite}` placeholder prefers `bench/`, so it
# picked up the `bench/zk-compose/` output dir). Those members are ALREADY
# baselined and covered by `snapshot_covers_every_member`, so the follow-on was a
# double false positive (merged #1608 → spurious #1655). Fixed two ways:
#   * `exclude_new_paths = ["zk/compose/**"]` drops compose members from the match,
#     so only a genuinely-NEW top-level family (a new `zk/<family>/`) fires it; and
#   * the template uses the dedicated `{zk_circuit}` placeholder (derived from
#     `zk/`, never `bench/`, and with `zk/compose/` excluded) instead of `{suite}`.
[[rule]]
id = "new-zk-circuit-gatecount"
description = "A new top-level ZK circuit family landed; record a gate-count baseline."
when_new_paths = ["zk/*/Nargo.toml", "zk/*/src/main.nr"]
exclude_new_paths = ["zk/compose/**"]

[[rule.create]]
dedup_key = "zk-gatecount-{zk_circuit}"
title = "zk: add a gate-count baseline for new circuit {zk_circuit}"
# [OPUS-4.8] area:sparq-zk → triage promotes to status:ready (role:soundness) at creation.
labels = ["zk", "bench", "area:sparq-zk"]
body = """
Merged PR #{pr} ({pr_title}) added a new top-level ZK circuit `zk/{zk_circuit}`.

Record a gate-count baseline for it (run the gate-count harness and add the row),
so circuit bloat is caught by the regression gate. `zk/compose/` members are
already covered by `snapshot_covers_every_member`; a new top-level circuit family
also needs a `members` baseline (or an `exempt_circuits` entry) so
`snapshot_covers_top_level_circuits` (Gate G5) passes.
"""

# --- New PUBLIC npm package → website + guide + test methods -------------------
# [OPUS-5] (#5243) sparq is not a Rust-only monorepo: it also publishes npm
# packages (`packages/*` — the workspace home for new ones — plus the legacy
# top-level `js/`, `@jeswr/sparq`). A new one carries the SAME un-gateable
# obligations a new crate does, and gets LESS help getting them, because merge
# gate G1 (scripts/gate-new-crate.py) matches `crates/*/Cargo.toml` ONLY: nothing
# proactive checks an npm package's README, docs or tests at all. These three
# reactive rules are the whole of the coverage.
#
# PUBLIC/PRIVATE predicate: all three fire only when the added manifest is NOT
# `private: true` (flow-on.py `package_is_private`). That is the exact npm
# analogue of G1's `publish = false` stub escape hatch — npm refuses to publish a
# private package, so the flag states that there is no public surface to
# advertise, no guide page a reader needs, and no obligation beyond unit tests.
# It already discriminates correctly across this repo: `packages/rdfjs-conformance`
# and `packages/sparq-client` (internal) carry it, as does every other in-repo
# manifest not meant to publish (`site/`, `gui/*`, the bench + fuzz adapters);
# `packages/eyereasoner-compat`, `packages/solid-server` and `js/` — the three
# published packages — do not.
#
# The repo's only Python package is `crates/sparq-py/` — a pyo3 crate with a
# `Cargo.toml` — so it already sits inside the crates-side scope and needs no
# trigger of its own here.
#
# NOTE ON THE GLOBS: `packages/*/package.json` is deliberately loose (fnmatch's
# `*` crosses `/`, the same trap that made `new-zk-circuit-gatecount` mis-fire on
# a compose member). The stricter `NPM_PACKAGE_MANIFEST_RE` in flow-on.py is what
# actually resolves the package, and a path it cannot resolve fails the rule
# CLOSED rather than minting a follow-on that names nothing.

[[rule]]
id = "new-package-site-advertisement"
description = "A new public npm package landed but the PR touched no site/ file; advertise it."
when_new_paths = ["packages/*/package.json", "js/package.json"]
unless_paths = ["site/**"]

[[rule.create]]
dedup_key = "new-package-site-{package}"
title = "site: advertise new npm package {package} on the website"
labels = ["site", "kind:site", "area:site"]
body = """
Merged PR #{pr} ({pr_title}) added the new public npm package `{package_path}`,
and did not touch any `site/**` file — so the website does not know it exists.

Add it to the canonical site IA in `site/src/data/surfaces.ts` (the single source
the sidebar nav, the landing surface grid and the command palette all derive
from), with an HONEST `tier` badge for what actually runs today — an aspirational
tier is a false claim on a public page. Anything the package exposes that is
still unproven (a ZK or MPC property in particular) must carry its caveat in the
blurb rather than be presented as settled.

If the package is deliberately not user-facing, mark it `"private": true` in its
`package.json` (which also stops npm publishing it, and exempts it from these
follow-ons in future) or say so here and close.
"""

[[rule]]
id = "new-package-guide-page"
description = "A new public npm package landed but the PR touched no book/ file; give it a guide page."
when_new_paths = ["packages/*/package.json", "js/package.json"]
unless_paths = ["book/**"]

[[rule.create]]
dedup_key = "new-package-guide-{package}"
title = "docs: add an mdBook guide page for new npm package {package}"
labels = ["docs", "kind:docs", "area:guide"]
body = """
Merged PR #{pr} ({pr_title}) added the new public npm package `{package_path}`,
and did not touch any `book/**` file — so the published guide does not cover it.

Add a page under `book/src/` and list it in `book/src/SUMMARY.md`. Per the SUMMARY
header, a content page should be a thin `{{#include}}` wrapper that single-sources
its prose from the canonical `{package_path}/README.md` anchors, so the guide
cannot drift from the package's own docs; only the SUMMARY entry and a one-line
section heading are original prose. If `{package_path}/README.md` does not exist
yet, write it FIRST — there is no gate equivalent to G1 that required one.

If the package is internal plumbing with nothing for a reader of the guide, say so
here and close.
"""

[[rule]]
id = "new-package-test-methods"
description = "A new public npm package landed; decide which test methods it needs."
when_new_paths = ["packages/*/package.json", "js/package.json"]

[[rule.create]]
dedup_key = "new-package-test-methods-{package}"
title = "test: choose the applicable test methods for new npm package {package}"
labels = ["test", "kind:test", "area:js"]
body = """
Merged PR #{pr} ({pr_title}) added the new public npm package `{package_path}`.

No merge gate covers an npm package's test surface — gate G1
(`scripts/gate-new-crate.py`) is `crates/*/Cargo.toml`-only — so unlike a new
crate, NOTHING has yet checked that this package has tests at all. Confirm it has
unit tests AND that some CI leg actually invokes them, then walk the menu of this
repo's other test METHODS, wire up the ones that apply, and say in a comment why
the rest do not:

- an RDF/JS conformance run against `packages/rdfjs-conformance`, if it exposes
  an RDF/JS interface;
- a differential test against the Rust implementation it wraps, if it wraps one
  (a WASM binding that silently diverges from the engine is the failure mode);
- property tests for anything with an algebraic law;
- a published-artifact smoke test (`npm pack` → install the tarball → import it),
  which catches a broken `files`/`exports`/`types` field that no in-repo test can;
- a CI leg that actually RUNS the above — a test file no workflow invokes passes
  silently-zero forever.

Close this with a note if unit tests genuinely are the whole appropriate set.
"""
