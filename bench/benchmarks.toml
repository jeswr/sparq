[[benchmark]]
id          = "ci-bench"
name        = "CI cross-commit benchmark emitter (free GitHub runners)"
category    = "scaling"
measures    = "customSmallerIsBetter JSON: load_s, store_bytes_per_triple, dict_bytes_per_term, per-query {count,materialize,json}_us, rdfs_infer_s, wasm_bundle_bytes"
