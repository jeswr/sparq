# [OPUS-4.8] sparq benchmark registry — authored by Opus 4.8 (Fable unavailable;
# flag for re-review when Fable returns). Machine-readable catalog of EVERY
# benchmark/measurement in the repo. Companion human guide: bench/CATALOG.md.
# Companion results doc: research/BENCHMARKS.md ("what we measured"); this file
# is "what benchmarks exist + how to run them". Invocations are verified against
# the actual code/scripts as of 2026-06-13 — do not edit a command without
# re-checking the source it cites.
#
# Field semantics:
#   id                  stable slug
#   name                human title
#   category            parse | ingest | query | serve | inference | zk |
#                       compression | scaling | conformance
#   measures            what + units
#   invoke              EXACT command(s); paths relative to repo root unless noted
#   source              file(s) the invocation is defined in (provenance)
#   dataset             source + how to obtain/regenerate + approx size
#   quiet_box_sensitive true  => wall-clock throughput/latency (needs idle box)
#                       false => gate-counts/byte-identity/correctness (load-robust)
#   pinning             SHA/seed/dataset-version that must be fixed, if any
#   records_to          where results land
#   status              ok | stale | broken | external-cost | planning

# =============================================================================
# QUERY — engine compute + differential correctness vs reference engines
# =============================================================================

[[benchmark]]
id          = "sparq-bench-compare"
name        = "sparq vs Oxigraph differential + perf"
category    = "query"
measures    = "load time, per-query min-of-K warm latency, peak RSS (MiB); solution-count agreement"
invoke      = "cargo run -p sparq-bench --release -- --scale 50000 --iters 4"
source      = "crates/sparq-bench/src/main.rs (compare), src/dataset.rs"
dataset     = "synthetic WatDiv-flavoured social graph, generated in-process by dataset::generate; --scale = entities (~8 triples/entity); 50k entities ~= 400k triples"
quiet_box_sensitive = true
pinning     = "dataset deterministic (fixed SplitMix64 seed 0x9E3779B97F4A7C15); pin --scale/--iters for comparable numbers"
records_to  = "stdout; results table in research/BENCHMARKS.md"
status      = "ok"

[[benchmark]]
id          = "sparq-bench-fuzz"
name        = "Differential fuzzer vs Oxigraph"
category    = "query"
measures    = "correctness only: sparq query().len() == Oxigraph count AND == sparq count(), over N random (graph,query) cases; mismatch prints deterministic repro"
invoke      = "cargo run -p sparq-bench --release -- fuzz <seed_start> <count> [all|bgp|filter|optional|union|minus|limit|distinct|order]"
source      = "crates/sparq-bench/src/fuzz.rs, src/main.rs (fuzz dispatch)"
dataset     = "random small graphs (3..=16 subjects), mixed-datatype ex:val column; generated per-seed in-process"
quiet_box_sensitive = false
pinning     = "seed_start fully determines the case set (deterministic SplitMix64); category shards the space"
records_to  = "stdout (PASS summary or repro on mismatch)"
status      = "ok"

[[benchmark]]
id          = "sparq-bench-diff"
name        = "Single hand-crafted differential probe"
category    = "query"
measures    = "correctness: sparq query/count vs Oxigraph count on ONE (data,query); exit 1 on mismatch"
invoke      = "cargo run -p sparq-bench --release -- diff <data.ttl> <query.rq|inline-sparql>"
source      = "crates/sparq-bench/src/main.rs (diff)"
dataset     = "user-supplied Turtle file + query (adversarial edge-case probe)"
quiet_box_sensitive = false
pinning     = "none (inputs are the pin)"
records_to  = "stdout"
status      = "ok"

[[benchmark]]
id          = "cli-bench-suite"
name        = "CLI query-suite runner (count/materialize/json)"
category    = "query"
measures    = "per-query rows + min-of-iters latency (microseconds); TSV name<TAB>rows<TAB>micros"
invoke      = "cargo build -p sparq-cli --release && ./target/release/sparq-cli bench <data-file> <turtle|ntriples|nquads|trig> <queries-dir> [iters=5] [count|materialize|json]"
source      = "crates/sparq-cli/src/main.rs (cmd_bench, run_query_suite)"
dataset     = "any RDF file + a directory of *.rq; used by the QLever/selective/u64 harnesses"
quiet_box_sensitive = true
pinning     = "dataset + query dir; mode (count vs materialize vs json) must match when comparing"
records_to  = "stdout (TSV)"
status      = "ok"

[[benchmark]]
id          = "cli-bench-mmap"
name        = "Out-of-core (mmap) query-suite runner"
category    = "query"
measures    = "open time, committed heap, per-query min-of-iters latency over a memory-mapped on-disk index"
invoke      = "./target/release/sparq-cli bench-mmap <index-dir> <queries-dir> [iters=5] [count|materialize|json] [decompress]"
source      = "crates/sparq-cli/src/main.rs (cmd_bench_mmap)"
dataset     = "an index dir built by `save`/`build` (see ingest entries); query dir of *.rq"
quiet_box_sensitive = true
pinning     = "index dir + query dir; OS page cache state affects cold/warm — run cold for first-touch numbers"
records_to  = "stdout (TSV); used in bench/qlever-baselines.md mmap comparison"
status      = "ok"

# [OPUS-4.8] sq-ca4 — one query per SPARQL operator family; trend-only latency coverage.
[[benchmark]]
id          = "operator-coverage"
name        = "SPARQL operator-coverage latency suite"
category    = "query"
measures    = "per-operator min-of-iters latency (us) across count/materialize/json for one query per operator family (BGP/star/chain/triangle, UNION, OPTIONAL/!bound, MINUS, FILTER {numeric,string,IN,EXISTS}, BIND, VALUES, aggregates+GROUP BY+HAVING, DISTINCT, ORDER BY+LIMIT/OFFSET, property paths {+,*,?,seq,alt,inverse,negated-set}, subquery, ASK/CONSTRUCT/DESCRIBE); each query returns a small stable non-empty result"
invoke      = "cargo build -p sparq-cli sparq-bench --release && ./target/release/sparq-bench dump 2000 /tmp/op.nt && ./target/release/sparq-cli bench /tmp/op.nt ntriples bench/operators/queries 3 count   # also materialize|json; CI runs all three via scripts/ci-bench.sh -> op_<query>_<mode>_us"
source      = "bench/operators/queries/*.rq; crates/sparq-cli/src/main.rs (run_query_suite — routes CONSTRUCT/DESCRIBE to construct_or_describe via PreparedQuery::is_graph_form); scripts/ci-bench.sh"
dataset     = "sparq-bench synthetic dump (deterministic WatDiv-flavoured social graph); queries hit fixed subjects/cities so row counts are stable across scales"
quiet_box_sensitive = true  # wall-clock latency; trend-only, NOT in the deterministic perf-gate (scripts/perf-gate.py)
pinning     = "query dir + mode; dataset deterministic; queries pinned to fixed subjects so result counts are scale-stable"
records_to  = "stdout (TSV); CI emits op_<query>_<mode>_us into benchmark-data (dev/bench) via scripts/ci-bench.sh"
status      = "ok"

[[benchmark]]
id          = "selective-bindjoin"
name        = "Selective (index-nested-loop / bind) join"
category    = "query"
measures    = "count + materialize latency, bind-join vs merge-join; intermediate peak memory; vs Oxigraph correctness"
invoke      = "python3 bench/selective/gen.py 500000 > bench/selective/selective.nt && ./target/release/sparq-cli bench bench/selective/selective.nt ntriples bench/selective/queries 3 count"
source      = "bench/selective/gen.py, gen2.py, queries/, queries2/, README.md"
dataset     = "dense follows graph (N nodes x4 edges) + rare premium leaf; gen2.py adds a second rare predicate for two-sided/predicate-transfer characterization; 500k nodes ~= 2M triples"
quiet_box_sensitive = true
pinning     = "gen.py seed fixed (random.seed(7)); pin N + fanout"
records_to  = "stdout; tables in bench/selective/README.md; analysis research/predicate-transfer-measured.md"
status      = "ok"

[[benchmark]]
id          = "u64-valueids"
name        = "Inline value-id / dict-resolve cost probe (literals)"
category    = "query"
measures    = "FILTER/BIND/GROUP-BY/ORDER-BY latency split by value path: inline int vs dict+numerics-cache (big int/decimal) vs dict-materialized (dateTime)"
invoke      = "python3 bench/u64-valueids/gen.py 1000000 /tmp/t3-literals.nt && ./target/release/sparq-cli bench /tmp/t3-literals.nt ntriples bench/u64-valueids/queries 3 materialize"
source      = "bench/u64-valueids/gen.py, queries/ (q01..q11)"
dataset     = "literal-heavy synthetic, ~5N triples (int inline / big int / decimal / dateTime / group key); 1M subjects ~= 5M triples"
quiet_box_sensitive = true
pinning     = "deterministic generator (index-derived values); pin N"
records_to  = "stdout (TSV)"
status      = "ok"

# =============================================================================
# QUERY — sparq vs QLever (external reference engine)
# =============================================================================

[[benchmark]]
id          = "qlever-olympics"
name        = "sparq vs QLever — Olympics (real skewed data)"
category    = "query"
measures    = "min-of-N COLD per-query time; endtoend (compute+SPARQL-JSON) and compute (count) passes; result-size/count correctness cross-check"
invoke      = "../../.qlever-venv/bin/python compare.py 5 endtoend   # (run from bench/qlever-olympics; also: compare.py 5 compute). Setup: qlever setup-config olympics / get-data / index / start"
source      = "bench/qlever-olympics/{compare.py,README.md,Qleverfile}, queries/, queries-count/"
dataset     = "Olympics (DBpedia/Wallscope), ~1.78M triples (~323 MB); fetched via qlever get-data (gitignored)"
quiet_box_sensitive = true
pinning     = "QLever version + dataset version (note date/commit on re-measure); QLever cache cleared each cold run; PORT 7019"
records_to  = "stdout; results in research/BENCHMARKS.md + bench/qlever-baselines.md"
status      = "ok"

[[benchmark]]
id          = "qlever-synthetic-10m"
name        = "sparq vs QLever — 10M synthetic"
category    = "query"
measures    = "min-of-N cold compute (QLever query-time-ms vs sparq count us) on 10M synthetic; endtoend + compute passes"
invoke      = "./target/release/sparq-bench dump 1250000 bench/qlever-synthetic/synthetic.nt   # 10M triples; then (from bench/qlever-synthetic) ../../.qlever-venv/bin/python compare.py 5 compute"
source      = "bench/qlever-synthetic/{compare.py,Qleverfile,synthetic.settings.json}, queries/, queries-count/"
dataset     = "sparq-bench synthetic dump, 1.25M entities x8 = 10M triples; QLever index built from synthetic.nt; PORT 7029"
quiet_box_sensitive = true
pinning     = "scale (1.25M entities), QLever version; stored QLever reference in bench/qlever-baselines.md (M1, QLever 0.5.47)"
records_to  = "stdout; bench/qlever-baselines.md"
status      = "ok"

[[benchmark]]
id          = "qlever-synthetic-100m"
name        = "sparq vs QLever — 100M synthetic (in-mem + mmap)"
category    = "query"
measures    = "compute latency in-memory and via bench-mmap; external-build wall + peak RAM + on-disk index size; vs stored QLever baselines"
invoke      = "./target/release/sparq-bench dump 12500000 bench/qlever-100m/synthetic100m.nt   # 100M triples; then sparq-cli bench (count) and/or save+bench-mmap; compare to bench/qlever-baselines.md"
source      = "bench/qlever-100m/{compare.py,Qleverfile}, queries/, queries-count/; bench/qlever-baselines.md"
dataset     = "sparq-bench synthetic dump, 12.5M entities x8 = 100M triples (~10.8GB in-mem store+dict; ~7.9GB on-disk uncompressed perms); PORT 7030"
quiet_box_sensitive = true
pinning     = "scale (12.5M entities); QLever 100M baselines recorded 2026-06-08/09 in bench/qlever-baselines.md"
records_to  = "stdout; bench/qlever-baselines.md (incl. mmap-vs-QLever table)"
status      = "ok"

# =============================================================================
# INGEST / PARSE — load + dictionary + external-memory build throughput
# =============================================================================

[[benchmark]]
id          = "cli-ingest"
name        = "Ingestion throughput probe (parse|intern|full)"
category    = "ingest"
measures    = "M triples/s for decompress+parse (parse), +dict intern (intern), +6-permutation build (full); extrapolation to full Wikidata truthy (~8B)"
invoke      = "./target/release/sparq-cli ingest <file[.gz|.bz2|.zst]> [parse|intern|full] [max_millions]"
source      = "crates/sparq-cli/src/main.rs (cmd_ingest)"
dataset     = "any N-Triples (optionally gz/bz2/zst); typically a Wikidata truthy slice (gitignored)"
quiet_box_sensitive = true
pinning     = "input file + mode + cap; codec (zstd ~12x faster decode than bz2)"
records_to  = "stdout summary; analysis research/fast-ingestion.md, research/wikidata-ingestion-benchmark.md"
status      = "ok"

[[benchmark]]
id          = "cli-save-build"
name        = "Index persist (save) + external-memory build"
category    = "ingest"
measures    = "build/persist wall-clock; external-memory build bounds peak RSS for >RAM datasets (dict-spill optional)"
invoke      = "./target/release/sparq-cli save <data> <format> <dir> [compressed]   # in-RAM build+persist\n./target/release/sparq-cli build <file[.gz|.bz2|.zst]> <format> <dir> [chunk_millions=16]   # external-memory"
source      = "crates/sparq-cli/src/main.rs (cmd_save, cmd_build, cmd_recompress)"
dataset     = "any RDF file; output is an on-disk index dir queryable via query-mmap/bench-mmap"
quiet_box_sensitive = true
pinning     = "chunk_millions (run size); SPARQ_DICT_SPILL=1 + SPARQ_DICT_SPILL_BUDGET_MB for spill; output is byte-identical regardless of chunk"
records_to  = "stderr timing; research/external-dictionary.md"
status      = "ok"

[[benchmark]]
id          = "cli-bench-remap"
name        = "Dict-remap gather micro-benchmark (per-ISA prefetch)"
category    = "ingest"
measures    = "M triples/s for the latency-bound dictionary-id remap gather; prefetch on vs off delta"
invoke      = "./target/release/sparq-cli bench-remap [n_triples=20000000] [dict_size=50000000] [iters=5]   # run again with SPARQ_NO_PREFETCH=1 for the delta"
source      = "crates/sparq-cli/src/main.rs (cmd_bench_remap); sparq_core::bench_remap"
dataset     = "synthesized id arrays (no file); sizes are the args"
quiet_box_sensitive = true
pinning     = "n_triples, dict_size, iters; SPARQ_NO_PREFETCH toggles the variable under test"
records_to  = "stdout (TSV line); per-ISA validation feeds research/hw-bench-results.md"
status      = "ok"

[[benchmark]]
id          = "parse-baseline"
name        = "Custom-parsers BASELINE harness (NT/TTL/compressed)"
category    = "parse"
measures    = "MB/s over decompressed bytes: memscan ceiling, oxttl parse-only/parse+intern/full Graph, incumbent NT parser serial+all-cores, gzip/zstd decode-only, streaming-vs-two-stage; median of 3 wall"
invoke      = "cd bench/parse && cargo build --release && ./target/release/parse-baseline bench-nt <data.nt>   # also bench-ttl, bench-zip; gen/to-ttl/compress prepare datasets"
source      = "bench/parse/{README.md,Cargo.toml}, parse-baseline bin"
dataset     = "data/ (gitignored): Wikidata truthy first 1.5M lines (~173MB) and synthetic (gen 320000 ~162MB NT/~57MB TTL); + compressed variants"
quiet_box_sensitive = true
pinning     = "dataset slice size; mimalloc + fat LTO build to match shipped ingest"
records_to  = "stdout; analysis research/custom-parsers-baseline.md"
status      = "ok"

[[benchmark]]
id          = "compress-bench"
name        = "Compressed result-serialization (D4)"
category    = "compression"
measures    = "gzip/zstd ratio + serial-vs-rayon walls, zstd dictionaries, end-to-end serialize+compress, paced-replay TTFB proxy (big); point-query response sizes (small); reference-decoder artifacts"
invoke      = "cd bench/parse && ./target/release/compress-bench big <data.nt>   # also: small <data.nt>; artifacts <data.nt> <outdir>"
source      = "bench/parse/Cargo.toml (compress-bench bin); crates/sparq-parse CompressedSink"
dataset     = "same data/ slices as parse-baseline (gitignored)"
quiet_box_sensitive = true
pinning     = "dataset slice; codec levels fixed in harness"
records_to  = "stdout; analysis research/custom-parsers-D4-compressed-serialization.md"
status      = "ok"

[[benchmark]]
id          = "wikidata-8b"
name        = "Wikidata full-truthy (~8-9.4B) low-resource external build"
category    = "ingest"
measures    = "external-memory build wall (8-17h), peak RSS, peak swap, on-disk index bytes, validation COUNT queries; the 'Wikidata on a 16GB box' claim"
invoke      = "cd bench/wikidata-8b/scripts && ./launch.sh (dry-run) ; EXECUTE=1 ./launch.sh && EXECUTE=1 ./run.sh && EXECUTE=1 ./collect.sh && EXECUTE=1 ./terminate.sh   # core build: SPARQ_DICT_SPILL=1 ... sparq-cli build ~/data/truthy.nt.zst ntriples ~/idx 32"
source      = "bench/wikidata-8b/{RUNBOOK.md,STATUS.md}, scripts/ (config/launch/run/collect/terminate/remote-8b/mem-sampler)"
dataset     = "Wikidata latest-truthy.nt.gz (~70.65GB, ~8-9.4B triples); external EC2 r8g.large + 2200GB gp3; gitignored"
quiet_box_sensitive = true
pinning     = "SPARQ_SHA pinned in config.sh (post dict-spill merge); dump rolls weekly so re-verify Content-Length; record exact line count = triple count"
records_to  = "bench/wikidata-8b/results/ + STATUS.md; research/wikidata-lowresource-stage{1,2}.md"
status      = "external-cost"  # HARD GATE: blocked on dict-spill merge to main + budget; ~$5-17 instance cost. See RUNBOOK §0.

# =============================================================================
# COMPRESSION — index footprint / B-per-triple tradeoffs
# =============================================================================

[[benchmark]]
id          = "cli-probe-compress"
name        = "Permutation-index compression probe (measure-first)"
category    = "compression"
measures    = "B/triple: raw vs lexicographic-delta+LEB128-varint vs gzip; +block-directory random-access overhead; decode-cost M/s"
invoke      = "./target/release/sparq-cli probe-compress <perm-file>"
source      = "crates/sparq-cli/src/main.rs (cmd_probe_compress)"
dataset     = "a single saved permutation index file (12 B/row [u32;3]); from a `save` dir"
quiet_box_sensitive = false  # byte-counts are deterministic; the M/s scan figures are not
pinning     = "the perm file is the pin"
records_to  = "stdout; research/compressed-perms-verdict.md, research/term-index-compression.md"
status      = "ok"

[[benchmark]]
id          = "cli-compare-compress"
name        = "Raw vs block-compressed index footprint + query latency"
category    = "compression"
measures    = "in-RAM index footprint raw vs compressed (MB, B/triple, % of raw), encode time; optional query latency raw vs compressed"
invoke      = "./target/release/sparq-cli compare-compress <data-file> <format> [<sparql>]"
source      = "crates/sparq-cli/src/main.rs (cmd_compare_compress)"
dataset     = "any RDF file (loaded raw then re-encoded compressed in-process)"
quiet_box_sensitive = true  # footprint is deterministic; query latency arm is quiet-box-sensitive
pinning     = "dataset + optional query"
records_to  = "stdout; research/compressed-perms-verdict.md, research/dict-compression-measured.md"
status      = "ok"

# =============================================================================
# SCALING — parallel thread sweep
# =============================================================================

[[benchmark]]
id          = "cli-scaling"
name        = "Per-subsystem parallel scaling sweep"
category    = "scaling"
measures    = "best ms, speedup, parallel efficiency (speedup / thread-ratio) per subsystem (load + each query) across a thread-count sweep"
invoke      = "./target/release/sparq-cli scaling <data-file> <format> <queries-dir> [threads=1,2,4,8,...] [iters=3]   # many-core box: 1,2,4,8,16,32,64,128,192"
source      = "crates/sparq-cli/src/main.rs (cmd_scaling)"
dataset     = "any RDF file + query dir; rayon pool sized per sweep point"
quiet_box_sensitive = true
pinning     = "dataset + query dir + thread list; must be the ONLY load on the box (it owns all cores)"
records_to  = "stdout (TSV subsystem/threads/best_ms/speedup/efficiency)"
status      = "ok"

